# glauth configuration — Centreon LDAP test server
# https://github.com/glauth/glauth
#
# Glauth v2.1.0+ standard DN format (see glauth.github.io/docs/compatibility.html):
#   Users:  cn=<name>,ou=<primarygroup>,ou=users,dc=centreon,dc=com
#   Groups: cn=<name>,ou=<group>,ou=groups,dc=centreon,dc=com
#
#   nameformat="cn,uid" → DN uses cn= prefix; both cn and uid attributes are set
#                         to u.Name, so (uid=*) and (cn=*) filters both work.
#   groupFormat="ou"    → GroupFormatAsArray[0]="ou", produces ou=<primarygroup>
#                         as the second DN component.
#
# e.g. cn=centreon-ldap,ou=people,ou=users,dc=centreon,dc=com
#      (primary group is named "people" → avoids the ou=users,ou=users duplication)
#
# Admin DN: cn=admin,ou=people,ou=users,dc=centreon,dc=com
# Groups:   cn=<name>,ou=people,ou=groups,dc=centreon,dc=com
#
# Passwords equal the username (e.g. centreon-ldap / centreon-ldap).
# Admin password: centreon
#
# memberOf is computed automatically from group membership.

debug = false

# ---------------------------------------------------------------------------
# LDAP listener
# ---------------------------------------------------------------------------
[ldap]
  enabled = true
  listen = "0.0.0.0:389"

[ldaps]
  enabled = false

# ---------------------------------------------------------------------------
# In-memory config backend
# ---------------------------------------------------------------------------
[backend]
  datastore = "config"
  baseDN = "dc=centreon,dc=com"
  groupFormat = "ou"
  # "cn,uid" → DN uses cn= prefix; both cn and uid attributes are set to the
  # user name, so (uid=*) and (cn=*) LDAP filters both work.
  nameformat = "cn,uid"

[behaviors]
  # Allow all authenticated (and anonymous) searches without per-user capability checks
  IgnoreCapabilities = true
  LimitFailedBinds = false

