# ---------------------------------------------------------------------------
# Groups  (DN: cn=<name>,ou=groups,dc=centreon,dc=com)
# memberOf on user entries is computed automatically from group membership.
# ---------------------------------------------------------------------------

# Primary group for all users (gidNumber 1000)
[[groups]]
  name = "people"
  gidnumber = 1000

[[groups]]
  name = "debian"
  gidnumber = 5001
  members = ["centreon-ldap5"]

[[groups]]
  name = "windows"
  gidnumber = 5002
  members = ["centreon-ldap", "centreon-ldap2", "centreon-ldap3", "centréon-ldap4"]

# linux includes the debian sub-group → centreon-ldap5 inherits linux membership
[[groups]]
  name = "linux"
  gidnumber = 5003
  includegroups = [5001]
  members = ["centreon-ldap", "centreon-ldap2"]

[[groups]]
  name = "networking"
  gidnumber = 5004
  members = ["centreon-ldap"]

[[groups]]
  name = "auth-middleware"
  gidnumber = 5005
  members = ["hub-manager"]
