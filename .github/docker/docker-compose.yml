services:
  web:
    platform: linux/amd64
    env_file:
      - .env
    image: "${WEB_IMAGE:-docker.centreon.com/centreon/centreon-web-alma9:develop}"
    ports: ["4000:80"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      GLPI_HOST: glpi
      VAULT_HOST: vault
      OPENID_HOST: sso-proxy
      SAML_HOST: saml
      LDAP_HOST: openldap
      CENTREON_DATASET: ${CENTREON_DATASET:-1}
      CENTREON_LANG: ${CENTREON_LANG:-en_US}
      DATABASE_PARTITIONING: ${DATABASE_PARTITIONING:-1}
      DEBUG: ${DEBUG:-0}
      CENTREON_INTERNAL_API_BASE_URL: ${CENTREON_INTERNAL_API_BASE_URL:-127.0.0.1:80}
    healthcheck:
      test: bash -c "[ -f /tmp/docker.ready ]" && curl --fail http://localhost/centreon/api/latest/platform/versions || exit 1
      interval: 1s
      retries: 120
      timeout: 5s

  db:
    platform: linux/amd64
    env_file:
      - .env
    image: "${MYSQL_IMAGE:-bitnamilegacy/mariadb:10.11}"
    ports: ["3306"]
    environment:
      MARIADB_EXTRA_FLAGS: "--skip-ssl"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3306 && sleep 3 && </dev/tcp/127.0.0.1/3306'"]
      interval: 10s
      timeout: 15s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 100M

  poller:
    env_file:
      - .env
    image: "${POLLER_IMAGE:-docker.centreon.com/centreon/centreon-poller-alma9:develop}"
    depends_on:
      web:
        condition: service_healthy
    profiles: ["poller"]
    environment:
      WEB_HOST: web

  glpi:
    env_file:
      - .env
    image: "${GLPI_IMAGE:-ghcr.io/centreon/centreon/glpi:26.05}"
    ports: ["80"]
    depends_on:
      - db
    profiles: ["glpi"]
    environment:
      MYSQL_HOST: db

  vault:
    image: "${VAULT_IMAGE:-ghcr.io/centreon/centreon/vault:26.05}"
    env_file:
      - .env
    ports: ["8200"]
    profiles: ["vault"]

  openid:
    env_file:
      - .env
    image: "${OPENID_IMAGE:-ghcr.io/centreon/centreon/keycloak:26.05}"
    ports: []
    profiles: ["openid"]

  saml:
    env_file:
      - .env
    image: "${SAML_IMAGE:-ghcr.io/centreon/centreon/keycloak:26.05}"
    ports: ["8080:8080"]
    profiles: ["saml"]

  openldap:
    image: "${LDAP_IMAGE:-ghcr.io/centreon/centreon/ldap:26.05}"
    ports: ["389"]
    profiles: ["openldap", "ldap"]

  squid-simple:
    image: docker.centreon.com/centreon/mon-squid-simple:latest
    ports: ["3128"]
    profiles: ["squid-simple"]

  squid-basic-auth:
    image: docker.centreon.com/centreon/mon-squid-basic-auth:latest
    ports: ["3128"]
    profiles: ["squid-basic-auth"]

  mediawiki:
    image: "${MEDIAWIKI_IMAGE:-ghcr.io/centreon/centreon/mediawiki:26.05}"
    ports: ["80"]
    profiles: ["mediawiki"]

  remote-server:
    platform: linux/amd64
    env_file:
      - .env
    image: "${WEB_IMAGE:-docker.centreon.com/centreon/centreon-web-alma9:develop}"
    ports: ["4001:80"]
    profiles: ["remote-server"]
    depends_on:
      db-remote:
        condition: service_started
      web:
        condition: service_healthy
    environment:
      MYSQL_HOST: db-remote
      CENTREON_DATASET: 0
      CENTREON_LANG: ${CENTREON_LANG:-en_US}
      DEBUG: ${DEBUG:-0}
      CENTRAL_HOST: web
      CENTRAL_API_USERNAME: ${CENTRAL_API_USERNAME:-admin}
      CENTRAL_API_PASSWORD: ${CENTRAL_API_PASSWORD:-Centreon!2021}
      REMOTE_SERVER_NAME: ${REMOTE_SERVER_NAME:-remote-server}
    volumes:
      - ./centreon-web/${CENTREON_WEB_OS:-alma9}/entrypoint/container.d/81-register_remote_server_background.sh:/usr/share/centreon/container.d/81-register_remote_server_background.sh
    healthcheck:
      test: bash -c "[ -f /tmp/docker.ready ] && [ -f /tmp/remote-server.registered ]" && curl --fail http://localhost/centreon/api/latest/platform/versions || exit 1
      interval: 5s
      retries: 120
      timeout: 5s

  db-remote:
    platform: linux/amd64
    env_file:
      - .env
    image: "${MYSQL_IMAGE:-bitnamilegacy/mariadb:10.11}"
    ports: ["3306"]
    profiles: ["remote-server"]
    environment:
      MARIADB_EXTRA_FLAGS: "--skip-ssl"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 400M
        reservations:
          cpus: '0.25'
          memory: 100M

  sso-proxy:
    image: nginx:stable-alpine
    depends_on:
      - openid
    ports:
      - "8080:8080"
    profiles: ["openid"]
    configs:
      - source: sso_nginx_conf
        target: /etc/nginx/conf.d/default.conf
configs:
  sso_nginx_conf:
    name: sso_nginx_conf
    content: |
      server {
        listen 8080;
        server_name sso-proxy;

        location / {
            proxy_pass http://openid:8080;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Forwarded-Host $$http_host;
            proxy_set_header X-Forwarded-Port $$server_port;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header X-Forwarded-For $$remote_addr;

            # fix redirects to include port
            proxy_redirect http://sso-proxy/ http://sso-proxy:8080/;
            proxy_redirect https://sso-proxy/ https://sso-proxy:8080/;
        }
      }
