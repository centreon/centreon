services:
  web:
    env_file:
      - .env
    image: "${WEB_IMAGE}"
    ports: ["4000:80"]
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      GLPI_HOST: glpi
      VAULT_HOST: vault
      OPENID_HOST: sso-proxy
      SAML_HOST: saml
      LDAP_HOST: openldap
      CENTREON_DATASET: ${CENTREON_DATASET:-1}
      CENTREON_LANG: ${CENTREON_LANG:-en_US}
      DEBUG: ${DEBUG:-0}
      CENTREON_INTERNAL_API_BASE_URL: ${CENTREON_INTERNAL_API_BASE_URL:-127.0.0.1:80}
    healthcheck:
      test: bash -c "[ -f /tmp/docker.ready ]" && curl --fail http://localhost/centreon/api/latest/platform/versions || exit 1
      interval: 1s
      retries: 120
      timeout: 5s

  db:
    env_file:
      - .env
    image: "${MYSQL_IMAGE}"
    ports: ["3306"]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 400M
        reservations:
          cpus: '0.25'
          memory: 100M

  openid:
    env_file:
      - .env
    image: "${OPENID_IMAGE:-ghcr.io/centreon/centreon/keycloak:25.10}"
    ports: []
    profiles: ["openid"]

  saml:
    env_file:
      - .env
    image: "${SAML_IMAGE:-ghcr.io/centreon/centreon/keycloak:24.10}"
    ports: ["8080:8080"]
    profiles: ["saml"]

  openldap:
    image: "${LDAP_IMAGE:-ghcr.io/centreon/centreon/ldap:24.10}"
    ports: ["389"]
    profiles: ["openldap", "ldap"]

  squid-simple:
    image: docker.centreon.com/centreon/mon-squid-simple:latest
    ports: ["3128"]
    profiles: ["squid-simple"]

  squid-basic-auth:
    image: docker.centreon.com/centreon/mon-squid-basic-auth:latest
    ports: ["3128"]
    profiles: ["squid-basic-auth"]

  mediawiki:
    image: "${MEDIAWIKI_IMAGE:-ghcr.io/centreon/centreon/mediawiki:24.10}"
    ports: ["80"]
    profiles: ["mediawiki"]

  sso-proxy:
    image: nginx:stable-alpine
    depends_on:
      - openid
    ports:
      - "8080:8080"
    profiles: ["openid"]
    configs:
      - source: sso_nginx_conf
        target: /etc/nginx/conf.d/default.conf
configs:
  sso_nginx_conf:
    name: sso_nginx_conf
    content: |
      server {
        listen 8080;
        server_name sso-proxy;

        location / {
            proxy_pass http://openid:8080;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Forwarded-Host $$http_host;
            proxy_set_header X-Forwarded-Port $$server_port;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header X-Forwarded-For $$remote_addr;

            # fix redirects to include port
            proxy_redirect http://sso-proxy/ http://sso-proxy:8080/;
            proxy_redirect https://sso-proxy/ https://sso-proxy:8080/;
        }
      }