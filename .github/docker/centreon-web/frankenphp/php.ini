; PHP settings of centreon-web, for the web server and the CLI (one binary, one php.ini):
; - the php.ini-production values of the distribution package that differ from PHP defaults;
; - centreon/packaging/src/php.ini (50-centreon.ini) and the timezone of the package;
; - the [centreon] PHP-FPM pool (centreon/packaging/src/php-fpm.rpm.conf): error log, sessions.

; php.ini-production
short_open_tag = Off
output_buffering = 4096
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On
variables_order = "GPCS"
request_order = "GP"
zend.assertions = -1
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0
session.gc_divisor = 1000
mysqlnd.collect_memory_statistics = Off
gd.jpeg_ignore_warning = 1

; 20-timezone.ini
date.timezone = Europe/Paris

; 50-centreon.ini
max_execution_time = 300
session.use_strict_mode = 1
session.gc_maxlifetime = 7200
expose_php = Off
allow_url_fopen = Off
memory_limit = 256M
upload_max_filesize = 5M

; PHP-FPM pool: error_log goes to the container output instead of /var/log/centreon/prod.web.log
error_log = /dev/stderr
session.save_handler = files
session.save_path = /var/lib/php/session

; No system trust store on scratch: CA bundle copied from the distribution
openssl.cafile = /etc/ssl/cert.pem
curl.cainfo = /etc/ssl/cert.pem

; OPcache (not installed in the slim image)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
