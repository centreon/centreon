# Gorgone-less light Central PoC (MON-215448 / MON-215451): remote poller.
# Separate compose project, like a poller behind NAT: no published port, only
# the external gls-wan network, outbound BBDO to centreon-broker:5669.
#
#   docker compose -p gls-poller -f docker-compose.poller.yml --env-file images.env up -d
name: gls-poller

services:
  volumes-init:
    image: "${REGISTRY}/centreon-engine-trixie:${ENGINE_TAG}"
    user: "0"
    entrypoint: ["/bin/sh", "/gls/init-volumes.sh", "poller"]
    environment:
      APP_SECRET: "${APP_SECRET:-9cd3e2ccf822916ec8fc5379f8abdaf277860415454f9b91c0913392d4b41f92}"
      SALT: "${SALT:-84e9107f78239bdab2751c3321023a32c3716ed0724a4a8b13de8e7aed8d319d}"
    volumes:
      - ./scripts:/gls:ro
      - poller-engine-etc:/mnt/engine-etc
      - poller-broker-etc:/mnt/broker-etc
    network_mode: none
    restart: "no"

  poller-engine:
    image: "${REGISTRY}/centreon-engine-trixie:${ENGINE_TAG}"
    hostname: poller-engine
    restart: unless-stopped
    depends_on:
      volumes-init: {condition: service_completed_successfully}
    environment:
      TZ: "${TZ:-Europe/Paris}"
      NAME: "${POLLER_NAME:-gls-poller}"
      ENGINE_RPC_LISTEN_ADDRESS: "127.0.0.1"
      # Bootstrap from env only (contracts § 6.3): rendered when no config exists,
      # never over a delivered one. POLLER_ID / POLLER_UID come from the poller
      # creation API answer (gls-e2e.sh up).
      CENTRAL_BROKER_HOST: centreon-broker
      CENTRAL_BROKER_PORT: "5669"
      POLLER_NAME: "${POLLER_NAME:-gls-poller}"
      POLLER_ID: "${POLLER_ID:-}"
      POLLER_UID: "${POLLER_UID:-}"
      BROKER_CA_CERT: /etc/centreon-broker/certs/ca.crt
      BROKER_TLS_HOSTNAME: centreon-broker
      APP_SECRET: "${APP_SECRET:-9cd3e2ccf822916ec8fc5379f8abdaf277860415454f9b91c0913392d4b41f92}"
      SALT: "${SALT:-84e9107f78239bdab2751c3321023a32c3716ed0724a4a8b13de8e7aed8d319d}"
    volumes:
      - type: volume
        source: poller-engine-etc
        target: /etc/centreon-engine
        volume: {nocopy: true}
      - type: volume
        source: poller-broker-etc
        target: /etc/centreon-broker
        volume: {nocopy: true}
      # CA of the central cbd (contracts § 6.2), run-time throwaway.
      - ${GLS_CERTS_DIR:-./.certs}/ca.crt:/etc/centreon-broker/certs/ca.crt:ro
      # State (contracts § 7): cbmod cache_directory (queue while the central is
      # unreachable) + retention.dat. Logs stay in the container layer.
      - poller-engine-state:/var/lib/centreon-engine
      - ./overrides/05-engine-config.sh:/usr/local/lib/centreon-engine/container.d/05-engine-config.sh:ro
    tmpfs:
      - /var/lib/centreon-engine/rw:uid=901,gid=901,mode=0770
    # Connected = an established outbound socket to port 5669 (0x1625).
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1625 01' /proc/net/tcp /proc/net/tcp6 2>/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 3
    networks: [wan]

networks:
  wan:
    name: gls-wan
    external: true

volumes:
  poller-engine-etc:
  poller-broker-etc:
  poller-engine-state:
