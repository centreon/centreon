# Gorgone-less light Central PoC (MON-215448 / MON-215451): central side.
# Not meant to be merged. See README.md.
#
#   docker network create gls-wan
#   docker compose -p gls-central -f docker-compose.central.yml --env-file images.env up -d
#
# No gorgone service. The central poller (nagios_server id 1) gets its
# configuration like any poller: cbd and central-engine bootstrap from env,
# then the web delivers through the cbd API (contracts § 9). No volume is
# shared between the web (fpm) and the collect containers.
# CENTRAL_POLLER_UID is generated once by gls-e2e.sh up (see README).
name: gls-central

x-tz: &tz
  TZ: "${TZ:-Europe/Paris}"

x-secrets: &secrets
  APP_SECRET: "${APP_SECRET:-9cd3e2ccf822916ec8fc5379f8abdaf277860415454f9b91c0913392d4b41f92}"
  SALT: "${SALT:-84e9107f78239bdab2751c3321023a32c3716ed0724a4a8b13de8e7aed8d319d}"

services:
  db:
    image: "${MYSQL_IMAGE:-mariadb:11.8}"
    env_file: [../.env]
    environment:
      <<: *tz
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--port=3306", "--skip-ssl", "--skip-name-resolve"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MARIADB_ROOT_PASSWORD\" mariadb-admin --skip-ssl -h 127.0.0.1 -P3306 -uroot ping --silent"]
      interval: 5s
      timeout: 15s
      retries: 30
    networks: [central]

  valkey:
    image: "${VALKEY_IMAGE:-valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a}"
    environment:
      <<: *tz
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:-centreon-valkey-dev}"
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\" --save '' --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [central]

  fpm:
    image: "${REGISTRY}/centreon-web-split-fpm-trixie:${WEB_TAG}"
    env_file: [../.env]
    depends_on:
      db: {condition: service_healthy}
      valkey: {condition: service_healthy}
    environment:
      <<: [*tz, *secrets]
      RUN_INSTALL: "true"
      # First central export through the cbd API (generate-and-reload on id 1,
      # retried on 409 until the central peer is capable), contracts § 9.
      RUN_CONFIG_DELIVERY: "true"
      # Central peer identity, same value as central-engine POLLER_UID (contracts § 9).
      CENTRAL_POLLER_UID: "${CENTRAL_POLLER_UID:?generated by gls-e2e.sh up}"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      CENTREON_INTERNAL_API_BASE_URL: "http://httpd:80"
      CENTREON_RRDCACHED_HOST: rrdcached
      RRDCACHED_PORT: "42217"
      PHP_TIMEZONE: "${TZ:-Europe/Paris}"
      PHP_MEMORY_LIMIT: "256M"
      PHP_MAX_EXECUTION_TIME: "300"
      PHP_SESSION_HANDLER: redis
      PHP_SESSION_SAVE_PATH: "tcp://valkey:6379"
      PHP_SESSION_REDIS_PASSWORD: "${VALKEY_PASSWORD:-centreon-valkey-dev}"
      # Web -> central cbd remote API (contracts.md §1). Unused by step 0 images.
      CENTREON_BROKER_API_URL: "http://centreon-broker:8099"
      CENTREON_BROKER_API_TOKEN: "${CENTREON_BROKER_API_TOKEN:-gls-poc-token}"
      # gRPC TLS on every cbmod output and on the central input (contracts § 6.W2),
      # paths = § 6.2 defaults. No remote_actions_insecure anywhere.
      CENTREON_BROKER_TLS: "1"
      CENTREON_BROKER_TLS_HOSTNAME: centreon-broker
      # What external pollers dial (install command, contracts § 11.S2): the published 5669.
      CENTREON_BROKER_POLLER_HOST: "${GLS_BROKER_PUBLIC_HOST:-host.docker.internal}"
      CENTREON_BROKER_POLLER_PORT: "${GLS_BROKER_PUBLIC_PORT:-5669}"
      # Engine retention on the state volume (contracts § 7), default for the
      # central (install) and for pollers created through the API.
      ENGINE_STATE_RETENTION_FILE: /var/lib/centreon-engine/retention.dat
    volumes:
      - centreon-status:/var/lib/centreon/status
      - centreon-metrics:/var/lib/centreon/metrics
      - centreon-media:/usr/share/centreon/www/img/media
      - centreon-license:/etc/centreon/license.d
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/docker.ready"]
      interval: 5s
      timeout: 5s
      retries: 120
    networks: [central]

  # Autodiscovery worker (phase 3 P2/P3, contracts § 12.M, 12.W-worker): runs the
  # discovery jobs through cbd /v1/executions, no gorgone. Same image as fpm.
  autodiscovery-worker:
    image: "${REGISTRY}/centreon-web-split-fpm-trixie:${WEB_TAG}"
    env_file: [../.env]
    depends_on:
      db: {condition: service_healthy}
      fpm: {condition: service_healthy}
    restart: unless-stopped
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "exec /usr/share/centreon/bin/console centreon-autodiscovery:worker"]
    environment:
      <<: [*tz, *secrets]
      # Per-container steps only: renders centreon.conf.php and .env, no DB install.
      RUN_INSTALL: "true"
      INSTALL_DB_STEPS: "false"
      RUN_CONFIG_DELIVERY: "false"
      RRD_VOLUMES_CHOWN: "false"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      PHP_TIMEZONE: "${TZ:-Europe/Paris}"
      CENTREON_BROKER_API_URL: "http://centreon-broker:8099"
      CENTREON_BROKER_API_TOKEN: "${CENTREON_BROKER_API_TOKEN:-gls-poc-token}"
      # e2e TIMEOUT case (default 300 s).
      CENTREON_AUTODISCOVERY_EXEC_TIMEOUT: "${CENTREON_AUTODISCOVERY_EXEC_TIMEOUT:-10}"
      # P3 automatic save + export through the web API (install defaults, PoC only).
      CENTREON_INTERNAL_API_BASE_URL: "http://httpd:80"
      CENTREON_API_USERNAME: "${CENTREON_API_USERNAME:-admin}"
      CENTREON_API_PASSWORD: "${CENTREON_API_PASSWORD:-Centreon!2021}"
    volumes:
      - centreon-license:/etc/centreon/license.d:ro
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/autodiscovery-worker.alive -mmin -10 | grep -q ."]
      interval: 15s
      timeout: 5s
      start_period: 2m
      retries: 8
    networks: [central]

  httpd:
    image: "${REGISTRY}/centreon-web-split-httpd-trixie:${WEB_TAG}"
    depends_on:
      fpm: {condition: service_healthy}
    ports:
      - "${HTTPD_PORT:-18180}:80"
    environment:
      <<: *tz
      PHP_FPM_UPSTREAM: "fpm:9000"
      HTTPD_SERVER_NAME: "${HTTPD_SERVER_NAME:-localhost:18180}"
      # No gorgone: the pullwss proxy points at a closed local port.
      GORGONE_WSS_UPSTREAM: "127.0.0.1:1"
      HTTPD_PROXY_TIMEOUT: "300"
    volumes:
      - centreon-media:/usr/share/centreon/www/img/media:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/docker.ready"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [central]

  rrdcached:
    image: "${REGISTRY}/centreon-web-split-rrdcached-trixie:${WEB_TAG}"
    environment:
      <<: *tz
    expose: ["42217"]
    volumes:
      - centreon-status:/var/lib/centreon/status
      - centreon-metrics:/var/lib/centreon/metrics
      - /var/lib/rrdcached/journal
    networks: [central]

  # Central cbd. Service name = the host the web writes in the central cbmod
  # output (fpm 12-install.sh) and in the remote pollers' output.
  centreon-broker:
    image: "${REGISTRY}/centreon-broker-trixie:${BROKER_TAG}"
    hostname: centreon-broker
    restart: unless-stopped
    # cbd directly: the pinned image has no api_control.py, and cbd reloads itself (contracts § 5.3).
    command: ["cbd", "/etc/centreon-broker/central-broker.json"]
    environment:
      <<: [*tz, *secrets]
      # Self-generated CA + server cert at start when none is mounted (contracts § 8.1).
      # SAN = what pollers dial (contracts § 11.C2): centreon-broker on gls-wan; the
      # install-script step adds the external name (server cert renewed, same CA).
      BROKER_TLS_SAN: "${GLS_BROKER_TLS_SAN:-centreon-broker}"
      # Bootstrap central-broker.json (remote_api + TLS input, no output) when
      # none is delivered yet; same token as fpm (contracts § 9.C).
      CENTREON_BROKER_API_TOKEN: "${CENTREON_BROKER_API_TOKEN:-gls-poc-token}"
      # cbd self-reloads on a deployment to this uid (contracts § 9.C4).
      CENTRAL_POLLER_UID: "${CENTRAL_POLLER_UID:?generated by gls-e2e.sh up}"
    volumes:
      # Shared rw with central-engine only (collect-only): the central cbmod
      # applies the deliveries to id 1, cbd reloads itself (contracts § 9.C).
      - central-broker-etc:/etc/centreon-broker
      # TLS identity of the BBDO input, generated by cbd and kept (contracts § 8.1).
      # Seeded from the image directory (902, 0755, contracts § 8.A).
      - central-broker-certs:/etc/centreon-broker/certs
      - centreon-status:/var/lib/centreon/status
      - centreon-metrics:/var/lib/centreon/metrics
      # cbd cache_directory (failover queue, command.sock), contracts § 7.
      - central-broker-state:/var/lib/centreon-broker
    # Healthy once the TLS identity exists: the central cbmod needs ca.crt at bootstrap.
    healthcheck:
      test: ["CMD-SHELL", "test -s /etc/centreon-broker/certs/ca.crt && test -s /etc/centreon-broker/certs/central.crt"]
      interval: 5s
      timeout: 5s
      retries: 60
    # 5669 published for external pollers (contracts § 11.S2); 8099 internal only.
    ports: ["${GLS_BROKER_PUBLIC_PORT:-5669}:5669"]
    expose: ["5669", "8099"]
    networks:
      central: {}
      wan: {}

  # Central poller engine (nagios_server id 1): same image and same path as a
  # remote poller, only on the central network.
  central-engine:
    image: "${REGISTRY}/centreon-engine-trixie:${ENGINE_TAG}"
    hostname: central-engine
    restart: unless-stopped
    depends_on:
      centreon-broker: {condition: service_healthy}
    environment:
      <<: [*tz, *secrets]
      NAME: central
      ENGINE_RPC_LISTEN_ADDRESS: "127.0.0.1"
      # Bootstrap from env like a poller (contracts § 9.C); engine-context.json
      # from APP_SECRET/SALT (§ 8.A).
      CENTRAL_BROKER_HOST: centreon-broker
      CENTRAL_BROKER_PORT: "5669"
      POLLER_NAME: Central
      POLLER_ID: "1"
      POLLER_UID: "${CENTRAL_POLLER_UID:?generated by gls-e2e.sh up}"
      BROKER_CA_CERT: /etc/centreon-broker/certs/ca.crt
      BROKER_TLS_HOSTNAME: centreon-broker
    volumes:
      # Collect-only, seeded by the image (contracts § 8.A / 9).
      - central-engine-etc:/etc/centreon-engine
      - central-broker-etc:/etc/centreon-broker
      # CA that signs the central cbd cert (cbmod verifies it).
      - central-broker-certs:/etc/centreon-broker/certs:ro
      # State (contracts § 7): cbmod cache_directory + retention.dat. Logs stay
      # in the container layer.
      - central-engine-state:/var/lib/centreon-engine
      # Keeps the engine gRPC on what the config says (127.0.0.1 for vm pollers).
      - ./overrides/05-engine-config.sh:/usr/local/lib/centreon-engine/container.d/05-engine-config.sh:ro
    # command_file FIFO: only the engine uses it now (no gorgone).
    tmpfs:
      - /var/lib/centreon-engine/rw:uid=901,gid=901,mode=0770
    networks: [central]

networks:
  central: {}
  wan:
    name: gls-wan
    external: true

volumes:
  centreon-status:
  centreon-metrics:
  centreon-media:
  centreon-license:
  central-engine-etc:
  central-broker-etc:
  central-broker-certs:
  central-engine-state:
  central-broker-state:
