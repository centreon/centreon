# Gorgone-less light Central PoC (MON-215448 / MON-215451): central side.
# Not meant to be merged. See README.md.
#
#   docker network create gls-wan
#   docker compose -p gls-central -f docker-compose.central.yml --env-file images.env up -d
#
# No gorgone service. The central poller (nagios_server id 1) gets its
# configuration by the web's local copy (moveFiles.php, localhost=1): fpm
# mounts the central engine/broker config volumes. Bootstrap-only, removed
# once the BBDO downstream channel delivers the central poller too.
name: gls-central

x-tz: &tz
  TZ: "${TZ:-Europe/Paris}"

x-secrets: &secrets
  APP_SECRET: "${APP_SECRET:-9cd3e2ccf822916ec8fc5379f8abdaf277860415454f9b91c0913392d4b41f92}"
  SALT: "${SALT:-84e9107f78239bdab2751c3321023a32c3716ed0724a4a8b13de8e7aed8d319d}"

services:
  # Creates the shared config volumes empty, with the ownership both the web
  # (www-data, gid 33) and engine/broker (901/902) need. Empty volumes make
  # the engine wait for its first delivery (30-wait-broker-module-config.sh).
  volumes-init:
    image: "${REGISTRY}/centreon-engine-trixie:${ENGINE_TAG}"
    user: "0"
    entrypoint: ["/bin/sh", "/gls/init-volumes.sh", "central"]
    environment:
      <<: *secrets
    volumes:
      - ./scripts:/gls:ro
      - central-engine-etc:/mnt/engine-etc
      - central-broker-etc:/mnt/broker-etc
      # Only prepared (owner 902, 0755): cbd generates its PKI there (contracts § 8).
      - central-broker-certs:/mnt/broker-certs
    restart: "no"

  db:
    image: "${MYSQL_IMAGE:-mariadb:11.8}"
    env_file: [../.env]
    environment:
      <<: *tz
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--port=3306", "--skip-ssl", "--skip-name-resolve"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MARIADB_ROOT_PASSWORD\" mariadb-admin --skip-ssl -h 127.0.0.1 -P3306 -uroot ping --silent"]
      interval: 5s
      timeout: 15s
      retries: 30
    networks: [central]

  valkey:
    image: "${VALKEY_IMAGE:-valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a}"
    environment:
      <<: *tz
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:-centreon-valkey-dev}"
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\" --save '' --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [central]

  fpm:
    image: "${REGISTRY}/centreon-web-split-fpm-trixie:${WEB_TAG}"
    env_file: [../.env]
    depends_on:
      db: {condition: service_healthy}
      valkey: {condition: service_healthy}
      volumes-init: {condition: service_completed_successfully}
    environment:
      <<: [*tz, *secrets]
      RUN_INSTALL: "true"
      # The PoC first-delivery loop waits on gorgone: replaced by gls-e2e.sh bootstrap.
      RUN_CONFIG_DELIVERY: "false"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      CENTREON_INTERNAL_API_BASE_URL: "http://httpd:80"
      CENTREON_RRDCACHED_HOST: rrdcached
      RRDCACHED_PORT: "42217"
      PHP_TIMEZONE: "${TZ:-Europe/Paris}"
      PHP_MEMORY_LIMIT: "256M"
      PHP_MAX_EXECUTION_TIME: "300"
      PHP_SESSION_HANDLER: redis
      PHP_SESSION_SAVE_PATH: "tcp://valkey:6379"
      PHP_SESSION_REDIS_PASSWORD: "${VALKEY_PASSWORD:-centreon-valkey-dev}"
      # Web -> central cbd remote API (contracts.md §1). Unused by step 0 images.
      CENTREON_BROKER_API_URL: "http://centreon-broker:8099"
      CENTREON_BROKER_API_TOKEN: "${CENTREON_BROKER_API_TOKEN:-gls-poc-token}"
      # gRPC TLS on every cbmod output and on the central input (contracts § 6.W2),
      # paths = § 6.2 defaults. No remote_actions_insecure anywhere.
      CENTREON_BROKER_TLS: "1"
      CENTREON_BROKER_TLS_HOSTNAME: centreon-broker
      # Engine retention on the state volume (contracts § 7), default for the
      # central (install) and for pollers created through the API.
      ENGINE_STATE_RETENTION_FILE: /var/lib/centreon-engine/retention.dat
    volumes:
      - centreon-status:/var/lib/centreon/status
      - centreon-metrics:/var/lib/centreon/metrics
      - centreon-media:/usr/share/centreon/www/img/media
      - centreon-license:/etc/centreon/license.d
      # Bootstrap-only (central poller local copy), see header.
      - type: volume
        source: central-engine-etc
        target: /etc/centreon-engine
        volume: {nocopy: true}
      - type: volume
        source: central-broker-etc
        target: /etc/centreon-broker
        volume: {nocopy: true}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/docker.ready"]
      interval: 5s
      timeout: 5s
      retries: 120
    networks: [central]

  httpd:
    image: "${REGISTRY}/centreon-web-split-httpd-trixie:${WEB_TAG}"
    depends_on:
      fpm: {condition: service_healthy}
    ports:
      - "${HTTPD_PORT:-18180}:80"
    environment:
      <<: *tz
      PHP_FPM_UPSTREAM: "fpm:9000"
      HTTPD_SERVER_NAME: "${HTTPD_SERVER_NAME:-localhost:18180}"
      # No gorgone: the pullwss proxy points at a closed local port.
      GORGONE_WSS_UPSTREAM: "127.0.0.1:1"
      HTTPD_PROXY_TIMEOUT: "300"
    volumes:
      - centreon-media:/usr/share/centreon/www/img/media:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/docker.ready"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [central]

  rrdcached:
    image: "${REGISTRY}/centreon-web-split-rrdcached-trixie:${WEB_TAG}"
    environment:
      <<: *tz
    expose: ["42217"]
    volumes:
      - centreon-status:/var/lib/centreon/status
      - centreon-metrics:/var/lib/centreon/metrics
      - /var/lib/rrdcached/journal
    networks: [central]

  # Central cbd. Service name = the host the web writes in the central cbmod
  # output (fpm 12-install.sh) and in the remote pollers' output.
  centreon-broker:
    image: "${REGISTRY}/centreon-broker-trixie:${BROKER_TAG}"
    hostname: centreon-broker
    restart: unless-stopped
    depends_on:
      fpm: {condition: service_started}
      volumes-init: {condition: service_completed_successfully}
    # Waits for the web-generated config instead of crash-looping on a
    # missing file (the image refuses the package default anyway).
    entrypoint:
      - /bin/sh
      - -c
      - |
        until [ -s /etc/centreon-broker/central-broker.json ]; do echo "gls: waiting for central-broker.json"; sleep 3; done
        sleep 2
        exec /usr/local/lib/centreon-broker/container.sh "$$@"
      - gls-wait
    # cbd directly: the pinned image has no api_control.py, and cbd reloads itself (contracts § 5.3).
    command: ["cbd", "/etc/centreon-broker/central-broker.json"]
    environment:
      <<: [*tz, *secrets]
      # Self-generated CA + server cert at start when none is mounted (contracts § 8.1).
      BROKER_TLS_SAN: centreon-broker
    volumes:
      - type: volume
        source: central-broker-etc
        target: /etc/centreon-broker
        volume: {nocopy: true}
      # TLS identity of the BBDO input, generated by cbd and kept (contracts § 8.1).
      # nocopy: keep the 902/0755 root set by volumes-init (the engine reads ca.crt).
      - type: volume
        source: central-broker-certs
        target: /etc/centreon-broker/certs
        volume: {nocopy: true}
      - centreon-status:/var/lib/centreon/status
      - centreon-metrics:/var/lib/centreon/metrics
      # cbd cache_directory (failover queue, command.sock), contracts § 7.
      - central-broker-state:/var/lib/centreon-broker
    expose: ["5669", "8099"]
    networks:
      central: {}
      wan: {}

  # Central poller engine (nagios_server id 1): same image and same path as a
  # remote poller, only on the central network.
  central-engine:
    image: "${REGISTRY}/centreon-engine-trixie:${ENGINE_TAG}"
    hostname: central-engine
    restart: unless-stopped
    depends_on:
      volumes-init: {condition: service_completed_successfully}
      centreon-broker: {condition: service_started}
    environment:
      <<: [*tz, *secrets]
      NAME: central
      ENGINE_RPC_LISTEN_ADDRESS: "127.0.0.1"
    volumes:
      - type: volume
        source: central-engine-etc
        target: /etc/centreon-engine
        volume: {nocopy: true}
      - type: volume
        source: central-broker-etc
        target: /etc/centreon-broker
        volume: {nocopy: true}
      # CA that signs the central cbd cert (cbmod verifies it).
      - type: volume
        source: central-broker-certs
        target: /etc/centreon-broker/certs
        read_only: true
        volume: {nocopy: true}
      # State (contracts § 7): cbmod cache_directory + retention.dat. Logs stay
      # in the container layer.
      - central-engine-state:/var/lib/centreon-engine
      # Keeps the engine gRPC on what the config says (127.0.0.1 for vm pollers).
      - ./overrides/05-engine-config.sh:/usr/local/lib/centreon-engine/container.d/05-engine-config.sh:ro
    # command_file FIFO: only the engine uses it now (no gorgone).
    tmpfs:
      - /var/lib/centreon-engine/rw:uid=901,gid=901,mode=0770
    networks: [central]

networks:
  central: {}
  wan:
    name: gls-wan
    external: true

volumes:
  centreon-status:
  centreon-metrics:
  centreon-media:
  centreon-license:
  central-engine-etc:
  central-broker-etc:
  central-broker-certs:
  central-engine-state:
  central-broker-state:
