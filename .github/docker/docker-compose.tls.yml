# HTTPS-mode overlay. Load alongside docker-compose.yml via -f flags or by
# setting COMPOSE_FILE. See README.md "HTTP / HTTPS mode".
#
# Adds: certgen one-shot, the `certs` named volume, TLS for web/db/remote-server/db-remote.
# Replaces (not merges): web.ports, remote-server.ports, web/remote-server healthcheck targets,
# db/db-remote MARIADB_EXTRA_FLAGS.
#
# Requires: docker compose >= 2.20 (for `!override` and `service_completed_successfully`),
#           a centreon-web image containing centreon/centreon PR #9237 (DatabaseTLSResolver).
#           The 04-tls.sh entrypoint hook fails fast with a copy-pasteable error otherwise.

services:
  certgen:
    build: ./certgen
    image: "${CERTGEN_IMAGE:-centreon-certgen:local}"
    command:
      - web
      - remote-server
      - db
      - db-remote
      - localhost
      - "127.0.0.1"
    volumes:
      - certs:/out

  web:
    ports: !override
      # :80 stays mapped in HTTPS mode so the :80→:443 redirect emitted by the
      # official template can be exercised externally (e.g. `curl -I :4000` shows
      # the 301 Location header). Note: the redirect target uses %{HTTP_HOST}
      # which includes the request port, so curl -L from the host won't follow
      # successfully — use `docker compose exec web curl -kL http://localhost/...`
      # to test the full chain at production-default ports.
      - "4000:80"
      - "4443:443"
    volumes:
      # Bind-mount the TLS hooks the same way 81-register_remote_server runs on remote-server:
      # pre-built WEB_IMAGEs don't yet contain them, so without this the hooks never run.
      # - 04-tls.sh: certs install, Apache TLS vhost, mysql client cfg, .env keys (runs BEFORE install)
      # - 16-tls-gorgone.sh: patch gorgone DSN with mysql_ssl=1 (runs AFTER install)
      - ./centreon-web/${CENTREON_WEB_OS:-alma9}/entrypoint/container.d/04-tls.sh:/usr/share/centreon/container.d/04-tls.sh:ro
      - ./centreon-web/${CENTREON_WEB_OS:-alma9}/entrypoint/container.d/16-tls-gorgone.sh:/usr/share/centreon/container.d/16-tls-gorgone.sh:ro
      - certs:/etc/pki/centreon-tls:ro
    depends_on:
      db:
        condition: service_started
      certgen:
        condition: service_completed_successfully
    healthcheck:
      test: bash -c "[ -f /tmp/docker.ready ]" && curl -k --fail https://localhost/centreon/api/latest/platform/versions || exit 1

  db:
    volumes:
      - certs:/certs:ro
    environment:
      MARIADB_EXTRA_FLAGS: "--ssl-ca=/certs/rootCA.pem --ssl-cert=/certs/db/server.pem --ssl-key=/certs/db/server-key.pem --require-secure-transport=ON"
    depends_on:
      certgen:
        condition: service_completed_successfully

  remote-server:
    ports: !override
      - "4001:80"
      - "4444:443"
    volumes:
      - ./centreon-web/${CENTREON_WEB_OS:-alma9}/entrypoint/container.d/81-register_remote_server_background.sh:/usr/share/centreon/container.d/81-register_remote_server_background.sh
      - ./centreon-web/${CENTREON_WEB_OS:-alma9}/entrypoint/container.d/04-tls.sh:/usr/share/centreon/container.d/04-tls.sh:ro
      - ./centreon-web/${CENTREON_WEB_OS:-alma9}/entrypoint/container.d/16-tls-gorgone.sh:/usr/share/centreon/container.d/16-tls-gorgone.sh:ro
      - certs:/etc/pki/centreon-tls:ro
    depends_on:
      db-remote:
        condition: service_started
      web:
        condition: service_healthy
      certgen:
        condition: service_completed_successfully
    healthcheck:
      test: bash -c "[ -f /tmp/docker.ready ] && [ -f /tmp/remote-server.registered ]" && curl -k --fail https://localhost/centreon/api/latest/platform/versions || exit 1

  db-remote:
    volumes:
      - certs:/certs:ro
    environment:
      MARIADB_EXTRA_FLAGS: "--ssl-ca=/certs/rootCA.pem --ssl-cert=/certs/db/server.pem --ssl-key=/certs/db/server-key.pem --require-secure-transport=ON"
    depends_on:
      certgen:
        condition: service_completed_successfully

volumes:
  certs:
