{{- /* Pod spec ported from the centreon-central chart's _poller.tpl
       (commit b429003acf), without its in-cluster central couplings. */ -}}
{{- $fullname := include "centreon-poller.fullname" . -}}
{{- $engineImage := include "centreon-poller.image" (dict "ctx" . "image" .Values.images.engine) -}}
{{- $gorgoneImage := include "centreon-poller.image" (dict "ctx" . "image" .Values.images.gorgone) -}}
{{- $otelTlsSecret := include "centreon-poller.otelTlsSecret" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "centreon-poller.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}
  # Scaling out = more pollers (more releases), never replicas.
  replicas: 1
  # The pod is not Ready until the central delivers the config: with
  # OrderedReady an upgrade fixing a bad value would never replace it.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "centreon-poller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "centreon-poller.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Host name = pod name <fullname>-0 (forced by the StatefulSet
      # controller): the CMA TLS identity comes from engine.otel.tls.
      # gorgone's systemctl shim dials "centengine:50155": it must reach this
      # pod's own engine.
      # The VMware connector is reached as "centreon-vmware" (same name as
      # with install-poller), here in the same pod.
      hostAliases:
        - ip: 127.0.0.1
          hostnames:
            - centengine
            {{- if .Values.vmware.enabled }}
            - centreon-vmware
            {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.traps.enabled }}
      # snmptrapd runs as uid 900 and binds 162/udp: Docker allows it through
      # its default unprivileged port range, Kubernetes through this sysctl
      # ("safe", allowed by the baseline Pod Security Standard).
      securityContext:
        sysctls:
          - { name: net.ipv4.ip_unprivileged_port_start, value: "162" }
      {{- end }}
      initContainers:
        # Docker named-volume copy-up made explicit. /etc/centreon-broker is
        # NOT seeded: it waits for the config delivered by the central.
        - name: seed-engine
          image: {{ $engineImage }}
          imagePullPolicy: {{ .Values.images.engine.pullPolicy }}
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- include "centreon-poller.seedFn" . | nindent 14 }}
              seed /etc/centreon-engine /seed/engine
              seed /var/log/centreon-engine /seed/logs
              # CMA CA, generated by centengine at first boot only if absent:
              # the seed gives the dir 901:901, a fresh PVC is root-owned.
              seed /etc/pki/centreon-engine /seed/pki
              # gorgone writes the delivered config, centengine reads it (902).
              own 902:902 775 /seed/broker
              # External command FIFO (centengine creates it, gorgone writes).
              own 901:901 775 /seed/centcmd
              # Engine user's home = cbmod's default cache directory (queue
              # saved on clean stop). Needs an image whose entrypoint is not
              # in the home (MON-211751), or the seed would freeze it.
              seed /var/lib/centreon-engine /seed/engine-home
              {{- if $otelTlsSecret }}
              # CMA TLS identity: private to centengine (gorgone shares the pod).
              for f in /seed/otel-tls-src/*; do
                n=$(basename "$f")
                cp "$f" "/seed/otel-tls/$n"
                chown 901:901 "/seed/otel-tls/$n"
                case "$n" in *.key) chmod 600 "/seed/otel-tls/$n" ;; *) chmod 644 "/seed/otel-tls/$n" ;; esac
              done
              own 901:901 750 /seed/otel-tls
              {{- end }}
              ls -lnd /seed/*
          volumeMounts:
            - { name: engine, mountPath: /seed/engine }
            - { name: broker, mountPath: /seed/broker }
            - { name: logs, mountPath: /seed/logs }
            - { name: centcmd, mountPath: /seed/centcmd }
            - { name: cma-pki, mountPath: /seed/pki }
            - { name: engine-home, mountPath: /seed/engine-home }
            {{- if $otelTlsSecret }}
            - { name: otel-tls-src, mountPath: /seed/otel-tls-src, readOnly: true }
            - { name: otel-tls, mountPath: /seed/otel-tls }
            {{- end }}
        - name: seed-gorgone
          image: {{ $gorgoneImage }}
          imagePullPolicy: {{ .Values.images.gorgone.pullPolicy }}
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- include "centreon-poller.seedFn" . | nindent 14 }}
              seed /etc/centreon /seed/etc
              # Gorgone keys and history: keeps the poller identity across
              # reinstalls.
              seed /var/lib/centreon-gorgone /seed/gorgone-data
              {{- if .Values.traps.enabled }}
              # Trap definitions (centreontrapd.sdb): written by gorgone (903),
              # read by centreontrapd (900).
              own 903:900 775 /seed/traps-config
              # Trap spool: snmptrapd writes, centreontrapd consumes.
              own 900:900 1777 /seed/traps-spool
              {{- end }}
              ls -lnd /seed/*
          volumeMounts:
            - { name: etc, mountPath: /seed/etc }
            - { name: gorgone-data, mountPath: /seed/gorgone-data }
            {{- if .Values.traps.enabled }}
            - { name: traps-config, mountPath: /seed/traps-config }
            - { name: traps-spool, mountPath: /seed/traps-spool }
            {{- end }}
        {{- if .Values.vmware.enabled }}
        # The connector's default config (until the central delivers one),
        # never overwritten.
        - name: seed-vmware
          image: {{ include "centreon-poller.vmwareImage" . }}
          imagePullPolicy: {{ .Values.vmware.image.pullPolicy }}
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - |
              [ -e /seed/etc/centreon_vmware.json ] ||
                cp -p /etc/centreon/centreon_vmware.json /seed/etc/
              ls -ln /seed/etc/centreon_vmware.json
          volumeMounts:
            - { name: etc, mountPath: /seed/etc }
        {{- end }}
      containers:
        - name: gorgone
          image: {{ $gorgoneImage }}
          imagePullPolicy: {{ .Values.images.gorgone.pullPolicy }}
          env:
            - { name: TYPE, value: poller }
            - { name: NAME, value: {{ required "poller.name is required" .Values.poller.name | quote }} }
            - { name: GORGONE_UID, value: {{ include "centreon-poller.id" . | quote }} }
            {{- include "centreon-poller.secretEnv" (dict "ctx" . "name" "GORGONE_TOKEN" "key" .Values.secrets.keys.gorgoneToken) | nindent 12 }}
            {{- include "centreon-poller.secretEnv" (dict "ctx" . "name" "APP_SECRET" "key" .Values.secrets.keys.appSecret) | nindent 12 }}
            {{- include "centreon-poller.secretEnv" (dict "ctx" . "name" "SALT" "key" .Values.secrets.keys.salt) | nindent 12 }}
            - { name: CENTRAL_HOST, value: {{ required "central.host is required" .Values.central.host | quote }} }
            - { name: CENTRAL_PORT, value: {{ .Values.central.port | quote }} }
            - { name: GORGONE__GORGONE__MODULES__PULLWSS__SSL, value: {{ .Values.central.ssl | quote }} }
            - { name: GORGONE__GORGONE__MODULES__PULLWSS__CENTRAL_URI, value: {{ printf "%s/gorgone/pullwss/websocket" (trimSuffix "/" .Values.central.baseUri) | quote }} }
            - { name: GORGONE_LOG_LEVEL, value: {{ .Values.gorgone.logLevel | quote }} }
            - { name: DEBUG, value: {{ .Values.debug | quote }} }
            - { name: TZ, value: {{ .Values.poller.timezone | quote }} }
            {{- with .Values.gorgone.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # No probes: a central outage must neither restart the poller nor
          # cut the CMA agents off.
          {{- if .Values.gracefulStop.enabled }}
          lifecycle:
            preStop:
              exec:
                # gRPC SHUTDOWN of the engine (what "restart centengine" does):
                # cbmod saves its queue, unlike on SIGTERM.
                command:
                  - perl
                  - /usr/local/lib/centreon-gorgone/grpc-signal.pl
                  - centengine
                  - "50155"
                  - /com.centreon.engine.Engine/SignalProcess
                  - "0801"
          {{- end }}
          volumeMounts:
            - { name: engine, mountPath: /etc/centreon-engine }
            - { name: broker, mountPath: /etc/centreon-broker }
            - { name: centcmd, mountPath: /var/lib/centreon-engine/rw }
            - { name: etc, mountPath: /etc/centreon }
            - { name: gorgone-data, mountPath: /var/lib/centreon-gorgone }
            {{- if .Values.traps.enabled }}
            - { name: traps-config, mountPath: /etc/snmp/centreon_traps }
            {{- end }}
          {{- with .Values.gorgone.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: centengine
          image: {{ $engineImage }}
          imagePullPolicy: {{ .Values.images.engine.pullPolicy }}
          env:
            - { name: TYPE, value: poller }
            - { name: NAME, value: {{ .Values.poller.name | quote }} }
            - { name: TZ, value: {{ .Values.poller.timezone | quote }} }
            # The engine image only traces with DEBUG=1.
            - { name: DEBUG, value: {{ ternary "1" "0" .Values.debug | quote }} }
            {{- include "centreon-poller.secretEnv" (dict "ctx" . "name" "APP_SECRET" "key" .Values.secrets.keys.appSecret) | nindent 12 }}
            {{- include "centreon-poller.secretEnv" (dict "ctx" . "name" "SALT" "key" .Values.secrets.keys.salt) | nindent 12 }}
            {{- with .Values.engine.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { name: engine-grpc, containerPort: 50155 }
            - { name: otel, containerPort: 4317 }
          {{- if .Values.engine.addNetRaw }}
          securityContext:
            capabilities:
              add: [NET_RAW]
          {{- end }}
          # No liveness: centengine crash-loops until its delivered config
          # lands (self-resolving).
          readinessProbe:
            exec:
              command: [test, -f, /tmp/docker.ready]
            periodSeconds: 10
          {{- if .Values.gracefulStop.enabled }}
          lifecycle:
            preStop:
              exec:
                # Leaves time for gorgone's gRPC shutdown before the SIGTERM.
                command: [sleep, {{ .Values.gracefulStop.waitSeconds | quote }}]
          {{- end }}
          volumeMounts:
            # Home first: the command FIFO dir (rw) is mounted over it.
            - { name: engine-home, mountPath: /var/lib/centreon-engine }
            - { name: centcmd, mountPath: /var/lib/centreon-engine/rw }
            - { name: engine, mountPath: /etc/centreon-engine }
            - { name: broker, mountPath: /etc/centreon-broker }
            - { name: logs, mountPath: /var/log/centreon-engine }
            - { name: cma-pki, mountPath: /etc/pki/centreon-engine }
            {{- if $otelTlsSecret }}
            - { name: otel-tls, mountPath: {{ .Values.engine.otel.tls.mountPath }}, readOnly: true }
            {{- end }}
          {{- with .Values.engine.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with .Values.traps }}
        {{- if .enabled }}
        # SNMP traps: snmptrapd receives them on 162/udp and spools them,
        # centreontrapd matches them against the delivered definitions and
        # submits results to the engine's command FIFO (hence the same pod).
        - name: snmptrapd
          image: {{ include "centreon-poller.image" (dict "ctx" $ "image" .images.snmptrapd) }}
          imagePullPolicy: {{ .images.snmptrapd.pullPolicy }}
          env:
            - { name: TZ, value: {{ $.Values.poller.timezone | quote }} }
            - { name: DEBUG, value: {{ $.Values.debug | quote }} }
          ports:
            - { name: snmptrap, containerPort: 162, protocol: UDP }
          volumeMounts:
            - { name: traps-spool, mountPath: /var/spool/centreontrapd }
          {{- with .snmptrapdResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: centreontrapd
          image: {{ include "centreon-poller.image" (dict "ctx" $ "image" .images.centreontrapd) }}
          imagePullPolicy: {{ .images.centreontrapd.pullPolicy }}
          env:
            - { name: TZ, value: {{ $.Values.poller.timezone | quote }} }
            - { name: DEBUG, value: {{ $.Values.debug | quote }} }
            - { name: CENTREONTRAPD_LOG_LEVEL, value: {{ .logLevel | quote }} }
          volumeMounts:
            - { name: traps-spool, mountPath: /var/spool/centreontrapd }
            - { name: traps-config, mountPath: /etc/snmp/centreon_traps, readOnly: true }
            - { name: centcmd, mountPath: /var/lib/centreon-engine/rw }
          {{- with .centreontrapdResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.vmware.enabled }}
        # VMware connector, queried by the engine's VMware plugins on 5700.
        # Its config (/etc/centreon/centreon_vmware.json) is delivered by the
        # central through gorgone; the connector restarts itself on change.
        - name: centreon-vmware
          image: {{ include "centreon-poller.vmwareImage" . }}
          imagePullPolicy: {{ .Values.vmware.image.pullPolicy }}
          env:
            - { name: TZ, value: {{ .Values.poller.timezone | quote }} }
            - { name: DEBUG, value: {{ .Values.debug | quote }} }
            {{- include "centreon-poller.secretEnv" (dict "ctx" . "name" "APP_SECRET" "key" .Values.secrets.keys.appSecret) | nindent 12 }}
            {{- include "centreon-poller.secretEnv" (dict "ctx" . "name" "SALT" "key" .Values.secrets.keys.salt) | nindent 12 }}
          ports:
            - { name: vmware, containerPort: 5700 }
          volumeMounts:
            - { name: etc, mountPath: /etc/centreon }
          {{- with .Values.vmware.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: centcmd
          emptyDir: {}
        {{- if .Values.traps.enabled }}
        # Traps waiting for centreontrapd: processed within seconds.
        - name: traps-spool
          emptyDir: {}
        {{- end }}
        {{- with $otelTlsSecret }}
        # Only seed-engine reads the Secret; it copies it into otel-tls owned
        # by centengine (key 0600). No fsGroup: it would re-own the PVCs.
        - name: otel-tls-src
          secret:
            secretName: {{ . }}
            defaultMode: 0400
        - name: otel-tls
          emptyDir:
            medium: Memory
        {{- end }}
  volumeClaimTemplates:
    {{- $claims := dict "engine" .Values.persistence.engine "broker" .Values.persistence.broker "etc" .Values.persistence.etc "logs" .Values.persistence.logs "cma-pki" .Values.persistence.cmaPki "engine-home" .Values.persistence.engineHome "gorgone-data" .Values.persistence.gorgoneData }}
    {{- if .Values.traps.enabled }}
    {{- $_ := set $claims "traps-config" .Values.persistence.trapsConfig }}
    {{- end }}
    {{- range $vol, $size := $claims }}
    - metadata:
        name: {{ $vol }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $.Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $size }}
    {{- end }}
