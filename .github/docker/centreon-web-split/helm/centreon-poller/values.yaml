# One Centreon remote poller per release (gorgone + centengine/cbmod in one
# pod), attached to a central running anywhere (Helm, Docker or packages).
#
# Before installing:
#   1. Create the poller in Centreon ("Add Poller"): it gives its id (--uid)
#      and its pullwss token ("<token-name>:<token-value>").
#   2. Create the Secret referenced by secrets.existingSecret.
#   3. In the poller's broker configuration in Centreon: output host = the
#      central broker endpoint (5669) reachable from this cluster. Keep the
#      default "Cache directory" (/var/lib/centreon-engine, persisted).
#
# The engine image must keep its entrypoint out of /var/lib/centreon-engine
# (MON-211751): older images would have it frozen on the persisted volume.

# Resource names default to the release name (pod "<fullname>-0").
fullnameOverride: ""

imagePullSecrets: []

# Stable images are published on ghcr.io, tagged with the major version (same
# convention as install-poller). Empty tag = the chart's appVersion.
# Pre-release: docker.centreon.com/centreon/centreon-<component>-trixie with
# the maintenance branch tag (e.g. dev-26.10.x) or develop.
images:
  engine:
    repository: ghcr.io/centreon/centreon-engine
    tag: ""
    pullPolicy: IfNotPresent
  gorgone:
    repository: ghcr.io/centreon/centreon-gorgone
    tag: ""
    pullPolicy: IfNotPresent

poller:
  # Poller name as declared in Centreon. Required.
  name: ""
  # GORGONE_UID: the --uid of the Add Poller install command. Required, as a
  # quoted string (--set-string): 18-digit ids lose precision as numbers.
  id: ""
  timezone: UTC

# How gorgone reaches the central (pullwss, through the central's web server
# or ingress). Raise the ingress proxy read/send timeouts, otherwise idle
# websockets are cut (60s with ingress-nginx).
central:
  # Host name of the central web server / ingress. Required.
  host: ""
  port: 443
  ssl: true
  # Centreon base URI on the central.
  baseUri: /centreon

# Never generated by the chart. Keys hold the Add Poller token and the
# central's APP_SECRET / SALT (must match the central).
secrets:
  existingSecret: ""
  keys:
    gorgoneToken: GORGONE_TOKEN
    appSecret: APP_SECRET
    salt: SALT

gorgone:
  logLevel: info
  extraEnv: []
  resources: {}

engine:
  # check_icmp carries cap_net_raw: the container needs NET_RAW in its
  # bounding set. containerd keeps it by default, CRI-O / Podman drop it.
  # Off by default to stay within the "baseline" Pod Security Standard.
  # Set it on CRI-O / OpenShift: adding NET_RAW explicitly then requires a
  # "privileged" namespace.
  addNetRaw: false
  # E.g. SMTP_HOST / SMTP_PORT / SMTP_FROM / SMTP_TLS for notifications.
  extraEnv: []
  resources: {}
  # OpenTelemetry / Centreon Monitoring Agent (CMA) gRPC server, active once
  # an agent configuration is attached to the poller.
  otel:
    service:
      enabled: true
      type: ClusterIP          # LoadBalancer / NodePort for agents outside the cluster
      port: 4317
      nodePort: ""
      loadBalancerSourceRanges: []
      externalTrafficPolicy: ""
      annotations: {}

# On SIGTERM centengine stops cleanly (~15 s) and cbmod saves its queue.
terminationGracePeriodSeconds: 60

# Volume claim templates: cannot be changed after the first install
# (StatefulSet restriction).
persistence:
  storageClass: ""
  engine: 1Gi           # /etc/centreon-engine
  broker: 1Gi           # /etc/centreon-broker (delivered config)
  etc: 1Gi              # /etc/centreon
  logs: 5Gi             # /var/log/centreon-engine (+ retention.dat)
  cmaPki: 100Mi         # /etc/pki/centreon-engine (CMA CA)
  engineHome: 5Gi       # /var/lib/centreon-engine (cbmod's queue/cache)
  gorgoneData: 1Gi      # /var/lib/centreon-gorgone (keys, history)

debug: false

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
