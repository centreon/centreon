# Local dev/test stack for the split httpd/php-fpm centreon-web images
# (Pilier 1 — see trixie/README.md). Builds both images from source and
# wires them to a real MariaDB, reproducing the manual smoke test that
# validated a real login end to end.
#
# Usage (from the repository root):
#   docker compose -f .github/docker/centreon-web-split/docker-compose.yml up --build
#
# Then open http://localhost:18080/centreon/ (trailing slash — see the
# HTTPD_SERVER_NAME note below) and log in with admin / Centreon!2021.
#
# If you change HTTPD_PORT, also override HTTPD_SERVER_NAME to match — with
# UseCanonicalName On, Apache rebuilds self-referential URLs (including the
# automatic /centreon -> /centreon/ redirect) from HTTPD_SERVER_NAME, not
# from the Host header the browser actually sent.
services:
  db:
    image: "${MYSQL_IMAGE:-mariadb:11.8}"
    env_file:
      - ../.env
    environment:
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--skip-ssl", "--skip-name-resolve"]
    healthcheck:
      # Bare TCP check logs "Aborted connection ... user: 'unauthenticated'" at
      # every probe with the official image — use a real login instead. The
      # 11.x client requires TLS by default even though the server runs
      # --skip-ssl, so --skip-ssl is needed here too. Over TCP on purpose: a
      # bitnami-initialised datadir only has root@'%'.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MARIADB_ROOT_PASSWORD\" mariadb-admin --skip-ssl -h 127.0.0.1 -uroot ping --silent"]
      interval: 5s
      timeout: 15s
      retries: 20

  fpm:
    build:
      context: ../../..
      dockerfile: .github/docker/centreon-web-split/trixie/Dockerfile
      target: fpm
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      RUN_INSTALL: "true"
      MYSQL_HOST: db
      CENTREON_INTERNAL_API_BASE_URL: "http://httpd:80"
      # Read by generate-broker-configuration.php to poll gorgone's own
      # connection-status API (GET /internal/constatus, confirmed reachable
      # here over plain HTTP, no auth) before attempting config delivery —
      # a latency optimization over blind-retrying, not a correctness
      # requirement (that script's own fallback, and this script's outer
      # retry-forever loop, both still hold if gorgone's API is unreachable
      # for any reason).
      GORGONE_API_BASE_URL: "http://gorgone-central:8085"
      CENTREON_DATASET: "${CENTREON_DATASET:-0}"
      # Opt-in overrides, both unset/off by default — same fixture-default
      # behavior as before (admin / Centreon!2021, no forced password
      # change) unless explicitly set. See 12-install.sh for the full
      # story, including why centreon-gorgone needed its own dedicated
      # credential rather than reusing whatever admin's password happens
      # to be.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_PASSWORD_EXPIRED: "${ADMIN_PASSWORD_EXPIRED:-false}"
      GORGONE_API_USERNAME: centreon-gorgone
      GORGONE_API_PASSWORD: "${GORGONE_API_PASSWORD:-centreon-gorgone}"
      # centreonGraph{,Ng,Status}.class.php's remote rrdcached host (C7).
      # DESIGN CHANGE (see trixie/README.md): rrdcached is its own service,
      # not sharing centreon-broker's network namespace any more — reachable
      # at its own service name. Must stay aligned with 12-install.sh's own
      # RRDCACHED_HOST default ('rrdcached'), which is the value it writes
      # into cfg_centreonbroker_info's 'host' row for Central's rrd output;
      # fpm has no way to read that row back, so this is a second, redundant
      # source of truth for the same hostname, not derived from the first.
      # Harmless to set even while rrd_cached_option stays 'disable'
      # (RRDCACHED_PORT unset below): nothing calls fsockopen() unless
      # broker actually attempts an rrd flush, which it doesn't while
      # disabled.
      CENTREON_RRDCACHED_HOST: "${RRDCACHED_HOST:-rrdcached}"
      # Disabled by default until a BROKER_TAG carrying MON-213839's 'host'
      # key support is in use (C12: G9). 12-install.sh forces
      # rrd_cached_option back to 'disable' (and drops the 'host' row)
      # whenever this is unset/empty, idempotently on every start either
      # way.
      RRDCACHED_PORT: "${RRDCACHED_PORT:-}"
      # Resolved into centreon.ini at container start (01-config.sh) — the
      # image itself defaults to UTC (Dockerfile), this dev stack keeps the
      # value it always had rather than silently changing behavior.
      PHP_TIMEZONE: "${PHP_TIMEZONE:-Europe/Paris}"
      # Fixed dev secret, not regenerated on every recreate (neither .env*
      # nor engine-context.json are persisted — a random secret would drift
      # on every `up --force-recreate fpm`, invalidating sessions and
      # orphaning anything already encrypted in the DB under the previous
      # secret, since the db service *is* kept across an fpm-only recreate).
      # Dev/test value only, override with your own via `APP_SECRET=...`.
      APP_SECRET: "${APP_SECRET:-9cd3e2ccf822916ec8fc5379f8abdaf277860415454f9b91c0913392d4b41f92}"
      SALT: "${SALT:-84e9107f78239bdab2751c3321023a32c3716ed0724a4a8b13de8e7aed8d319d}"
    volumes:
      # Generic application state (Symfony cache, /var/lib/centreon) kept
      # across a recreate. Ownership is fixed natively at build time in the
      # Dockerfile (chown centreon:centreon, chmod 775).
      - centreon-cache:/var/cache/centreon
      - centreon-varlib:/var/lib/centreon
      # RRD graph rendering (centreonGraph.class.php shells out to rrdtool,
      # reading these files — never writes them, confirmed by exploring the
      # PHP source, no `.rrd` write/unlink call anywhere under www/) — a
      # narrower, dedicated pair of volumes vs. reusing centreon-varlib
      # above: this data will be shared with centreon-broker specifically,
      # not with gorgone (which has no reason to see it).
      #
      # Not :ro: these are fresh named volumes with no image-provided
      # ownership, and centreon-broker's own image ships USER centreon-broker
      # (non-root) by default, so it can't chown them itself. fpm already
      # runs an early root-level container.d phase and already bakes in
      # centreon-broker's exact UID/GID — container.d/03-rrd-volumes.sh does
      # the one-time mkdir+chown there instead of adding a dedicated init
      # container. The application code itself (www/, the rrdtool shell-out
      # above) still never writes here — httpd gets no mount at all, it
      # serves no PHP and has no reason to touch this.
      - centreon-status:/var/lib/centreon/status
      - centreon-metrics:/var/lib/centreon/metrics
      # UI-uploaded media (company logo, host/service icons — anything
      # through Administration > Parameters > Medias) — fpm is the writer
      # here (FileWriteMediaRepository writes straight into www/, confirmed
      # by tracing it: no dedicated upload dir outside the docroot), httpd
      # only needs to read it back to serve it statically. Without this,
      # media uploaded after build time is invisible to httpd (its own www/
      # is a build-time snapshot, no shared volume by design) — 404/broken
      # image, confirmed by comparing this exact path on both containers
      # directly.
      - centreon-media:/usr/share/centreon/www/img/media
      # PHP's own session store (session.save_handler=files, session.save_path
      # in centreon-pool.conf) — without this, every fpm recreate silently
      # logs every user out: the DB-side `session` table only tracks whether
      # a session id is still valid (CentreonSession::checkSession()), it
      # never holds the actual $_SESSION content ($_SESSION['centreon'], the
      # hydrated contact object) — that lives only in these files. A plain
      # `docker compose restart fpm` already survives this (container
      # filesystem untouched), only a recreate needed the volume.
      - centreon-sessions:/var/lib/php/sessions
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/docker.ready"]
      interval: 5s
      timeout: 5s
      retries: 60

  httpd:
    build:
      context: ../../..
      dockerfile: .github/docker/centreon-web-split/trixie/Dockerfile
      target: httpd
    depends_on:
      fpm:
        condition: service_healthy
    ports:
      - "${HTTPD_PORT:-18080}:80"
    environment:
      PHP_FPM_UPSTREAM: "fpm:9000"
      HTTPD_SERVER_NAME: "${HTTPD_SERVER_NAME:-localhost:18080}"
      GORGONE_WSS_UPSTREAM: "${GORGONE_WSS_UPSTREAM:-gorgone-central:8087}"
    volumes:
      # See the matching comment on fpm's own mount of this volume — fpm
      # writes, httpd only serves it back statically, :ro here on purpose.
      - centreon-media:/usr/share/centreon/www/img/media:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/docker.ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Pilier 2 (config-delivery, pullwss variant) — central orchestrator
  # gorgone. Native TYPE=central support: container.d/10-create-config.sh
  # writes config.d/{30-centreon,31-centreon-api,40-gorgoned}.yaml at startup
  # from env vars, and the image's own default CMD
  # (`gorgoned --config=/etc/centreon-gorgone/config.yaml`) picks them up
  # through the same `!include config.d/*.yaml` path TYPE=poller already
  # uses — no `command:` override needed here any more than for the poller
  # service below, and no bind-mounted static YAML either. Deliberate
  # deviations from a real central's own config.d, documented in that
  # script: gorgonecore.id 1000 not 1 (avoids an id/self-collision), proxy.
  # httpserver binds 0.0.0.0 not localhost (separate containers), tpapi
  # collapsed to one file/base_url (nothing is 127.0.0.1-reachable between
  # containers, so the real file's external-vs-local split doesn't apply).
  gorgone-central:
    image: "${GORGONE_IMAGE:-docker.centreon.com/centreon/centreon-gorgone-trixie:develop}"
    pull_policy: always
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      # Not required for the websocket/REMOTECOPY mechanism itself (that
      # worked fine without this), but register_nodes_from_db()/the nodes
      # module query nagios_server — starting before fpm's RUN_INSTALL has
      # populated the schema means self-registration has to rely on retries
      # instead of just working on the first pass.
      fpm:
        condition: service_healthy
    environment:
      TYPE: central
      MYSQL_HOST: db
      # Confirmed live: every GORGONE__ segment must be uppercase —
      # load_env_config lowercases the env var name to match it, then
      # re-fetches the value via $ENV{uc(...)}, which silently returns undef
      # (discarding the override) for any name that wasn't already all-
      # uppercase, while still logging success. All 6 needed, not just the
      # DSN: config.d/30-centreon.yaml ships REPLACE_ME/centreon/centreon as
      # literal placeholders, and gorgone's own load_env_config substitutes
      # them at load time from these exact GORGONE__ vars — db_realtime
      # needs its own DSN/username/password too, not just
      # db_configuration's.
      GORGONE__CENTREON__DATABASE__DB_CONFIGURATION__DSN: "mysql:host=db;dbname=centreon"
      GORGONE__CENTREON__DATABASE__DB_CONFIGURATION__USERNAME: centreon
      GORGONE__CENTREON__DATABASE__DB_CONFIGURATION__PASSWORD: centreon
      GORGONE__CENTREON__DATABASE__DB_REALTIME__DSN: "mysql:host=db;dbname=centreon_storage"
      GORGONE__CENTREON__DATABASE__DB_REALTIME__USERNAME: centreon
      GORGONE__CENTREON__DATABASE__DB_REALTIME__PASSWORD: centreon
      # New, for 10-create-config.sh's own tpapi block (not the GORGONE__
      # override mechanism — this script writes them directly into the
      # config.d file it generates). Pointed at the dedicated
      # centreon-gorgone system contact (see 12-install.sh) rather than
      # admin, so gorgone's own REST calls to Centreon don't silently depend
      # on the admin account's password never changing.
      CENTREON_API_BASE_URL: "http://httpd/centreon/api/latest/"
      CENTREON_API_USERNAME: centreon-gorgone
      CENTREON_API_PASSWORD: "${GORGONE_API_PASSWORD:-centreon-gorgone}"
      # MON-213814 (G8): the reverse pair — gorgone's own inbound API auth,
      # which is what fpm's own GORGONE_API_USERNAME/GORGONE_API_PASSWORD
      # (above, on the fpm service) authenticate against when calling INTO
      # gorgone. Same credential, same value, opposite direction from
      # CENTREON_API_USERNAME/PASSWORD just above (gorgone calling OUT to
      # Centreon's web API) — two distinct env var pairs the image's own
      # 10-create-config.sh now requires separately (:?-guarded, fails fast
      # if either is unset), not one derived from the other. Without this,
      # gorgone-central never starts at all (its own nodes module never
      # loads nagios_server, so pullwss rejects every poller connection with
      # "please registernodes" — confirmed testing the full C12 stack).
      GORGONE_API_USERNAME: centreon-gorgone
      GORGONE_API_PASSWORD: "${GORGONE_API_PASSWORD:-centreon-gorgone}"
    volumes:
      # Same named volumes as fpm — REMOTECOPY reads source files off its own
      # disk, never from the triggering request, so this has to be the exact
      # same filesystem fpm wrote to, not a copy.
      - centreon-cache:/var/cache/centreon
      - centreon-varlib:/var/lib/centreon

  # Central's own engine acting as a poller for config-delivery purposes (the
  # existing, unmodified TYPE=poller image/config, reused as-is).
  gorgone-central-poller:
    image: "${GORGONE_IMAGE:-docker.centreon.com/centreon/centreon-gorgone-trixie:develop}"
    pull_policy: always
    environment:
      TYPE: poller
      # Same pair as fpm's engine-context.json (not independent
      # placeholders) — centengine has to decrypt the same data web
      # encrypts.
      APP_SECRET: "${APP_SECRET:-9cd3e2ccf822916ec8fc5379f8abdaf277860415454f9b91c0913392d4b41f92}"
      SALT: "${SALT:-84e9107f78239bdab2751c3321023a32c3716ed0724a4a8b13de8e7aed8d319d}"
      GORGONE_UID: "1"                 # must match the Central nagios_server.id
      CENTRAL_HOST: httpd
      CENTRAL_PORT: "80"                # httpd's internal port, not the mapped host port
      # Native token auto-fetch: gorgone-central-poller logs in to the
      # Centreon API itself at startup and fetches the real "poller-default"
      # token value, no manually-pasted GORGONE_TOKEN that goes stale after
      # every fresh install. PULLWSS_TOKEN_NAME is the opt-in gate (unset =
      # old static GORGONE_TOKEN behavior) — reserved for this service
      # specifically, deliberately NOT a general poller template: a real
      # remote poller already gets a static token the normal way (Add
      # Poller UI) and handing it Centreon admin-API credentials on top
      # would be a real privilege increase for no benefit.
      PULLWSS_TOKEN_NAME: poller-default
      CENTREON_API_BASE_URL: "http://httpd/centreon/api/latest/"
      CENTREON_API_USERNAME: admin
      CENTREON_API_PASSWORD: "Centreon!2021"
      # Default 30 retries x 2s per phase (login, then fetch) is ~2min
      # total, which can plausibly lose a race against a genuinely fresh
      # install's full schema setup (depends_on below only waits for httpd
      # to start, not for fpm's RUN_INSTALL to finish) — bumped for
      # headroom; `restart: unless-stopped` below is the real safety net
      # regardless.
      PULLWSS_TOKEN_FETCH_RETRIES: "90"
      # Every GORGONE__ segment must be uppercase (see gorgone-central's own
      # comment above) — this dev stack has no TLS on httpd (port 80 only).
      GORGONE__GORGONE__MODULES__PULLWSS__SSL: "false"
    restart: unless-stopped
    depends_on:
      httpd:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "grep -q \":$$(printf '%04X' $${CENTRAL_PORT:-443}) 01\" /proc/net/tcp /proc/net/tcp6 2>/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 30m
      retries: 3
    volumes:
      - poller-engine:/etc/centreon-engine
      - poller-broker:/etc/centreon-broker
      # Command pipe dir, shared with centengine — same 3-volume pairing
      # (engine/broker/centcmd) install-poller's own generated compose uses
      # between its gorgone and centengine services.
      - poller-centcmd:/var/lib/centreon-engine/rw
      # "Generate Configuration Files" REMOTECOPYs centreon_vmware.json here
      # on every run regardless of whether a VMware poller is actually
      # configured (centreon-vmware's own feature config). Without this
      # volume, that delivery lands in the container's own ephemeral
      # filesystem and vanishes on recreate.
      - poller-etc:/etc/centreon

  # Real monitoring engine for Central-as-a-poller, matching centreon/
  # install-poller's own generated docker-compose.yaml service definition
  # almost verbatim — same image family, same volumes, same healthcheck.
  # Needed for the COMMAND/reload path (gorgone's systemctl shim targets a
  # hostname literally called "centengine" over gRPC) — does NOT fix
  # "Generate Configuration Files"' local centengine -v shell-out in
  # php-fpm, that's a separate, still-unaddressed local shell-out.
  centengine:
    image: "${ENGINE_IMAGE:-docker.centreon.com/centreon/centreon-engine-trixie:develop}"
    pull_policy: always
    hostname: centengine
    restart: unless-stopped
    environment:
      NAME: gorgone-central-poller
      TZ: UTC
      DEBUG: "false"
      APP_SECRET: "${APP_SECRET:-9cd3e2ccf822916ec8fc5379f8abdaf277860415454f9b91c0913392d4b41f92}"
      SALT: "${SALT:-84e9107f78239bdab2751c3321023a32c3716ed0724a4a8b13de8e7aed8d319d}"
      ENGINE_PORT: "5669"
    volumes:
      - poller-engine:/etc/centreon-engine
      - poller-broker:/etc/centreon-broker
      - poller-centcmd:/var/lib/centreon-engine/rw
      - poller-centlog:/var/log/centreon-engine
    healthcheck:
      test: ["CMD-SHELL", "grep -q \":$$(printf '%04X' $${ENGINE_PORT:-443}) 01\" /proc/net/tcp /proc/net/tcp6 2>/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3
    depends_on:
      gorgone-central-poller:
        condition: service_healthy
      centreon-broker:
        condition: service_started

  # central-broker-master: the global BBDO dispatcher centengine's cbmod
  # streams events to. Once "Generate Configuration Files" + gorgone
  # REMOTECOPY actually ran for real, central-broker.json is no longer the
  # image's bare default. RRD role (central-rrd-master) not run separately
  # — merged into this same process via config (12-install.sh's broker
  # adaptation block), not two containers.
  #
  # Pinned to an image bundling a fingerprint guard (refuses to start on
  # the package-default config) and an HTTP reload/restart shim as PID 1 —
  # not yet wired up here (its HTTP endpoints aren't consumed by anything
  # in this stack yet).
  #
  # No seeding step for the `poller-broker` volume: a genuinely empty
  # volume at first boot is the correct, already-handled state on that
  # image — real content arrives via gorgone REMOTECOPY, triggered
  # automatically by 13-generate-broker-config_background.sh instead of a
  # manual UI click.
  #
  # The two custom RRD directories (fresh named volumes, no image-provided
  # ownership) are chowned by fpm's own container.d/03-rrd-volumes.sh
  # instead of a dedicated init container here — fpm already runs an early
  # root-level startup phase and already bakes in centreon-broker's exact
  # UID/GID (cross-container volume consistency), so reusing it avoids
  # pulling the (large) broker image just for one mkdir+chown. This service
  # needs no entrypoint/command/user override at all as a result, pure
  # image defaults throughout.
  centreon-broker:
    image: "${BROKER_IMAGE:-docker.centreon.com/centreon/centreon-broker-trixie:develop}"
    pull_policy: always
    hostname: centreon-broker
    restart: unless-stopped
    environment:
      # Same pair as everywhere else — db_password in central-broker.json is
      # "encrypt::...", decryptable only via an AES key built from this
      # exact app_secret+salt. Deliberately NOT the shared poller-engine
      # named volume (keep engine and broker from sharing that volume) —
      # this container's own container.sh writes its own private copy from
      # these env vars instead.
      APP_SECRET: "${APP_SECRET:-9cd3e2ccf822916ec8fc5379f8abdaf277860415454f9b91c0913392d4b41f92}"
      SALT: "${SALT:-84e9107f78239bdab2751c3321023a32c3716ed0724a4a8b13de8e7aed8d319d}"
    volumes:
      - poller-broker:/etc/centreon-broker
      - centreon-status:/var/lib/centreon/status
      - centreon-metrics:/var/lib/centreon/metrics
    depends_on:
      db:
        condition: service_healthy
      # Not service_healthy: that requires RUN_INSTALL to fully finish
      # (minutes), but 03-rrd-volumes.sh runs within the first second of
      # fpm's own startup, long before that — service_started is enough to
      # avoid making this a false hard dependency on the whole install.
      fpm:
        condition: service_started
    ports:
      - "5669:5669"
      # api_control.py's HTTP reload/restart/health shim (uvicorn): POST
      # /reload (SIGHUP, in-place config+AES-key refresh), POST /restart
      # (SIGTERM then exits the wrapper itself so `restart: unless-stopped`
      # relaunches the container), GET /health. Not consumed by anything in
      # this stack yet (still manual `docker compose restart centreon-broker`
      # after a config change) — exposed so it's reachable for that
      # follow-up without another compose edit.
      - "8080:8080"

  # TCP write-cache sidecar for Central's merged RRD output (MON-213837).
  # DESIGN CHANGE, see trixie/README.md: no longer network_mode:
  # service:centreon-broker. G9/MON-213839 adds a 'host' key to the rrd
  # output (find_param(cfg, "host", false, "localhost") in
  # broker.class.php), so cbd can now dial out to a separate container
  # instead of requiring netns sharing — its own service/hostname on the
  # default compose network, reachable at "rrdcached" (12-install.sh's own
  # RRDCACHED_HOST default, kept aligned with fpm's CENTREON_RRDCACHED_HOST
  # above). No depends_on: this service is self-contained (shares the RRD
  # volumes, nothing else), cbd/fpm tolerate it not being up yet the same
  # way they tolerate any other not-yet-ready peer.
  #
  # Disabled by default stack-wide (RRDCACHED_PORT unset, see fpm's own
  # environment above and 12-install.sh) until a BROKER_TAG carrying the
  # 'host' key fix is in use (C12: G9). This container still runs and
  # answers its healthcheck regardless — proves the wiring, does nothing
  # until broker is told to use it.
  rrdcached:
    build:
      context: ../../..
      dockerfile: .github/docker/centreon-web-split/trixie/Dockerfile
      target: rrdcached
    expose:
      - "42217"
    volumes:
      - centreon-status:/var/lib/centreon/status
      - centreon-metrics:/var/lib/centreon/metrics
      # Anonymous volume: a journal replay on restart is a nice-to-have in a
      # dev stack, not persisted deliberately across a full teardown.
      - /var/lib/rrdcached/journal
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/42217 && echo PING >&3 && read -t 2 r <&3 && [[ \"$$r\" == *PONG* ]]"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Scheduled jobs a real RPM/DEB install gets via /etc/cron.d/{centreon,
  # centstorage} (CentACL, downtime start/stop, token/storage purge,
  # partitioning, reporting, backup) — never ported to this split image
  # before now. Dedicated container, not folded into fpm: 3 of the 10 jobs
  # are Perl, and a persistent scheduler inside fpm would multiply per fpm
  # replica if that image is ever scaled (same reasoning INSTALL_DB_STEPS
  # exists for the install step). Deliberately no shared volume with fpm —
  # see trixie/entrypoint/cron/container.sh for why that would be a real
  # regression risk (fpm's own "already installed" guard on
  # /etc/centreon/centreon.conf.php). No depends_on fpm either: a job
  # firing before fpm's own install has finished just gets a harmless DB
  # error, logged, retried on its own next scheduled run — same
  # self-healing philosophy as the rest of this stack's config delivery.
  centreon-cron:
    build:
      context: ../../..
      dockerfile: .github/docker/centreon-web-split/trixie/Dockerfile
      target: cron
      # Perl modules of the Perl jobs: a centreon-collect checkout (see the
      # perl-libs stage of the Dockerfile).
      additional_contexts:
        perl-libs: ${CENTREON_COLLECT_PATH:-../../../../centreon-collect}/perl-libs/lib
    # MYSQL_PASSWORD already reaches this container via env_file (same
    # ../.env as fpm) — no separate wiring needed for that one.
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      # Must match fpm's own PHP_TIMEZONE exactly (same expression/default):
      # centreon-partitioning.php reads partition boundaries fpm created
      # using fpm's timezone — a mismatch (e.g. this left at the image's UTC
      # default while fpm runs Europe/Paris) makes the day boundary disagree
      # by one, failing with "Duplicate partition name pXXXXXXXX".
      PHP_TIMEZONE: "${PHP_TIMEZONE:-Europe/Paris}"

volumes:
  centreon-cache:
  centreon-varlib:
  centreon-status:
  centreon-metrics:
  centreon-media:
  centreon-sessions:
  poller-etc:
  poller-engine:
  poller-broker:
  poller-centcmd:
  poller-centlog:
