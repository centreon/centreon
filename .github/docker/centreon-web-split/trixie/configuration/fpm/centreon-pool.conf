; Adapted from centreon/packaging/src/php-fpm.deb.conf for the split
; httpd/php-fpm topology (Pilier 1): listens on all interfaces instead of
; 127.0.0.1 (the client is now a separate container), default php:8.4-fpm
; port (9000) kept instead of the packaged 9042.
;
; CENTREON_INTERNAL_API_BASE_URL fixes the first of the two independent
; internal-URL bugs documented on the pillar-1 page (InternalApiClient falls
; back to SERVER_ADDR/SERVER_PORT of the current request otherwise, which is
; unreachable from the Docker network with UseCanonicalName Off on the httpd
; side). php-fpm expands $VARNAME from its own process environment natively
; here — no entrypoint templating needed, just set the env var (see the
; ENV default in the Dockerfile, override at `docker run -e ...`).
;
; [global] below replaces the image's own docker.conf/zz-docker.conf (removed
; in the Dockerfile together with the default [www] pool): daemonize must
; stay "no" — the base php-fpm.conf's own default is "yes", which would fork
; to background and exit PID 1 immediately in a container.
[global]
daemonize = no
error_log = /proc/self/fd/2

[centreon]
user = www-data
group = www-data
listen = 0.0.0.0:9000
pm = ondemand
pm.max_children = 30
pm.process_idle_timeout = 10s
pm.max_requests = 500
rlimit_files = 4096
php_admin_value[error_log] = /var/log/centreon/prod.web.log
php_admin_flag[log_errors] = on
php_value[session.save_handler] = files
php_value[session.save_path]    = /var/lib/php/sessions
php_value[soap.wsdl_cache_dir]  = /var/lib/php/wsdlcache
env[CENTREON_INTERNAL_API_BASE_URL] = $CENTREON_INTERNAL_API_BASE_URL
; gorgone API endpoint, overriding options gorgone_api_* (ConfigurationLoader):
; gorgone runs in another container. Unset = empty = the options apply.
env[CENTREON_GORGONE_API_ADDRESS] = $CENTREON_GORGONE_API_ADDRESS
env[CENTREON_GORGONE_API_PORT] = $CENTREON_GORGONE_API_PORT
env[CENTREON_GORGONE_API_SSL] = $CENTREON_GORGONE_API_SSL
; Remote rrdcached (centreonGraph{,Ng,Status}.class.php): broker's RRD output
; runs in another container here, unlike a co-located VM install. Unset =
; empty = falls back to 127.0.0.1 (confirmed with gorgone-api/C7).
env[CENTREON_RRDCACHED_HOST] = $CENTREON_RRDCACHED_HOST
; Feature flags file (ENV default in the image, per-pod copy with Vault on).
env[FILE_FEATURE_FLAGS] = $FILE_FEATURE_FLAGS
; Database TLS for the command-line tools the web runs (bin/generateSqlLite
; from the SNMP traps generation...): they do not load Dotenv, they read
; these from the environment, which php-fpm otherwise clears. Unset = empty
; = no TLS, as without them.
env[DATABASE_SSL_ENABLED] = $DATABASE_SSL_ENABLED
env[DATABASE_VERIFY_SERVER_CERT] = $DATABASE_VERIFY_SERVER_CERT
env[DATABASE_CA_PATH] = $DATABASE_CA_PATH
