name: behat-test

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      module_name:
        required: true
        type: string
      database_image:
        required: true
        type: string
      image_name:
        required: true
        type: string
      os:
        required: true
        type: string
      features_path:
        required: true
        type: string
      test_tags:
        required: false
        type: string
        default: "not @ignore"
      config_file:
        required: false
        type: string
        default: behat.yml
      is_nightly:
        required: true
        type: string
      major_version:
        required: true
        type: string
      labels:
        description: "The list of PR labels"
        required: false
        type: string
        default: ''
    secrets:
      registry_username:
        required: true
      registry_password:
        required: true
      composer_token:
        required: true
      jira_base_url:
        required: true
      jira_user_email:
        required: true
      jira_api_token:
        required: true
      github_models_token:
        required: true

jobs:
  behat-test-list:
    runs-on: ubuntu-24.04
    outputs:
      test_tags: ${{ steps.list-features.outputs.tags }}
      features: ${{ steps.list-features.outputs.specs }}
      has_features: ${{ steps.list-features.outputs.specs != '' && toJson(fromJson(steps.list-features.outputs.specs)) != '[]' && 'true' || 'false' }}
      db_id: ${{ steps.get-db-id.outputs.db_id }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Get database identifier
        id: get-db-id
        run: |
          db_id=$(echo "$DATABASE_IMAGE" | sed 's|.*/||' | tr ':' '-')
          echo "db_id=$db_id" >> $GITHUB_OUTPUT
        env:
          DATABASE_IMAGE: ${{ inputs.database_image }}

      - name: Detect relevant E2E specs
        id: list-features
        uses: ./.github/actions/e2e-test-list
        with:
          module_name: ${{ inputs.module_name }}
          feature_directory: ${{ inputs.features_path }}
          tags: ${{ inputs.test_tags }}
          use_ai: ${{ contains(inputs.labels, 'experimental-ai-e2e-test-list-generation') && 'true' || 'false' }}
          github_token: ${{ secrets.github_models_token }}

  behat-test-run:
    if: ${{ needs.behat-test-list.outputs.features != '' && toJson(fromJson(needs.behat-test-list.outputs.features)) != '[]' }}
    needs: [behat-test-list]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJson(needs.behat-test-list.outputs.features) }}
    name: ${{ matrix.feature }}

    env:
      SLIM_IMAGE_NAME: ${{ inputs.image_name }}-slim-${{ inputs.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Compute image tag
        id: image_tag
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          MAJOR_VERSION: ${{ inputs.major_version }}
        run: |
          if [[ "$REF" == "develop" ]]; then
            echo "tag=develop-${MAJOR_VERSION}" >> $GITHUB_OUTPUT
          else
            SANITIZED_REF="$(printf '%s' "$REF" | sed -E 's#[^[:alnum:]_.-]+#-#g; s#^[.-]+##; s#-+#-#g' | cut -c1-128)"
            if [[ -z "$SANITIZED_REF" ]]; then
              echo "::error::Unable to derive a valid Docker tag from ref '$REF'"
              exit 1
            fi
            echo "tag=$SANITIZED_REF" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Login to registry
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: 8.2
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.composer_token }}
          runner: ubuntu-24.04

      - name: Setup docker compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Setup pnpm
        if: ${{ contains(matrix.feature, 'RestApi') }}
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
          run_install: |
            cwd: "centreon/tests/rest_api"
            args: [--ignore-scripts, --frozen-lockfile]
          standalone: true

      - name: Create configuration file
        run: cp config/centreon.config.php.template config/centreon.config.php
        working-directory: ${{ inputs.module_name }}

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-scripts
        working-directory: ${{ inputs.module_name }}

      - name: Restore standard slim image from cache
        id: cache-docker-slim
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        timeout-minutes: 6
        with:
          path: ./docker-image
          key: docker-image-${{ env.SLIM_IMAGE_NAME }}-${{ steps.image_tag.outputs.tag }}
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

      - name: Load standard slim image
        if: ${{ steps.cache-docker-slim.outputs.cache-hit == 'true' }}
        run: |
          docker load --input ./docker-image/${{ env.SLIM_IMAGE_NAME }}.tar
          docker tag ${{ env.SLIM_IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }} docker.centreon.com/centreon/${{ env.SLIM_IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}
        shell: bash

      - name: Behat acceptance testing
        env:
          PANTHER_CHROME_BINARY: /usr/bin/google-chrome
          WEB_IMAGE: docker.centreon.com/centreon/${{ env.SLIM_IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}
          MYSQL_IMAGE: ${{ inputs.database_image }}
        run: |
          rm -rf acceptance-logs && mkdir acceptance-logs
          rm -rf xunit-reports && mkdir xunit-reports
          BASE_DIRECTORY=$(pwd)
          cd ${{ inputs.module_name }}
          ./vendor/bin/behat --config="${{ inputs.config_file }}" --tags '${{ needs.behat-test-list.outputs.test_tags }}' --colors --format=pretty --out=std --format=junit --out="$BASE_DIRECTORY/xunit-reports" "${{ inputs.features_path }}/${{ matrix.feature }}.feature"

      - name: Clean empty reports
        if: ${{ !cancelled() }}
        run: find ./xunit-reports/* -type f | xargs grep -l -E "<testsuites.+></testsuites>" | xargs -r rm

      - name: Replace / with - in the feature path
        id: feature-path
        if: always()
        run: |
          feature_name="${{ matrix.feature }}"
          feature_name_with_dash="${feature_name//\//-}"
          echo "Modified Feature Name: $feature_name_with_dash"
          echo "feature_name_with_dash=$feature_name_with_dash" >> $GITHUB_OUTPUT

      - name: Display logs
        if: failure()
        run: find ./acceptance-logs -type f | grep '.txt' | xargs -r more | cat
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        name: Upload acceptance test logs
        with:
          name: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.behat-test-list.outputs.db_id }}-test-logs-${{ steps.feature-path.outputs.feature_name_with_dash }}
          path: acceptance-logs
          retention-days: 1

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.behat-test-list.outputs.db_id }}-test-reports-${{ steps.feature-path.outputs.feature_name_with_dash }}
          path: xunit-reports
          retention-days: 1

  behat-test-report:
    needs: [behat-test-list, behat-test-run]
    if: failure()
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.behat-test-list.outputs.db_id }}-test-reports-*
          path: ${{ inputs.name }}-xunit-reports
          merge-multiple: true

      - uses: ./.github/actions/publish-report
        with:
          check_name: ${{ inputs.name }}-tests-report
          path: '${{ inputs.name }}-xunit-reports/**/*.xml'

  regroup-artifacts:
    needs: [behat-test-list, behat-test-run, behat-test-report]
    if: |
      ! cancelled() &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.behat-test-list.outputs.has_features == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type_of_report: [test-logs, test-reports]
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ contains(needs.behat-test-run.result, 'failure') }}
        with:
          name: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.behat-test-list.outputs.db_id }}-${{ matrix.type_of_report }}
          pattern: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.behat-test-list.outputs.db_id }}-${{ matrix.type_of_report }}-*
          retention-days: 1

      - name: Delete merged artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.behat-test-list.outputs.db_id }}-${{ matrix.type_of_report }}-*
          failOnError: false
