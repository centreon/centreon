name: docker-trapd

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
    paths:
      - '.github/docker/centreon-snmptrapd/**'
      - '.github/docker/centreon-centreontrapd/**'
      - 'centreon/packaging/centreon-trap.yaml'
      - 'centreon/bin/centreontrapd'
      - 'centreon/bin/centreontrapdforward'
      - '.github/workflows/docker-trapd.yml'
  pull_request:
    paths:
      - '.github/docker/centreon-snmptrapd/**'
      - '.github/docker/centreon-centreontrapd/**'
      - 'centreon/packaging/centreon-trap.yaml'
      - 'centreon/bin/centreontrapd'
      - 'centreon/bin/centreontrapdforward'
      - '.github/workflows/docker-trapd.yml'

jobs:
  get-environment:
    if: github.repository == 'centreon/centreon'
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: centreon/www/install/insertBaseConf.sql

  package-centreon-trap:
    needs: [get-environment]
    if: ${{ needs.get-environment.outputs.skip_workflow == 'false' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distrib: [trixie]
    container:
      image: ghcr.io/centreon/delivery-tooling/packaging:${{ needs.get-environment.outputs.major_version }}-${{ matrix.distrib }}
    name: package centreon-trap ${{ matrix.distrib }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Package centreon-trap
        uses: ./.github/actions/package-nfpm
        with:
          nfpm_file_pattern: "centreon/packaging/centreon-trap.yaml"
          module_name: "centreon"
          distrib: ${{ matrix.distrib }}
          package_extension: deb
          major_version: ${{ needs.get-environment.outputs.major_version }}
          minor_version: ${{ needs.get-environment.outputs.minor_version }}
          release: ${{ needs.get-environment.outputs.release }}
          arch: all
          commit_hash: ${{ github.sha }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-deb-${{ matrix.distrib }}-trap
          rpm_gpg_key: ${{ secrets.RPM_GPG_SIGNING_KEY }}
          rpm_gpg_signing_key_id: ${{ secrets.RPM_GPG_SIGNING_KEY_ID }}
          rpm_gpg_signing_passphrase: ${{ secrets.RPM_GPG_SIGNING_PASSPHRASE }}
          php_version: ${{ needs.get-environment.outputs.php_version }}
          stability: ${{ needs.get-environment.outputs.stability }}

  package-perl-libs:
    needs: [get-environment]
    if: ${{ needs.get-environment.outputs.skip_workflow == 'false' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distrib: [trixie]
    container:
      image: ghcr.io/centreon/delivery-tooling/packaging:${{ needs.get-environment.outputs.major_version }}-${{ matrix.distrib }}
    name: package centreon-perl-libs ${{ matrix.distrib }}

    steps:
      - name: Checkout sources (centreon/centreon for actions)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Checkout centreon-collect (for perl-libs packaging)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: centreon/centreon-collect
          ref: ${{ needs.get-environment.outputs.linked_dev_branch || github.ref_name }}
          path: centreon-collect

      - name: Set PERL_VENDORLIB for deb
        run: echo "PERL_VENDORLIB=/usr/share/perl5" >> $GITHUB_ENV
        shell: bash

      - name: Package centreon-perl-libs
        uses: ./.github/actions/package-nfpm
        with:
          nfpm_file_pattern: "centreon-collect/perl-libs/packaging/centreon-perl-libs.yaml centreon-collect/perl-libs/packaging/centreon-perl-libs-common.yaml"
          module_name: "centreon-collect"
          distrib: ${{ matrix.distrib }}
          package_extension: deb
          major_version: ${{ needs.get-environment.outputs.major_version }}
          minor_version: ${{ needs.get-environment.outputs.minor_version }}
          release: ${{ needs.get-environment.outputs.release }}
          arch: all
          commit_hash: ${{ github.sha }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-deb-${{ matrix.distrib }}-perl
          rpm_gpg_key: ${{ secrets.RPM_GPG_SIGNING_KEY }}
          rpm_gpg_signing_key_id: ${{ secrets.RPM_GPG_SIGNING_KEY_ID }}
          rpm_gpg_signing_passphrase: ${{ secrets.RPM_GPG_SIGNING_PASSPHRASE }}
          php_version: ${{ needs.get-environment.outputs.php_version }}
          stability: ${{ needs.get-environment.outputs.stability }}

  dockerize:
    needs: [get-environment, package-centreon-trap, package-perl-libs]
    if: ${{ needs.get-environment.outputs.skip_workflow == 'false' }}
    runs-on: centreon-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [centreon-snmptrapd, centreon-centreontrapd]
        operating_system: [trixie]
    name: dockerize ${{ matrix.component }}-${{ matrix.operating_system }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Login to registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PUSH_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PUSH_TOKEN }}

      - name: Get GitHub OIDC token for Pulp
        id: pulp-oidc
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://pulp.dev.centreon.io" \
            | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Ensure Pulp container distribution exists
        env:
          OIDC_TOKEN: ${{ steps.pulp-oidc.outputs.token }}
          BASE_PATH: centreon/${{ matrix.component }}-${{ matrix.operating_system }}
        run: |
          EXISTING=$(curl -sS \
            -H "Authorization: Github $OIDC_TOKEN" \
            -G --data-urlencode "base_path=$BASE_PATH" \
            "https://pulp-api.apps.centreon.com/api/v3/distributions/container/container/" \
            | jq -r '.results[0].pulp_href // empty')
          if [ -z "$EXISTING" ]; then
            echo "Distribution $BASE_PATH not found, creating..."
            curl -sS -f -X POST \
              -H "Authorization: Github $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$BASE_PATH\",\"base_path\":\"$BASE_PATH\"}" \
              "https://pulp-api.apps.centreon.com/api/v3/distributions/container/container/" \
              | jq '{task: .task}'
            sleep 5
          else
            echo "Distribution $BASE_PATH exists: $EXISTING"
          fi
        shell: bash

      - name: Login to Pulp registry via OIDC
        env:
          OIDC_TOKEN: ${{ steps.pulp-oidc.outputs.token }}
          BASE_PATH: centreon/${{ matrix.component }}-${{ matrix.operating_system }}
        run: |
          mkdir -p ~/.docker
          # GitHubActionsAuthentication (keyword="github") only accepts Authorization: Github.
          # identitytoken triggers an OAuth2 POST that Pulp's GET-only /token/ rejects (405).
          # Solution: fetch the Pulp JWT ourselves with Github auth, then store it as
          # "registrytoken". Docker uses a registrytoken directly for registry API calls
          # (Authorization: Bearer <jwt>) without ever calling the token service again.
          PULP_JWT=$(curl -sS \
            -H "Authorization: Github $OIDC_TOKEN" \
            "https://pulp-api.apps.centreon.com/token/?service=pulp-api.apps.centreon.com&scope=repository:${BASE_PATH}:push,pull" \
            | jq -r '.token // empty')
          if [ -z "$PULP_JWT" ]; then
            echo "::error::Failed to fetch Pulp JWT (token service returned empty)"
            exit 1
          fi
          PAYLOAD=$(echo "$PULP_JWT" | cut -d. -f2 | tr '+/' '-_' | tr -d '=')
          echo "Pulp JWT scope: $(printf '%s==' "$PAYLOAD" | base64 -d 2>/dev/null | jq -c '.access // []')"
          echo "::add-mask::$PULP_JWT"
          EXISTING=$(cat ~/.docker/config.json 2>/dev/null || echo '{}')
          echo "$EXISTING" | jq --arg jwt "$PULP_JWT" \
            '.auths["pulp-api.apps.centreon.com"] = {"registrytoken": $jwt}' \
            > ~/.docker/config.json
          echo "=== Docker config (sanitized) ==="
          cat ~/.docker/config.json | jq 'del(.auths[].registrytoken) | del(.auths[].identitytoken) | del(.auths[].auth) | del(.auths[].password)'
        shell: bash

      - name: Parse distrib name
        id: parse-distrib
        uses: ./.github/actions/parse-distrib
        with:
          distrib: ${{ matrix.operating_system }}

      - name: Restore centreon-trap package
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./*.${{ steps.parse-distrib.outputs.package_extension }}
          key: ${{ github.sha }}-${{ github.run_id }}-${{ steps.parse-distrib.outputs.package_extension }}-${{ matrix.operating_system }}-trap
          fail-on-cache-miss: true

      - name: Restore centreon-perl-libs packages
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./*.${{ steps.parse-distrib.outputs.package_extension }}
          key: ${{ github.sha }}-${{ github.run_id }}-${{ steps.parse-distrib.outputs.package_extension }}-${{ matrix.operating_system }}-perl
          fail-on-cache-miss: true

      - name: Prepare packages-centreon directory
        env:
          PACKAGE_EXTENSION: ${{ steps.parse-distrib.outputs.package_extension }}
        run: |
          mkdir -p packages-centreon
          mv *."$PACKAGE_EXTENSION" packages-centreon/
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Compute Docker tag
        id: compute-tag
        env:
          RAW_REF: ${{ github.head_ref || github.ref_name }}
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
        run: |
          if [[ "$RAW_REF" == "develop" ]]; then
            echo "tag=develop-${MAJOR_VERSION}" >> "$GITHUB_OUTPUT"
            echo "additional_tag=develop" >> "$GITHUB_OUTPUT"
          elif [[ "$RAW_REF" =~ ^dev-[0-9]+\.[0-9]+\.x$ ]]; then
            echo "tag=${MAJOR_VERSION}" >> "$GITHUB_OUTPUT"
            echo "additional_tag=" >> "$GITHUB_OUTPUT"
          else
            docker_tag=$(printf '%s' "$RAW_REF" | sed -E 's#[^[:alnum:]_.-]+#-#g; s#^[.-]+##; s#-+#-#g' | cut -c1-128)
            if [[ -z "$docker_tag" ]]; then
              echo "::error::Unable to derive a valid Docker tag from ref '$RAW_REF'"
              exit 1
            fi
            echo "tag=${docker_tag}" >> "$GITHUB_OUTPUT"
            echo "additional_tag=" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Docker build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
          PLATFORMS: linux/amd64,linux/arm64
        with:
          context: .
          file: .github/docker/${{ matrix.component }}/${{ matrix.operating_system }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          pull: true
          push: true
          tags: |
            ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ matrix.component }}-${{ matrix.operating_system }}:${{ steps.compute-tag.outputs.tag }}
            ${{ steps.compute-tag.outputs.additional_tag != '' && format('{0}/{1}-{2}:{3}', vars.DOCKER_INTERNAL_REGISTRY_URL, matrix.component, matrix.operating_system, steps.compute-tag.outputs.additional_tag) || '' }}
            pulp-api.apps.centreon.com/centreon/${{ matrix.component }}-${{ matrix.operating_system }}:${{ steps.compute-tag.outputs.tag }}
            ${{ steps.compute-tag.outputs.additional_tag != '' && format('pulp-api.apps.centreon.com/centreon/{0}-{1}:{2}', matrix.component, matrix.operating_system, steps.compute-tag.outputs.additional_tag) || '' }}

      - name: Set Pulp labels on container distribution
        env:
          PULP_URL: https://pulp-api.apps.centreon.com
          PULP_TOKEN: ${{ steps.pulp-oidc.outputs.token }}
          BASE_PATH: centreon/${{ matrix.component }}-${{ matrix.operating_system }}
          MODULE: ${{ matrix.component }}
          OS: ${{ matrix.operating_system }}
          STABILITY: ${{ needs.get-environment.outputs.stability }}
          TAG: ${{ steps.compute-tag.outputs.tag }}
          ADDITIONAL_TAG: ${{ steps.compute-tag.outputs.additional_tag }}
          PLATFORMS: linux/amd64,linux/arm64
        run: bash .github/actions/docker-delivery/set-pulp-labels.sh
        shell: bash
