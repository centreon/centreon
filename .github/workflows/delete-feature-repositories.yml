name: delete-feature-repositories

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - closed

jobs:
  delete-feature-repositories:
    if: |
      startsWith(github.head_ref, 'MON-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check if other feature branches/pull requests of the same ticket exist on other repositories
        id: check_other_feature_prs
        shell: bash
        run: |
          set -x
          if [[ -n $(gh pr list --repo centreon/centreon-modules --head "$HEAD_REF" --state open --json number | jq -r '.[].number') ]] \
          || [[ -n $(gh pr list --repo centreon/centreon-collect --head "$HEAD_REF" --state open --json number | jq -r '.[].number') ]]; then
            echo "::notice::Other open feature pull requests have been found on other repositories: no feature repository deletion will be requested."
            echo "feature_prs_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Other open feature pull requests have not been found on other repositories: a feature repository deletion will be requested."
            echo "feature_prs_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pulp-cli
        if: steps.check_other_feature_prs.outputs.feature_prs_found == 'false'
        uses: ./.github/actions/setup-pulp-cli

      - name: Delete feature repositories
        if: steps.check_other_feature_prs.outputs.feature_prs_found == 'false'
        shell: bash
        run: |
          set -euo pipefail

          FEATURE_TICKET=$(echo "$HEAD_REF" | grep -oE 'MON-[0-9]+' | head -1 || true)
          if [[ -z "$FEATURE_TICKET" ]]; then
            echo "::notice::Ticket ID not found due to the branch name not corresponding to standards."
            exit 0
          fi

          for PLUGIN in rpm deb; do
            mapfile -t DISTRIBUTIONS < <(pulp "$PLUGIN" distribution list --base-path-contains "feature/$FEATURE_TICKET/" --limit 1000 | jq -r '.[].name')
            for NAME in "${DISTRIBUTIONS[@]}"; do
              echo "[INFO] Deleting $PLUGIN distribution $NAME"
              pulp "$PLUGIN" distribution destroy --name "$NAME"
            done

            mapfile -t REPOSITORIES < <(pulp "$PLUGIN" repository list --limit 1000 | jq -r --arg pattern "feature-$FEATURE_TICKET-" '.[] | select(.name | contains($pattern)) | .name')
            for NAME in "${REPOSITORIES[@]}"; do
              echo "[INFO] Deleting $PLUGIN repository $NAME"
              pulp "$PLUGIN" repository destroy --name "$NAME"
            done
          done
