name: delete-feature-repositories

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - closed

# Feature repositories live in Pulp and are shared by every repository delivering the same
# ticket (centreon, centreon-modules, centreon-collect). A product CI identity cannot delete
# them: when the last open delivery-feature pull request of a ticket closes, this asks
# centreon/delivery-tooling to (delete-feature-repositories dispatch, handled by its
# delete-feature-repos.yml). Same workflow in the three repositories.

permissions: {}

jobs:
  request-feature-repositories-deletion:
    if: |
      startsWith(github.head_ref, 'MON-') &&
      github.event.pull_request.base.ref == 'develop' &&
      contains(github.event.pull_request.labels.*.name, 'delivery-feature')
    runs-on: ubuntu-24.04
    steps:
      - name: Extract the feature ticket
        id: ticket
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          # same extraction as the feature delivery (ensure-feature-repository.sh)
          feature_ticket=$(grep -oE 'MON-[0-9]+' <<< "${HEAD_REF}" | head -1 || true)
          if [[ -z "${feature_ticket}" ]]; then
            echo "::error::Cannot extract the feature ticket from branch name ${HEAD_REF}"
            exit 1
          fi
          echo "feature_ticket=${feature_ticket}" >> "${GITHUB_OUTPUT}"

      - name: Check for other open delivery-feature pull requests of the same ticket
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
          FEATURE_TICKET: ${{ steps.ticket.outputs.feature_ticket }}
        run: |
          set -euo pipefail

          # Fail closed: a failed lookup (rate limit, 5xx, auth) fails this step, which skips
          # the dispatch. The feature repositories are never deleted on an uncertain answer.
          # This repository is checked too: another branch of the same ticket may be open here.
          open_prs=()
          for repository in centreon/centreon centreon/centreon-modules centreon/centreon-collect; do
            prs=$(
              gh pr list --repo "${repository}" --label delivery-feature --state open --limit 1000 \
                --json number,headRefName \
                | jq -r --arg ticket "${FEATURE_TICKET}" --arg repository "${repository}" \
                    '.[] | select(first(.headRefName | scan("MON-[0-9]+")) == $ticket) | "\($repository)#\(.number)"'
            )
            if [[ -n "${prs}" ]]; then
              mapfile -t found <<< "${prs}"
              open_prs+=("${found[@]}")
            fi
          done

          if [[ ${#open_prs[@]} -gt 0 ]]; then
            echo "::notice::Open delivery-feature pull requests of ${FEATURE_TICKET} remain (${open_prs[*]}): the feature repositories are kept."
            echo "other_prs_found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::No other open delivery-feature pull request of ${FEATURE_TICKET}: requesting the deletion of its feature repositories."
            echo "other_prs_found=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Request the feature repositories deletion
        if: steps.check.outputs.other_prs_found == 'false'
        shell: bash
        env:
          CENTREON_TECHNIQUE_PAT: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
          FEATURE_TICKET: ${{ steps.ticket.outputs.feature_ticket }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${CENTREON_TECHNIQUE_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/centreon/delivery-tooling/dispatches \
            -d "$(jq -n \
              --arg feature_ticket "${FEATURE_TICKET}" \
              '{
                event_type: "delete-feature-repositories",
                client_payload: {
                  feature_ticket: $feature_ticket
                }
              }'
            )"
          echo "::notice::Deletion of the ${FEATURE_TICKET} feature repositories requested from centreon/delivery-tooling."
