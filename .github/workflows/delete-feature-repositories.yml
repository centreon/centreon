name: delete-feature-repositories

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - closed

jobs:
  check-other-feature-prs:
    if: |
      startsWith(github.head_ref, 'MON-') &&
      github.event.pull_request.base.ref == 'develop' &&
      contains(github.event.pull_request.labels.*.name, 'delivery-feature')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
      HEAD_REF: ${{ github.head_ref }}
    outputs:
      feature_prs_found: ${{ steps.check.outputs.feature_prs_found }}
    steps:
      - name: Check if other feature branches/pull requests of the same ticket exist on other repositories
        id: check
        shell: bash
        run: |
          set -euo pipefail

          # Capture each lookup explicitly: under `set -e`/`pipefail` a transient
          # `gh` failure (rate limit, 5xx, auth blip) aborts this job instead of
          # being silently read as "no sibling PR". A failed check job leaves the
          # deletion jobs skipped (their `needs` failed) — i.e. fail closed: never
          # delete feature repositories on an uncertain sibling-PR lookup.
          modules_prs=$(gh pr list --repo centreon/centreon-modules --head "$HEAD_REF" --label "delivery-feature" --state open --json number --jq '.[].number')
          collect_prs=$(gh pr list --repo centreon/centreon-collect --head "$HEAD_REF" --label "delivery-feature" --state open --json number --jq '.[].number')

          if [[ -n "$modules_prs" || -n "$collect_prs" ]]; then
            echo "::notice::Other open delivery-feature pull requests have been found on other repositories for this ticket: no feature repository deletion will be requested."
            echo "feature_prs_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No other open delivery-feature pull requests have been found on other repositories for this ticket: a feature repository deletion will be requested."
            echo "feature_prs_found=false" >> "$GITHUB_OUTPUT"
          fi

  delete-artifactory-feature-repositories:
    needs: [check-other-feature-prs]
    if: needs.check-other-feature-prs.outputs.feature_prs_found == 'false'
    runs-on: ubuntu-24.04
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Send repository dispatch to delete Artifactory feature repositories
        shell: bash
        env:
          CENTREON_TECHNIQUE_PAT: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
        run: |
          set -euo pipefail

          feature_ticket=$(echo "$HEAD_REF" | grep -oE 'MON-[0-9]+' | head -1 || true)
          if [[ -z "$feature_ticket" ]]; then
            echo "::notice::Ticket ID not found due to the branch name not corresponding to standards."
            exit 0
          fi

          echo "Sending repository dispatch to delete Artifactory feature repositories..."
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $CENTREON_TECHNIQUE_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/centreon/delivery-tooling/dispatches \
            -d "$(jq -n \
              --arg feature_ticket "$feature_ticket" \
              '{
                event_type: "delete-feature-repositories",
                client_payload: {
                  feature_ticket: $feature_ticket
                }
              }'
            )"

  delete-pulp-feature-repositories:
    needs: [check-other-feature-prs]
    if: needs.check-other-feature-prs.outputs.feature_prs_found == 'false'
    # same runner as the deliver-pulp / promote-pulp jobs: the Pulp api must be
    # reachable from here, and continue-on-error would mask a network failure
    runs-on: centreon-ubuntu-22.04
    # non-blocking during the Pulp migration, consistent with the deliver-pulp /
    # promote-pulp jobs: a Pulp-side failure must not fail the PR-close workflow.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pulp-cli
        uses: ./.github/actions/setup-pulp-cli
        with:
          pulp_url: ${{ vars.PULP_API_URL }}
          audience: ${{ vars.PULP_OIDC_AUDIENCE }}

      - name: Delete feature repositories
        shell: bash
        run: |
          set -euo pipefail

          FEATURE_TICKET=$(echo "$HEAD_REF" | grep -oE 'MON-[0-9]+' | head -1 || true)
          if [[ -z "$FEATURE_TICKET" ]]; then
            echo "::notice::Ticket ID not found due to the branch name not corresponding to standards."
            exit 0
          fi

          for PLUGIN in rpm deb; do
            mapfile -t DISTRIBUTIONS < <(pulp "$PLUGIN" distribution list --base-path-contains "feature/$FEATURE_TICKET/" --limit 1000 | jq -r '.[].name')
            for NAME in "${DISTRIBUTIONS[@]}"; do
              echo "[INFO] Deleting $PLUGIN distribution $NAME"
              pulp "$PLUGIN" distribution destroy --name "$NAME"
            done

            mapfile -t REPOSITORIES < <(pulp "$PLUGIN" repository list --limit 1000 | jq -r --arg pattern "feature-$FEATURE_TICKET-" '.[] | select(.name | contains($pattern)) | .name')
            for NAME in "${REPOSITORIES[@]}"; do
              echo "[INFO] Deleting $PLUGIN repository $NAME"
              pulp "$PLUGIN" repository destroy --name "$NAME"
            done
          done
