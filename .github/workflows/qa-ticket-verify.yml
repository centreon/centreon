name: qa-ticket-verify

# Drives the qa-ticket-verify skill headlessly: reads a Jira ticket, finds its PR, spins up
# that PR's build in Docker, exercises it with Playwright, posts a report as a Jira comment.
# Never transitions the ticket itself.
#
# The skill ships in the CI-only centreon-qa-ci plugin of centreon/dotfiles, loaded with
# --plugin-dir; its README documents the environment contract. Everything repo-specific stays
# here, under .claude/skills/qa-ticket-verify/: resolve-env.sh (PR -> image and source paths),
# the Playwright MCP configs (version pinned) and the selector catalog.
#
# Setup: CLAUDE_CODE_OAUTH_TOKEN is per contributor, not a shared secret: each person runs
# `claude setup-token` then `gh secret set CLAUDE_CODE_OAUTH_TOKEN_<their-github-username>
# --repo centreon/centreon` (no admin rights needed). `secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}',
# github.actor)]` below resolves it dynamically from whoever actually triggered the run, so
# onboarding a new contributor never touches this file, and a run only ever spends under the
# identity that triggered it. Secret names only allow [A-Za-z0-9_] and expressions can't
# rewrite github.actor, so a username containing a hyphen can't have its own token yet.
# JIRA_BASE_URL / XRAY_JIRA_USER_EMAIL / XRAY_JIRA_TOKEN are shared, reused from the existing
# Xray reporting workflows.
#
# Run: `gh workflow run qa-ticket-verify.yml --repo centreon/centreon -f jira_key=MON-12345`, or
# Actions > qa-ticket-verify > Run workflow. No per-run budget cap: the qa-verify job's
# timeout-minutes bounds a run. The artifact qa-ticket-verify-<key> (14 days) holds the
# Claude transcripts, the generated .feature and report data, the updated selector catalog
# (merge it back from time to time, CI never pushes) and the Playwright video/screenshots.

on:
  workflow_dispatch:
    inputs:
      jira_key:
        description: "Jira ticket key to verify (e.g. MON-207985)"
        required: true
        type: string
        default: "MON-207985"
  push:
    branches:
      - qa-ticket-verify-skill

permissions:
  contents: read

concurrency:
  group: qa-ticket-verify-${{ inputs.jira_key || 'MON-207985' }}
  cancel-in-progress: false

jobs:
  # Fails in seconds if the triggering user hasn't set up their own token, instead of
  # discovering it several minutes into `qa-verify` (after PR discovery + Docker startup).
  check-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check that the triggering user has their own Claude token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', github.actor)] }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::No Claude token configured for GitHub user '$ACTOR' (expected repo secret 'CLAUDE_CODE_OAUTH_TOKEN_$ACTOR'). Set your own — no admin rights needed: \`claude setup-token\` then \`gh secret set CLAUDE_CODE_OAUTH_TOKEN_$ACTOR --repo centreon/centreon\`."
            exit 1
          fi
          echo "Token found for $ACTOR — proceeding to qa-verify."

  qa-verify:
    needs: check-token
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout the centreon-qa plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: centreon/dotfiles
          ref: feat/qa-ticket-verify-skill # develop once centreon/dotfiles#133 is merged
          token: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
          path: dotfiles

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Login to Docker registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

      - name: Install ffmpeg for Playwright video recording
        run: npx -y playwright install ffmpeg

      - name: Find linked PR
        id: find_pr
        env:
          GH_TOKEN: ${{ github.token }}
          TICKET_KEY: ${{ inputs.jira_key || 'MON-207985' }}
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          pr_json_raw=$(gh pr list --repo centreon/centreon --search "$TICKET_KEY in:title,body" --state all \
            --json number,url,headRefName,isDraft,updatedAt,state)
          # Exclude this workflow's own branch — its PR description mentions ticket keys
          # too and, being frequently updated, can outrank the ticket's real PR.
          pr_json=$(echo "$pr_json_raw" | jq --arg branch "$CURRENT_BRANCH" '[.[] | select(.headRefName != $branch)]')
          count=$(echo "$pr_json" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "::error::No PR found referencing $TICKET_KEY (searched title/body for the key, excluding this workflow's own branch $CURRENT_BRANCH)"
            exit 1
          fi
          open_pr=$(echo "$pr_json" | jq '[.[] | select(.state == "OPEN" and (.isDraft | not))] | sort_by(.updatedAt) | last')
          if [ "$open_pr" = "null" ]; then
            selected=$(echo "$pr_json" | jq 'sort_by(.updatedAt) | last')
          else
            selected="$open_pr"
          fi
          number=$(echo "$selected" | jq -r '.number')
          head_ref=$(echo "$selected" | jq -r '.headRefName')
          url=$(echo "$selected" | jq -r '.url')
          if [ "$count" -gt 1 ]; then
            echo "::warning::$count PRs matched $TICKET_KEY, picked #$number ($url) — see the final report for the full list"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # The skill can't read this step's annotations: hand it every candidate.
          {
            echo "PR_CANDIDATES<<EOF_PR_CANDIDATES"
            echo "$pr_json" | jq -r '.[] | "#\(.number) \(.state) \(.url)"'
            echo "EOF_PR_CANDIDATES"
          } >> "$GITHUB_ENV"
          echo "Found PR #$number ($url) on branch $head_ref for $TICKET_KEY"

      - name: Resolve environment and start it
        id: start_env
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
        run: |
          # KEY=value lines documented in the skill: the next steps (and Claude) read them from
          # $GITHUB_ENV, this step exports them itself.
          .claude/skills/qa-ticket-verify/resolve-env.sh "$PR_NUMBER" > resolved-env.txt
          cat resolved-env.txt
          cat resolved-env.txt >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do export "$key=$value"; done < resolved-env.txt

          attempts=0
          max_attempts=5
          until docker compose -f .github/docker/docker-compose.yml ${COMPOSE_PROFILE:+--profile "$COMPOSE_PROFILE"} up -d --wait; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "::error::$WEB_IMAGE never became healthy after $max_attempts attempts"
              docker compose -f .github/docker/docker-compose.yml logs web --tail 100 || true
              exit 1
            fi
            echo "Not ready yet (attempt $attempts/$max_attempts, the PR's image may still be building) — waiting 60s"
            docker compose -f .github/docker/docker-compose.yml ${COMPOSE_PROFILE:+--profile "$COMPOSE_PROFILE"} down -v || true
            sleep 60
          done
          curl -sf http://localhost:4000/centreon/login > /dev/null \
            && echo "Centreon is reachable at http://localhost:4000/centreon"

          # The healthchecks above don't prove the app can run a DB-backed query end to
          # end. --skip-ssl matches the server's MARIADB_EXTRA_FLAGS in docker-compose.yml.
          if ! db_version=$(docker compose -f .github/docker/docker-compose.yml exec -T db \
            mariadb -uroot -pcentreon --skip-ssl -N -e "SELECT VERSION();"); then
            echo "::error::Database container is up but did not answer a real SQL query"
            docker compose -f .github/docker/docker-compose.yml logs db --tail 100 || true
            exit 1
          fi
          echo "Database is answering queries (MariaDB $db_version)"

          app_version=$(curl -sf http://localhost:4000/centreon/api/latest/platform/versions | jq -r '.web // empty')
          if [ -z "$app_version" ]; then
            echo "::error::Web app responded but the DB-backed /platform/versions endpoint returned no version — DB wiring may be broken"
            exit 1
          fi
          echo "App confirms DB connectivity (web version $app_version)"

      - name: Run QA verification
        id: qa
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', github.actor)] }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.XRAY_JIRA_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TICKET_KEY: ${{ inputs.jira_key || 'MON-207985' }}
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
          PR_URL: ${{ steps.find_pr.outputs.url }}
          TRIGGERED_BY: ${{ github.actor }}
          QA_SKILL_DIR: ${{ github.workspace }}/dotfiles/plugins/centreon-qa-ci/skills/qa-ticket-verify
        run: |
          set -o pipefail  # otherwise `| tee` makes this step "succeed" even when claude fails
          # No missing-token check here — the check-token job already guarantees
          # CLAUDE_CODE_OAUTH_TOKEN is set before qa-verify is even allowed to start.

          claude -p "Use the centreon-qa-ci:qa-ticket-verify skill to verify Jira ticket $TICKET_KEY \
            (linked PR #$PR_NUMBER, $PR_URL, module $MODULE). Every input it documents is already \
            in the environment. This run was triggered by GitHub user $TRIGGERED_BY." \
            --plugin-dir dotfiles/plugins/centreon-qa-ci \
            --mcp-config .claude/skills/qa-ticket-verify/mcp-config.ci.json \
            --strict-mcp-config \
            --allowedTools "Skill,Bash,Read,Edit,Write,Grep,Glob,mcp__playwright__browser_navigate,mcp__playwright__browser_snapshot,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_wait_for,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_evaluate,mcp__playwright__browser_select_option,mcp__playwright__browser_press_key,mcp__playwright__browser_find,mcp__playwright__browser_close" \
            --permission-mode bypassPermissions \
            --verbose \
            --output-format stream-json \
            | tee claude-output.jsonl \
            | jq -R --unbuffered '
                try (fromjson) catch empty
                | if .type == "system" and .subtype == "init" then
                    "STEP: session started (model=" + (.model // "?") + ")"
                  elif .type == "assistant" then
                    (.message.content // [])[] |
                    if .type == "tool_use" then
                      "STEP: -> " + .name + " " + ((.input // {}) | tostring | .[0:150])
                    elif .type == "text" and ((.text // "") | length) > 0 then
                      "STEP: " + ((.text // "") | .[0:300] | gsub("\n"; " "))
                    else empty end
                  elif .type == "result" then
                    "STEP: === finished (" + (.subtype // "?") + ") ==="
                  else empty end
              ' \
            | tee claude-progress.log

      - name: Post failure notice to Jira if the run errored before reporting
        if: failure()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.XRAY_JIRA_TOKEN }}
          TICKET_KEY: ${{ inputs.jira_key || 'MON-207985' }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -su "$JIRA_EMAIL:$JIRA_API_TOKEN" -X POST -H "Content-Type: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET_KEY/comment" \
            --data "$(jq -n --arg text "qa-ticket-verify failed before producing a report. Logs: $run_url" \
              '{body:{type:"doc",version:1,content:[{type:"paragraph",content:[{type:"text",text:$text}]}]}}')"
        continue-on-error: true # never let a notification failure mask the real job failure

      - name: Tear down environment
        if: always()
        run: docker compose -f .github/docker/docker-compose.yml ${COMPOSE_PROFILE:+--profile "$COMPOSE_PROFILE"} down -v || true

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: qa-ticket-verify-${{ inputs.jira_key || 'MON-207985' }}
          path: |
            claude-output.jsonl
            claude-progress.log
            .claude/skills/qa-ticket-verify/runs/*
            .claude/skills/qa-ticket-verify/selectors.json
            playwright-mcp-output/**
          retention-days: 14
          if-no-files-found: warn
