name: qa-ticket-verify

on:
  workflow_dispatch:
    inputs:
      jira_key:
        description: "Jira ticket key to verify (e.g. MON-12345)"
        required: true
        type: string
      pr_number:
        description: "Force this PR instead of searching for one referencing jira_key (an orchestrator usually already knows it)"
        required: false
        type: string
      report_mode:
        description: "comment posts the verdict on the Jira ticket as usual; artifact keeps the report and its evidence in the run's artifacts only, for a reviewer to read before anything reaches Jira"
        required: false
        type: choice
        default: comment
        options:
          - comment
          - artifact
      request_id:
        description: "Opaque id an orchestrator can set to find this exact run back (echoed in the run's name) — unused by the skill itself"
        required: false
        type: string

run-name: "qa-ticket-verify ${{ inputs.jira_key }}${{ inputs.request_id && format(' ({0})', inputs.request_id) || '' }}"

permissions:
  contents: read

concurrency:
  group: qa-ticket-verify-${{ inputs.jira_key }}
  cancel-in-progress: false

jobs:
  check-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate jira_key format
        env:
          TICKET_KEY: ${{ inputs.jira_key }}
        run: |
          if ! [[ "$TICKET_KEY" =~ ^[A-Z]+-[0-9]+$ ]]; then
            echo "::error::jira_key '$TICKET_KEY' doesn't match the expected <PROJECT>-<NUMBER> shape (e.g. MON-12345)."
            exit 1
          fi

      - name: Check that the triggering user has their own Claude token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', github.actor_id)] || secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', github.actor)] }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::No Claude token configured for GitHub user '$ACTOR' (expected repo secret 'CLAUDE_CODE_OAUTH_TOKEN_$ACTOR_ID', your numeric account id). Set your own — no admin rights needed: \`claude setup-token\` then \`gh secret set CLAUDE_CODE_OAUTH_TOKEN_$ACTOR_ID --repo centreon/centreon\`."
            exit 1
          fi
          echo "Token found for $ACTOR — proceeding to qa-verify."

  qa-verify:
    needs: check-token
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Checkout the centreon-qa plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: centreon/dotfiles
          ref: feat/qa-ticket-verify-isolate-jira-secrets
          token: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
          path: dotfiles
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.325

      - name: Login to Docker registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

      - name: Install ffmpeg for Playwright video recording
        run: |
          mcp_spec=$(jq -r '.mcpServers.playwright.args[1]' .claude/skills/qa-ticket-verify/mcp-config.ci.json)
          pw_version=$(npm view "$mcp_spec" dependencies.playwright-core)
          npx -y "playwright@$pw_version" install ffmpeg

      - name: Find linked PR
        id: find_pr
        env:
          GH_TOKEN: ${{ github.token }}
          TICKET_KEY: ${{ inputs.jira_key }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$PR_NUMBER_INPUT" ]; then
            selected=$(gh pr view "$PR_NUMBER_INPUT" --repo centreon/centreon --json number,url,headRefName,state)
            number=$(echo "$selected" | jq -r '.number')
            head_ref=$(echo "$selected" | jq -r '.headRefName')
            url=$(echo "$selected" | jq -r '.url')
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            state=$(echo "$selected" | jq -r '.state')
            echo "PR_CANDIDATES=#$number $state $url" >> "$GITHUB_ENV"
            echo "Using forced PR #$number ($url) for $TICKET_KEY (pr_number input, no search)"
            exit 0
          fi

          pr_json_raw=$(gh pr list --repo centreon/centreon --search "$TICKET_KEY in:title,body" --state all \
            --json number,url,headRefName,isDraft,updatedAt,state)
          pr_json=$(echo "$pr_json_raw" | jq --arg branch "$CURRENT_BRANCH" '[.[] | select(.headRefName != $branch)]')
          count=$(echo "$pr_json" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "::error::No PR found referencing $TICKET_KEY (searched title/body for the key, excluding this workflow's own branch $CURRENT_BRANCH)"
            exit 1
          fi
          open_pr=$(echo "$pr_json" | jq '[.[] | select(.state == "OPEN" and (.isDraft | not))] | sort_by(.updatedAt) | last')
          if [ "$open_pr" = "null" ]; then
            selected=$(echo "$pr_json" | jq 'sort_by(.updatedAt) | last')
          else
            selected="$open_pr"
          fi
          number=$(echo "$selected" | jq -r '.number')
          head_ref=$(echo "$selected" | jq -r '.headRefName')
          url=$(echo "$selected" | jq -r '.url')
          if [ "$count" -gt 1 ]; then
            echo "::warning::$count PRs matched $TICKET_KEY, picked #$number ($url) — see the final report for the full list"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "PR_CANDIDATES<<EOF_PR_CANDIDATES"
            echo "$pr_json" | jq -r '.[] | "#\(.number) \(.state) \(.url)"'
            echo "EOF_PR_CANDIDATES"
          } >> "$GITHUB_ENV"
          echo "Found PR #$number ($url) on branch $head_ref for $TICKET_KEY"

      - name: Resolve environment and start it
        id: start_env
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
        run: |
          .claude/skills/qa-ticket-verify/resolve-env.sh "$PR_NUMBER" > resolved-env.txt
          cat resolved-env.txt
          cat resolved-env.txt >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do export "$key=$value"; done < resolved-env.txt

          os=$(echo "$WEB_IMAGE" | grep -oE 'alma[0-9]+|trixie|jammy' | head -1)
          attempts=0
          max_attempts=5
          while :; do
            pr_state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,statusCheckRollup)
            head_sha=$(echo "$pr_state" | jq -r '.headRefOid')
            dockerize_ok=$(echo "$pr_state" | jq -r --arg name "dockerize $os" \
              '[.statusCheckRollup[]? | select(.name == $name)] | last | (.conclusion // .state // "") | ascii_downcase == "success"')
            if [ "$dockerize_ok" = "true" ]; then
              echo "TESTED_COMMIT=$head_sha" >> "$GITHUB_ENV"
              echo "Image build confirmed green for $head_sha (dockerize $os)"
              break
            fi
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "::warning::Could not confirm a green 'dockerize $os' check for $head_sha after $max_attempts attempts — proceeding with whatever $WEB_IMAGE currently resolves to, but the report will flag the tested commit as unconfirmed."
              echo "TESTED_COMMIT=$head_sha (unconfirmed — dockerize $os not green)" >> "$GITHUB_ENV"
              break
            fi
            echo "dockerize $os not green yet for $head_sha (attempt $attempts/$max_attempts) — waiting 60s"
            sleep 60
          done

          attempts=0
          max_attempts=5
          until docker compose -f .github/docker/docker-compose.yml ${COMPOSE_PROFILE:+--profile "$COMPOSE_PROFILE"} up -d --wait; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "::error::$WEB_IMAGE never became healthy after $max_attempts attempts"
              docker compose -f .github/docker/docker-compose.yml logs web --tail 100 || true
              exit 1
            fi
            echo "Not ready yet (attempt $attempts/$max_attempts, the PR's image may still be building) — waiting 60s"
            docker compose -f .github/docker/docker-compose.yml ${COMPOSE_PROFILE:+--profile "$COMPOSE_PROFILE"} down -v || true
            sleep 60
          done
          curl -sf http://localhost:4000/centreon/login > /dev/null \
            && echo "Centreon is reachable at http://localhost:4000/centreon"

          if ! db_version=$(docker compose -f .github/docker/docker-compose.yml exec -T db \
            mariadb -uroot -pcentreon --skip-ssl -N -e "SELECT VERSION();"); then
            echo "::error::Database container is up but did not answer a real SQL query"
            docker compose -f .github/docker/docker-compose.yml logs db --tail 100 || true
            exit 1
          fi
          echo "Database is answering queries (MariaDB $db_version)"

          app_version=$(curl -sf http://localhost:4000/centreon/api/latest/platform/versions | jq -r '.web // empty')
          if [ -z "$app_version" ]; then
            echo "::error::Web app responded but the DB-backed /platform/versions endpoint returned no version — DB wiring may be broken"
            exit 1
          fi
          echo "App confirms DB connectivity (web version $app_version)"

      - name: Fetch the Jira ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.XRAY_JIRA_TOKEN }}
          TICKET_KEY: ${{ inputs.jira_key }}
        run: |
          curl -s --fail-with-body -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -o ticket.json \
            "${JIRA_BASE_URL%/}/rest/api/3/issue/$TICKET_KEY?fields=summary,description,status,comment,customfield_12014,customfield_11948,customfield_11915,customfield_11913,customfield_11914,customfield_11981"

      - name: Run QA verification
        id: qa
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', github.actor_id)] || secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', github.actor)] }}
          GH_TOKEN: ${{ github.token }}
          TICKET_KEY: ${{ inputs.jira_key }}
          TICKET_FILE: ${{ github.workspace }}/ticket.json
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
          PR_URL: ${{ steps.find_pr.outputs.url }}
          TRIGGERED_BY: ${{ github.actor }}
          QA_SKILL_DIR: ${{ github.workspace }}/dotfiles/plugins/centreon-qa-ci/skills/qa-ticket-verify
        run: |
          set -o pipefail

          claude -p "Use the centreon-qa-ci:qa-ticket-verify skill to verify Jira ticket $TICKET_KEY \
            (linked PR #$PR_NUMBER, $PR_URL, module $MODULE). Every input it documents is already \
            in the environment. This run was triggered by GitHub user $TRIGGERED_BY." \
            --plugin-dir dotfiles/plugins/centreon-qa-ci \
            --mcp-config .claude/skills/qa-ticket-verify/mcp-config.ci.json \
            --strict-mcp-config \
            --allowedTools "Skill,Bash,Read,Edit,Write,Grep,Glob,mcp__playwright__browser_navigate,mcp__playwright__browser_snapshot,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_wait_for,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_evaluate,mcp__playwright__browser_select_option,mcp__playwright__browser_press_key,mcp__playwright__browser_find,mcp__playwright__browser_close" \
            --permission-mode bypassPermissions \
            --verbose \
            --output-format stream-json \
            | tee claude-output.jsonl \
            | jq -R --unbuffered '
                try (fromjson) catch empty
                | if .type == "system" and .subtype == "init" then
                    "STEP: session started (model=" + (.model // "?") + ")"
                  elif .type == "assistant" then
                    (.message.content // [])[] |
                    if .type == "tool_use" then
                      "STEP: -> " + .name + " " + ((.input // {}) | tostring | .[0:150])
                    elif .type == "text" and ((.text // "") | length) > 0 then
                      "STEP: " + ((.text // "") | .[0:300] | gsub("\n"; " "))
                    else empty end
                  elif .type == "result" then
                    "STEP: === finished (" + (.subtype // "?") + ") ==="
                  else empty end
              ' \
            | tee claude-progress.log

      - name: Enrich the report with execution metadata
        if: ${{ !cancelled() }}
        env:
          TICKET_KEY: ${{ inputs.jira_key }}
        run: |
          report=".claude/skills/qa-ticket-verify/runs/$TICKET_KEY.report.json"
          if [ ! -f "$report" ]; then
            echo "No report.json written (notice-only or failed run) — nothing to enrich."
            exit 0
          fi
          result_line=$(jq -c 'select(.type == "result")' claude-output.jsonl 2>/dev/null | tail -n 1)
          init_line=$(jq -c 'select(.type == "system" and .subtype == "init")' claude-output.jsonl 2>/dev/null | head -n 1)
          [ -z "$result_line" ] && result_line='{}'
          [ -z "$init_line" ] && init_line='{}'
          model=$(echo "$init_line" | jq -r '.model // ""')
          duration_ms=$(echo "$result_line" | jq '.duration_ms // 0')
          cost_usd=$(echo "$result_line" | jq '.total_cost_usd // 0')
          jq --arg model "$model" --argjson duration_ms "$duration_ms" --argjson cost_usd "$cost_usd" \
             --arg image "$WEB_IMAGE" \
             '. + {model: $model, duration_ms: $duration_ms, cost_usd: $cost_usd, image: $image}' \
             "$report" > "$report.tmp" && mv "$report.tmp" "$report"
          echo "Enriched $report with model=$model duration_ms=$duration_ms cost_usd=$cost_usd image=$WEB_IMAGE"

      - name: Render the report as HTML
        if: ${{ !cancelled() }}
        run: |
          report=".claude/skills/qa-ticket-verify/runs/$TICKET_KEY.report.json"
          if [ ! -f "$report" ]; then
            echo "No report.json written (notice-only or failed run) — nothing to render."
            exit 0
          fi
          python3 "$QA_SKILL_DIR/scripts/render-report-html.py" "$report" "${report%.json}.html"
        env:
          TICKET_KEY: ${{ inputs.jira_key }}
          PR_URL: ${{ steps.find_pr.outputs.url }}
          TRIGGERED_BY: ${{ github.actor }}
          QA_SKILL_DIR: ${{ github.workspace }}/dotfiles/plugins/centreon-qa-ci/skills/qa-ticket-verify

      - name: Post the report to Jira
        if: ${{ !cancelled() }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.XRAY_JIRA_TOKEN }}
          TICKET_KEY: ${{ inputs.jira_key }}
          PR_URL: ${{ steps.find_pr.outputs.url }}
          TRIGGERED_BY: ${{ github.actor }}
          QA_SKILL_DIR: ${{ github.workspace }}/dotfiles/plugins/centreon-qa-ci/skills/qa-ticket-verify
        run: |
          if [ "${{ inputs.report_mode || 'comment' }}" = "artifact" ]; then
            echo "report_mode=artifact — nothing posted to Jira, the report stays in the run's artifacts."
            exit 0
          fi
          runs=.claude/skills/qa-ticket-verify/runs
          if [ -f "$runs/$TICKET_KEY.report.json" ]; then
            python3 "$QA_SKILL_DIR/scripts/post-report.py" "$runs/$TICKET_KEY.report.json"
          elif [ -f "$runs/$TICKET_KEY.notice.txt" ]; then
            python3 "$QA_SKILL_DIR/scripts/post-report.py" --notice "$(cat "$runs/$TICKET_KEY.notice.txt")"
          else
            echo "::warning::No report.json or notice.txt found for $TICKET_KEY — nothing to post."
          fi

      - name: Post failure notice to Jira if the run errored before reporting
        if: failure()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.XRAY_JIRA_TOKEN }}
          TICKET_KEY: ${{ inputs.jira_key }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -su "$JIRA_EMAIL:$JIRA_API_TOKEN" -X POST -H "Content-Type: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET_KEY/comment" \
            --data "$(jq -n --arg text "qa-ticket-verify failed before producing a report. Logs: $run_url" \
              '{body:{type:"doc",version:1,content:[{type:"paragraph",content:[{type:"text",text:$text}]}]}}')"
        continue-on-error: true

      - name: Tear down environment
        if: always()
        run: docker compose -f .github/docker/docker-compose.yml ${COMPOSE_PROFILE:+--profile "$COMPOSE_PROFILE"} down -v || true

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: qa-ticket-verify-${{ inputs.jira_key }}
          path: |
            claude-output.jsonl
            claude-progress.log
            .claude/skills/qa-ticket-verify/runs/*
            .claude/skills/qa-ticket-verify/selectors.json
            playwright-mcp-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
