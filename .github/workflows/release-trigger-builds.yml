---
name: release-trigger-builds
run-name: 'release-trigger-builds ${{ inputs.dispatch_target_release_branch }} ${{ inputs.dispatch_content }} ${{ inputs.release_number }}${{ inputs.dry_run && '' (dry run)'' || '''' }}'

# Two modes, chosen by "testing_tag_builds" in release-components.json at the target branch:
# legacy (dispatch on the branch, job 1 only) or testing tag (job 1 checks + tags, job 2 records + dispatches).
# Design and diagrams: delivery-tooling docs/release/testing-bundles.md and testing-bundles-flow.md

on:
  workflow_dispatch:
    inputs:
      dispatch_target_release_branch:
        description: "Release or hotfix branch to trigger"
        required: true
      dispatch_content:
        description: "Dispatch content mode (affects what workflow is going to be triggered)"
        required: true
        type: choice
        options:
          - REGULAR # Centreon components only without libs
          - CHANGED_ONLY # Anything that received a change
          - FULL # Centreon components + libs
      release_number:
        description: "Release number YYYYMMNN (testing-tag mode only): release = YYYYMM00, hotfix = YYYYMM01.."
        required: false
        default: ""
      dry_run:
        description: "Check and show what would be created and dispatched, without doing it"
        required: false
        type: boolean
        default: true

env:
  BUCKET: release-orchestrator
  # true writes and reads the bundle status under dry-run/ (tests)
  STATUS_DRY_RUN: "false"

jobs:
  dependency-scan:
    permissions:
      contents: read
      pull-requests: write
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  release-trigger-builds:
    needs: [dependency-scan]
    if: github.repository == 'centreon/centreon'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      id-token: write
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      branch: ${{ steps.prepare.outputs.branch }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      previous_stable_bundle_tag: ${{ steps.prepare.outputs.previous_stable_bundle_tag }}
      previous_stable_bundle_tag_sha: ${{ steps.prepare.outputs.previous_stable_bundle_tag_sha }}
      release_scope: ${{ steps.prepare.outputs.release_scope }}
      tag: ${{ steps.validate.outputs.tag }}
      role: ${{ steps.validate.outputs.role }}
      stopped: ${{ steps.tag.outputs.stopped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # logic shared by the 3 repos, components from release-components.json read at the branch
      - name: Get references and the mode of the branch
        id: prepare
        env:
          DISPATCH_TARGET_RELEASE_BRANCH: ${{ inputs.dispatch_target_release_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          BRANCH_TOKEN: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
        run: .github/scripts/release/release-trigger-builds.sh prepare

      # --- legacy mode: dispatch on the branch ---

      - name: Detect changed components since last stable release bundle tag
        if: steps.prepare.outputs.mode == 'legacy'
        uses: ./.github/actions/release-detect-changed-components
        with:
          base_sha: ${{ steps.prepare.outputs.previous_stable_bundle_tag_sha }}
          head_sha: ${{ steps.prepare.outputs.head_sha }}
          components_file: ${{ steps.prepare.outputs.components_file }}

      - name: Generate release summary
        if: steps.prepare.outputs.mode == 'legacy'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_SHA: ${{ steps.prepare.outputs.previous_stable_bundle_tag_sha }}
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          PREVIOUS_RELEASE_BUNDLE_TAG: ${{ steps.prepare.outputs.previous_stable_bundle_tag }}
          NEW_BRANCH: ${{ steps.prepare.outputs.branch }}
        with:
          script: await require('./.github/scripts/release/release-summary.js')({ core })

      - name: Trigger components on selected branch
        if: steps.prepare.outputs.mode == 'legacy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: legacy
          DISPATCH_CONTENT: ${{ inputs.dispatch_content }}
          DRY_RUN: ${{ inputs.dry_run }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          COMPONENTS_FILE: ${{ steps.prepare.outputs.components_file }}
          CHANGED_FILE: artifacts/changed-components.txt
        run: .github/scripts/release/release-trigger-builds.sh dispatch

      # --- testing-tag mode, job 1: every check, then the tag ---

      - name: Detect changed components (plan)
        if: steps.prepare.outputs.mode == 'testing'
        env:
          BASE_SHA: ${{ steps.prepare.outputs.previous_stable_bundle_tag_sha }}
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          COMPONENTS_FILE: ${{ steps.prepare.outputs.components_file }}
        run: .github/scripts/release/release-detect-changed-components.sh "$BASE_SHA" "$HEAD_SHA" "$COMPONENTS_FILE"

      # a dry run still checks what it can when the bucket is not reachable
      - name: Get credentials for the bundle status bucket
        id: aws
        if: steps.prepare.outputs.mode == 'testing'
        continue-on-error: ${{ inputs.dry_run }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::625664829291:role/release-orchestrator-github-trigger-writer
          role-session-name: release-trigger-builds-${{ github.run_id }}
          aws-region: eu-west-1

      - name: Check the release and pick the bundle
        id: validate
        if: steps.prepare.outputs.mode == 'testing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMOTE_TOKEN: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
          S3_AVAILABLE: ${{ steps.aws.outcome == 'success' }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          DISPATCH_CONTENT: ${{ inputs.dispatch_content }}
          DRY_RUN: ${{ inputs.dry_run }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          BRANCH_EXISTS: ${{ steps.prepare.outputs.branch_exists }}
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          RELEASE_SCOPE: ${{ steps.prepare.outputs.release_scope }}
          RELEASE_TYPE: ${{ steps.prepare.outputs.release_type }}
          MAJOR: ${{ steps.prepare.outputs.major }}
          COMPONENTS_FILE: ${{ steps.prepare.outputs.components_file }}
          CHANGED_FILE: artifacts/changed-components.txt
        run: .github/scripts/release/release-trigger-builds.sh validate

      - name: Create the branch if needed, then the testing tag
        id: tag
        if: steps.prepare.outputs.mode == 'testing'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          BRANCH_TOKEN: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          BRANCH_EXISTS: ${{ steps.prepare.outputs.branch_exists }}
          BRANCH_BASE: ${{ steps.prepare.outputs.branch_base }}
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          TAG: ${{ steps.validate.outputs.tag }}
          STOP_AFTER_BRANCH: ${{ steps.validate.outputs.stop_after_branch }}
        run: .github/scripts/release/release-trigger-builds.sh tag

  # testing-tag mode, job 2: re-runnable with "Re-run failed jobs" (same tag, same plan)
  record-and-dispatch:
    needs: [release-trigger-builds]
    if: needs.release-trigger-builds.outputs.mode == 'testing' && needs.release-trigger-builds.outputs.stopped != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      DISPATCH_CONTENT: ${{ inputs.dispatch_content }}
      BRANCH: ${{ needs.release-trigger-builds.outputs.branch }}
      HEAD_SHA: ${{ needs.release-trigger-builds.outputs.head_sha }}
      TAG: ${{ needs.release-trigger-builds.outputs.tag }}
      ROLE: ${{ needs.release-trigger-builds.outputs.role }}
      RELEASE_SCOPE: ${{ needs.release-trigger-builds.outputs.release_scope }}
      PREVIOUS_STABLE_BUNDLE_TAG: ${{ needs.release-trigger-builds.outputs.previous_stable_bundle_tag }}
      CHANGED_FILE: artifacts/changed-components.txt
      COMMIT_LISTS_DIR: artifacts/commit-lists
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the components mapping at the tagged commit
        id: mapping
        run: .github/scripts/release/release-trigger-builds.sh mapping

      - name: Detect changed components since last stable release bundle tag
        uses: ./.github/actions/release-detect-changed-components
        with:
          base_sha: ${{ needs.release-trigger-builds.outputs.previous_stable_bundle_tag_sha }}
          head_sha: ${{ needs.release-trigger-builds.outputs.head_sha }}
          components_file: ${{ steps.mapping.outputs.components_file }}

      - name: Generate release summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_SHA: ${{ needs.release-trigger-builds.outputs.previous_stable_bundle_tag_sha }}
          PREVIOUS_RELEASE_BUNDLE_TAG: ${{ needs.release-trigger-builds.outputs.previous_stable_bundle_tag }}
          NEW_BRANCH: ${{ needs.release-trigger-builds.outputs.tag }}
        with:
          script: await require('./.github/scripts/release/release-summary.js')({ core })

      - name: Get credentials for the bundle status bucket
        if: inputs.dry_run == false
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::625664829291:role/release-orchestrator-github-trigger-writer
          role-session-name: release-trigger-builds-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: eu-west-1

      - name: Record the bundle in the status bucket
        env:
          COMPONENTS_FILE: ${{ steps.mapping.outputs.components_file }}
        run: .github/scripts/release/release-trigger-builds.sh record

      - name: Trigger components on the testing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: testing
          COMPONENTS_FILE: ${{ steps.mapping.outputs.components_file }}
        run: .github/scripts/release/release-trigger-builds.sh dispatch
