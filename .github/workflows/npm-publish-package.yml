name: npm-publish-package

on:
  workflow_call:
    inputs:
      package_directory:
        required: true
        type: string
    secrets:
      npm_token:
        required: true

jobs:
  get-environment:
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: .version.centreon-web

  publish-package:
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      github.repository == 'centreon/centreon'
    needs: [get-environment]
    runs-on: ubuntu-24.04

    env:
      tag: ${{ github.ref_name == 'develop' && 'latest' || github.head_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get current package information
        id: get-package-info
        run: |
          echo "current_package_version=`cat package.json | jq -r '.version'`" >> $GITHUB_OUTPUT
          echo "package_name=`cat package.json | jq -r '.name'`" >> $GITHUB_OUTPUT
        shell: bash
        working-directory: ${{ inputs.package_directory }}

      - name: Get next package version
        id: get-next-package-version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CURRENT_VERSION: ${{ steps.get-package-info.outputs.current_package_version }}
          PACKAGE_NAME: ${{ steps.get-package-info.outputs.package_name }}
          PACKAGE_DIRECTORY: ${{ inputs.package_directory }}
          TAG: ${{ env.tag }}
          STABILITY: ${{ needs.get-environment.outputs.stability }}
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        with:
          script: |
            const getPackageInformations = async () => {
              const response = await fetch(`https://registry.npmjs.org/${process.env.PACKAGE_NAME}`);
              return await response.json();
            }

            try {
              const tag = process.env.TAG;

              const package = await getPackageInformations();
              const existingPackageVersion = package['dist-tags'][tag];

              if (existingPackageVersion) {
                core.info(`Existing package version for tag ${tag}: ${existingPackageVersion}`);
              }

              let minorVersion = 0;
              if (process.env.STABILITY === 'unstable') {
                const semverMajorVersion = process.env.MAJOR_VERSION.replace('.0', '.');
                while (`${semverMajorVersion}.${minorVersion}` in package.versions) {
                  minorVersion++;
                }
                core.setOutput("package_version", `${semverMajorVersion}.${minorVersion}`);
              } else {
                while (`${process.env.CURRENT_VERSION}-${process.env.BRANCH_NAME}.${minorVersion}` in package.versions) {
                  minorVersion++;
                }
                core.setOutput("package_version", `${process.env.CURRENT_VERSION}-${process.env.BRANCH_NAME}.${minorVersion}`);
              }
            } catch (error) {
              core.setFailed(error.message);
            }

      - name: Write NPM package version
        run: npm version ${{ steps.get-next-package-version.outputs.package_version }} --no-commit-hooks --no-git-tag-version --no-workspaces-update
        working-directory: ${{ inputs.package_directory }}
        shell: bash

      - name: Publish npm package ${{ steps.get-package-info.outputs.package_name }}@${{ steps.get-next-package-version.outputs.package_version }} (${{ env.tag }})
        uses: JS-DevTools/npm-publish@19c28f1ef146469e409470805ea4279d47c3d35c # v3.1.1
        with:
          access: public
          package: ${{ inputs.package_directory }}/package.json
          tag: ${{ env.tag }}
          token: ${{ secrets.npm_token }}

  set-skip-label:
    needs: [get-environment, publish-package]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/set-pull-request-skip-label.yml
