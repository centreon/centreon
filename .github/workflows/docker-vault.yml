name: docker-vault

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".version"
      - ".github/docker/vault/**"
      - ".github/workflows/docker-vault.yml"
  push:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
    paths:
      - ".version"
      - ".github/docker/vault/**"
      - ".github/workflows/docker-vault.yml"

jobs:
  dependency-scan:
    permissions:
      contents: read
      pull-requests: write
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  get-environment:
    permissions:
      contents: read
      pull-requests: write
    needs: [dependency-scan]
    if: github.event.pull_request.head.repo.fork != true
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: centreon/www/install/insertBaseConf.sql

  dockerize:
    needs: [get-environment]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/vault
          labels: |
            org.opencontainers.image.description=Vault image for Centreon E2E tests
            com.centreon.stability=${{ needs.get-environment.outputs.stability }}
            com.centreon.version=${{ needs.get-environment.outputs.major_version }}

      - name: Compute image tag
        id: image_tag
        env:
          STABILITY: ${{ needs.get-environment.outputs.stability }}
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
          RAW_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$STABILITY" = "unstable" ]; then
            echo "value=$MAJOR_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=${RAW_REF//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          file: .github/docker/vault/Dockerfile
          context: .
          pull: true
          outputs: type=image,push=true,annotation-index.org.opencontainers.image.description=Vault image for Centreon E2E tests
          tags: ghcr.io/${{ github.repository }}/vault:${{ steps.image_tag.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}

  set-skip-label:
    permissions:
      contents: read
      pull-requests: write
    needs: [get-environment, dockerize]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/set-pull-request-skip-label.yml
