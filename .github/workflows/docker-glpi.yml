name: docker-glpi

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".version"
      - '.github/docker/glpi/**'
      - ".github/workflows/docker-glpi.yml"
  push:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
    paths:
      - ".version"
      - '.github/docker/glpi/**'
      - ".github/workflows/docker-glpi.yml"

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  get-environment:
    needs: [dependency-scan]
    if: github.event.pull_request.head.repo.fork != true
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: centreon/www/install/insertBaseConf.sql

  dockerize:
    needs: [get-environment]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Login to registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}/glpi
          labels: |
            org.opencontainers.image.description=GLPI image for Centreon E2E tests
            com.centreon.stability=${{ needs.get-environment.outputs.stability }}
            com.centreon.version=${{ needs.get-environment.outputs.major_version }}

      - name: Compute image tag
        id: image_tag
        env:
          STABILITY: ${{ needs.get-environment.outputs.stability }}
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
          RAW_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$STABILITY" = "unstable" ]; then
            echo "value=$MAJOR_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=${RAW_REF//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
        with:
          file: .github/docker/glpi/Dockerfile
          context: .
          build-args: |
            "VERSION=${{ needs.get-environment.outputs.major_version }}"
          pull: true
          outputs: type=image,push=true,annotation-index.org.opencontainers.image.description=GLPI image for Centreon E2E tests
          tags: ghcr.io/${{ github.repository }}/glpi:${{ steps.image_tag.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}

  set-skip-label:
    needs: [get-environment, dockerize]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/set-pull-request-skip-label.yml
