name: docker-mediawiki

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".version"
      - '.github/docker/mediawiki/**'
      - ".github/workflows/docker-mediawiki.yml"
  push:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
    paths:
      - ".version"
      - '.github/docker/mediawiki/**'
      - ".github/workflows/docker-mediawiki.yml"

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  get-environment:
    needs: [dependency-scan]
    if: github.event.pull_request.head.repo.fork != true
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: centreon/www/install/insertBaseConf.sql

  dockerize:
    needs: [get-environment]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/mediawiki
          labels: |
            org.opencontainers.image.description=Mediawiki image for Centreon E2E tests
            com.centreon.stability=${{ needs.get-environment.outputs.stability }}
            com.centreon.version=${{ needs.get-environment.outputs.major_version }}

      - name: Compute image tag
        id: image_tag
        env:
          STABILITY: ${{ needs.get-environment.outputs.stability }}
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
          RAW_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$STABILITY" = "unstable" ]; then
            echo "value=$MAJOR_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=${RAW_REF//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
        with:
          file: .github/docker/mediawiki/Dockerfile
          context: .github/docker/mediawiki
          pull: true
          outputs: type=image,push=true,annotation-index.org.opencontainers.image.description=Mediawiki image for Centreon E2E tests
          tags: ghcr.io/${{ github.repository }}/mediawiki:${{ steps.image_tag.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}

  set-skip-label:
    needs: [get-environment, dockerize]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/set-pull-request-skip-label.yml
