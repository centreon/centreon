name: web
run-name: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.nightly_manual_trigger == 'true')) && format('web nightly {0}', github.ref_name) || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      nightly_manual_trigger:
        description: "Set to true to trigger a nightly run"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * 1-5"
  pull_request:
    paths:
      - ".github/workflows/web.yml"
      - ".version"
      - ".version.centreon-web"
      - "centreon/**"
  push:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
      - master
      - "[2-9][0-9].[0-9][0-9].x"
      - "release-[2-9][0-9].[0-9][0-9]-next"
      - "hotfix-[2-9][0-9].[0-9][0-9]-next"
    paths:
      - ".version"
      - ".version.centreon-web"
      - "centreon/**"
    tags:
      - "centreon-web-*"

env:
  base_directory: centreon
  widgets_directory: centreon/www/widgets
  e2e_directory: centreon/tests/e2e

jobs:
  dispatch-to-maintained-branches:
    if: ${{ github.run_attempt == 1 && github.event_name == 'schedule' && github.ref_name == 'develop' && github.repository == 'centreon/centreon' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Run nightly on a different maintenance branch depending on the day
        run: |
          NIGHTLY_TARGETS=("dev-24.04.x" "dev-24.10.x" "dev-25.10.x")
          TARGET_BRANCH=${NIGHTLY_TARGETS[$(( $(date +%u) - 1 ))]}
          if [[ -z "$TARGET_BRANCH" ]]; then
            echo "[INFO] - The target branch was not properly defined for that day (out-of-bounds array)."
            exit 0
          else
            gh workflow run web.yml -r "$TARGET_BRANCH" -f nightly_manual_trigger=true
            echo "[INFO] - Dispatching nightly run to $TARGET_BRANCH branch."
          fi
        shell: bash
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  get-environment:
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: centreon/www/install/insertBaseConf.sql
      nightly_manual_trigger: ${{ inputs.nightly_manual_trigger || false }}

  changes:
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    needs: [get-environment]
    uses: ./.github/workflows/get-changes-triggers.yml
    with:
      backend_production_paths: |
        ".version"
        ".version.centreon-web"
        "centreon/.env*"
        "centreon/bootstrap.php"
        "centreon/composer.*"
        "centreon/container.php"
        "centreon/symfony.lock"
        "centreon/api/**"
        "centreon/bin/**"
        "centreon/config/**"
        "centreon/config.new/**"
        "centreon/cron/**"
        "centreon/doc/API/**"
        "centreon/GPL_LIB/**"
        "centreon/lang/**"
        "centreon/lib/**"
        "centreon/libinstall/**"
        "centreon/logrotate/**"
        "centreon/lua/**"
        "centreon/packaging/**"
        "centreon/selinux/**"
        "centreon/snmptrapd/**"
        "centreon/src/**"
        "centreon/tmpl/**"
        "centreon/tools/**"
        "centreon/varinstall/**"
        "centreon/www/**"
        "!centreon/www/front_src/**"
      frontend_production_paths: |
        "centreon/biome.json"
        "centreon/package.json"
        "centreon/pnpm*"
        "centreon/rspack*"
        "centreon/tsconfig.json"
        "centreon/packages/ui/package.json"
        "centreon/packages/ui/src/**"
        "centreon/packages/ui-context/package.json"
        "centreon/packages/ui-context/src/**"
        "centreon/www/front_src/**"
        "!centreon/**/cypress/**"
        "!centreon/**/*.cypress.*"
        "!centreon/**/__mocks__/**"
      backend_test_paths: |
        "centreon/.php-cs-fixer*"
        "centreon/castor.php"
        "centreon/codingstyle.xml"
        "centreon/phpstan.*"
        "centreon/phpunit*.xml"
        "centreon/rector.*"
        "centreon/tests/php/**"
      frontend_test_paths: |
        "centreon/cypress.config.ts"
        "centreon/**/cypress/**"
        "centreon/**/*.cypress.*"
        "centreon/**/__mocks__/**"
        "centreon/lighthouse/**"
      api_test_paths: |
        "centreon/tests/rest_api/**"
      e2e_test_paths: |
        "centreon/behat.yml"
        "centreon/features/**"
        "centreon/tests/clapi_export/**"
        "centreon/tests/e2e/**"
        "centreon/tests/performance/**"
      upgrade_test_paths: |
        "centreon/www/install/**"
        "centreon/packaging/**"
        "centreon/tests/e2e/features/Platform-upgrade-update/**"
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
      base_sha: ${{ needs.get-environment.outputs.previous_release_bundle_tag }}
      labels: ${{ needs.get-environment.outputs.labels }}

  check-version-consistency:
    runs-on: ubuntu-24.04
    needs: [get-environment]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      (
        needs.get-environment.outputs.stability == 'testing' ||
        (github.event_name == 'pull_request' && needs.get-environment.outputs.target_stability == 'testing')
      )
    env:
      version: ${{ needs.get-environment.outputs.major_version }}.${{ needs.get-environment.outputs.minor_version }}
      version_file: .version.centreon-web
      installation_file: centreon/www/install/insertBaseConf.sql
      update_file: centreon/www/install/php/Update-${{ needs.get-environment.outputs.major_version }}.${{ needs.get-environment.outputs.minor_version }}.php
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Check ${{ env.version_file }}
        uses: ./.github/actions/check-version-consistency
        with:
          file: ${{ env.version_file }}
          version: ${{ env.version }}

      - name: Check ${{ env.installation_file }}
        uses: ./.github/actions/check-version-consistency
        with:
          file: ${{ env.installation_file }}
          version: ${{ env.version }}

      - name: Check ${{ env.update_file }}
        uses: ./.github/actions/check-version-consistency
        with:
          file: ${{ env.update_file }}
          version: ${{ env.version }}

      - name: Get list of modified update files from current pull request
        if: |
          github.event_name == 'pull_request' &&
          ! contains(needs.get-environment.outputs.labels, 'skip-update-files-check')
        id: get_changed_files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46.0.5
        with:
          files: |
            centreon/www/install/php/Update-**.php

      - name: Check what update files are modified
        if: |
          github.event_name == 'pull_request' &&
          ! contains(needs.get-environment.outputs.labels, 'skip-update-files-check')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          MODIFIED_UPDATE_SCRIPTS: ${{ steps.get_changed_files.outputs.all_changed_files }}
        with:
          script: |
            const fs = require('fs');

            const MODIFIED_UPDATE_SCRIPTS = process.env.MODIFIED_UPDATE_SCRIPTS.split(" ");
            let failed = 0;
            if (MODIFIED_UPDATE_SCRIPTS.length == 0 || MODIFIED_UPDATE_SCRIPTS[0] == '') { return; }
            else if (MODIFIED_UPDATE_SCRIPTS.length > 1) {
              core.setFailed(`❌ No more than one update script should be modified.`);
              failed = 1;
            } else {
              if ( ('${{ needs.get-environment.outputs.target_stability }}' == 'unstable' || '${{ needs.get-environment.outputs.target_stability }}' == 'canary') && !MODIFIED_UPDATE_SCRIPTS[0].match(/Update-next\.php$/) ) {
                core.setFailed(`❌ This pull request targeting ${{ github.base_ref }} should only be modifying the Update-next.php script.`);
                failed = 1;
              } else if ( '${{ needs.get-environment.outputs.target_stability }}' == 'testing' ) {
                const majorVersionContent = fs.readFileSync('.version', { encoding: 'utf8' });
                const minorVersionContent = fs.readFileSync('.version.centreon-web', { encoding: 'utf8' });
                const version = majorVersionContent.match(/MAJOR="?(\d+\.\d+)"?/)[1] + "." + minorVersionContent.match(/MINOR="?(\d+)"?/)[1]

                if (!MODIFIED_UPDATE_SCRIPTS[0].match(`/Update-${version}\.php$`)) {
                  core.setFailed(`❌ Update script ` + MODIFIED_UPDATE_SCRIPTS[0] + ` should not be modified.`);
                  failed = 1;
                }
              }
            }

            if (failed == 1) {
              core.notice(`📚 If you want to bypass this check for any reason, please add label 'skip-update-files-check' on your pull request and re-run all jobs on the pipeline.`);
              return;
            } else {
              core.notice(`Properly modifying ` + MODIFIED_UPDATE_SCRIPTS[0] + ` script.`);
              return;
            }

  frontend-web-build:
    needs: [get-environment, changes]
    if: |
      (
        needs.changes.outputs.trigger_packaging == 'true' &&
        needs.get-environment.outputs.skip_workflow == 'false'
      ) ||
      needs.get-environment.outputs.stability == 'stable'
    # needed to deliver sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./.github/actions/frontend-build
        with:
          base_directory: ${{ env.base_directory }}
          dependencies_lock_file: ${{ env.base_directory }}/pnpm-lock.yaml
          index_file: ${{ env.base_directory }}/www/index.html
          static_directory: ${{ env.base_directory }}/www/static
          index_cache_key: ${{ github.sha }}-${{ github.run_id }}-index
          static_cache_key: ${{ github.sha }}-${{ github.run_id }}-static
          build_command: pnpm centreon:build

  backend-dependencies:
    needs: [get-environment, changes]
    if: |
      (
        needs.changes.outputs.trigger_packaging == 'true' &&
        needs.get-environment.outputs.skip_workflow == 'false'
      ) ||
      needs.get-environment.outputs.stability == 'stable'
    # needed to deliver sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: 8.2
        env:
          runner: ubuntu-24.04

      - name: Create configuration file
        run: cp config/centreon.config.php.template config/centreon.config.php
        working-directory: ${{ env.base_directory }}

      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress --quiet --no-scripts
        working-directory: ${{ env.base_directory }}
        shell: bash

      - name: Cache vendor directory
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.base_directory }}/vendor
          key: ${{ github.sha }}-${{ github.run_id }}-vendor

  translation-build:
    needs: [get-environment, changes]
    if: |
      (
        needs.changes.outputs.trigger_packaging == 'true' &&
        needs.get-environment.outputs.skip_workflow == 'false'
      ) ||
      needs.get-environment.outputs.stability == 'stable'
    # needed to deliver sources
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/translation:${{ needs.get-environment.outputs.major_version }}
      credentials:
        username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
        password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 10
          token: ${{ secrets.CENTREON_TECHNIQUE_PAT }}

      - name: Build translations
        id: build-translations
        env:
          IS_NIGHTLY: ${{ needs.get-environment.outputs.is_nightly }}
          STABILITY: ${{ needs.get-environment.outputs.stability }}
          EVENT_NAME: ${{ github.event_name }}
          HAS_UPDATE_TRANSLATIONS_LABEL: ${{ contains(needs.get-environment.outputs.labels, 'update-translations') }}
        run: |
          TRANSLATIONS_PATCH_FILE=""

          git config --global --add safe.directory $GITHUB_WORKSPACE

          cd centreon

          for i in lang/*.UTF-8 ; do
            localefull="$(basename "$i")"
            langName="$(echo "$localefull" | cut -d . -f 1)"
            langShortName="$(echo "$localefull" | cut -d _ -f 1)"
            mkdir -p "www/locale/$localefull/LC_MESSAGES"
            bash -e ../.github/scripts/translation/make_translation.sh centreon $langName
            msgfmt "lang/$localefull/LC_MESSAGES/messages.po" -o "www/locale/$localefull/LC_MESSAGES/messages.mo" || exit 1
            msgfmt "lang/$localefull/LC_MESSAGES/help.po" -o "www/locale/$localefull/LC_MESSAGES/help.mo" || exit 1
            php bin/centreon-translations.php "$langShortName" "lang/$localefull/LC_MESSAGES/messages.po" "www/locale/$localefull/LC_MESSAGES/messages.ser"
          done

          mkdir -p www/locale/en_US.UTF-8/LC_MESSAGES
          php bin/centreon-translations.php en lang/fr_FR.UTF-8/LC_MESSAGES/messages.po www/locale/en_US.UTF-8/LC_MESSAGES/messages.ser

          if [[ "$(git diff --ignore-matching-lines="POT-Creation-Date" | wc -l)" != "0" ]]; then
            # avoid to always update POT-Creation-Date field
            find -type f -regex '.+\.pot?' -exec sed -i -e 's/"POT-Creation-Date.*$/"POT-Creation-Date: 2025-01-01 00:00+0000\\n"/g' {} \;
            if [[ ( "$IS_NIGHTLY" == "false" && "$STABILITY" == "unstable" ) || ( "$EVENT_NAME" == 'pull_request' && "$HAS_UPDATE_TRANSLATIONS_LABEL" == "true" ) ]]; then
              if [[ "$(git log -1 --pretty=format:'%an')" != "technique-ci" ]]; then
                git config user.name "technique-ci"
                git config user.email "technique+ci@centreon.com"
                git status
                git add .
                git commit -m "chore(lang): update translations"
                git push
              else
                echo "::notice::Last commit author is technique-ci. Skipping commit to avoid infinite loop."
                cd ..
                git diff > translations.patch
                TRANSLATIONS_PATCH_FILE="translations.patch"
              fi
            else
              echo "::notice::Translations have been updated, but the workflow is a nightly run or does not have the update-translations label. Skipping commit. Git patch will be available as artifact."
              cd ..
              git diff > translations.patch
              TRANSLATIONS_PATCH_FILE="translations.patch"
            fi
          else
            echo "No changes in translations"
          fi

          echo "translations_patch_file=$TRANSLATIONS_PATCH_FILE" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload translations patch
        if: ${{ steps.build-translations.outputs.translations_patch_file != '' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: translations-patch
          path: ${{ steps.build-translations.outputs.translations_patch_file }}
          retention-days: 1

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.base_directory }}/www/locale
          key: ${{ github.sha }}-${{ github.run_id }}-translation

  frontend-web-lint:
    runs-on: ubuntu-24.04
    needs: [changes, get-environment]
    if: |
      needs.changes.outputs.trigger_frontend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./.github/actions/frontend-lint
        with:
          frontend_directory: ${{ env.base_directory }}
          module_name: centreon
          dependencies_lock_file: ${{ env.base_directory }}/pnpm-lock.yaml
          pat: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          lint_path: ./www/front_src/

  frontend-unit-test:
    runs-on: ubuntu-24.04
    needs: [changes, get-environment]
    if: |
      needs.changes.outputs.trigger_frontend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ env.base_directory }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: centreon
        env:
          CYPRESS_INSTALL_BINARY: "0"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Unit test
        run: pnpm t --silent --reporter=jest-junit
        working-directory: centreon

      - if: failure()
        uses: ./.github/actions/publish-report
        with:
          path: "centreon/junit.xml"

  frontend-component-test:
    needs: [changes, get-environment]
    if: |
      needs.changes.outputs.trigger_frontend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    uses: ./.github/workflows/cypress-component-parallelization.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.LIGHTHOUSE_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.LIGHTHOUSE_SECRET }}
      jira_base_url: ${{ secrets.JIRA_BASE_URL }}
      jira_user_email: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
      jira_api_token: ${{ secrets.XRAY_JIRA_TOKEN }}
    with:
      name: centreon
      module_name: centreon
      specs_path: www/**
      dependencies_lock_file: centreon/pnpm-lock.yaml
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}

  backend-unit-test:
    runs-on: ubuntu-24.04
    needs: [changes, get-environment]
    if: |
      needs.changes.outputs.trigger_backend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: 8.2
          coverage: none
        env:
          runner: ubuntu-24.04

      - name: Create configuration file
        run: cp config/centreon.config.php.template config/centreon.config.php
        working-directory: centreon

      - name: Ensure Symfony cache directories exist and are writable (legacy and new)
        run: |
          echo "Ensure Symfony cache directories exist"
          sudo mkdir -p /var/cache/centreon/symfony{,.new}
          echo "Set permissions on Symfony cache directories with user: '$USER'"
          sudo chown -R $USER:$USER /var/cache/centreon/symfony{,.new}

      - name: Install dependencies
        uses: ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520 # v3.1.1
        with:
          working-directory: centreon
          composer-options: "--optimize-autoloader"

      - name: Unit test
        run: XDEBUG_MODE=coverage composer run-script test:ci
        working-directory: centreon

      - if: failure()
        uses: ./.github/actions/publish-report
        with:
          path: "centreon/build/phpunit.xml"
          format: "php-junit"

  backend-lint:
    runs-on: ubuntu-24.04
    needs: [changes, get-environment]
    if: |
      needs.changes.outputs.trigger_backend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: 8.2
          coverage: none
        env:
          runner: ubuntu-24.04

      - name: Install dependencies for PHP quality tools
        run: composer install --optimize-autoloader --prefer-dist --no-interaction --no-progress --quiet --no-scripts
        working-directory: php-tools
        shell: bash

      - name: Create configuration file
        run: cp config/centreon.config.php.template config/centreon.config.php
        working-directory: centreon

      - name: Ensure Symfony cache directories exist and are writable (legacy and new)
        run: |
          echo "Ensure Symfony cache directories exist" && set -e
          sudo mkdir -p /var/cache/centreon/symfony.new
          sudo mkdir -p /var/cache/centreon/symfony
          echo "Set permissions on Symfony cache directories with user: '$USER'" && set -e
          sudo chown -R $USER:$USER /var/cache/centreon/symfony.new
          sudo chown -R $USER:$USER /var/cache/centreon/symfony

      - name: Install dependencies for centreon-web
        run: composer install --optimize-autoloader --prefer-dist --no-interaction --no-progress --quiet --no-scripts
        working-directory: centreon
        shell: bash

      - name: ⚙️ Check Symfony configuration (legacy and new)
        run: composer symfony:check && composer symfony:new:check
        working-directory: centreon

      - name: Get changed PHP files
        id: changed-php
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47.0.0
        with:
          files: |
            **/*.php

      - name: 🛠️ Rector checks
        if: steps.changed-php.outputs.any_changed == 'true'
        working-directory: centreon
        run: |
          echo "Run of these Rector tests: rector:legacy, rector:core, rector:new on diff" && set -e
          PHP_DIFF_FILES="${{ steps.changed-php.outputs.all_changed_files }}" composer rector:diff

      - name: 🧹 PHP-CS-Fixer checks
        if: steps.changed-php.outputs.any_changed == 'true'
        working-directory: centreon
        run: |
          echo "Run of these PHP-CS-Fixer tests: cs:legacy, cs:core, cs:new on diff" && set -e
          PHP_DIFF_FILES="${{ steps.changed-php.outputs.all_changed_files }}" composer cs:diff

      - name: 🔍 PHPStan checks
        working-directory: centreon
        run: |
          echo "Run of these PHPStan tests: stan:legacy:www, stan:legacy:src, stan:legacy:test, stan:core, stan:core:test, stan:new, stan:new:test" && set -e

          pids=()
          statuses=()

          run_task() {
            name=$1
            shift
            "$@" -- --no-progress
            result=$?
            if [ $result -eq 0 ]; then
              echo "✅ PHPStan $name: Success"
            else
              echo "❌ PHPStan $name: Failed"
            fi
            return $result
          }

          # Start tasks in background
          run_task legacy:www composer stan:legacy:www & pids+=($!)
          run_task legacy:src composer stan:legacy:src & pids+=($!)
          run_task legacy:test composer stan:legacy:test & pids+=($!)
          run_task core:src composer stan:core:src & pids+=($!)
          run_task core:test composer stan:core:test & pids+=($!)
          run_task new:src composer stan:new:src & pids+=($!)
          run_task new:test composer stan:new:test & pids+=($!)

          # Wait for all, and record if any failed
          exit_code=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              exit_code=1
            fi
          done

          exit $exit_code

      - name: 📐 Deptrac checks
        working-directory: centreon
        run: |
          echo "Run of these Deptrac tests: dep:new" && set -e

          pids=()
          statuses=()

          run_task() {
            name=$1
            shift
            "$@" -- --no-progress
            result=$?
            if [ $result -eq 0 ]; then
              echo "✅ Deptrac $name: Success"
            else
              echo "❌ Deptrac $name: Failed"
            fi
            return $result
          }

          # Start tasks in background
          run_task new composer dep:new & pids+=($!)

          # Wait for all, and record if any failed
          exit_code=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              exit_code=1
            fi
          done

          exit $exit_code

  gherkin-lint:
    runs-on: ubuntu-24.04
    needs: [get-environment, changes]
    if: |
      needs.changes.outputs.trigger_e2e_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./.github/actions/gherkin-lint
        with:
          features_path: ${{ env.e2e_directory }}/features

  e2e-lint:
    runs-on: ubuntu-22.04
    needs: [get-environment, changes]
    if: |
      needs.changes.outputs.trigger_e2e_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./.github/actions/frontend-lint
        with:
          frontend_directory: ${{ env.e2e_directory }}
          module_name: ${{ env.base_directory }}
          dependencies_lock_file: ${{ env.base_directory }}/pnpm-lock.yaml
          pat: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

  package:
    needs:
      [
        get-environment,
        changes,
        check-version-consistency,
        translation-build,
        backend-dependencies,
        backend-lint,
        backend-unit-test,
        frontend-web-build,
        frontend-web-lint,
        frontend-unit-test,
        frontend-component-test,
        gherkin-lint,
        e2e-lint,
      ]
    if: |
      needs.changes.outputs.trigger_packaging == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.get-environment.outputs.stability != 'stable'
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_extension: rpm
            image: packaging-nfpm-alma8
            distrib: el8
          - package_extension: rpm
            image: packaging-nfpm-alma9
            distrib: el9
          - package_extension: deb
            image: packaging-nfpm-bookworm
            distrib: bookworm
          - package_extension: deb
            image: packaging-nfpm-jammy
            distrib: jammy
    name: package ${{ matrix.distrib }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ matrix.image }}:${{ needs.get-environment.outputs.major_version }}
      credentials:
        username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
        password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Restore translation from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: centreon/www/locale
          key: ${{ github.sha }}-${{ github.run_id }}-translation
          fail-on-cache-miss: true

      - name: Restore web index.html from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: centreon/www/index.html
          key: ${{ github.sha }}-${{ github.run_id }}-index
          fail-on-cache-miss: true

      - name: Restore web frontend from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: centreon/www/static
          key: ${{ github.sha }}-${{ github.run_id }}-static
          fail-on-cache-miss: true

      - name: Restore vendor directory from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: centreon/vendor
          key: ${{ github.sha }}-${{ github.run_id }}-vendor
          fail-on-cache-miss: true

      - name: Set perl vendor lib path according to distrib
        run: |
          if [[ "${{ matrix.package_extension }}" == "deb" ]]; then
            PERL_VENDORLIB="/usr/share/perl5"
          else
            PERL_VENDORLIB="/usr/share/perl5/vendor_perl"
          fi
          echo "PERL_VENDORLIB=$PERL_VENDORLIB" >> $GITHUB_ENV
        shell: bash

      - name: Create centreon web configuration file
        run: mv centreon/config/centreon.config.php.template centreon/config/centreon.config.php
        shell: bash

      - name: Remove compilation related files
        run: |
          rm -rf centreon/www/front_src
          rm -rf centreon/www/widgets/src
          find centreon/www/widgets/ -maxdepth 1 -type f ! -name "*.php" ! -name "*.ts" -delete
        shell: bash

      - name: Replace macros in source code
        run: |
          MACRO_REPLACEMENT_FILE="centreon/packaging/src/centreon-macroreplacement.txt"
          if [[ "${{ matrix.package_extension }}" == "rpm" ]]; then
            APACHE_USER="apache"
          else
            APACHE_USER="www-data"
          fi
          echo "s#@WEB_USER@#$APACHE_USER#g" >> $MACRO_REPLACEMENT_FILE

          find ./centreon -type f -not -path "./vendor/*" | grep -v $MACRO_REPLACEMENT_FILE | xargs --delimiter='\n' sed -i -f $MACRO_REPLACEMENT_FILE
        shell: bash

      - name: Generate selinux binaries
        if: ${{ matrix.package_extension == 'rpm' }}
        run: |
          cd centreon/selinux
          sed -i "s/@VERSION@/${{ needs.get-environment.outputs.major_version }}.${{ needs.get-environment.outputs.minor_version }}/g" *.te
          make -f /usr/share/selinux/devel/Makefile
        shell: bash

      - name: Remove selinux packaging files on debian
        if: ${{ matrix.package_extension == 'deb' }}
        run: rm -f centreon/packaging/*-selinux.yaml
        shell: bash

      - name: Package Centreon
        uses: ./.github/actions/package-nfpm
        with:
          nfpm_file_pattern: "centreon/packaging/*.yaml"
          module_name: centreon
          distrib: ${{ matrix.distrib }}
          package_extension: ${{ matrix.package_extension }}
          major_version: ${{ needs.get-environment.outputs.major_version }}
          minor_version: ${{ needs.get-environment.outputs.minor_version }}
          release: ${{ needs.get-environment.outputs.release }}
          arch: all
          commit_hash: ${{ github.sha }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-${{ matrix.package_extension }}-${{ matrix.distrib }}
          rpm_gpg_key: ${{ secrets.RPM_GPG_SIGNING_KEY }}
          rpm_gpg_signing_key_id: ${{ secrets.RPM_GPG_SIGNING_KEY_ID }}
          rpm_gpg_signing_passphrase: ${{ secrets.RPM_GPG_SIGNING_PASSPHRASE }}
          stability: ${{ needs.get-environment.outputs.stability }}
          is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
          upload_artifacts: ${{ needs.get-environment.outputs.is_nightly == 'true' || contains(needs.get-environment.outputs.labels, 'upload-artifacts') && 'true' || 'false' }}

  dockerize:
    runs-on: ubuntu-24.04
    needs: [get-environment, changes, package]
    if: |
      needs.changes.outputs.trigger_packaging == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.get-environment.outputs.stability != 'stable' &&
      github.repository == 'centreon/centreon'

    env:
      project: centreon-web
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}
    name: dockerize ${{ matrix.operating_system }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Generate information according to matrix os
        id: matrix_include
        run: |
          if [ "${{ matrix.operating_system }}" = "alma8" ]; then
            DISTRIB=el8
            PACKAGE_EXTENSION=rpm
          elif [ "${{ matrix.operating_system }}" = "alma9" ]; then
            DISTRIB=el9
            PACKAGE_EXTENSION=rpm
          elif [ "${{ matrix.operating_system }}" = "bookworm" ]; then
            DISTRIB=bookworm
            PACKAGE_EXTENSION=deb
          elif [ "${{ matrix.operating_system }}" = "jammy" ]; then
            DISTRIB=jammy
            PACKAGE_EXTENSION=deb
          else
            echo "::error::${{ matrix.operating_system }} is not managed"
            exit 1
          fi

          echo "distrib=$DISTRIB" >> $GITHUB_OUTPUT
          echo "package_extension=$PACKAGE_EXTENSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Login to registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PUSH_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PUSH_TOKEN }}

      - name: Get FROM image tag
        id: from_image_version
        run: |
          FROM_IMAGE_VERSION="${{ needs.get-environment.outputs.major_version }}"
          FROM_IMAGE="centreon-web-dependencies-collect-${{ matrix.operating_system }}"
          IMAGE_TAG_EXISTS=$(docker manifest inspect ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${FROM_IMAGE}:${{ github.head_ref || github.ref_name }} >/dev/null 2>&1 && echo yes || echo no)
          if [[ "$IMAGE_TAG_EXISTS" == "yes" ]]; then
            FROM_IMAGE_VERSION="${{ github.head_ref || github.ref_name }}"
            echo "::notice::FROM image $FROM_IMAGE:$FROM_IMAGE_VERSION will be used to build docker image ${{ env.project }}-${{ matrix.operating_system }}."
          else
            IMAGE_TAG_EXISTS=$(docker manifest inspect ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${FROM_IMAGE}:${{ github.base_ref || github.ref_name }} >/dev/null 2>&1 && echo yes || echo no)
            if [[ "$IMAGE_TAG_EXISTS" == "yes" ]]; then
              FROM_IMAGE_VERSION="${{ github.base_ref || github.ref_name }}"
              echo "::notice::FROM image $FROM_IMAGE:$FROM_IMAGE_VERSION will be used to build docker image ${{ env.project }}-${{ matrix.operating_system }}."
            fi
          fi

          echo "from_image_version=$FROM_IMAGE_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Restore ${{ steps.matrix_include.outputs.package_extension }} files
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ./*.${{ steps.matrix_include.outputs.package_extension }}
          key: ${{ github.sha }}-${{ github.run_id }}-${{ steps.matrix_include.outputs.package_extension }}-${{ steps.matrix_include.outputs.distrib }}
          fail-on-cache-miss: true

      - run: |
          if [ "${{ steps.matrix_include.outputs.package_extension }}" = "rpm" ]; then
            rm -f centreon{,-central,-mariadb,-mysql,-web-selinux}-${{ needs.get-environment.outputs.major_version }}*.rpm
          else
            rm -f centreon{,-central,-mariadb,-mysql}_${{ needs.get-environment.outputs.major_version }}*.deb
          fi

          mkdir packages-centreon
          mv *.${{ steps.matrix_include.outputs.package_extension }} packages-centreon/
        shell: bash

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push web image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          file: .github/docker/${{ env.project }}/${{ matrix.operating_system }}/Dockerfile
          context: .
          build-args: |
            "REGISTRY_URL=${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}"
            "VERSION=${{ needs.get-environment.outputs.major_version }}"
            "FROM_IMAGE_VERSION=${{ steps.from_image_version.outputs.from_image_version }}"
            "STABILITY=${{ needs.get-environment.outputs.stability }}"
          pull: true
          push: true
          load: true
          tags: |
            ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ env.project }}-${{ matrix.operating_system }}:${{ github.head_ref || github.ref_name }}
            ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ env.project }}-slim-${{ matrix.operating_system }}:${{ github.head_ref || github.ref_name }}

      - name: Store slim image in local archive
        run: |
          docker tag ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ env.project }}-slim-${{ matrix.operating_system }}:${{ github.head_ref || github.ref_name }} ${{ env.project }}-slim-${{ matrix.operating_system }}:${{ github.head_ref || github.ref_name }}
          mkdir -p docker-image
          docker save --output ./docker-image/${{ env.project }}-slim-${{ matrix.operating_system }}.tar ${{ env.project }}-slim-${{ matrix.operating_system }}:${{ github.head_ref || github.ref_name }}
        shell: bash

      - name: Clear previous docker image from cache
        run: |
          curl \
            -X DELETE \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/centreon/centreon/actions/caches?key=docker-image-${{ env.project }}-slim-${{ matrix.operating_system }}-${{ github.head_ref || github.ref_name }}
        shell: bash

      - name: Store slim image in cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ./docker-image
          key: docker-image-${{ env.project }}-slim-${{ matrix.operating_system }}-${{ github.head_ref || github.ref_name }}

  create-xray-test-plan-and-test-execution:
    needs: [get-environment, changes, dockerize]
    if: |
      needs.changes.outputs.trigger_api_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      ( needs.get-environment.outputs.stability == 'testing' || github.event_name == 'schedule' ) &&
      github.repository == 'centreon/centreon'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}
    name: create-xray-test-plan-and-test-execution ${{ matrix.operating_system }}
    uses: ./.github/workflows/create-xray-test-plan-and-test-execution.yml
    with:
      major_version: ${{ needs.get-environment.outputs.major_version }}
      minor_version: ${{ needs.get-environment.outputs.minor_version }}
      os: ${{ matrix.operating_system }}
    secrets:
      xray_client_id: ${{ secrets.XRAY_CLIENT_ID }}
      xray_client_secret: ${{ secrets.XRAY_CLIENT_SECRET }}
      xray_jira_user_email: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
      xray_jira_token: ${{ secrets.XRAY_JIRA_TOKEN }}

  newman-test:
    needs:
      [
        get-environment,
        changes,
        create-xray-test-plan-and-test-execution,
        dockerize
      ]
    if: |
      needs.changes.outputs.trigger_api_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.get-environment.outputs.stability != 'stable' &&
      github.repository == 'centreon/centreon'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).databases }}
    name: newman-test ${{ matrix.operating_system }}-${{ matrix.database }}
    uses: ./.github/workflows/newman.yml
    with:
      collection_path: centreon/tests/rest_api/collections
      image_name: centreon-web
      os: ${{ matrix.operating_system }}
      container_name: my_centreon_container
      centreon_url: http://localhost
      centreon_image: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/centreon-web-slim-${{ matrix.operating_system }}:${{ github.head_ref || github.ref_name }}
      database_image: bitnamilegacy/${{ matrix.database }}
      dependencies_lock_file: centreon/pnpm-lock.yaml
      major_version: ${{ needs.get-environment.outputs.major_version }}
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
      stability: ${{ needs.get-environment.outputs.stability }}
      xray_keys_and_ids: ${{ toJson(needs.create-xray-test-plan-and-test-execution.outputs) }}

    secrets:
      registry_username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
      registry_password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}
      client_id: ${{ secrets.XRAY_CLIENT_ID }}
      client_secret: ${{ secrets.XRAY_CLIENT_SECRET }}
      jira_base_url: ${{ secrets.JIRA_BASE_URL }}
      jira_user_email: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
      jira_api_token: ${{ secrets.XRAY_JIRA_TOKEN }}

  legacy-e2e-test:
    needs: [get-environment, changes, dockerize]
    if: |
      needs.changes.outputs.trigger_e2e_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.get-environment.outputs.stability != 'stable' &&
      github.repository == 'centreon/centreon'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}
    name: legacy-e2e-test ${{ matrix.operating_system }}-${{ matrix.database }}
    uses: ./.github/workflows/behat-test.yml
    with:
      name: legacy-e2e
      module_name: centreon
      database_image: bitnamilegacy/${{ matrix.database }}
      image_name: centreon-web
      os: ${{ matrix.operating_system }}
      features_path: features
      test_tags: ${{ matrix.test_tags }}
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
    secrets:
      registry_username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
      registry_password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}
      composer_token: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
      jira_base_url: ${{ secrets.JIRA_BASE_URL }}
      jira_user_email: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
      jira_api_token: ${{ secrets.XRAY_JIRA_TOKEN }}

  e2e-test:
    needs:
      [
        get-environment,
        changes,
        dockerize,
        create-xray-test-plan-and-test-execution,
        gherkin-lint,
        e2e-lint,
      ]
    if: |
      needs.changes.outputs.trigger_e2e_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.get-environment.outputs.stability != 'stable' &&
      github.repository == 'centreon/centreon'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}
    name: e2e-test ${{ matrix.operating_system }}-${{ matrix.database }}
    uses: ./.github/workflows/cypress-e2e-parallelization.yml
    with:
      name: e2e
      module_name: centreon
      image_name: centreon-web
      database_image: bitnamilegacy/${{ matrix.database }}
      os: ${{ matrix.operating_system }}
      features_path: tests/e2e/features
      major_version: ${{ needs.get-environment.outputs.major_version }}
      minor_version: ${{ needs.get-environment.outputs.minor_version }}
      stability: ${{ needs.get-environment.outputs.stability }}
      target_stability: ${{ needs.get-environment.outputs.target_stability }}
      package_cache_key: ${{ format('{0}-{1}-{2}', github.sha, github.run_id, matrix.operating_system == 'alma8' && 'rpm-el8' || matrix.operating_system == 'alma9' && 'rpm-el9' || 'deb-bookworm' ) }}
      package_directory: fixtures/packages
      test_tags: ${{ needs.changes.outputs.trigger_upgrade_testing == 'true' && matrix.test_tags || format('{0} and not @update and not @upgrade', matrix.test_tags) }}
      dependencies_lock_file: centreon/pnpm-lock.yaml
      xray_keys_and_ids: ${{ toJson(needs.create-xray-test-plan-and-test-execution.outputs) }}
      is_cloud: ${{ needs.get-environment.outputs.is_cloud }}
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
    secrets:
      registry_username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
      registry_password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}
      xray_client_id: ${{ secrets.XRAY_CLIENT_ID }}
      xray_client_secret: ${{ secrets.XRAY_CLIENT_SECRET }}
      artifactory_internal_repo_username: ${{ secrets.ARTIFACTORY_INTERNAL_REPO_USERNAME }}
      artifactory_internal_repo_password: ${{ secrets.ARTIFACTORY_INTERNAL_REPO_PASSWORD }}
      jira_base_url: ${{ secrets.JIRA_BASE_URL }}
      jira_user_email: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
      jira_api_token: ${{ secrets.XRAY_JIRA_TOKEN }}

