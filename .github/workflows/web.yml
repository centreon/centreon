name: web
run-name: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.nightly_manual_trigger == 'true')) && format('web nightly {0}', github.ref_name) || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      nightly_manual_trigger:
        description: "Set to true to trigger a nightly run"
        required: true
        default: false
        type: boolean
      labels:
        description: "Labels to add to the run (comma separated)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 3 * * 1-5"
  pull_request:
    paths:
      - ".github/workflows/web.yml"
      - ".version"
      - ".version.centreon-web"
      - "centreon/**"
  push:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
      - master
      - "[2-9][0-9].[0-9][0-9].x"
      - "release-[2-9][0-9].[0-9][0-9]-next"
      - "hotfix-[2-9][0-9].[0-9][0-9]-next"
    paths:
      - ".version"
      - ".version.centreon-web"
      - "centreon/**"
    tags:
      - "centreon-web-*"

env:
  base_directory: centreon
  widgets_directory: centreon/www/widgets
  e2e_directory: centreon/tests/e2e

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  dispatch-to-maintenance-branches:
    if: |
      github.run_attempt == 1 &&
      github.event_name == 'schedule' &&
      github.ref_name == 'develop'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select maintenance branch and run nightly workflow on it
        uses: ./.github/actions/dispatch-to-maintenance-branch

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  get-environment:
    needs: [dependency-scan]
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: centreon/www/install/insertBaseConf.sql
      nightly_manual_trigger: ${{ inputs.nightly_manual_trigger || false }}
      labels: ${{ inputs.labels || '' }}

  changes:
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    needs: [get-environment]
    uses: ./.github/workflows/get-changes-triggers.yml
    with:
      backend_production_paths: |
        ".version"
        ".version.centreon-web"
        "centreon/.env*"
        "centreon/bootstrap.php"
        "centreon/composer.*"
        "centreon/container.php"
        "centreon/symfony.lock"
        "centreon/api/**"
        "centreon/bin/**"
        "centreon/config/**"
        "centreon/config.new/**"
        "centreon/cron/**"
        "centreon/doc/API/**"
        "centreon/GPL_LIB/**"
        "centreon/lib/**"
        "centreon/libinstall/**"
        "centreon/logrotate/**"
        "centreon/lua/**"
        "centreon/packaging/**"
        "centreon/selinux/**"
        "centreon/snmptrapd/**"
        "centreon/src/**"
        "centreon/tmpl/**"
        "centreon/tools/**"
        "centreon/varinstall/**"
        "centreon/www/**"
        "!centreon/www/front_src/**"
      frontend_production_paths: |
        "centreon/biome.json"
        "centreon/package.json"
        "centreon/pnpm*"
        "centreon/rspack*"
        "centreon/tsconfig.json"
        "centreon/packages/ui/package.json"
        "centreon/packages/ui/src/**"
        "centreon/packages/ui-context/package.json"
        "centreon/packages/ui-context/src/**"
        "centreon/www/front_src/**"
        "!centreon/**/cypress/**"
        "!centreon/**/*.cypress.*"
        "!centreon/**/__mocks__/**"
      backend_test_paths: |
        "centreon/.php-cs-fixer*"
        "centreon/castor.php"
        "centreon/codingstyle.xml"
        "centreon/phpstan.*"
        "centreon/phpunit*.xml"
        "centreon/rector.*"
        "centreon/tests/php/**"
      frontend_test_paths: |
        "centreon/cypress.config.ts"
        "centreon/**/cypress/**"
        "centreon/**/*.cypress.*"
        "centreon/**/__mocks__/**"
        "centreon/lighthouse/**"
      api_test_paths: |
        "centreon/tests/api/**"
      e2e_test_paths: |
        "centreon/tests/clapi_export/**"
        "centreon/tests/e2e/**"
        "centreon/tests/performance/**"
      upgrade_test_paths: |
        "centreon/www/install/**"
        "centreon/packaging/**"
        "centreon/tests/e2e/features/Platform-upgrade-update/**"
      translation_paths: |
        "centreon/lang/**"
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
      base_sha: ${{ needs.get-environment.outputs.previous_release_bundle_tag }}
      labels: ${{ needs.get-environment.outputs.labels }}

  check-version-consistency:
    runs-on: ubuntu-24.04
    needs: [get-environment]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      (
        needs.get-environment.outputs.stability == 'testing' ||
        (github.event_name == 'pull_request' && needs.get-environment.outputs.target_stability == 'testing')
      )
    env:
      version: ${{ needs.get-environment.outputs.major_version }}.${{ needs.get-environment.outputs.minor_version }}
      version_file: .version.centreon-web
      installation_file: centreon/www/install/insertBaseConf.sql
      update_file: centreon/www/install/php/Update-${{ needs.get-environment.outputs.major_version }}.${{ needs.get-environment.outputs.minor_version }}.php
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check ${{ env.version_file }}
        uses: ./.github/actions/check-version-consistency
        with:
          file: ${{ env.version_file }}
          version: ${{ env.version }}

      - name: Check ${{ env.installation_file }}
        uses: ./.github/actions/check-version-consistency
        with:
          file: ${{ env.installation_file }}
          version: ${{ env.version }}

      - name: Check ${{ env.update_file }}
        uses: ./.github/actions/check-version-consistency
        with:
          file: ${{ env.update_file }}
          version: ${{ env.version }}

      - name: Get list of modified update files from current pull request
        if: |
          github.event_name == 'pull_request' &&
          ! contains(needs.get-environment.outputs.labels, 'skip-update-files-check')
        id: get_changed_files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          use_rest_api: ${{ github.event_name == 'pull_request' }}
          files: |
            centreon/www/install/php/Update-**.php

      - name: Check what update files are modified
        if: |
          github.event_name == 'pull_request' &&
          ! contains(needs.get-environment.outputs.labels, 'skip-update-files-check')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MODIFIED_UPDATE_SCRIPTS: ${{ steps.get_changed_files.outputs.all_changed_files }}
          BASE_REF: ${{ github.base_ref }}
          TARGET_STABILITY: ${{ needs.get-environment.outputs.target_stability }}
        with:
          script: |
            const fs = require('fs');

            const MODIFIED_UPDATE_SCRIPTS = process.env.MODIFIED_UPDATE_SCRIPTS.split(" ");
            const TARGET_STABILITY = process.env.TARGET_STABILITY;
            const BASE_REF = process.env.BASE_REF;
            let failed = 0;
            if (MODIFIED_UPDATE_SCRIPTS.length == 0 || MODIFIED_UPDATE_SCRIPTS[0] == '') { return; }
            else if (MODIFIED_UPDATE_SCRIPTS.length > 1) {
              core.setFailed(`❌ No more than one update script should be modified.`);
              failed = 1;
            } else {
              if ( (TARGET_STABILITY == 'unstable' || TARGET_STABILITY == 'canary') && !MODIFIED_UPDATE_SCRIPTS[0].match(/Update-next\.php$/) ) {
                core.setFailed(`❌ This pull request targeting ${BASE_REF} should only be modifying the Update-next.php script.`);
                failed = 1;
              } else if ( TARGET_STABILITY == 'testing' ) {
                const majorVersionContent = fs.readFileSync('.version', { encoding: 'utf8' });
                const minorVersionContent = fs.readFileSync('.version.centreon-web', { encoding: 'utf8' });
                const version = majorVersionContent.match(/MAJOR="?(\d+\.\d+)"?/)[1] + "." + minorVersionContent.match(/MINOR="?(\d+)"?/)[1]

                if (!MODIFIED_UPDATE_SCRIPTS[0].match(`/Update-${version}\.php$`)) {
                  core.setFailed(`❌ Update script ` + MODIFIED_UPDATE_SCRIPTS[0] + ` should not be modified.`);
                  failed = 1;
                }
              }
            }

            if (failed == 1) {
              core.notice(`📚 If you want to bypass this check for any reason, please add label 'skip-update-files-check' on your pull request and re-run all jobs on the pipeline.`);
              return;
            } else {
              core.notice(`Properly modifying ` + MODIFIED_UPDATE_SCRIPTS[0] + ` script.`);
              return;
            }

  frontend-web-build:
    needs: [get-environment, changes]
    if: |
      (
        needs.changes.outputs.trigger_packaging == 'true' &&
        needs.get-environment.outputs.skip_workflow == 'false'
      ) ||
      (
        needs.get-environment.outputs.stability == 'stable' &&
        ! cancelled() &&
        ! contains(needs.*.result, 'failure') &&
        ! contains(needs.*.result, 'cancelled')
      )
    # needed to deliver sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/frontend-build
        with:
          base_directory: ${{ env.base_directory }}
          dependencies_lock_file: ${{ env.base_directory }}/pnpm-lock.yaml
          index_file: ${{ env.base_directory }}/www/index.html
          static_directory: ${{ env.base_directory }}/www/static
          index_cache_key: ${{ github.sha }}-${{ github.run_id }}-index
          static_cache_key: ${{ github.sha }}-${{ github.run_id }}-static
          build_command: pnpm centreon:build

  backend-dependencies:
    needs: [get-environment, changes]
    if: |
      (
        needs.changes.outputs.trigger_packaging == 'true' &&
        needs.get-environment.outputs.skip_workflow == 'false'
      ) ||
      (
        needs.get-environment.outputs.stability == 'stable' &&
        ! cancelled() &&
        ! contains(needs.*.result, 'failure') &&
        ! contains(needs.*.result, 'cancelled')
      )
    # needed to deliver sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ needs.get-environment.outputs.php_version }}
        env:
          runner: ubuntu-24.04

      - name: Create configuration file
        run: cp config/centreon.config.php.template config/centreon.config.php
        working-directory: ${{ env.base_directory }}

      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress --quiet --no-scripts
        working-directory: ${{ env.base_directory }}
        shell: bash

      - name: Cache vendor directory
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.base_directory }}/vendor
          key: ${{ github.sha }}-${{ github.run_id }}-vendor

  translation-build:
    needs: [get-environment, changes]
    if: |
      (
        needs.changes.outputs.trigger_packaging == 'true' &&
        needs.get-environment.outputs.skip_workflow == 'false'
      ) ||
      (
        needs.get-environment.outputs.stability == 'stable' &&
        ! cancelled() &&
        ! contains(needs.*.result, 'failure') &&
        ! contains(needs.*.result, 'cancelled')
      )
    # needed to deliver sources
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/centreon/delivery-tooling/translation:${{ needs.get-environment.outputs.major_version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 10
          token: ${{ github.event.pull_request.head.repo.fork == true && secrets.GITHUB_TOKEN || secrets.CENTREON_TECHNIQUE_PAT }}

      - name: Build translations
        id: build-translations
        env:
          IS_NIGHTLY: ${{ needs.get-environment.outputs.is_nightly }}
          STABILITY: ${{ needs.get-environment.outputs.stability }}
          EVENT_NAME: ${{ github.event_name }}
          HAS_UPDATE_TRANSLATIONS_LABEL: ${{ contains(needs.get-environment.outputs.labels, 'update-translations') }}
        run: bash .github/scripts/translation/build-translations.sh
        shell: bash

      - name: Upload translations patch
        if: ${{ steps.build-translations.outputs.translations_patch_file != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: translations-patch
          path: ${{ steps.build-translations.outputs.translations_patch_file }}
          retention-days: 1

      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.base_directory }}/www/locale
          key: ${{ github.sha }}-${{ github.run_id }}-translation

  frontend-web-lint:
    runs-on: ubuntu-24.04
    needs: [changes, get-environment]
    if: |
      needs.changes.outputs.trigger_frontend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/frontend-lint
        with:
          frontend_directory: ${{ env.base_directory }}
          module_name: centreon
          dependencies_lock_file: ${{ env.base_directory }}/pnpm-lock.yaml
          pat: ${{ github.event.pull_request.head.repo.fork == true && github.token || secrets.PERSONAL_ACCESS_TOKEN }}
          lint_path: ./www/front_src/

  frontend-type-check:
    runs-on: ubuntu-24.04
    needs: [changes, get-environment]
    if: |
      needs.changes.outputs.trigger_frontend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: ./.github/actions/frontend-type-check
        with:
          frontend_directory: ${{ env.base_directory }}
          dependencies_lock_file: ${{ env.base_directory }}/pnpm-lock.yaml

  frontend-unit-test:
    runs-on: ubuntu-24.04
    needs: [changes, get-environment]
    if: |
      needs.changes.outputs.trigger_frontend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # v6.0.4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ env.base_directory }}/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install \
            --frozen-lockfile \
            --config.trustPolicy=no-downgrade \
            --config.minimumReleaseAge=2880 \
            --config.blockExoticSubdeps=true
        working-directory: centreon
        env:
          CYPRESS_INSTALL_BINARY: "0"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Unit test
        run: pnpm t --silent --reporter=jest-junit
        working-directory: centreon

      - if: failure()
        uses: ./.github/actions/publish-report
        with:
          path: "centreon/junit.xml"

  frontend-component-test:
    needs: [changes, get-environment]
    if: |
      needs.changes.outputs.trigger_frontend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    uses: ./.github/workflows/cypress-component-parallelization.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.LIGHTHOUSE_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.LIGHTHOUSE_SECRET }}
      jira_base_url: ${{ secrets.JIRA_BASE_URL }}
      jira_user_email: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
      jira_api_token: ${{ secrets.XRAY_JIRA_TOKEN }}
    with:
      name: centreon
      module_name: centreon
      specs_path: www/**
      dependencies_lock_file: centreon/pnpm-lock.yaml
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}

  backend-unit-test:
    runs-on: ubuntu-24.04
    needs: [changes, get-environment]
    if: |
      needs.changes.outputs.trigger_backend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ needs.get-environment.outputs.php_version }}
          coverage: none
        env:
          runner: ubuntu-24.04

      - name: Create configuration file
        run: cp config/centreon.config.php.template config/centreon.config.php
        working-directory: centreon

      - name: Ensure Symfony cache and log directories exist and are writable (legacy and new)
        # /var/log/centreon is created by the package on prod hosts; mkdir it here for MON-151077 handlers.
        run: |
          sudo mkdir -p /var/cache/centreon/symfony /var/cache/centreon/symfony.new /var/log/centreon
          sudo chown -R "$USER:$USER" /var/cache/centreon/symfony /var/cache/centreon/symfony.new /var/log/centreon

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          working-directory: centreon
          composer-options: "--optimize-autoloader"

      - name: Unit test
        run: XDEBUG_MODE=coverage composer run-script test:ci
        working-directory: centreon

      - name: App unit test
        run: composer run test:new
        working-directory: centreon

      - if: failure()
        uses: ./.github/actions/publish-report
        with:
          path: "centreon/build/phpunit.xml"
          format: "php-junit"

  backend-integration-test:
    runs-on: ubuntu-24.04
    needs: [get-environment, changes, backend-unit-test]
    if: |
      needs.changes.outputs.trigger_backend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    services:
      db:
        image: mysql:8.4
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
        ports:
          - 3306:3306
        env:
          MYSQL_USER: centreon
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ needs.get-environment.outputs.php_version }}
          coverage: none

      - name: Create configuration files
        run: |
          cp config/centreon.config.php.template config/centreon.config.php
          sed -i \
            -e "s|'@CENTREON_ETC@'|realpath(__DIR__) . '/'|" \
            -e "s|'@CENTREON_LOG@'|'/var/lib/centreon'|" \
            -e "s|'@CENTREON_CACHEDIR@'|'/var/cache/centreon'|" \
            -e "s|'@CENTREON_VARLIB@'|'/var/lib/centreon'|" \
            config/centreon.config.php
          cat config/centreon.config.php

          cp www/install/var/configFileTemplate config/centreon.conf.php
          sed -i \
            -e "s|--ADDRESS--|127.0.0.1|" \
            -e "s|--DBUSER--|centreon|" \
            -e "s|--DBPASS--|password|" \
            -e "s|--CONFDB--|centreon|" \
            -e "s|--STORAGEDB--|centreon_storage|" \
            -e "s|--DBPORT--|3306|" \
            -e "s|--CENTREONDIR--|$(pwd)|" \
            config/centreon.conf.php
          cat config/centreon.conf.php
        working-directory: centreon

      - name: Ensure Symfony cache and log directories exist and are writable (legacy and new)
        # /var/log/centreon is created by the package on prod hosts; mkdir it here for MON-151077 handlers.
        run: |
          sudo mkdir -p /var/cache/centreon/symfony /var/cache/centreon/symfony.new /var/log/centreon
          sudo chown -R "$USER:$USER" /var/cache/centreon/symfony /var/cache/centreon/symfony.new /var/log/centreon

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          working-directory: centreon
          composer-options: "--optimize-autoloader"

      - name: Run App integration tests
        run: composer run test:new:integration
        working-directory: centreon

      - name: Run Core integration tests
        run: composer run test:core
        working-directory: centreon

      - name: Display application logs
        if: failure()
        run: |
          echo "::group::test.web.log"
          cat /tmp/centreon-test-logs/test.web.log 2>/dev/null || echo "File not found"
          echo "::endgroup::"
          echo "::group::Symfony logs (var/log/)"
          find centreon/var/log -type f -name "*.log" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || echo "No logs found"
          echo "::endgroup::"

  backend-lint:
    runs-on: ubuntu-24.04
    needs: [changes, get-environment]
    if: |
      needs.changes.outputs.trigger_backend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ needs.get-environment.outputs.php_version }}
          coverage: none
        env:
          runner: ubuntu-24.04

      - name: Install dependencies for PHP quality tools
        run: composer install --optimize-autoloader --prefer-dist --no-interaction --no-progress --quiet --no-scripts
        working-directory: php-tools
        shell: bash

      - name: Create configuration file
        run: cp config/centreon.config.php.template config/centreon.config.php
        working-directory: centreon

      - name: Ensure Symfony cache and log directories exist and are writable (legacy and new)
        # /var/log/centreon is created by the package on prod hosts; mkdir it here for MON-151077 handlers.
        run: |
          sudo mkdir -p /var/cache/centreon/symfony /var/cache/centreon/symfony.new /var/log/centreon
          sudo chown -R "$USER:$USER" /var/cache/centreon/symfony /var/cache/centreon/symfony.new /var/log/centreon

      - name: Install dependencies for centreon-web
        run: composer install --optimize-autoloader --prefer-dist --no-interaction --no-progress --quiet --no-scripts
        working-directory: centreon
        shell: bash

      - name: ⚙️ Check Symfony configuration (legacy and new)
        run: composer symfony:check && composer symfony:new:check
        working-directory: centreon

      - name: Get changed PHP files
        id: changed-php
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          use_rest_api: ${{ github.event_name == 'pull_request' }}
          files: |
            **/*.php

      - name: 🛠️ Rector checks
        if: steps.changed-php.outputs.any_changed == 'true'
        working-directory: centreon
        env:
          PHP_DIFF_FILES: ${{ steps.changed-php.outputs.all_changed_files }}
        run: |
          echo "Run of these Rector tests: rector:legacy, rector:core, rector:new on diff" && set -e
          composer rector:diff

      - name: 🧹 PHP-CS-Fixer checks
        if: steps.changed-php.outputs.any_changed == 'true'
        working-directory: centreon
        env:
          PHP_DIFF_FILES: ${{ steps.changed-php.outputs.all_changed_files }}
        run: |
          echo "Run of these PHP-CS-Fixer tests: cs:legacy, cs:core, cs:new on diff" && set -e
          composer cs:diff

      - name: Restore PHPStan result cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: centreon/.phpstan-cache
          # Unique per run (sha) so the evolving result cache is re-saved every run;
          # head_ref is the real branch name on pull_request (ref_name would be "N/merge").
          key: phpstan-cache-web-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            phpstan-cache-web-${{ github.head_ref || github.ref_name }}-
            phpstan-cache-web-

      - name: 🔍 PHPStan checks
        working-directory: centreon
        run: |
          echo "Run of these PHPStan tests: stan:legacy:www, stan:legacy:src, stan:legacy:test, stan:core:src, stan:core:test, stan:new:src, stan:new:test"

          exit_code=0

          # Run every task even if one fails, then exit non-zero if any failed.
          # Each task uses its own tmp dir so its result cache (resultCache.php) does
          # not collide with the others. The whole .phpstan-cache directory is persisted
          # across CI runs, so only changed files (and their dependents) get re-analysed.
          run_task() {
            task=$1                  # e.g. core:src
            cache_dir=${task//:/-}   # e.g. core-src
            # PHPStan has no --tmp-dir flag; its tmp dir defaults to sys_get_temp_dir()/phpstan
            # and sys_get_temp_dir() honours $TMPDIR. Point each task at its own dir so their
            # result caches (resultCache.php) don't clobber each other across runs.
            task_tmp="${PWD}/.phpstan-cache/${cache_dir}"
            mkdir -p "${task_tmp}"
            if TMPDIR="${task_tmp}" composer "stan:${task}" -- --no-progress; then
              echo "✅ PHPStan ${task}: Success"
            else
              echo "❌ PHPStan ${task}: Failed"
              exit_code=1
            fi
          }

          # Run sequentially: each PHPStan run already parallelises internally, so chaining
          # them avoids the CPU oversubscription the previous background fan-out caused.
          run_task legacy:www
          run_task legacy:src
          run_task legacy:test
          run_task core:src
          run_task core:test
          run_task new:src
          run_task new:test

          exit $exit_code

      - name: 📐 Deptrac checks
        working-directory: centreon
        run: |
          echo "Run of these Deptrac tests: dep:new" && set -e

          pids=()
          statuses=()

          run_task() {
            name=$1
            shift
            "$@" -- --no-progress
            result=$?
            if [ $result -eq 0 ]; then
              echo "✅ Deptrac $name: Success"
            else
              echo "❌ Deptrac $name: Failed"
            fi
            return $result
          }

          # Start tasks in background
          run_task new composer dep:new & pids+=($!)

          # Wait for all, and record if any failed
          exit_code=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              exit_code=1
            fi
          done

          exit $exit_code

  gherkin-lint:
    runs-on: ubuntu-24.04
    needs: [get-environment, changes]
    if: |
      needs.changes.outputs.trigger_e2e_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/gherkin-lint
        with:
          features_path: ${{ env.e2e_directory }}/features

  e2e-lint:
    runs-on: ubuntu-22.04
    needs: [get-environment, changes]
    if: |
      needs.changes.outputs.trigger_e2e_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/frontend-lint
        with:
          frontend_directory: ${{ env.e2e_directory }}
          module_name: ${{ env.base_directory }}
          dependencies_lock_file: ${{ env.base_directory }}/pnpm-lock.yaml
          pat: ${{ github.event.pull_request.head.repo.fork == true && github.token || secrets.PERSONAL_ACCESS_TOKEN }}
          lint_path: './features'

  package:
    needs:
      [
        get-environment,
        changes,
        check-version-consistency,
        translation-build,
        backend-dependencies,
        backend-lint,
        backend-unit-test,
        backend-integration-test,
        frontend-web-build,
        frontend-web-lint,
        frontend-unit-test,
        frontend-type-check,
        frontend-component-test,
        gherkin-lint,
        e2e-lint,
      ]
    if: |
      needs.changes.outputs.trigger_packaging == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.get-environment.outputs.stability != 'stable'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.package_matrix) }}

    name: package ${{ matrix.distrib }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/centreon/delivery-tooling/packaging:${{ needs.get-environment.outputs.major_version }}-${{ matrix.operating_system }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore translation from cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: centreon/www/locale
          key: ${{ github.sha }}-${{ github.run_id }}-translation
          fail-on-cache-miss: true

      - name: Restore web index.html from cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: centreon/www/index.html
          key: ${{ github.sha }}-${{ github.run_id }}-index
          fail-on-cache-miss: true

      - name: Restore web frontend from cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: centreon/www/static
          key: ${{ github.sha }}-${{ github.run_id }}-static
          fail-on-cache-miss: true

      - name: Restore vendor directory from cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: centreon/vendor
          key: ${{ github.sha }}-${{ github.run_id }}-vendor
          fail-on-cache-miss: true

      - name: Set perl vendor lib path according to distrib
        run: |
          if [[ "${{ matrix.package_extension }}" == "deb" ]]; then
            PERL_VENDORLIB="/usr/share/perl5"
          else
            PERL_VENDORLIB="/usr/share/perl5/vendor_perl"
          fi
          echo "PERL_VENDORLIB=$PERL_VENDORLIB" >> $GITHUB_ENV
        shell: bash

      - name: Create centreon web configuration file
        run: mv centreon/config/centreon.config.php.template centreon/config/centreon.config.php
        shell: bash

      - name: Remove compilation related files
        run: |
          rm -rf centreon/www/front_src
          rm -rf centreon/www/widgets/src
          find centreon/www/widgets/ -maxdepth 1 -type f ! -name "*.php" ! -name "*.ts" -delete
        shell: bash

      - name: Replace macros in source code
        run: |
          MACRO_REPLACEMENT_FILE="centreon/packaging/src/centreon-macroreplacement.txt"
          if [[ "${{ matrix.package_extension }}" == "rpm" ]]; then
            APACHE_USER="apache"
          else
            APACHE_USER="www-data"
          fi
          echo "s#@WEB_USER@#$APACHE_USER#g" >> $MACRO_REPLACEMENT_FILE

          find ./centreon -type f -not -path "./vendor/*" | grep -v $MACRO_REPLACEMENT_FILE | xargs --delimiter='\n' sed -i -f $MACRO_REPLACEMENT_FILE
        shell: bash

      - name: Generate selinux binaries
        if: ${{ matrix.package_extension == 'rpm' }}
        env:
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
          MINOR_VERSION: ${{ needs.get-environment.outputs.minor_version }}
        run: |
          cd centreon/selinux
          sed -i "s/@VERSION@/$MAJOR_VERSION.$MINOR_VERSION/g" *.te
          make -f /usr/share/selinux/devel/Makefile
        shell: bash

      - name: Remove selinux packaging files on debian
        if: ${{ matrix.package_extension == 'deb' }}
        run: rm -f centreon/packaging/*-selinux.yaml
        shell: bash

      - name: Package Centreon
        uses: ./.github/actions/package-nfpm
        with:
          nfpm_file_pattern: "centreon/packaging/*.yaml"
          module_name: centreon
          distrib: ${{ matrix.distrib }}
          package_extension: ${{ matrix.package_extension }}
          major_version: ${{ needs.get-environment.outputs.major_version }}
          minor_version: ${{ needs.get-environment.outputs.minor_version }}
          release: ${{ needs.get-environment.outputs.release }}
          arch: all
          commit_hash: ${{ github.sha }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-${{ matrix.package_extension }}-${{ matrix.distrib }}
          rpm_gpg_key: ${{ github.event.pull_request.head.repo.fork != true && secrets.RPM_GPG_SIGNING_KEY || '' }}
          rpm_gpg_signing_key_id: ${{ github.event.pull_request.head.repo.fork != true && secrets.RPM_GPG_SIGNING_KEY_ID || '' }}
          rpm_gpg_signing_passphrase: ${{ github.event.pull_request.head.repo.fork != true && secrets.RPM_GPG_SIGNING_PASSPHRASE || '' }}
          php_version: ${{ needs.get-environment.outputs.php_version }}
          stability: ${{ needs.get-environment.outputs.stability }}
          is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
          upload_artifacts: ${{ needs.get-environment.outputs.is_nightly == 'true' || contains(needs.get-environment.outputs.labels, 'upload-artifacts') && 'true' || 'false' }}

  dockerize:
    runs-on: ubuntu-24.04
    needs: [get-environment, changes, package]
    permissions:
      contents: read
      packages: read
      actions: write
    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}
    if: |
      needs.changes.outputs.trigger_packaging == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.get-environment.outputs.stability != 'stable'

    env:
      project: centreon-web
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.package_matrix) }}
    name: dockerize ${{ matrix.operating_system }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate information according to matrix os
        id: matrix_include
        run: |
          if [ "${{ matrix.operating_system }}" = "alma9" ]; then
            DISTRIB=el9
            PACKAGE_EXTENSION=rpm
          elif [ "${{ matrix.operating_system }}" = "alma10" ]; then
            DISTRIB=el10
            PACKAGE_EXTENSION=rpm
          elif [ "${{ matrix.operating_system }}" = "trixie" ]; then
            DISTRIB=trixie
            PACKAGE_EXTENSION=deb
          elif [ "${{ matrix.operating_system }}" = "jammy" ]; then
            DISTRIB=jammy
            PACKAGE_EXTENSION=deb
          else
            echo "::error::${{ matrix.operating_system }} is not managed"
            exit 1
          fi

          echo "distrib=$DISTRIB" >> $GITHUB_OUTPUT
          echo "package_extension=$PACKAGE_EXTENSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Compute image tag
        id: image_tag
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
        run: |
          if [[ "$REF" == "develop" ]]; then
            echo "tag=develop-${MAJOR_VERSION}" >> $GITHUB_OUTPUT
            echo "additional_tag=develop" >> $GITHUB_OUTPUT
          else
            SANITIZED_REF="$(printf '%s' "$REF" | sed -E 's#[^[:alnum:]_.-]+#-#g; s#^[.-]+##; s#-+#-#g' | cut -c1-128)"
            if [[ -z "$SANITIZED_REF" ]]; then
              echo "::error::Unable to derive a valid Docker tag from ref '$REF'"
              exit 1
            fi
            echo "tag=$SANITIZED_REF" >> $GITHUB_OUTPUT
            echo "additional_tag=" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Login to registry
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PUSH_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PUSH_TOKEN }}

      - name: Get FROM image tag
        id: from_image_version
        uses: ./.github/actions/get-docker-from-image-version
        with:
          from_image: centreon-web-dependencies-collect
          current_tag: ${{ steps.image_tag.outputs.tag }}
          major_version: ${{ needs.get-environment.outputs.major_version }}
          is_cloud: ${{ needs.get-environment.outputs.is_cloud }}
          registry_url: ghcr.io/${{ github.repository }}
          tag_suffix: -${{ matrix.operating_system }}

      - name: Restore ${{ steps.matrix_include.outputs.package_extension }} files
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./*.${{ steps.matrix_include.outputs.package_extension }}
          key: ${{ github.sha }}-${{ github.run_id }}-${{ steps.matrix_include.outputs.package_extension }}-${{ steps.matrix_include.outputs.distrib }}
          fail-on-cache-miss: true

      - env:
          PACKAGE_EXTENSION: ${{ steps.matrix_include.outputs.package_extension }}
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
        run: |
          if [ "$PACKAGE_EXTENSION" = "rpm" ]; then
            rm -f centreon{,-central,-mariadb,-mysql,-web-selinux}-"$MAJOR_VERSION"*.rpm
          else
            rm -f centreon{,-central,-mariadb,-mysql}_"$MAJOR_VERSION"*.deb
          fi

          mkdir packages-centreon
          mv *."$PACKAGE_EXTENSION" packages-centreon/
        shell: bash

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: |
            docker.centreon.com/centreon/${{ env.project }}-${{ matrix.operating_system }}
            docker.centreon.com/centreon/${{ env.project }}-slim-${{ matrix.operating_system }}
          tags: |
            type=raw,value=${{ steps.image_tag.outputs.tag }}
            type=raw,value=${{ steps.image_tag.outputs.additional_tag }},enable=${{ steps.image_tag.outputs.additional_tag != '' }}

      - name: Build and push web image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          file: .github/docker/${{ env.project }}/${{ matrix.operating_system }}/Dockerfile
          context: .
          build-args: |
            "REGISTRY_URL=ghcr.io/${{ github.repository }}"
            "MAJOR_VERSION=${{ needs.get-environment.outputs.major_version }}"
            "FROM_IMAGE_VERSION=${{ steps.from_image_version.outputs.from_image_version }}"
            "STABILITY=${{ needs.get-environment.outputs.stability }}"
            "IS_CLOUD=${{ needs.get-environment.outputs.is_cloud }}"
            "PHP_VERSION=${{ needs.get-environment.outputs.php_version }}"
          pull: true
          push: ${{ github.event.pull_request.head.repo.fork != true }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Store slim image in local archive
        env:
          OPERATING_SYSTEM: ${{ matrix.operating_system }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker tag "docker.centreon.com/centreon/$project-slim-$OPERATING_SYSTEM:$IMAGE_VERSION" "$project-slim-$OPERATING_SYSTEM:$IMAGE_VERSION"
          mkdir -p docker-image
          docker save --output "./docker-image/$project-slim-$OPERATING_SYSTEM.tar" "$project-slim-$OPERATING_SYSTEM:$IMAGE_VERSION"
        shell: bash

      - name: Clear previous docker image from cache
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATING_SYSTEM: ${{ matrix.operating_system }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          curl \
            -X DELETE \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/caches?key=docker-image-$project-slim-$OPERATING_SYSTEM-$IMAGE_VERSION"
        shell: bash

      - name: Store slim image in cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./docker-image
          key: docker-image-${{ env.project }}-slim-${{ matrix.operating_system }}-${{ steps.meta.outputs.version }}

  create-xray-test-plan-and-test-execution:
    needs: [get-environment, changes, dockerize]
    if: |
      needs.changes.outputs.trigger_api_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      (needs.get-environment.outputs.stability == 'testing' || needs.get-environment.outputs.is_nightly == 'true') &&
      github.event.pull_request.head.repo.fork != true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}
    name: create-xray-test-plan-and-test-execution ${{ matrix.operating_system }}
    uses: ./.github/workflows/create-xray-test-plan-and-test-execution.yml
    with:
      major_version: ${{ needs.get-environment.outputs.major_version }}
      minor_version: ${{ needs.get-environment.outputs.minor_version }}
      os: ${{ matrix.operating_system }}
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
    secrets:
      xray_client_id: ${{ secrets.XRAY_CLIENT_ID }}
      xray_client_secret: ${{ secrets.XRAY_CLIENT_SECRET }}
      xray_jira_user_email: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
      xray_jira_token: ${{ secrets.XRAY_JIRA_TOKEN }}

  bruno-api-test:
    needs: [get-environment, changes, create-xray-test-plan-and-test-execution, dockerize]
    if: |
      needs.changes.outputs.trigger_api_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}
    name: bruno-test ${{ matrix.operating_system }} ${{ matrix.database }}
    uses: ./.github/workflows/bruno-api-test.yml
    with:
      collection_path: centreon/tests/api/web-api-workspace/collections
      image_name: centreon-web-slim
      operating_system: ${{ matrix.operating_system }}
      database_image: bitnamilegacy/${{ matrix.database }}
      major_version: ${{ needs.get-environment.outputs.major_version }}
      stability: ${{ needs.get-environment.outputs.stability }}
      working_directory: centreon/tests/api/web-api-workspace
      component-name: centreon
      xray_keys_and_ids: ${{ toJson(needs.create-xray-test-plan-and-test-execution.outputs) }}
      upload_artifacts: ${{ contains(needs.get-environment.outputs.labels, 'upload-artifacts') && 'true' || 'false' }}
    secrets:
      registry_username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
      registry_password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}
      client_id: ${{ secrets.XRAY_CLIENT_ID }}
      client_secret: ${{ secrets.XRAY_CLIENT_SECRET }}
      jira_user: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
      jira_token_test: ${{ secrets.XRAY_JIRA_TOKEN }}

  e2e-test:
    needs:
      [
        get-environment,
        changes,
        dockerize,
        create-xray-test-plan-and-test-execution,
        gherkin-lint,
        e2e-lint,
      ]
    if: |
      needs.changes.outputs.trigger_e2e_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.get-environment.outputs.stability != 'stable'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}
    name: e2e-test ${{ matrix.operating_system }}-${{ matrix.database }}
    uses: ./.github/workflows/cypress-e2e-parallelization.yml
    with:
      name: e2e
      module_name: centreon
      image_name: centreon-web
      database_image: bitnamilegacy/${{ matrix.database }}
      os: ${{ matrix.operating_system }}
      features_path: tests/e2e/features
      major_version: ${{ needs.get-environment.outputs.major_version }}
      minor_version: ${{ needs.get-environment.outputs.minor_version }}
      stability: ${{ needs.get-environment.outputs.stability }}
      target_stability: ${{ needs.get-environment.outputs.target_stability }}
      package_cache_key: ${{ format('{0}-{1}-{2}', github.sha, github.run_id, case(matrix.operating_system == 'alma10', 'rpm-el10', matrix.operating_system == 'alma9', 'rpm-el9', 'deb-trixie') ) }}
      package_directory: fixtures/packages
      test_tags: ${{ needs.changes.outputs.trigger_upgrade_testing == 'true' && matrix.test_tags || format('{0} and not @update and not @upgrade', matrix.test_tags) }}
      dependencies_lock_file: centreon/pnpm-lock.yaml
      xray_keys_and_ids: ${{ toJson(needs.create-xray-test-plan-and-test-execution.outputs) }}
      is_cloud: ${{ needs.get-environment.outputs.is_cloud }}
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
      labels: ${{ needs.get-environment.outputs.labels }}
    secrets:
      registry_username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
      registry_password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}
      xray_client_id: ${{ secrets.XRAY_CLIENT_ID }}
      xray_client_secret: ${{ secrets.XRAY_CLIENT_SECRET }}
      jira_base_url: ${{ secrets.JIRA_BASE_URL }}
      jira_user_email: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
      jira_api_token: ${{ secrets.XRAY_JIRA_TOKEN }}
      github_models_token: ${{ secrets.CENTREON_TECHNIQUE_PAT }}

  # performances-test:
  #   runs-on: ubuntu-24.04
