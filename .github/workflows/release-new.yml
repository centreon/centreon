---
name: release-new
run-name: '${{ inputs.release_scope }} ${{ inputs.release_type }} of branch ${{ inputs.release_branch }} (release number ${{ inputs.release_number }})'

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release or hotfix branch name'
        required: true
        default: '' # Default is empty, to avoid any accident
        type: string
      release_number:
        description: 'Release number using YYYYMMDD format'
        required: true
        default: '00000000' # Default, should return an error if left untouched
        type: string
      release_type:
        description: 'Release type, affects context of release action'
        required: true
        default: 'release' # Default is release
        type: choice
        options:
          - hotfix
          - release
      release_scope:
        description: 'Release scope, affects context of release action'
        type: choice
        options:
          - cloud
          - onprem

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  check-inputs:
    needs: [dependency-scan]
    if: ${{ github.repository == 'centreon/centreon' }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_BRANCH: ${{ inputs.release_branch }}
      RELEASE_NUMBER: ${{ inputs.release_number }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      RELEASE_SCOPE: ${{ inputs.release_scope }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Fight against empty inputs
        run: |
          if [[ -z "$RELEASE_BRANCH" || -z "$RELEASE_NUMBER" || "$RELEASE_NUMBER" == "00000000" ]]; then
            echo "Invalid inputs were given for release-branch ($RELEASE_BRANCH) or release-number ($RELEASE_NUMBER). Exiting."
            exit 1
          else
            echo "Inputs are not empty."
          fi
        shell: bash
      - name: Check release branch and release type inputs coherence
        run: |
          # Extract release branch prefix
          RELEASE_BRANCH_PREFIX="${RELEASE_BRANCH%%-*}"

          echo "Checking inputs coherence on $RELEASE_BRANCH..."
          if [[ "$RELEASE_BRANCH_PREFIX" == "$RELEASE_TYPE" ]]; then
            echo "Inputs are ok, continue."
          else
            echo "Inputs are NOT ok, exiting."
            exit 1
          fi
        shell: bash
      - name: Check if release or hotfix branch exists
        run: |
          echo "Given inputs:"
          echo "Release branch: $RELEASE_BRANCH"
          echo "Release number: $RELEASE_NUMBER"
          echo "Release type: $RELEASE_TYPE"
          echo "Release scope: $RELEASE_SCOPE"
          echo "Checking for release branch based on workflow input..."
          if git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_BRANCH"; then
            echo "Branch $RELEASE_BRANCH does exist, using it as reference for versions."
          else
            echo "Branch $RELEASE_BRANCH does not exist, exiting."
            exit 1
          fi
        shell: bash

  release:
    needs: [check-inputs]
    if: ${{ github.repository == 'centreon/centreon' }}
    runs-on: ubuntu-24.04
    outputs:
      new_release_bundle_tag: ${{ steps.build_release_bundle_tag.outputs.new_release_bundle_tag }}
    env:
      RELEASE_BRANCH: ${{ inputs.release_branch }}
      RELEASE_NUMBER: ${{ inputs.release_number }}
      RELEASE_SCOPE: ${{ inputs.release_scope }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Build new release bundle tag
        id: build_release_bundle_tag
        run: |
          set -eux

          echo "Building release bundle tag."
          # Expected output: release-cloud-YYYYMMNN-AA.BB or release-onprem-YYYYMMNN-AA.BB
          # YYYY is year
          # MM is month
          # NN is stable release iteration number (00 is always the first one)
          # AA.BB is major version (ex: 25.05)
          NEW_RELEASE_BUNDLE_TAG="release-$RELEASE_SCOPE-$RELEASE_NUMBER"

          # Extract major version from release_branch input
          MAJOR_VERSION=$(echo "$RELEASE_BRANCH" | cut -d "-" -f2)

          # Concatenate final NEW_RELEASE_BUNDLE_TAG
          NEW_RELEASE_BUNDLE_TAG="release-$RELEASE_SCOPE-$RELEASE_NUMBER-$MAJOR_VERSION"

          # Output to GITHUB_ENV
          echo "new_release_bundle_tag=$NEW_RELEASE_BUNDLE_TAG" >> "$GITHUB_OUTPUT"
          echo "major_version=$MAJOR_VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Check ref where release workflow is hosted
        run: |
          set -eu
          # Check if github.ref is develop or dev-xxx branches where workflow and action are hosted
          # This must never run on any other ref than develop or dev-xxx
          if [[ "$GITHUB_REF_NAME" == 'develop' ]]; then
            echo "[DEBUG] ref hosting release workflow is valid: $GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" =~ ^dev-[2-9][0-9]\.[0-9][0-9]\.x$ ]]; then
            echo "[DEBUG] ref hosting release workflow is valid: $GITHUB_REF_NAME"
          else
            echo "::error::ref hosting release workflow is not valid ($GITHUB_REF), please use develop or dev-xxx branch, exiting."
            exit 1
          fi
        shell: bash

      - name: Release
        id: release
        uses: ./.github/actions/release-new
        with:
          github_ref_name: ${{ github.ref_name }}
          jira_project_id: ${{ secrets.JIRA_PROJECT_ID }}
          jira_user_email: ${{ secrets.JIRA_RELEASE_USER }}
          jira_api_token: ${{ secrets.JIRA_RELEASE_TOKEN }}
          jira_base_url: ${{ secrets.JIRA_BASE_URL }}
          release_number: ${{ inputs.release_number }}
          release_type: ${{ inputs.release_type }}
          release_scope: ${{ inputs.release_scope }}
          release_bundle_tag: ${{ steps.build_release_bundle_tag.outputs.new_release_bundle_tag }}
          release_branch: ${{ inputs.release_branch }}
          centreon_technique_pat: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
          major_version: ${{ steps.build_release_bundle_tag.outputs.major_version }}
