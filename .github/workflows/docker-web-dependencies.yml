name: docker-web-dependencies

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".version*"
      - '.github/docker/centreon-web/**/Dockerfile.dependencies'
  push:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
    paths:
      - ".version*"
      - '.github/docker/centreon-web/**/Dockerfile.dependencies'
  schedule:
    - cron: "0 2 * * 1-5"

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  dispatch-to-maintained-branches:
    if: ${{ github.run_attempt == 1 && github.event_name == 'schedule' && github.ref_name == 'develop' && github.repository == 'centreon/centreon' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - run: |
          NIGHTLY_TARGETS=("dev-23.10.x" "dev-24.04.x" "dev-24.10.x")
          for target in "${NIGHTLY_TARGETS[@]}"; do
            echo "[INFO] - Dispatching nightly run to $target branch."
            gh workflow run docker-web-dependencies.yml -r "$target"
          done
        shell: bash
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  get-environment:
    needs: [dependency-scan]
    if: github.repository == 'centreon/centreon'
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: centreon/www/install/insertBaseConf.sql

  dockerize:
    needs: [get-environment]
    if: ${{ needs.get-environment.outputs.skip_workflow == 'false' }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        distrib: [alma8, alma9, bookworm]
    steps:
      - name: Checkout sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Login to registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PUSH_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PUSH_TOKEN }}

      - name: Compute image tag
        id: image_tag
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
        run: |
          if [[ "$REF" == "develop" ]]; then
            echo "tag=develop-${MAJOR_VERSION}" >> $GITHUB_OUTPUT
            echo "additional_tag=develop" >> $GITHUB_OUTPUT
            # Keep major_version tag so dev-XX.YY.x E2E tests can still resolve their FROM image
            echo "major_version_tag=${MAJOR_VERSION}" >> $GITHUB_OUTPUT
          elif [[ "$REF" =~ ^dev-[0-9]+\.[0-9]+\.x$ ]]; then
            echo "tag=${MAJOR_VERSION}" >> $GITHUB_OUTPUT
            echo "additional_tag=" >> $GITHUB_OUTPUT
            echo "major_version_tag=" >> $GITHUB_OUTPUT
          else
            echo "tag=$REF" >> $GITHUB_OUTPUT
            echo "additional_tag=" >> $GITHUB_OUTPUT
            echo "major_version_tag=" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Compute docker tags
        id: docker_tags
        env:
          REGISTRY: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          DISTRIB: ${{ matrix.distrib }}
          TAG: ${{ steps.image_tag.outputs.tag }}
          ADDITIONAL: ${{ steps.image_tag.outputs.additional_tag }}
          MAJOR_VERSION_TAG: ${{ steps.image_tag.outputs.major_version_tag }}
        run: |
          WEB_DEPS="${REGISTRY}/centreon-web-dependencies-${DISTRIB}"
          WEB_DEPS_COLLECT="${REGISTRY}/centreon-web-dependencies-collect-${DISTRIB}"

          TAGS_DEPS="${WEB_DEPS}:${TAG}"
          TAGS_DEPS_COLLECT="${WEB_DEPS_COLLECT}:${TAG}"
          if [[ -n "$ADDITIONAL" ]]; then
            TAGS_DEPS="${TAGS_DEPS},${WEB_DEPS}:${ADDITIONAL}"
            TAGS_DEPS_COLLECT="${TAGS_DEPS_COLLECT},${WEB_DEPS_COLLECT}:${ADDITIONAL}"
          fi
          if [[ -n "$MAJOR_VERSION_TAG" ]]; then
            TAGS_DEPS="${TAGS_DEPS},${WEB_DEPS}:${MAJOR_VERSION_TAG}"
            TAGS_DEPS_COLLECT="${TAGS_DEPS_COLLECT},${WEB_DEPS_COLLECT}:${MAJOR_VERSION_TAG}"
          fi
          echo "tags_deps=${TAGS_DEPS}" >> $GITHUB_OUTPUT
          echo "tags_deps_collect=${TAGS_DEPS_COLLECT}" >> $GITHUB_OUTPUT
        shell: bash

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        if: |
          needs.get-environment.outputs.is_cloud == 'false' ||
          ! contains(fromJson('["testing", "stable"]'), needs.get-environment.outputs.stability) ||
          matrix.distrib != 'bookworm'
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
        with:
          file: .github/docker/centreon-web/${{ matrix.distrib }}/Dockerfile.dependencies
          target: web_dependencies
          context: .
          build-args: |
            "MAJOR_VERSION=${{ needs.get-environment.outputs.major_version }}"
            "IS_CLOUD=${{ needs.get-environment.outputs.is_cloud }}"
            "STABILITY=${{ needs.get-environment.outputs.stability }}"
          pull: true
          push: true
          tags: ${{ steps.docker_tags.outputs.tags_deps }}
          secrets: |
            "ARTIFACTORY_INTERNAL_REPO_USERNAME=${{ secrets.ARTIFACTORY_INTERNAL_REPO_USERNAME }}"
            "ARTIFACTORY_INTERNAL_REPO_PASSWORD=${{ secrets.ARTIFACTORY_INTERNAL_REPO_PASSWORD }}"

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        if: |
          needs.get-environment.outputs.is_cloud == 'false' ||
          ! contains(fromJson('["testing", "stable"]'), needs.get-environment.outputs.stability) ||
          matrix.distrib != 'bookworm'
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
        with:
          file: .github/docker/centreon-web/${{ matrix.distrib }}/Dockerfile.dependencies
          target: web_dependencies_collect
          context: .
          build-args: |
            "MAJOR_VERSION=${{ needs.get-environment.outputs.major_version }}"
            "IS_CLOUD=${{ needs.get-environment.outputs.is_cloud }}"
            "STABILITY=${{ needs.get-environment.outputs.stability }}"
          pull: false
          push: true
          tags: ${{ steps.docker_tags.outputs.tags_deps_collect }}
          secrets: |
            "ARTIFACTORY_INTERNAL_REPO_USERNAME=${{ secrets.ARTIFACTORY_INTERNAL_REPO_USERNAME }}"
            "ARTIFACTORY_INTERNAL_REPO_PASSWORD=${{ secrets.ARTIFACTORY_INTERNAL_REPO_PASSWORD }}"

  set-skip-label:
    needs: [get-environment, dockerize]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/set-pull-request-skip-label.yml
