name: cypress-ai-selection

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "centreon/**"
      - ".github/workflows/cypress-ai-selection.yml"

permissions:
  contents: read
  models: read

jobs:
  ai-cypress-selection:
    runs-on: ubuntu-24.04

    steps:
      - name: Detect relevant E2E specs
        id: detect
        uses: ./.github/actions/detect-e2e-test-list
        with:
          feature-directory: centreon/tests/e2e/features
          prompt-file: .github/prompts/select-features.prompt.yml
          model: openai/gpt-4.1
          max-tokens: '1000'
          github-token: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
