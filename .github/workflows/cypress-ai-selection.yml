name: cypress-ai-selection

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "centreon/**"
      - ".github/workflows/cypress-ai-selection.yml"

permissions:
  contents: read
  models: read

jobs:
  ai-cypress-selection:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Detect relevant E2E specs
        id: detect
        uses: ./.github/actions/e2e-test-list
        with:
          module_name: centreon
          feature_directory: tests/e2e/features
          use_ai: 'false'
          prompt_file: .github/prompts/select-features.prompt.yml
          github_token: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
