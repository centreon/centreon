name: cypress-ai-selection

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "centreon/**"
      - ".github/workflows/cypress-ai-selection.yml"

permissions:
  contents: read
  models: read

jobs:
  ai-cypress-selection:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # Checkout repository
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # -------------------------------
      # Detect changed files
      # -------------------------------
      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47.0.0

      - name: Check if there are changes
        id: check_changes
        run: |
          if [ -z "${{ steps.changed.outputs.all_changed_files }}" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "changed_files=${{ steps.changed.outputs.all_changed_files }}" >> $GITHUB_OUTPUT
          fi

      # -------------------------------
      # List available feature files
      # -------------------------------
      - name: List available feature files
        id: list_features
        run: |
          find centreon/tests/e2e/features -type f -name "*.feature" > all_features.txt
          echo "Available feature files:"
          cat all_features.txt

      # -------------------------------
      # AI inference (GitHub Models v2)
      # -------------------------------
      - name: Infer relevant feature files (AI)
        id: ai
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/ai-inference@334892bb203895caaed82ec52d23c1ed9385151e  # v2.0.4
        with:
          model: openai/gpt-4o-mini
          prompt-file: .github/ai-prompts/select-features.prompt.yml
          input: |
            changed_files: |
              ${{ steps.check_changes.outputs.changed_files }}
            available_features: |
              $(cat all_features.txt)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------
      # Validate AI output
      # -------------------------------
      - name: Validate AI output
        id: validate
        run: |
          echo "${{ steps.ai.outputs.response }}" > ai_raw.txt
          cat ai_raw.txt

          if grep -qx "NONE" ai_raw.txt; then
            echo "mode=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          VALID=""
          while read -r spec; do
            if [ -f "$spec" ]; then
              VALID="$VALID,$spec"
            fi
          done < ai_raw.txt

          if [ -z "$VALID" ]; then
            echo "mode=fallback" >> $GITHUB_OUTPUT
          else
            echo "mode=ai" >> $GITHUB_OUTPUT
            echo "specs=${VALID#,}" >> $GITHUB_OUTPUT

      # -------------------------------
      # Fallback mapping simple
      # -------------------------------
      - name: Fallback mapping
        id: fallback
        if: steps.validate.outputs.mode == 'fallback'
        run: |
          SPECS=""
          if echo "${{ steps.check_changes.outputs.changed_files }}" | grep -q "^centreon/tests/e2e/features/www/"; then
            SPECS="$SPECS,centreon/tests/e2e/features/www"
          fi
          if echo "${{ steps.check_changes.outputs.changed_files }}" | grep -q "^centreon/tests/e2e/features/widgets/"; then
            SPECS="$SPECS,centreon/tests/e2e/features/widgets"
          fi
          if [ -z "$SPECS" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=mapped" >> $GITHUB_OUTPUT
            echo "specs=${SPECS#,}" >> $GITHUB_OUTPUT

      # -------------------------------
      # Final decision
      # -------------------------------
      - name: Resolve final decision
        id: final
        run: |
          if [ "${{ steps.validate.outputs.mode }}" = "ai" ]; then
            echo "decision=AI" >> $GITHUB_OUTPUT
            echo "specs=${{ steps.validate.outputs.specs }}" >> $GITHUB_OUTPUT
          elif [ "${{ steps.fallback.outputs.mode }}" = "mapped" ]; then
            echo "decision=FALLBACK" >> $GITHUB_OUTPUT
            echo "specs=${{ steps.fallback.outputs.specs }}" >> $GITHUB_OUTPUT
          elif [ "${{ steps.validate.outputs.mode }}" = "skip" ]; then
            echo "decision=SKIP" >> $GITHUB_OUTPUT
          else
            echo "decision=FULL" >> $GITHUB_OUTPUT

      # -------------------------------
      # Summary
      # -------------------------------
      - name: Summary
        run: |
          echo "### Cypress AI Feature Selection Result" >> $GITHUB_STEP_SUMMARY
          echo "- Decision: ${{ steps.final.outputs.decision }}" >> $GITHUB_STEP_SUMMARY
          echo "- Specs: ${{ steps.final.outputs.specs || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
