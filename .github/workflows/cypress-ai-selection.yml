name: cypress-ai-selection

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "centreon/**"
      - ".github/workflows/cypress-ai-selection.yml"

permissions:
  contents: read
  models: read

jobs:
  ai-cypress-selection:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # Checkout (FULL history required)
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------
      # Compute git diff (SAFE)
      # -------------------------------
      - name: Compute git diff
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.sha }}"
            DIFF=$(git diff "$BASE_SHA...$HEAD_SHA")
          else
            # workflow_dispatch fallback
            DIFF=$(git diff HEAD~1)
          fi

          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # -------------------------------
      # List all feature files
      # -------------------------------
      - name: List available feature files
        id: features
        run: |
          find centreon/tests/e2e/features -type f -name "*.feature" > all_features.txt
          echo "features<<EOF" >> $GITHUB_OUTPUT
          cat all_features.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # -------------------------------
      # AI inference
      # -------------------------------
      - name: Infer relevant feature files (AI)
        id: ai
        if: steps.diff.outputs.diff != ''
        uses: actions/ai-inference@v2
        with:
          model: openai/gpt-4.1
          prompt-file: .github/prompts/select-features.prompt.md
          input: |
            Git diff:
            ```
            ${{ steps.diff.outputs.diff }}
            ```

            Available feature files:
            ```
            ${{ steps.features.outputs.features }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.CENTREON_TECHNIQUE_PAT }}

      # -------------------------------
      # Validate AI output
      # -------------------------------
      - name: Validate AI output
        id: validate
        if: steps.diff.outputs.diff != ''
        run: |
          echo '${{ steps.ai.outputs.result }}' > ai.json
          cat ai.json

          if ! jq -e . ai.json >/dev/null; then
            echo "mode=fallback" >> $GITHUB_OUTPUT
            exit 0
          fi

          VALID=$(jq -r '.[]' ai.json | while read f; do
            [ -f "$f" ] && echo "$f"
          done | paste -sd "," -)

          if [ -z "$VALID" ]; then
            echo "mode=fallback" >> $GITHUB_OUTPUT
          else
            echo "mode=ai" >> $GITHUB_OUTPUT
            echo "specs=$VALID" >> $GITHUB_OUTPUT
          fi

      # -------------------------------
      # Fallback mapping
      # -------------------------------
      - name: Fallback mapping
        id: fallback
        if: steps.validate.outputs.mode == 'fallback'
        run: |
          SPECS=""
          if echo "${{ steps.diff.outputs.diff }}" | grep -q "www/"; then
            SPECS="$SPECS,centreon/tests/e2e/features/www"
          fi
          if echo "${{ steps.diff.outputs.diff }}" | grep -q "widgets/"; then
            SPECS="$SPECS,centreon/tests/e2e/features/widgets"
          fi

          if [ -z "$SPECS" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=mapped" >> $GITHUB_OUTPUT
            echo "specs=${SPECS#,}" >> $GITHUB_OUTPUT
          fi

      # -------------------------------
      # Final decision
      # -------------------------------
      - name: Resolve final decision
        id: final
        run: |
          if [ "${{ steps.validate.outputs.mode }}" = "ai" ]; then
            echo "decision=AI" >> $GITHUB_OUTPUT
            echo "specs=${{ steps.validate.outputs.specs }}" >> $GITHUB_OUTPUT
          elif [ "${{ steps.fallback.outputs.mode }}" = "mapped" ]; then
            echo "decision=FALLBACK" >> $GITHUB_OUTPUT
            echo "specs=${{ steps.fallback.outputs.specs }}" >> $GITHUB_OUTPUT
          else
            SPECS=$(cat all_features.txt | paste -sd "," -)
            echo "decision=FULL" >> $GITHUB_OUTPUT
            echo "specs=$SPECS" >> $GITHUB_OUTPUT
          fi

      # -------------------------------
      # Step Summary
      # -------------------------------
      - name: Summary
        run: |
          echo "### Cypress AI Feature Selection Result" >> $GITHUB_STEP_SUMMARY
          echo "- Decision: ${{ steps.final.outputs.decision }}" >> $GITHUB_STEP_SUMMARY
          echo "- Specs: ${{ steps.final.outputs.specs || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
