name: cypress-ai-selection

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "centreon/**"
      - ".github/workflows/cypress-ai-selection.yml"

permissions:
  contents: read
  models: read

jobs:
  ai-cypress-selection:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # Checkout (FULL history required)
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62

      - name: Check if there are changes
        id: check_changes
        run: |
          if [ -z "${{ steps.changed.outputs.all_changed_files }}" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "changed_files=${{ steps.changed.outputs.all_changed_files }}" >> $GITHUB_OUTPUT
            CHANGED_JSON=$(printf '%s\n' "${{ steps.changed.outputs.all_changed_files }}" | jq -R -s -c 'split("\n")[:-1]')
            echo "changed_files_json=$CHANGED_JSON" >> $GITHUB_OUTPUT
          fi

      # -------------------------------
      # List all feature files
      # -------------------------------
      - name: List available feature files
        id: features
        run: |
          find centreon/tests/e2e/features -type f -name "*.feature" > all_features.txt
          FEATURES_JSON=$(cat all_features.txt | jq -R -s -c 'split("\n")[:-1]')
          echo "features_json=$FEATURES_JSON" >> $GITHUB_OUTPUT

      # -------------------------------
      # AI inference
      # -------------------------------
      - name: Infer relevant feature files (AI)
        id: ai
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/ai-inference@334892bb203895caaed82ec52d23c1ed9385151e # v2.0.4
        with:
          model: openai/gpt-4.1
          prompt-file: .github/prompts/select-features.prompt.yml
          input: |
            {
              "changed_files": ${{ steps.check_changes.outputs.changed_files_json }},
              "available_features": ${{ steps.features.outputs.features_json }}
            }
        env:
          GITHUB_TOKEN: ${{ secrets.CENTREON_TECHNIQUE_PAT }}  # PAT avec repo + workflow

      # -------------------------------
      # Validate AI output
      # -------------------------------
      - name: Validate AI output
        id: validate
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          cat <<EOF > ai.json
${{ steps.ai.outputs.response }}
EOF
          cat ai.json

          if ! jq -e 'type == "object" and has("specs") and (.specs | type == "array")' ai.json >/dev/null 2>&1; then
            echo "mode=fallback" >> $GITHUB_OUTPUT
            exit 0
          fi

          VALID=$(jq -r '.specs[]?' ai.json | while read f; do
            [ -f "$f" ] && echo "$f"
          done | paste -sd "," -)

          if [ -z "$VALID" ]; then
            echo "mode=fallback" >> $GITHUB_OUTPUT
          else
            echo "mode=ai" >> $GITHUB_OUTPUT
            echo "specs=$VALID" >> $GITHUB_OUTPUT
          fi


      # -------------------------------
      # Fallback mapping
      # -------------------------------
      - name: Fallback mapping
        id: fallback
        if: steps.validate.outputs.mode == 'fallback'
        run: |
          SPECS=""
          if echo "${{ steps.diff.outputs.diff }}" | grep -q "www/"; then
            SPECS="$SPECS,centreon/tests/e2e/features/www"
          fi
          if echo "${{ steps.diff.outputs.diff }}" | grep -q "widgets/"; then
            SPECS="$SPECS,centreon/tests/e2e/features/widgets"
          fi

          if [ -z "$SPECS" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=mapped" >> $GITHUB_OUTPUT
            echo "specs=${SPECS#,}" >> $GITHUB_OUTPUT
          fi

      # -------------------------------
      # Final decision
      # -------------------------------
      - name: Resolve final decision
        id: final
        run: |
          if [ "${{ steps.validate.outputs.mode }}" = "ai" ]; then
            echo "decision=AI" >> $GITHUB_OUTPUT
            echo "specs=${{ steps.validate.outputs.specs }}" >> $GITHUB_OUTPUT
          elif [ "${{ steps.fallback.outputs.mode }}" = "mapped" ]; then
            echo "decision=FALLBACK" >> $GITHUB_OUTPUT
            echo "specs=${{ steps.fallback.outputs.specs }}" >> $GITHUB_OUTPUT
          else
            SPECS=$(cat all_features.txt | paste -sd "," -)
            echo "decision=FULL" >> $GITHUB_OUTPUT
            echo "specs=$SPECS" >> $GITHUB_OUTPUT
          fi

      # -------------------------------
      # Step Summary
      # -------------------------------
      - name: Summary
        run: |
          echo "### Cypress AI Feature Selection Result" >> $GITHUB_STEP_SUMMARY
          echo "- Decision: ${{ steps.final.outputs.decision }}" >> $GITHUB_STEP_SUMMARY
          echo "- Specs: ${{ steps.final.outputs.specs || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
