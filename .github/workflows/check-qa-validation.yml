name: check-qa-validation

concurrency:
  group: ${{ github.workflow }}-${{ github.event.action }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [develop, 'dev-[2-9][0-9].[0-9][0-9].x', master, '[2-9][0-9].[0-9][0-9].x', 'hotfix-*', 'release-*']
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

jobs:
  check-qa-validation:
    if: ${{ ! github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      statuses: write        # post commit statuses
      issues: write          # remove stale qa-approved label
      pull-requests: read    # read timeline

    steps:
      - name: Evaluate QA validation state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_ACTION: ${{ github.event.action }}
        with:
          script: |
            const qaApprovedLabel = 'qa-approved';
            const statusContext = 'qa/validation';
            const headSha = context.payload.pull_request.head.sha;

            const setStatus = (state, description) =>
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                context: statusContext,
                state,          // 'pending' | 'success'
                description,
              });

            // Labels are in the event payload; no checkout needed
            let labels = context.payload.pull_request.labels.map(l => l.name);

            // Stale approval: new commits invalidate the QA label
            if (labels.includes(qaApprovedLabel)) {
              if (process.env.EVENT_ACTION === 'synchronize') {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    name: qaApprovedLabel,
                  });
                  labels = labels.filter(l => l !== qaApprovedLabel);
                  core.notice(`label ${qaApprovedLabel} removed because changes have been pushed.`);
                } catch (e) {
                  core.warning(`failed to remove label: ${e}`);
                }
              } else {
                await setStatus('success', 'Approved by the QA team');
                return;
              }
            }

            // Same team-detection logic as before
            const getRequestedTeamsFromTimeline = async (page) => {
              const timeline = await github.rest.issues.listEventsForTimeline({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
                page,
              });
              return timeline.data
                .filter(e => e.event === 'review_requested' && e?.requested_team?.name)
                .map(e => e.requested_team.name);
            };

            const teamsWithQaApproval = ['owners-php', 'owners-react', 'owners-cpp'];
            let needsQaApproval = false;
            try {
              let teams = await getRequestedTeamsFromTimeline(1);
              if (teams.length === 0) teams = await getRequestedTeamsFromTimeline(2);
              if (teams.length === 0) {
                core.warning('No requested teams found; assuming QA approval is needed.');
                needsQaApproval = true;
              }
              needsQaApproval ||= teams.some(t => teamsWithQaApproval.includes(t));
            } catch (e) {
              core.warning(`failed to list required reviewers: ${e}`);
              needsQaApproval = true;
            }

            if (needsQaApproval) {
              await setStatus('pending', `Waiting for QA — add the "${qaApprovedLabel}" label`);
            } else {
              await setStatus('success', 'QA approval not required for this PR');
            }