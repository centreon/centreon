name: clean-npm-tags

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5"

jobs:
  dependency-scan:
    permissions:
      contents: read
      pull-requests: write
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  clean-npm-tags:
    needs: [dependency-scan]
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Install action dependencies
        run: |
          pnpm install \
            --frozen-lockfile \
            --config.trustPolicy=no-downgrade \
            --config.minimumReleaseAge=2880 \
            --config.blockExoticSubdeps=true
        working-directory: ./.github/actions/clean-up-npm-tags
        shell: bash

      - uses: ./.github/actions/clean-up-npm-tags
        with:
          npm_token: ${{ secrets.NPM_TOKEN }}
