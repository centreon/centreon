# HACK(MON-212212): temporary end-to-end test of promote-docker-to-pulp-dev,
# triggered by a test-MON-212212-* tag (OIDC ref refs/tags/*, matching the
# Pulp dev grant). REMOVE BEFORE MERGE.
name: HACK test pulp promote

on:
  push:
    tags:
      - "test-MON-212212-*"

permissions:
  contents: read

jobs:
  test-promote-pulp-dev:
    runs-on: centreon-ubuntu-26.04-small
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        component: [centreon-snmptrapd, centreon-centreontrapd]
    env:
      HARBOR_IMAGE: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ matrix.component }}-trixie
      PULP_IMAGE: registry-dev.int.centreon.com/default/centreon/${{ matrix.component }}
      TEST_TAG: test-pr-12059
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to Harbor registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.1

      - name: Pick latest version candidate on Harbor
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          tag=$(crane ls "$HARBOR_IMAGE" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          echo "version tags: $(crane ls "$HARBOR_IMAGE" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tr '\n' ' ')"
          if [[ -z "$tag" ]]; then
            echo "::error::no X.Y.Z candidate on $HARBOR_IMAGE"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Promote to Pulp dev
        id: promote-pulp-dev
        uses: ./.github/actions/promote-docker-image
        with:
          source_image: ${{ env.HARBOR_IMAGE }}
          source_tag: ${{ steps.pick.outputs.tag }}
          dest_image: ${{ env.PULP_IMAGE }}
          dest_tags: ${{ env.TEST_TAG }}
          pulp_oidc_audience: https://pulp.dev.centreon.io

      - name: Attest SBOM
        uses: ./.github/actions/attest-image-sbom
        with:
          subject_name: ghcr.io/centreon/${{ matrix.component }}
          digest: ${{ steps.promote-pulp-dev.outputs.digest }}
          scan_image: ${{ env.HARBOR_IMAGE }}
          amd64_digest: ${{ steps.promote-pulp-dev.outputs.amd64_digest }}
          arm64_digest: ${{ steps.promote-pulp-dev.outputs.arm64_digest }}

      - name: Verify digests and attestations
        if: always() && steps.promote-pulp-dev.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.promote-pulp-dev.outputs.digest }}
          SOURCE_TAG: ${{ steps.pick.outputs.tag }}
        shell: bash
        run: |
          echo "harbor ${SOURCE_TAG}: $(crane digest "$HARBOR_IMAGE:$SOURCE_TAG")"
          echo "pulp   ${TEST_TAG}: $(crane digest "$PULP_IMAGE:$TEST_TAG" || true)"
          echo "promoted digest: $DIGEST"
          crane manifest "$PULP_IMAGE:$TEST_TAG" | jq -c '[.mediaType, [.manifests[].platform.architecture]]' || true
          for pt in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
            echo "== $pt"
            gh attestation verify "oci://$PULP_IMAGE:$TEST_TAG" --owner centreon --predicate-type "$pt" --format json \
              | jq -r '.[].verificationResult.signature.certificate | "\(.buildSignerURI | sub("@.*";"")) @ \(.sourceRepositoryRef)"' \
              | sort | uniq -c || true
          done
