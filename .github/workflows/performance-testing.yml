name: Performance Testing

on:
  workflow_dispatch:
    inputs:
      jmeter_test_file:
        description: 'Select JMeter test file to run (from jmeterFolder)'
        required: true
        type: choice
        options:
          - Centreon_API_Test_Plan.jmx
      jmeter_domain:
        description: 'Domain for JMeter tests (e.g., localhost)'
        required: true
        type: string
      jmeter_port:
        description: 'Port for JMeter tests (e.g., 4000)'
        required: false
        type: string
      jmeter_protocol:
        description: 'Protocol for JMeter tests (e.g., http)'
        required: true
        type: string
      api_prefix:
        description: 'API prefix to insert before /api/latest/configuration in the JMX file'
        required: true
        type: string
      number_of_users:
        description: 'Number of users for the test (affects .env file)'
        required: true
        type: string
      ramp_time:
        description: 'Ramp-up time (in seconds)'
        required: true

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  performance-test:
    # needs: [dependency-scan]
    runs-on: centreon-perf-testing
    defaults:
      run:
        shell: bash
        working-directory: centreon/tests/performance

    env:
      CSV_FILE_PATH: users.csv

    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java (OpenJDK 17)
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e  # v5.1.0
