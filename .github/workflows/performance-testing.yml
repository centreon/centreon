      - name: Install JMeter and WebDriver
        run: |
          echo "🚀 Téléchargement de JMeter (format tgz pour la rapidité)"
          curl -L https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz | tar -xz

          # Définir JMETER_HOME de manière absolue
          export JMETER_HOME=$(pwd)/apache-jmeter-5.6.3
          echo "JMETER_HOME=$JMETER_HOME" >> $GITHUB_ENV

          echo "🚀 Téléchargement sécurisé des outils de gestion"
          # -L est crucial pour suivre les redirections de jmeter-plugins.org
          curl -L https://repo1.maven.org/maven2/kg/apc/cmdrunner/2.2/cmdrunner-2.2.jar -o $JMETER_HOME/lib/cmdrunner.jar
          curl -L https://jmeter-plugins.org/get/ -o $JMETER_HOME/lib/ext/jmeter-plugins-manager.jar

          echo "🔍 Vérification de la taille des fichiers téléchargés"
          ls -lh $JMETER_HOME/lib/cmdrunner.jar
          ls -lh $JMETER_HOME/lib/ext/jmeter-plugins-manager.jar

          echo "🚀 Installation automatique de WebDriver et ses 20+ dépendances"
          cd $JMETER_HOME
          # Utilisation du Classpath absolu pour éviter le ClassNotFound
          java -cp "lib/ext/jmeter-plugins-manager.jar:lib/cmdrunner.jar" \
            org.jmeterplugins.repository.PluginManagerCMD install jpgc-webdriver,jpgc-dummy

          echo "✅ Installation terminée."

      - name: Install ChromeDriver for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          mkdir -p $GITHUB_WORKSPACE/centreon/tests/performance/chrome_driver
          cd $GITHUB_WORKSPACE/centreon/tests/performance/chrome_driver
          # On utilise une version stable connue pour Linux
          wget -q https://storage.googleapis.com/chrome-for-testing-public/121.0.6167.85/linux64/chromedriver-linux64.zip
          unzip chromedriver-linux64.zip
          mv chromedriver-linux64/chromedriver .
          chmod +x chromedriver
          echo "CHROME_DRIVER_PATH=$(pwd)/chromedriver" >> $GITHUB_ENV

      - name: Display inputs
        run: |
          echo "Test jmeter_domain value is: ${{ github.event.inputs.jmeter_domain }}"
          echo "Test jmeter_port value is: ${{ github.event.inputs.jmeter_port }}"
          echo "Test jmeter_protocol value is: ${{ github.event.inputs.jmeter_protocol }}"
          echo "Test api_prefix value is: ${{ github.event.inputs.api_prefix }}"
          echo "Test number_of_users value is: ${{ github.event.inputs.number_of_users }}"
          echo "Test ramp_time value is: ${{ github.event.inputs.ramp_time }}"

      - name: Update .env with input number of users
        run: |
          ENV_FILE="$GITHUB_WORKSPACE/centreon/tests/performance/.env"

          echo "Updating NUMBER_OF_USERS in $ENV_FILE"
          sed -i "s/^NUMBER_OF_USERS=.*/NUMBER_OF_USERS=${{ github.event.inputs.number_of_users }}/" "$ENV_FILE"

          echo "Updated .env file content:"
          cat "$ENV_FILE"

      - name: Update JMeter .jmx with inputs
        run: |
          echo "Updating JMeter configuration with inputs..."

          JMX_FILES=$GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/*.jmx

          for JMX_FILE in $JMX_FILES; do
            echo "Updating $JMX_FILE with inputs..."

            if [[ -n "${{ github.event.inputs.jmeter_port }}" ]]; then
                sed -i "s|<stringProp name=\"HTTPSampler.port\">.*</stringProp>|<stringProp name=\"HTTPSampler.port\">${{ github.event.inputs.jmeter_port }}</stringProp>|g" $JMX_FILE
            else
              sed -i "s|<stringProp name=\"HTTPSampler.port\">.*</stringProp>|<stringProp name=\"HTTPSampler.port\"></stringProp>|g" $JMX_FILE
            fi

            sed -i "s|<stringProp name=\"HTTPSampler.domain\">.*</stringProp>|<stringProp name=\"HTTPSampler.domain\">${{ github.event.inputs.jmeter_domain }}</stringProp>|g" $JMX_FILE
            sed -i "s|<stringProp name=\"HTTPSampler.protocol\">.*</stringProp>|<stringProp name=\"HTTPSampler.protocol\">${{ github.event.inputs.jmeter_protocol }}</stringProp>|g" $JMX_FILE
            sed -i 's|\(<stringProp name="HTTPSampler.path">/\)[^/]*/api/latest|\1${{ github.event.inputs.api_prefix }}/api/latest|g' "$JMX_FILE"
            sed -i "s|<intProp name=\"ThreadGroup.num_threads\">.*</intProp>|<intProp name=\"ThreadGroup.num_threads\">${{ github.event.inputs.number_of_users }}</intProp>|g" "$JMX_FILE"
            sed -i "s|<intProp name=\"ThreadGroup.ramp_time\">.*</intProp>|<intProp name=\"ThreadGroup.ramp_time\">${{ github.event.inputs.ramp_time }}</intProp>|g" "$JMX_FILE"

            echo "Updated $JMX_FILE:"
            cat $JMX_FILE
          done

      - name: Inject Data into database
        run: node injectData.mjs

      - name: Display users.csv content
        run: |
            echo "Displaying contents of users.csv..."
            cat $GITHUB_WORKSPACE/centreon/tests/performance/users.csv


      - name: Run JMX Scripts
        run: |
            JMETER_BIN=$(ls -d $GITHUB_WORKSPACE/centreon/tests/performance/apache-jmeter-*/bin)
            cd $JMETER_BIN

            # Création des dossiers
            mkdir -p $GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/jmeter_results
            mkdir -p $GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/jmeter_logs
            mkdir -p $GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/jmeter_html_report

            JMX_FILE=$GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/${{ github.event.inputs.jmeter_test_file }}

            if [ ! -f "$JMX_FILE" ]; then
              echo "❌ Selected JMX file does not exist: $JMX_FILE"
              exit 1
            fi

            RESULTS_FILE="$GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/jmeter_results/results_$(basename "$JMX_FILE" .jmx).jtl"
            LOG_FILE="$GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/jmeter_logs/jmeter_$(basename "$JMX_FILE" .jmx).log"
            HTML_REPORT_DIR="$GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/jmeter_html_report/$(basename "$JMX_FILE" .jmx)"

            # Exécution du test JMeter
            ./jmeter -n -t "$JMX_FILE" \
              -Jusers_csv_path="$GITHUB_WORKSPACE/centreon/tests/performance/users.csv" \
              -Jchrome_driver_path="$GITHUB_WORKSPACE/centreon/tests/performance/chrome_driver/chromedriver" \
              -l "$RESULTS_FILE" \
              -j "$LOG_FILE" \
              -LDEBUG

            # Génération du rapport HTML
            ./jmeter -g "$RESULTS_FILE" -o "$HTML_REPORT_DIR"

      - name: Upload JMeter results
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jmeter-results
          path: centreon/tests/performance/jmeterFolder/jmeter_results

      - name: Upload JMeter HTML Reports
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jmeter-html-reports
          path: centreon/tests/performance/jmeterFolder/jmeter_html_report

      - name: Upload JMeter logs
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jmeter-logs
          path: centreon/tests/performance/jmeterFolder/jmeter_logs/*

      - name: Display HTML Report in GitHub Summary
        if: success()
        run: |
          echo "Looking for JTL files..."
          ls -la $GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/jmeter_results

          NUMBER_OF_USERS="${{ github.event.inputs.number_of_users }}"
          RAMP_TIME="${{ github.event.inputs.ramp_time }}"

          echo "<h2>📊 JMeter Test Results</h2>" >> $GITHUB_STEP_SUMMARY
          echo "<p>👥 <strong>Number of users :</strong> $NUMBER_OF_USERS</p>" >> $GITHUB_STEP_SUMMARY
          echo "<p>⏳ <strong> Ramp-Up Time (seconds) :</strong> $RAMP_TIME</p>" >> $GITHUB_STEP_SUMMARY

          # Boucle sur chaque fichier JTL
          for JTL_FILE in $GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/jmeter_results/*.jtl; do

              echo "Found JTL file: $JTL_FILE"

              if [ ! -f "$JTL_FILE" ]; then
                  echo "Error: No JTL file found!"
                  exit 1
              fi

              # En-tête du tableau
              echo "<table style='width:100%; border-collapse: collapse; border: 1px solid #ddd; text-align: left;'>" >> $GITHUB_STEP_SUMMARY
              echo "<thead><tr><th>Timestamp</th><th>Elapsed (ms)</th><th>Label</th><th>Response Code</th><th>Response Message</th><th>Thread Name</th><th>Success</th><th>Bytes</th><th>Latency (ms)</th></tr></thead>" >> $GITHUB_STEP_SUMMARY
              echo "<tbody>" >> $GITHUB_STEP_SUMMARY

              line_counter=0

              while IFS=',' read -r timestamp elapsed label response_code response_message thread_name data_type success failure_message bytes sent_bytes grp_threads all_threads url latency idle_time connect
              do
                  if [ "$timestamp" == "timeStamp" ]; then
                      continue
                  fi

                  line_counter=$((line_counter + 1))

                  if [ "$line_counter" -gt 5 ]; then
                      break
                  fi

                  if [ "$success" == "true" ]; then
                      success_icon="🟢"
                  else
                      success_icon="🚨"
                  fi

                  if [[ "$latency" == "null" || "$latency" == "0" || -z "$latency" ]]; then
                      latency="N/A"
                  fi

                  echo "<tr><td>$timestamp</td><td>$elapsed</td><td>$label</td><td>✅ $response_code</td><td>$response_message</td><td>$thread_name</td><td>$success_icon</td><td>$bytes</td><td>$latency</td></tr>" >> $GITHUB_STEP_SUMMARY
              done < "$JTL_FILE"

              if [ "$line_counter" -gt 5 ]; then
                  echo "<tr><td colspan='9' style='color: red;'> ℹ️ Please refer to the artifact for more details.</td></tr>" >> $GITHUB_STEP_SUMMARY
              fi

              echo "</tbody></table>" >> $GITHUB_STEP_SUMMARY
          done

      - name: Cleaning up database
        if: success()
        run: node cleaningUpData.mjs

      - name: Install python3.11-venv
        if: success()
        run: sudo apt-get update && sudo apt-get install -y python3.11-venv

      - name: Set up Python Virtual Environment
        if: success()
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install pandas

      - name: Run Pandas Analysis
        if: success()
        run: |
          source .venv/bin/activate
          if [[ -f analyze_results.py ]]; then
              python3 analyze_results.py >> $GITHUB_STEP_SUMMARY || true
          else
            echo "❌ analyze_results.py not found!" >> $GITHUB_STEP_SUMMARY
            exit 0  # ou `true` pour ne pas faire échouer
          fi
