name: Performance Testing

on:
  workflow_dispatch:
    inputs:
      jmeter_test_file:
        description: 'Select JMeter test file to run (from jmeterFolder)'
        required: true
        type: choice
        options:
          - Centreon_API_Test Plan.jmx
      jmeter_domain:
        description: 'Domain for JMeter tests (e.g., localhost)'
        required: true
        type: string
      jmeter_port:
        description: 'Port for JMeter tests (e.g., 4000)'
        required: false
        type: string
      jmeter_protocol:
        description: 'Protocol for JMeter tests (e.g., http)'
        required: true
        type: string
      api_prefix:
        description: 'API prefix to insert before /api/latest/configuration'
        required: true
        type: string
      number_of_users:
        description: 'Number of users for the test'
        required: true
        type: string
      ramp_time:
        description: 'Ramp-up time (in seconds)'
        required: true

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  performance-test:
    needs: [dependency-scan]
    runs-on: centreon-perf-testing
    defaults:
      run:
        shell: bash
        working-directory: centreon/tests/performance

    env:
      CSV_FILE_PATH: users.csv

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ================================
      # 🔥 Selenium stack
      # ================================
      - name: Install Chrome, ChromeDriver and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver xvfb

          echo "Versions:"
          chromium-browser --version || true
          chromedriver --version || true

      - name: Install Required Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget curl

      - name: Display inputs
        run: |
          echo "Domain: ${{ github.event.inputs.jmeter_domain }}"
          echo "Port: ${{ github.event.inputs.jmeter_port }}"
          echo "Protocol: ${{ github.event.inputs.jmeter_protocol }}"
          echo "API Prefix: ${{ github.event.inputs.api_prefix }}"
          echo "Users: ${{ github.event.inputs.number_of_users }}"
          echo "Ramp time: ${{ github.event.inputs.ramp_time }}"

      - name: Update .env with input number of users
        run: |
          ENV_FILE="$GITHUB_WORKSPACE/centreon/tests/performance/.env"
          sed -i "s/^NUMBER_OF_USERS=.*/NUMBER_OF_USERS=${{ github.event.inputs.number_of_users }}/" "$ENV_FILE"
          cat "$ENV_FILE"

      # ================================
      # 🔧 Patch JMX files
      # ================================
      - name: Update JMeter .jmx with inputs
        run: |
          JMX_FILES=$GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/*.jmx

          for JMX_FILE in $JMX_FILES; do
            echo "Updating $JMX_FILE"

            if [[ -n "${{ github.event.inputs.jmeter_port }}" ]]; then
                sed -i "s|<stringProp name=\"HTTPSampler.port\">.*</stringProp>|<stringProp name=\"HTTPSampler.port\">${{ github.event.inputs.jmeter_port }}</stringProp>|g" $JMX_FILE
            else
              sed -i "s|<stringProp name=\"HTTPSampler.port\">.*</stringProp>|<stringProp name=\"HTTPSampler.port\"></stringProp>|g" $JMX_FILE
            fi

            sed -i "s|<stringProp name=\"HTTPSampler.domain\">.*</stringProp>|<stringProp name=\"HTTPSampler.domain\">${{ github.event.inputs.jmeter_domain }}</stringProp>|g" $JMX_FILE
            sed -i "s|<stringProp name=\"HTTPSampler.protocol\">.*</stringProp>|<stringProp name=\"HTTPSampler.protocol\">${{ github.event.inputs.jmeter_protocol }}</stringProp>|g" $JMX_FILE
            sed -i 's|\(<stringProp name="HTTPSampler.path">/\)[^/]*/api/latest|\1${{ github.event.inputs.api_prefix }}/api/latest|g' "$JMX_FILE"
            sed -i "s|<intProp name=\"ThreadGroup.num_threads\">.*</intProp>|<intProp name=\"ThreadGroup.num_threads\">${{ github.event.inputs.number_of_users }}</intProp>|g" "$JMX_FILE"
            sed -i "s|<intProp name=\"ThreadGroup.ramp_time\">.*</intProp>|<intProp name=\"ThreadGroup.ramp_time\">${{ github.event.inputs.ramp_time }}</intProp>|g" "$JMX_FILE"

            # 🔥 Selenium driver path fix
            sed -i 's|C:\\\\.*chromedriver.exe|/usr/bin/chromedriver|g' "$JMX_FILE"
          done

      - name: Inject Data into database
        run: node injectData.mjs

      - name: Install JMeter
        run: |
          JMETER_VERSION=$(curl -s https://downloads.apache.org/jmeter/binaries/ | grep -oP 'apache-jmeter-\d+\.\d+\.\d+\.zip' | sort -V | tail -n 1 | sed 's/apache-jmeter-\(.*\).zip/\1/')
          wget -q "https://downloads.apache.org/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.zip" -O jmeter.zip
          unzip -q jmeter.zip
          rm jmeter.zip

      # ================================
      # 🔌 JMeter plugins + WebDriver
      # ================================
      - name: Install JMeter Plugins + WebDriver
        run: |
          JMETER_DIR=$(ls -d $GITHUB_WORKSPACE/centreon/tests/performance/apache-jmeter-*/)
          cd $JMETER_DIR || exit 1

          # Plugin manager
          wget -q https://jmeter-plugins.org/get/
          mv get/PluginsManager.jar lib/ext/

          # Plugins
          java -jar lib/ext/PluginsManager.jar install webdriver
          java -jar lib/ext/PluginsManager.jar install jpgc-dummy

      # ================================
      # 🚀 Run JMeter (headless + Selenium)
      # ================================
      - name: Run JMX Scripts (Headless Selenium)
        run: |
          JMETER_BIN=$(ls -d $GITHUB_WORKSPACE/centreon/tests/performance/apache-jmeter-*/bin)
          cd $JMETER_BIN

          mkdir -p $GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/jmeter_results
          mkdir -p $GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/jmeter_html_report

          JMX_FILE=$GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/${{ github.event.inputs.jmeter_test_file }}

          xvfb-run -a ./jmeter -n -t "$JMX_FILE" \
            -Jusers_csv_path="$GITHUB_WORKSPACE/centreon/tests/performance/users.csv" \
            -l "$GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/jmeter_results/results_$(basename "$JMX_FILE" .jmx).jtl" \
            -j "$GITHUB_WORKSPACE/centreon/tests/performance/jmeterFolder/jmeter_results/jmeter_$(basename "$JMX_FILE" .jmx).log" \
            -LINFO

      # ================================
      # 📦 Artifacts
      # ================================
      - name: Upload JMeter results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: centreon/tests/performance/jmeterFolder/jmeter_results

      - name: Upload JMeter HTML Reports
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-reports
          path: centreon/tests/performance/jmeterFolder/jmeter_html_report
