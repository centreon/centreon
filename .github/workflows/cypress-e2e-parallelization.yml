name: cypress-e2e-test

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      module_name:
        required: true
        type: string
      database_image:
        required: true
        type: string
      image_name:
        required: true
        type: string
      os:
        required: true
        type: string
      features_path:
        required: true
        type: string
      major_version:
        required: true
        type: string
      minor_version:
        required: true
        type: string
      stability:
        required: true
        type: string
      target_stability:
        required: false
        type: string
      package_cache_key:
        required: false
        type: string
      package_directory:
        required: false
        type: string
      test_tags:
        required: false
        type: string
        default: "not @ignore"
      dependencies_lock_file:
        required: true
        type: string
        description: "The frontend dependencies lock file path"
      xray_keys_and_ids:
        description: "The test execution and the test plan keys and ids"
        required: true
        type: string
      is_cloud:
        description: "Define if the version is targeting cloud"
        required: false
        type: string # Set as string instead of boolean to avoid mixing types between workflows and actions
        default: 'false'
      is_nightly:
        required: true
        type: string
      labels:
        description: "The list of PR labels"
        required: false
        type: string
        default: ''
    secrets:
      registry_username:
        required: true
      registry_password:
        required: true
      xray_client_id:
        required: true
      xray_client_secret:
        required: true
      jira_base_url:
        required: true
      jira_user_email:
        required: true
      jira_api_token:
        required: true
      github_models_token:
        required: true

jobs:
  cypress-e2e-test-list:
    runs-on: ubuntu-24.04
    outputs:
      features: ${{ steps.list-features.outputs.specs }}
      has_features: ${{ steps.list-features.outputs.specs != '' && toJson(fromJson(steps.list-features.outputs.specs)) != '[]' && 'true' || 'false' }}
      db_id: ${{ steps.get-db-id.outputs.db_id }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get database identifier
        id: get-db-id
        run: |
          db_id=$(echo "$DATABASE_IMAGE" | sed 's|.*/||' | tr ':' '-')
          echo "db_id=$db_id" >> $GITHUB_OUTPUT
        env:
          DATABASE_IMAGE: ${{ inputs.database_image }}

      - name: Detect relevant E2E specs
        id: list-features
        uses: ./.github/actions/e2e-test-list
        with:
          module_name: ${{ inputs.module_name }}
          feature_directory: ${{ inputs.features_path }}
          tags: ${{ inputs.test_tags }}
          use_ai: ${{ contains(inputs.labels, 'experimental-ai-e2e-test-list-generation') && 'true' || 'false' }}
          github_token: ${{ secrets.github_models_token }}

  cypress-e2e-test-run:
    if: ${{ needs.cypress-e2e-test-list.outputs.features != '' && toJson(fromJson(needs.cypress-e2e-test-list.outputs.features)) != '[]' }}
    needs: [cypress-e2e-test-list]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJson(needs.cypress-e2e-test-list.outputs.features) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
    name: ${{ matrix.feature }}

    env:
      WORKING_DIRECTORY: ${{ inputs.module_name }}/tests/e2e
      SLIM_IMAGE_NAME: ${{ inputs.image_name }}-slim-${{ inputs.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compute image tag
        id: image_tag
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          MAJOR_VERSION: ${{ inputs.major_version }}
        run: |
          if [[ "$REF" == "develop" ]]; then
            echo "tag=develop-${MAJOR_VERSION}" >> $GITHUB_OUTPUT
          else
            SANITIZED_REF="$(printf '%s' "$REF" | sed -E 's#[^[:alnum:]_.-]+#-#g; s#^[.-]+##; s#-+#-#g' | cut -c1-128)"
            if [[ -z "$SANITIZED_REF" ]]; then
              echo "::error::Unable to derive a valid Docker tag from ref '$REF'"
              exit 1
            fi
            echo "tag=$SANITIZED_REF" >> $GITHUB_OUTPUT
          fi


      - name: Restore packages
        if: "${{ inputs.package_cache_key != '' && inputs.package_directory != '' && contains(matrix.feature, 'platform-') }}"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./*.${{ contains(inputs.os, 'alma') && 'rpm' || 'deb' }}
          key: ${{ inputs.package_cache_key }}
          fail-on-cache-miss: true

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ inputs.dependencies_lock_file }}

      - name: Install dependencies
        run: |
          pnpm install \
            --frozen-lockfile \
            --config.trustPolicy=no-downgrade \
            --config.minimumReleaseAge=2880 \
            --config.blockExoticSubdeps=true
        shell: bash
        env:
          CYPRESS_INSTALL_BINARY: "0"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Install Cypress binary
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          MODULE_NAME: ${{ inputs.module_name }}
        with:
          timeout_seconds: 120
          max_attempts: 10
          retry_wait_seconds: 30
          retry_on: error
          command: cd "$MODULE_NAME/tests/e2e" && pnpm cypress install --force

      - name: Move packages
        if: "${{ inputs.package_cache_key != '' && inputs.package_directory != '' && contains(matrix.feature, 'platform-') }}"
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package_directory }}
          PACKAGE_EXT: ${{ contains(inputs.os, 'alma') && 'rpm' || 'deb' }}
        run: |
          mkdir -p "$PACKAGE_DIRECTORY"
          mv ../../../*."$PACKAGE_EXT" "$PACKAGE_DIRECTORY"
        shell: bash

      - name: Login to Registry
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Restore standard slim image from cache
        id: cache-docker-slim
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 6
        with:
          path: ./docker-image
          key: docker-image-${{ env.SLIM_IMAGE_NAME }}-${{ steps.image_tag.outputs.tag }}
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

      - name: Load standard slim image
        if: ${{ steps.cache-docker-slim.outputs.cache-hit == 'true' }}
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          docker load --input "../../../docker-image/$SLIM_IMAGE_NAME.tar"
          docker tag "$SLIM_IMAGE_NAME:$IMAGE_TAG" "docker.centreon.com/centreon/$SLIM_IMAGE_NAME:$IMAGE_TAG"
        shell: bash

      - name: Get test execution Key
        id: get-test-execution-key
        env:
          XRAY_KEYS_AND_IDS: ${{ inputs.xray_keys_and_ids }}
          OS: ${{ inputs.os }}
        run: |
          test_execution_key=$(echo "$XRAY_KEYS_AND_IDS" | jq -r --arg os "$OS" '.["test_execution_key_" + $os]')
          echo "The Test Execution KEY: $test_execution_key"
          echo "test_execution_key=$test_execution_key" >> $GITHUB_ENV
        shell: bash

      - name: Add sso-proxy to /etc/hosts
        run: echo "127.0.0.1 sso-proxy" | sudo tee -a /etc/hosts
        shell: bash

      - name: Cypress end-to-end testing
        env:
          FEATURE: ${{ matrix.feature }}
          TEST_TAGS: ${{ inputs.test_tags }}
          CYPRESS_VERIFY_TIMEOUT: "60000"
          CYPRESS_DATABASE_IMAGE: ${{ inputs.database_image }}
          CYPRESS_WEB_IMAGE_OS: ${{ inputs.os }}
          CYPRESS_WEB_IMAGE_VERSION: ${{ steps.image_tag.outputs.tag }}
          CYPRESS_OPENID_IMAGE_VERSION: ${{ inputs.major_version }}
          CYPRESS_SAML_IMAGE_VERSION: ${{ inputs.major_version }}
          CYPRESS_STABILITY: ${{ inputs.stability }}
          CYPRESS_TARGET_STABILITY: ${{ inputs.target_stability }}
          CYPRESS_IS_CLOUD: ${{ inputs.is_cloud }}
        run: |
          pnpm run cypress:run --browser electron --spec "features/**/$FEATURE.feature" --env tags="$TEST_TAGS"

      - name: Ensure logs directory exists
        env:
          MODULE_NAME: ${{ inputs.module_name }}
        run: mkdir -p "$MODULE_NAME/tests/e2e/results/cucumber-logs/"
        shell: bash

      - name: Replace / with - in the feature path
        id: feature-path
        if: ${{ ! cancelled() }}
        env:
          FEATURE_NAME: ${{ matrix.feature }}
        run: |
          feature_name_with_dash="${FEATURE_NAME//\//-}"
          echo "Modified Feature Name: $feature_name_with_dash"
          echo "feature_name_with_dash=$feature_name_with_dash" >> $GITHUB_OUTPUT

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.cypress-e2e-test-list.outputs.db_id }}-test-results-${{ steps.feature-path.outputs.feature_name_with_dash }}
          path: ${{ inputs.module_name }}/tests/e2e/results/
          retention-days: 1

      - name: Move retries.json to reports directory and display warnings
        if: ${{ ! cancelled() }}
        env:
          MODULE_NAME: ${{ inputs.module_name }}
          FEATURE_NAME_WITH_DASH: ${{ steps.feature-path.outputs.feature_name_with_dash }}
        run: |
            retriesFile="$MODULE_NAME/tests/e2e/results/retries.json"
            if [ -f "$retriesFile" ]; then
              jq -r 'to_entries | .[].key' "$retriesFile" | while read -r testName; do
                echo "::warning::Following test was retried during execution: $testName (retries: $(jq --arg name "$testName" '.[$name]' "$retriesFile"))"
              done
              mv "$retriesFile" "$MODULE_NAME/tests/e2e/results/reports/$FEATURE_NAME_WITH_DASH-retries.json"
            fi
        shell: bash

      - name: Upload test reports
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.cypress-e2e-test-list.outputs.db_id }}-test-reports-${{ steps.feature-path.outputs.feature_name_with_dash }}
          path: ${{ inputs.module_name }}/tests/e2e/results/reports/*.json
          retention-days: 1

      - name: Upload xray reports
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.cypress-e2e-test-list.outputs.db_id }}-xray-reports-${{ steps.feature-path.outputs.feature_name_with_dash }}
          path: ${{ inputs.module_name }}/tests/e2e/results/cucumber-logs/*.json
          retention-days: 1

  # This action is only for NIGHTLY and testing branches
  import-reports-to-xray:
    needs: [cypress-e2e-test-list, cypress-e2e-test-run]
    if: |
      ! cancelled() &&
      ! contains(needs.*.result, 'cancelled') &&
      (inputs.stability == 'testing' || inputs.is_nightly == 'true') &&
      needs.cypress-e2e-test-list.outputs.has_features == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.cypress-e2e-test-list.outputs.db_id }}-xray-reports-*
          path: ${{ inputs.name }}-json-xray-reports
          merge-multiple: true

      - name: Generate Xray Token
        id: generate-xray-token
        env:
          XRAY_CLIENT_ID: ${{ secrets.xray_client_id }}
          XRAY_CLIENT_SECRET: ${{ secrets.xray_client_secret }}
        run: |
          payload=$(jq -nc --arg id "$XRAY_CLIENT_ID" --arg secret "$XRAY_CLIENT_SECRET" '{client_id: $id, client_secret: $secret}')
          token_response=$(curl -H "Content-Type: application/json" -X POST --data "$payload" "https://xray.cloud.getxray.app/api/v1/authenticate")
          xray_token=$(echo "$token_response" | sed -n 's/.*"\(.*\)".*/\1/p')
          echo "xray_token=$xray_token" >> $GITHUB_OUTPUT
        shell: bash

      - name: Keys
        env:
          XRAY_KEYS_AND_IDS: ${{ inputs.xray_keys_and_ids }}
          OS: ${{ inputs.os }}
        run: |
          test_execution_key=$(echo "$XRAY_KEYS_AND_IDS" | jq -r --arg os "$OS" '.["test_execution_key_" + $os]')
          test_plan_key=$(echo "$XRAY_KEYS_AND_IDS" | jq -r --arg os "$OS" '.["test_plan_key_" + $os]')
          echo "The Test Execution KEY: $test_execution_key"
          echo "The Test Plan KEY: $test_plan_key"

      - name: Import results to xray
        env:
          NAME: ${{ inputs.name }}
          XRAY_TOKEN: ${{ steps.generate-xray-token.outputs.xray_token }}
        run: |
          for file in "$NAME-json-xray-reports/"*.json
          do
            curl -H "Content-Type: application/json" -X POST -H "Authorization: Bearer $XRAY_TOKEN" --data @"$file" https://xray.cloud.getxray.app/api/v2/import/execution/cucumber
          done

  cypress-e2e-test-report:
    needs: [cypress-e2e-test-list, cypress-e2e-test-run]
    if: |
      ! cancelled() &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.cypress-e2e-test-list.outputs.has_features == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.cypress-e2e-test-list.outputs.db_id }}-test-reports-*
          path: ${{ inputs.name }}-json-reports
          merge-multiple: true

      - name: Merge reports
        env:
          NAME: ${{ inputs.name }}
        run: |
          pnpx mochawesome-merge "$NAME-json-reports/**/*-report.json" > mochawesome.json

          if ls "$NAME-json-reports/"*retries.json 1> /dev/null 2>&1; then
            cat "$NAME-json-reports/"*retries.json | jq -s add > retries.json
          else
            echo "{}" > retries.json
          fi
        shell: bash

      - name: Publish report
        if: needs.cypress-e2e-test-run.result == 'failure'
        uses: ./.github/actions/publish-report
        with:
          check_name: ${{ inputs.name }}-report
          path: mochawesome.json
          format: cypress

      - name: Display retries summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const retriesFile = 'retries.json';
            const retries = JSON.parse(fs.readFileSync(retriesFile, 'utf8'));
            if (Object.keys(retries).length > 0) {
              const outputTable = [
                [{data: 'Feature', header: true}, {data: 'Scenario', header: true}, {data: 'Retries', header: true}],
              ];
              const warningTitle = `${Object.keys(retries).length} tests were retried during execution`;

              let warningBody = JSON.stringify(retries, null, 2);
              for (const testName in retries) {
                const featureName = testName.split('>')[0];
                const scenarioName = testName.split('>').slice(1).join('>');
                outputTable.push([featureName, scenarioName, String(retries[testName])]);
              }

              // Display json to allow collect of metrics
              core.warning(warningBody, { title: warningTitle });

              core.summary
                .addHeading(`Retries Summary`)
                .addTable(outputTable)
                .addDetails(`Content of ${retriesFile}`, fs.readFileSync(retriesFile, 'utf8'))
                .write();
            }

  regroup-artifacts:
    needs: [cypress-e2e-test-list, cypress-e2e-test-run, import-reports-to-xray, cypress-e2e-test-report]
    if: |
      ! cancelled() &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.cypress-e2e-test-list.outputs.has_features == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type_of_report: [test-results, test-reports, xray-reports]
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ ( contains(needs.cypress-e2e-test-run.result, 'failure') && ( matrix.type_of_report == 'test-results' || matrix.type_of_report == 'test-reports' ) ) || matrix.type_of_report == 'xray-reports' }}
        with:
          name: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.cypress-e2e-test-list.outputs.db_id }}-${{ matrix.type_of_report }}
          pattern: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.cypress-e2e-test-list.outputs.db_id }}-${{ matrix.type_of_report }}-*
          delete-merged: false # cannot be set to true due to random fails: Failed to DeleteArtifact: Unable to make request: ECONNRESET
          retention-days: 1

      - name: Delete merged artifacts
        if: |
          success() ||
          ( failure() && matrix.type_of_report == 'test-results' )
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: ${{ inputs.name }}-${{ inputs.os }}-${{ needs.cypress-e2e-test-list.outputs.db_id }}-${{ matrix.type_of_report }}-*
          failOnError: false
