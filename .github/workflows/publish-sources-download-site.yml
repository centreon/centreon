---
name: publish-sources-download-site
run-name: publish sources of ${{ inputs.bundle_tag }}

# Publishes a release bundle's source tarballs to download.centreon.com, by opening one pull request
# on centreon/WebApp-download.
#
# Two ways in, on purpose. release-new calls it as a job so a normal release publishes itself; the
# dispatch is the retry path, because release-new cannot be re-run once its tags exist and
# "Re-run failed jobs" replays the same commit and so cannot pick up a fix.
#
# Contract: delivery-tooling docs/download-website/asset-publication.md

on:
  workflow_call:
    inputs:
      bundle_tag:
        description: 'Release bundle tag, e.g. release-onprem-20260700-25.10'
        required: true
        type: string
      dry_run:
        description: 'Rehearse without opening a pull request'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      bundle_tag:
        description: 'Release bundle tag, e.g. release-onprem-20260700-25.10'
        required: true
        type: string
      dry_run:
        description: 'Rehearse without opening a pull request'
        required: false
        default: true
        type: boolean

# Every component of one bundle writes the same branch and file in the target repository, and the
# retry dispatch can overlap the original call.
concurrency:
  group: publish-sources-${{ inputs.bundle_tag }}
  cancel-in-progress: false

jobs:
  publish-sources:
    name: Publish sources to the download site
    # Cloud bundles publish nothing here: web/collect/gorgone skip deliver-sources when is_cloud,
    # and a cloud train is not declared in the site's catalog.
    if: startsWith(inputs.bundle_tag, 'release-onprem-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read

    env:
      BUNDLE_TAG: ${{ inputs.bundle_tag }}
      WEBAPP_REPO: centreon/WebApp-download

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Fails in seconds rather than after the poll window: an undeclared train is a catalog pull
      # request someone has to open, not something waiting will fix.
      - name: Check the train is declared in the site catalog
        env:
          GH_TOKEN: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
        run: |
          set -euo pipefail
          [[ "$BUNDLE_TAG" =~ -([0-9]{2}\.[0-9]{2})$ ]] \
            || { echo "::error::cannot read the train from '$BUNDLE_TAG'"; exit 1; }
          TRAIN="${BASH_REMATCH[1]}"

          TRAINS="$(gh api "repos/$WEBAPP_REPO/contents/src/data/catalog.yaml" --jq '.content' \
            | base64 -d | awk '/^versions:/,/^products:/' \
            | sed -n 's/.*id:[[:space:]]*"\([^"]*\)".*/\1/p')"

          if ! grep -qxF "$TRAIN" <<<"$TRAINS"; then
            echo "::error::train '$TRAIN' is not declared in $WEBAPP_REPO src/data/catalog.yaml (versions:). Adding a train is a release-manager decision: open a catalog pull request first. Known trains: $(tr '\n' ' ' <<<"$TRAINS")"
            exit 1
          fi
          echo "train $TRAIN is declared"

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # The target repository's own validator runs before anything is pushed, and needs pnpm >= 11
      # provisioned the way its own workflows do it (not corepack, which node no longer ships).
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11
          run_install: false

      - name: Install libatomic1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libatomic1

      - name: Build the download site entries
        id: entries
        env:
          REPOSITORY: ${{ github.repository }}
          REPORT_FILE: sources-report.tsv
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/sources-release-entries.sh > entries.tsv

      - name: Publish to the download site
        env:
          GH_TOKEN: ${{ secrets.CENTREON_TECHNIQUE_PAT }}
          DRY_RUN: ${{ inputs.dry_run }}
          MISSING: ${{ steps.entries.outputs.missing }}
        run: |
          set -euo pipefail
          [[ "$BUNDLE_TAG" =~ ^release-onprem-([0-9]+)-([0-9]{2}\.[0-9]{2})$ ]]
          BUILD="${BASH_REMATCH[1]}"
          TRAIN="${BASH_REMATCH[2]}"

          # No --out-name: each entry carries its own, because components version independently
          # and the target keys its release files by version.
          ARGS=(
            --entries entries.tsv
            --branch "release/sources-${BUNDLE_TAG}"
            --commit-message "release: onprem ${TRAIN} build ${BUILD}"
            --pr-title "release: onprem ${TRAIN} build ${BUILD}"
            --no-sidecar
          )
          # an && list whose test is false returns non-zero and would abort under set -e
          if [[ "$DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi

          ./.github/scripts/publish-download-release.sh "${ARGS[@]}"

          # A release missing a component must not be mergeable, but what did land is still correct
          # and worth reviewing, so the pull request is opened and the run goes red.
          if [[ "${MISSING:-0}" != "0" ]]; then
            echo "::error::${MISSING} component(s) of $BUNDLE_TAG did not publish; see the summary"
            exit 1
          fi

      - name: Report
        if: always()
        run: |
          {
            echo "### Source tarballs for \`$BUNDLE_TAG\`"
            echo ""
            echo "| Component | Version | State | md5 / reason |"
            echo "|---|---|---|---|"
            while IFS=$'\t' read -r component version state a b; do
              [[ -n "$component" ]] || continue
              if [[ "$state" == "published" ]]; then
                printf '| `%s` | %s | published | `%s` (%s bytes) |\n' "$component" "$version" "$a" "$b"
              else
                printf '| `%s` | %s | **missing** | deliver-sources: %s [run](%s) |\n' "$component" "$version" "$a" "$b"
              fi
            done < sources-report.tsv
            echo ""
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
