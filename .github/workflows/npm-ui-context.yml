name: npm-ui-context

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/npm-ui-context.yml"
      - ".github/workflows/npm-publish-package.yml"
      - "centreon/packages/ui-context/**"
  push:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
    paths:
      - ".github/workflows/npm-ui-context.yml"
      - ".github/workflows/npm-publish-package.yml"
      - "centreon/packages/ui-context/**"

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  publish-package:
    permissions:
      contents: read  # Required by actions/checkout in called workflow
      id-token: write  # Required for OIDC
    needs: [dependency-scan]
    if: github.event.pull_request.head.repo.fork != true
    uses: ./.github/workflows/npm-publish-package.yml
    with:
      package_directory: "centreon/packages/ui-context"
