name: cypress-e2e-debug-analysis

# Standalone from cypress-e2e-parallelization.yml on purpose: that file is shared by every
# module's CI (10+ callers across centreon/centreon and centreon/centreon-modules), so this
# stays a separate, independently reviewable/deployable workflow rather than a job bolted
# onto it.
#
# Does real work only when a test run failed AND someone re-ran it with "Enable debug
# logging" checked (see the first step — runner.debug only exists once a runner is
# allocated, so it can't gate the job itself via the job-level `if:`). Reads the artifacts
# the test run already uploaded (no re-run), reads the PR diff, and asks Claude to judge
# whether each failure looks caused by this PR or flaky/pre-existing, writing the verdict to
# the GitHub Step Summary.

on:
  workflow_call:
    inputs:
      name:
        description: "Same 'name' input given to cypress-e2e-parallelization.yml for this leg (used to find its artifacts)"
        required: true
        type: string
      os:
        description: "Same 'os' input given to cypress-e2e-parallelization.yml for this leg"
        required: true
        type: string
      database_image:
        description: "Same 'database_image' input given to cypress-e2e-parallelization.yml for this leg (used to re-derive its db_id)"
        required: true
        type: string
    secrets:
      claude_code_oauth_token:
        description: "Resolved by the caller from secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', github.actor)] — this workflow has no access to the full secret store to do that lookup itself."
        required: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Get database identifier
        id: get-db-id
        env:
          DATABASE_IMAGE: ${{ inputs.database_image }}
        run: |
          db_id=$(echo "$DATABASE_IMAGE" | sed 's|.*/||' | tr ':' '-')
          echo "db_id=$db_id" >> "$GITHUB_OUTPUT"

      - name: Check that debug logging is enabled for this run
        id: debug-check
        run: echo "is_debug=${{ runner.debug == '1' }}" >> "$GITHUB_OUTPUT"

      # CLAUDE_CODE_OAUTH_TOKEN is per contributor (see .claude/skills/qa-ticket-verify),
      # keyed by whoever clicked "Re-run jobs" — if they haven't set one, skip quietly
      # instead of failing a run that already has a real test failure to look at.
      - name: Check for a Claude token for the triggering user
        id: token-check
        if: steps.debug-check.outputs.is_debug == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude_code_oauth_token }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            {
              echo "## AI failure analysis skipped"
              echo ""
              echo "No Claude token configured for @$GITHUB_ACTOR. To enable this analysis on your debug re-runs:"
              echo '```'
              echo "claude setup-token"
              echo "gh secret set CLAUDE_CODE_OAUTH_TOKEN_$GITHUB_ACTOR --repo ${{ github.repository }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout sources
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # cypress-e2e-parallelization.yml's own regroup-artifacts job already merges every
      # per-feature artifact into one combined one named exactly like this (no trailing
      # `-<feature>` suffix) and deletes the per-feature originals — so this must be an exact
      # `name:` match, not a `pattern:` wildcard (which would match nothing once the
      # per-feature artifacts are gone). The merged test-results artifact only exists when
      # this combo had a failure; continue-on-error so its absence doesn't fail this job.
      - name: Download failed test artifacts (screenshots, videos, logs)
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.name }}-${{ inputs.os }}-${{ steps.get-db-id.outputs.db_id }}-test-results
          path: debug-analysis/test-results

      - name: Download test reports (mochawesome JSON)
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.name }}-${{ inputs.os }}-${{ steps.get-db-id.outputs.db_id }}-test-reports
          path: debug-analysis/test-reports

      - name: Merge mochawesome reports and check this combo actually failed
        id: failure-check
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' }}
        run: |
          npx --yes mochawesome-merge "debug-analysis/test-reports/**/*-report.json" > debug-analysis/mochawesome.json
          failures=$(jq '.stats.failures' debug-analysis/mochawesome.json)
          echo "This combo (${{ inputs.os }}/${{ inputs.name }}) has $failures failing scenario(s)."
          echo "has_failures=$( [ "$failures" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Get PR diff
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' && steps.failure-check.outputs.has_failures == 'true' && github.event.pull_request != null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} > debug-analysis/pr.diff || true

      - name: Install Claude Code CLI
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' && steps.failure-check.outputs.has_failures == 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Analyze failures with Claude
        id: claude-analysis
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' && steps.failure-check.outputs.has_failures == 'true' }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude_code_oauth_token }}
        run: |
          set -o pipefail
          # Labeled so that when this run gets re-run more than once, each attempt's section
          # on the run's Summary page is unambiguous — GitHub keeps every past attempt's
          # summary there, it doesn't replace it, so without this they'd look identical.
          echo "## 🐛 Debug analysis — run attempt ${{ github.run_attempt }}" >> "$GITHUB_STEP_SUMMARY"
          claude -p "You are running in CI with no human present. This Cypress e2e run failed, \
            and debug logging was explicitly enabled for this re-run (that is how this job got \
            triggered). Read debug-analysis/mochawesome.json for the failing scenario(s) (error \
            message, stack trace), look at screenshots/videos under debug-analysis/test-results/ \
            if useful, and read debug-analysis/pr.diff (if present) for what this PR actually \
            changed. For each failing scenario, decide: is the failure caused by this PR's diff \
            (cite the specific line(s)/change), or does it look flaky / pre-existing / \
            environment-related and unrelated to the diff (explain why — e.g. a timing-sensitive \
            wait, a known-flaky selector pattern, an infra timeout)? Write your conclusion \
            directly to \$GITHUB_STEP_SUMMARY as markdown: one heading per failing scenario, a \
            bold verdict, then your reasoning. Do not edit any repository files, do not open a \
            PR or post a comment anywhere — \$GITHUB_STEP_SUMMARY is the only output. Stop once \
            you have written it." \
            --allowedTools "Bash,Read,Grep,Glob" \
            --permission-mode bypassPermissions \
            --max-budget-usd 3 \
            --verbose \
            --output-format stream-json \
            | tee claude-debug-analysis.jsonl \
            | jq -R --unbuffered '
                try (fromjson) catch empty
                | if .type == "assistant" then
                    (.message.content // [])[] |
                    if .type == "tool_use" then "STEP: -> " + .name
                    elif .type == "text" and ((.text // "") | length) > 0 then
                      "STEP: " + ((.text // "") | .[0:200] | gsub("\n"; " "))
                    else empty end
                  elif .type == "result" then "STEP: === finished (" + (.subtype // "?") + ") ==="
                  else empty end
              '

      # Guarantees a visible result in the Summary tab even if the step above crashed, hit
      # its budget cap, or just never got around to writing anything (continue-on-error above
      # keeps a Claude-side failure from being mistaken for a real e2e failure on this PR).
      # $GITHUB_STEP_SUMMARY is a fresh, separate buffer per step — a later step can never see
      # what an earlier one wrote to it — so this checks the previous step's own recorded
      # outcome instead of inspecting file content, and writes its own heading since this is
      # a distinct contribution to the job's summary, not an appendix to the one above.
      - name: Ensure a summary was written
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' && steps.failure-check.outputs.has_failures == 'true' && steps.claude-analysis.outcome != 'success' }}
        run: |
          {
            echo "## 🐛 Debug analysis — run attempt ${{ github.run_attempt }}"
            echo ""
            echo "### AI failure analysis did not complete"
            echo ""
            echo "The analysis step did not produce a verdict (outcome: ${{ steps.claude-analysis.outcome }})."
            echo "Check the run logs and, if present, the \`claude-debug-analysis.jsonl\` artifact for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis transcript
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' && steps.failure-check.outputs.has_failures == 'true' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}-${{ inputs.os }}-${{ steps.get-db-id.outputs.db_id }}-debug-analysis
          path: claude-debug-analysis.jsonl
          retention-days: 7
