name: cypress-e2e-debug-analysis

on:
  workflow_call:
    inputs:
      name:
        description: "Same 'name' input given to cypress-e2e-parallelization.yml for every leg (used to find its artifacts)"
        required: true
        type: string
      os_and_database_matrix:
        description: "The os_and_database_matrix output used to matrix e2e-test, so every combo's artifacts can be gathered into one analysis"
        required: true
        type: string
    secrets:
      claude_code_oauth_token:
        description: "Resolved by the caller from secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', github.actor)] — this workflow has no access to the full secret store to do that lookup itself."
        required: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Check that debug logging is enabled for this run
        id: debug-check
        run: echo "is_debug=${{ runner.debug == '1' }}" >> "$GITHUB_OUTPUT"

      - name: Check for a Claude token for the triggering user
        id: token-check
        if: steps.debug-check.outputs.is_debug == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude_code_oauth_token }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            {
              echo "## AI failure analysis skipped"
              echo ""
              echo "No Claude token configured for @$GITHUB_ACTOR. To enable this analysis on your debug re-runs:"
              echo '```'
              echo "claude setup-token"
              echo "gh secret set CLAUDE_CODE_OAUTH_TOKEN_$GITHUB_ACTOR --repo ${{ github.repository }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout sources
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download reports and failed-test artifacts for every os/database combo
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OS_AND_DATABASE_MATRIX: ${{ inputs.os_and_database_matrix }}
          NAME: ${{ inputs.name }}
        run: |
          echo "$OS_AND_DATABASE_MATRIX" | jq -c '.operating_systems[]' | while read -r combo; do
            os=$(echo "$combo" | jq -r '.operating_system')
            db_id=$(echo "$combo" | jq -r '.db_id')
            leg="${NAME}-${os}-${db_id}"
            gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
              -n "${leg}-test-reports" -D "debug-analysis/test-reports/${os}-${db_id}" || true
            gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
              -n "${leg}-test-results" -D "debug-analysis/test-results/${os}-${db_id}" || true
          done

      - name: Merge mochawesome reports and check whether anything actually failed
        id: failure-check
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' }}
        run: |
          npx --yes mochawesome-merge "debug-analysis/test-reports/**/*-report.json" > debug-analysis/mochawesome.json
          failures=$(jq '.stats.failures' debug-analysis/mochawesome.json)
          echo "This run has $failures failing scenario(s) across all os/database combos."
          echo "has_failures=$( [ "$failures" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Get PR diff
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' && steps.failure-check.outputs.has_failures == 'true' && github.event.pull_request != null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} > debug-analysis/pr.diff || true

      - name: Install Claude Code CLI
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' && steps.failure-check.outputs.has_failures == 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Analyze failures with Claude
        id: claude-analysis
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' && steps.failure-check.outputs.has_failures == 'true' }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude_code_oauth_token }}
        run: |
          set -o pipefail
          echo "## 🐛 Debug analysis — run attempt ${{ github.run_attempt }}" >> "$GITHUB_STEP_SUMMARY"
          claude -p "You are running in CI with no human present. This Cypress e2e run failed, \
            and debug logging was explicitly enabled for this re-run (that is how this job got \
            triggered). Read debug-analysis/mochawesome.json for every failing scenario across \
            all os/database combos (error message, stack trace), look at screenshots/videos \
            under debug-analysis/test-results/<os>-<database>/ if useful (the subfolder name \
            tells you which combo it's from), and read debug-analysis/pr.diff (if present) for \
            what this PR actually changed. For each failing scenario, decide: is the failure \
            caused by this PR's diff (cite the specific line(s)/change), or does it look flaky / \
            pre-existing / environment-related and unrelated to the diff (explain why — e.g. a \
            timing-sensitive wait, a known-flaky selector pattern, an infra timeout)? If the same \
            scenario fails on more than one combo, say so instead of repeating the analysis. \
            Write your conclusion directly to \$GITHUB_STEP_SUMMARY as markdown, one heading per \
            failing scenario, each with exactly these three parts in this order: a '**Verdict:**' \
            line stating caused by this PR's diff or flaky/pre-existing, an 'Explanation' section \
            with your reasoning (cite the specific line(s)/change or the flaky pattern), and a \
            'Proposed fix' section with a concrete, actionable suggestion (e.g. the exact line to \
            revert or change, or how to stabilize a flaky step). Do not edit any repository \
            files, do not open a PR or post a comment anywhere — \$GITHUB_STEP_SUMMARY is the \
            only output. Stop once you have written it." \
            --allowedTools "Bash,Read,Grep,Glob" \
            --permission-mode bypassPermissions \
            --max-budget-usd 3 \
            --verbose \
            --output-format stream-json \
            | tee claude-debug-analysis.jsonl \
            | jq -R --unbuffered '
                try (fromjson) catch empty
                | if .type == "assistant" then
                    (.message.content // [])[] |
                    if .type == "tool_use" then "STEP: -> " + .name
                    elif .type == "text" and ((.text // "") | length) > 0 then
                      "STEP: " + ((.text // "") | .[0:200] | gsub("\n"; " "))
                    else empty end
                  elif .type == "result" then "STEP: === finished (" + (.subtype // "?") + ") ==="
                  else empty end
              '

      - name: Ensure a summary was written
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' && steps.failure-check.outputs.has_failures == 'true' && steps.claude-analysis.outcome != 'success' }}
        run: |
          {
            echo "## 🐛 Debug analysis — run attempt ${{ github.run_attempt }}"
            echo ""
            echo "### AI failure analysis did not complete"
            echo ""
            echo "The analysis step did not produce a verdict (outcome: ${{ steps.claude-analysis.outcome }})."
            echo "Check the run logs and, if present, the \`claude-debug-analysis.jsonl\` artifact for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis transcript
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' && steps.failure-check.outputs.has_failures == 'true' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}-debug-analysis
          path: claude-debug-analysis.jsonl
          retention-days: 7
