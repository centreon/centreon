name: check-status

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
      - master
      - "[2-9][0-9].[0-9][0-9].x"
      - hotfix-*
      - release-*

jobs:
  check-status:
    runs-on: ubuntu-24.04
    steps:
      - name: Check workflow statuses and display token usage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "current rest api rate usage:"
          curl -s -H "Accept: application/vnd.github+json" -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/rate_limit | jq .rate
          echo ""
          echo ""
          echo "current graphql rate usage:"
          curl -s -H "Accept: application/vnd.github+json" -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/rate_limit | jq .resources.graphql
          echo ""
          echo ""

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            // let workflow runs triggered by the same event register before the first evaluation
            await new Promise((resolve) => setTimeout(resolve, 20000));

            // only runs triggered by these events gate the merge (manual workflow_dispatch or push runs on the same commit must not)
            const allowedEvents = ['pull_request'];
            // workflows which are required status checks on their own
            const excludedWorkflows = [
              'check-qa-validation',
            ];
            const failureConclusions = ['failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure', 'stale'];

            for (let i = 0; i < 120; i++) {
              let runs = [];
              try {
                runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: process.env.PR_HEAD_SHA,
                  per_page: 100
                });
              } catch (error) {
                core.warning(`Cannot list workflow runs, retrying: ${error.message}`);
                await new Promise((resolve) => setTimeout(resolve, 30000));
                continue;
              }

              // the listing is eventually consistent, do not trust it until it contains the current run
              if (!runs.some((run) => run.id === context.runId)) {
                core.warning("Current workflow run is not listed yet, retrying");
                await new Promise((resolve) => setTimeout(resolve, 30000));
                continue;
              }

              // keep only the latest run of each workflow to ignore runs superseded by a re-trigger (labeled, unlabeled...)
              const latestRunPerWorkflow = new Map();
              runs
                .filter((run) => allowedEvents.includes(run.event))
                .filter((run) => run.id !== context.runId)
                .filter((run) => !excludedWorkflows.includes(run.name))
                .forEach((run) => {
                  const latestRun = latestRunPerWorkflow.get(run.workflow_id);
                  if (!latestRun || run.run_number > latestRun.run_number) {
                    latestRunPerWorkflow.set(run.workflow_id, run);
                  }
                });

              const failedRuns = [];
              const pendingRuns = [];
              latestRunPerWorkflow.forEach((run) => {
                if (run.status !== 'completed') {
                  pendingRuns.push(run);
                } else if (failureConclusions.includes(run.conclusion)) {
                  failedRuns.push(run);
                }
                console.log(`workflow run ${run.name} => ${run.status === 'completed' ? run.conclusion : run.status}`);
              });

              if (failedRuns.length > 0) {
                const failedJobs = [];
                for await (const run of failedRuns) {
                  try {
                    const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id,
                      filter: 'latest',
                      per_page: 100
                    });

                    const failedJobsOfRun = jobs
                      .filter(({ conclusion }) => failureConclusions.includes(conclusion))
                      .map(({ conclusion, name, html_url }) => `<a href="${html_url}">${run.name} / ${name} (${conclusion})</a>`);
                    // a run can fail without any failed job (startup_failure...)
                    if (failedJobsOfRun.length === 0) {
                      failedJobsOfRun.push(`<a href="${run.html_url}">${run.name} (${run.conclusion})</a>`);
                    }
                    failedJobs.push(...failedJobsOfRun);
                  } catch (error) {
                    core.warning(`Cannot list jobs of workflow run ${run.id}: ${error.message}`);
                    failedJobs.push(`<a href="${run.html_url}">${run.name} (${run.conclusion})</a>`);
                  }
                }

                core.summary.addRaw(`${failedJobs.length} job(s) failed:`, true)
                core.summary.addList(failedJobs);
                core.summary.write();

                core.setFailed(`${failedRuns.length} workflow run(s) failed`);
                return;
              }

              if (pendingRuns.length === 0) {
                core.info("All workflows are ok");
                return;
              }

              core.info(`${pendingRuns.length} workflow run(s) in progress`);

              await new Promise((resolve) => setTimeout(resolve, 30000));
            }

            core.setFailed("Timeout: some jobs are still in progress");

  get-environment:
    if: |
      contains(fromJSON('["pull_request"]') , github.event_name) &&
      (startsWith(github.base_ref, 'release-') || startsWith(github.base_ref, 'hotfix-'))
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: centreon/www/install/insertBaseConf.sql

  check-cherry-pick:
    needs: [get-environment, check-status]
    runs-on: ubuntu-24.04
    if: |
      contains(fromJSON('["pull_request"]') , github.event_name) &&
      needs.get-environment.outputs.target_stability == 'testing' &&
      ! contains(needs.get-environment.outputs.labels, 'skip-cherry-pick')

    steps:
      - name: Check if the PR is a cherry-pick from dev branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LINKED_DEV_BRANCH: ${{ needs.get-environment.outputs.linked_dev_branch }}
        with:
          script: |
            const linkedDevBranch = process.env.LINKED_DEV_BRANCH;
            let linkedPrs = [];
            let errorMessage = `This pull request is not a cherry-pick from ${linkedDevBranch} or has no reference to a pull request which has been merged on ${linkedDevBranch}\n`;

            try {
              const pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });

              const { title, body } = pull.data;

              [title, body ?? ''].forEach((text) => {
                const linkedPrMatches = text.matchAll(/(?:#|\/pull\/)(\d+)/g);
                if (linkedPrMatches) {
                  [...linkedPrMatches].forEach((match) => {
                    linkedPrs.push(Number(match[1]));
                  });
                }
              });

              // remove duplicates
              linkedPrs = [...new Set(linkedPrs)];
              console.log(`Linked pull requests found in PR title and body: ${linkedPrs.join(', ')}`);
            } catch (e) {
              throw new Error(`Failed to get information of pull request #${context.issue.number}: ${e}`);
            }

            for await (const prNumber of linkedPrs) {
              try {
                const pull = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });

                if (pull.data.base.ref === linkedDevBranch) {
                  if (pull.data.state === 'closed' && pull.data.merged === true) {
                    console.log(`This pull request is a cherry-pick from pull request #${prNumber} on ${linkedDevBranch}`);
                    return;
                  } else {
                    errorMessage += `This pull request seems to be a cherry-pick from pull request #${prNumber} on ${linkedDevBranch} but it is not merged yet\n`;
                  }
                } else {
                  errorMessage += `Pull request #${prNumber} is linked to ${pull.data.base.ref} instead of ${linkedDevBranch}\n`;
                }
              } catch (e) {
                errorMessage += `Failed to get information on pull request #${prNumber}: ${e}\n`;
              }
            }

            errorMessage += `\nIf you are sure this PR does not need to be a cherry-pick from ${linkedDevBranch} or must be merged urgently, `;
            errorMessage += `open the pull request on ${linkedDevBranch} and add label "skip-cherry-pick" to the PR and re-run all jobs of workflow check-status\n`;

            throw new Error(errorMessage);
