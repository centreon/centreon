name: pulp-rbac-test

# Manual-only: this workflow makes real authenticated write attempts (modify_content) against
# the live Pulp instance to validate the object-scope + ref-restricted OIDC rules
# (delivery-tooling#138 / MON-199322). It must never run on every push/PR.
#
# Why this lives here and not in delivery-tooling's own pulp-oidc-test.yml: GitHub scopes an
# OIDC token to the repository the workflow runs in. delivery-tooling's test workflow can only
# ever mint a token with `repository: centreon/delivery-tooling`, so it structurally cannot
# exercise the rules matched on `repository: centreon/centreon`. This workflow mints the token
# as centreon/centreon instead — the only way to test what a real delivery/promote run here
# would actually be granted.
#
# The `ref` claim is whatever branch this workflow is actually dispatched from — it cannot be
# chosen per-input the way audience once was, because `ref` is asserted by GitHub from the real
# trigger context, not from anything the caller passes (that self-chosen-value problem is exactly
# why the OIDC rules stopped using `aud` as a security boundary — see configmap-settings.yaml).
# So: the stable_repository_href negative case (an unprotected branch must be refused) is testable
# from any branch. The positive stable case needs dispatching this workflow from an actual
# protected branch (develop, release-*-next, ...) once it's merged there.

on:
  workflow_dispatch:
    inputs:
      pulp_url:
        description: "Pulp API base URL"
        required: false
        default: "https://pulp-api.apps.centreon.com"
      audience:
        description: "OIDC audience (must match the pulp server GITHUB_OIDC.audience)"
        required: false
        default: "https://pulp.dev.centreon.io"
      positive_repository_href:
        description: >-
          An existing NON-stable repository href this token's family SHOULD be granted write on
          (e.g. an rpm-standard-*-unstable-* or apt-standard repo). Example:
          /api/v3/repositories/rpm/rpm/<uuid>/. Required to run the positive check.
        required: true
      negative_repository_href:
        description: >-
          An existing repository href OUTSIDE this token's family (e.g. an rpm-business-* repo
          when positive_repository_href is rpm-standard-*) — expected to be refused. Leave empty
          to skip this check.
        required: false
        default: ""
      stable_repository_href:
        description: >-
          An existing STABLE repository href in this token's OWN family (e.g.
          rpm-standard-*-stable-* or apt-standard-<version>-stable). Leave empty to skip the ref
          check. From an unprotected branch this must be refused (403); from develop/release-*-
          next/hotfix-*-next/a tag it must succeed (202).
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: centreon-ubuntu-22.04
    steps:
      - name: Get GitHub OIDC token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const aud = '${{ inputs.audience }}'
            const token = await core.getIDToken(aud)
            core.setSecret(token)
            core.exportVariable('PULP_TOKEN', token)
            core.info(`Requested OIDC token for audience: ${aud}`)

      - name: Debug — decoded claims (what the server matches against)
        run: |
          python3 - "$PULP_TOKEN" <<'PY'
          import sys, json, base64
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("iss", "aud", "sub", "repository", "ref", "actor", "workflow", "exp"):
              if k in claims:
                  print(f"  {k:12} = {claims[k]}")
          PY

      - name: Positive case — write within this token's own family
        env:
          PULP_URL: ${{ inputs.pulp_url }}
          HREF: ${{ inputs.positive_repository_href }}
        run: |
          code=$(curl -sS -o /tmp/positive.json -w '%{http_code}' -X POST \
            -H "Authorization: Github $PULP_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"add_content_units": []}' \
            "${PULP_URL}${HREF}modify/")
          echo "HTTP $code against $HREF (own family, non-stable)"
          echo "  expected: 202 — this repository should be covered by this token's delivery grant"
          head -c 500 /tmp/positive.json; echo
          if [[ "$code" != "202" ]]; then
            echo "::error::expected 202, got $code — the delivery grant for this family is missing or wrong"
            exit 1
          fi

      - name: Negative case — write outside this token's family
        if: inputs.negative_repository_href != ''
        env:
          PULP_URL: ${{ inputs.pulp_url }}
          HREF: ${{ inputs.negative_repository_href }}
        run: |
          code=$(curl -sS -o /tmp/negative_family.json -w '%{http_code}' -X POST \
            -H "Authorization: Github $PULP_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"add_content_units": []}' \
            "${PULP_URL}${HREF}modify/")
          echo "HTTP $code against $HREF (different family)"
          echo "  expected: 403 — this repository is outside the family this repo may write to"
          head -c 500 /tmp/negative_family.json; echo
          if [[ "$code" == "202" ]]; then
            echo "::error::expected 403, got 202 — this token can write outside its own family, the scope is too broad"
            exit 1
          fi

      - name: Ref case — write to the stable tier of this token's own family
        if: inputs.stable_repository_href != ''
        env:
          PULP_URL: ${{ inputs.pulp_url }}
          HREF: ${{ inputs.stable_repository_href }}
        run: |
          code=$(curl -sS -o /tmp/stable.json -w '%{http_code}' -X POST \
            -H "Authorization: Github $PULP_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"add_content_units": []}' \
            "${PULP_URL}${HREF}modify/")
          echo "HTTP $code against $HREF (own family, stable tier)"
          echo "  On this run's actual ref (see the decoded claims step above):"
          echo "  - 202 expected if that ref is develop/release-*-next/hotfix-*-next/master/main/dev-*.x/a tag"
          echo "  - 403 expected otherwise (any other branch/PR ref) — a delivery token must not reach"
          echo "    stable directly, only a genuinely protected ref should"
          head -c 500 /tmp/stable.json; echo
