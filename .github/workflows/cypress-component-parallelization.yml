name: frontend-component-test

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      module_name:
        required: true
        type: string
      specs_path:
        required: true
        type: string
      spec_extension:
        required: false
        type: string
        default: ".cypress.spec.tsx"
      dependencies_lock_file:
        required: true
        type: string
        description: 'The frontend dependencies lock file path'
      is_nightly:
        required: false
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      jira_base_url:
        required: true
      jira_user_email:
        required: true
      jira_api_token:
        required: true

jobs:
  cypress-component-test-list:
    runs-on: ubuntu-24.04
    outputs:
      specs: ${{ steps.list-specs.outputs.specs }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: List of specs
        id: list-specs
        run: |
          cd ${{ inputs.module_name }}
          echo "specs=$(find ${{ inputs.specs_path }} -type f -name "*${{ inputs.spec_extension }}" -exec basename {} \; | sed -e "s/${{ inputs.spec_extension }}//" | sort | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

  cypress-component-test-run:
    needs: [cypress-component-test-list]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJson(needs.cypress-component-test-list.outputs.specs) }}
    name: ${{ matrix.spec }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ inputs.dependencies_lock_file }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ inputs.module_name }}
        shell: bash
        env:
          CYPRESS_INSTALL_BINARY: "0"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Install Cypress binary
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_seconds: 120
          max_attempts: 10
          retry_wait_seconds: 30
          retry_on: error
          command: cd ${{ inputs.module_name }} && pnpm cypress install --force

      - name: Cypress web component testing
        uses: cypress-io/github-action@b8ba51a856ba5f4c15cf39007636d4ab04f23e3c # v6.10.2
        with:
          browser: chrome
          component: true
          install: false
          cache-key: cypress-cache-${{ runner.os }}-${{ hashFiles(inputs.dependencies_lock_file) }}
          working-directory: ${{ inputs.module_name }}
          spec: ./**/${{ matrix.spec }}${{ inputs.spec_extension }}
          publish-summary: false
          env: codeCoverageTasksRegistered=true

      - name: Move retries.json to reports directory and display warnings
        if: ${{ ! cancelled() }}
        run: |
          retriesFile="${{ inputs.module_name }}/cypress/results/retries.json"
          if [ -f "$retriesFile" ]; then
            jq 'to_entries | .[].key' $retriesFile | while read -r testName; do
              echo "::warning::Following test was retried during execution: $testName (retries: $(jq ".$testName" $retriesFile))"
            done
            mv $retriesFile "${{ inputs.module_name }}/cypress/results/${{ matrix.spec }}-retries.json"
          fi
        shell: bash

      - name: Archive test results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ failure() }}
        with:
          name: ${{ inputs.name }}-component-test-results-${{ matrix.spec }}
          path: |
            ${{ inputs.module_name }}/cypress/results/videos
            ${{ inputs.module_name }}/cypress/screenshots
            ${{ inputs.module_name }}/cypress/visual-testing-snapshots/**/*.diff.png
          retention-days: 1

      - name: Archive test reports
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ inputs.name }}-component-test-reports-${{ matrix.spec }}
          path: ${{ inputs.module_name }}/cypress/results/*.json
          retention-days: 1

      - name: Change coverage report name
        run: mv ${{ inputs.module_name }}/coverage/coverage-final.json ${{ inputs.module_name }}/coverage/${{ matrix.spec }}-out.json
        shell: bash

      - name: Archive test coverage
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ inputs.name }}-component-test-coverage-${{ matrix.spec }}
          path: ${{ inputs.module_name }}/coverage/${{ matrix.spec }}-out.json
          retention-days: 1

  cypress-component-coverage-report:
    needs: [cypress-component-test-run]
    if: |
      ! cancelled() &&
      ! contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10

      - name: Download coverage reports
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85 # v4.1.3
        with:
          pattern: ${{ inputs.name }}-component-test-coverage-*
          path: coverage/
          merge-multiple: true

      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        if: ${{ github.event_name == 'pull_request' || github.ref_name == 'develop' }}
        with:
          aws-region: eu-west-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Retrieve dynamic code coverages file
        shell: bash
        if: ${{ github.event_name == 'pull_request' || github.ref_name == 'develop'}}
        run: |
          aws s3 cp s3://centreon-lighthouse-report/baseCodeCoverages.json /tmp/

      - name: Merge coverage reports
        run: |
          pnpx nyc merge coverage
          mkdir .nyc_output
          mv coverage.json .nyc_output/out.json
        shell: bash

      - name: Generate lcov coverage report
        run: pnpx nyc report --reporter=lcov --reporter html
        shell: bash

      - name: Format title
        id: title
        run: |
          MODULE_NAME=`echo "${{ inputs.module_name }}" | sed -e "s#/#-#g"`
          echo "replaced=$MODULE_NAME" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install action dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./.github/actions/code-coverage-gate-keeper
        shell: bash

      - name: Archive HTML code coverage
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ steps.title.outputs.replaced }}-${{ inputs.name }}-code-coverage
          path: coverage/lcov-report
          retention-days: 1

      - name: Publish code coverage to PR
        uses: romeovs/lcov-reporter-action@87a815f34ec27a5826abba44ce09bbc688da58fd # v0.4.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: Code coverage report for ${{ steps.title.outputs.replaced }} ${{ inputs.name }} 🚀
          delete-old-comments: true
          filter-changed-files: true

      - name: Check Code coverage
        id: checkCodeCoverage
        uses: ./.github/actions/code-coverage-gate-keeper
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop') || github.ref_name == 'develop' }}
        with:
          module_path: ${{ inputs.module_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.title.outputs.replaced }}
          dynamicCodeCoveragesFilePath: /tmp/baseCodeCoverages.json
          generateNewCodeCoverages: ${{ github.ref_name == 'develop' && github.event.inputs.is_nightly == 'false' }}

      - name: Send new dynamic code coverages
        if: ${{ github.ref_name == 'develop' && github.event.inputs.is_nightly == 'false' && steps.checkCodeCoverage.outputs.has_new_code_coverage }}
        run: |
          aws s3 cp /tmp/newBaseCodeCoverages.json s3://centreon-lighthouse-report/baseCodeCoverages.json
        shell: bash

  cypress-component-test-report:
    needs: [cypress-component-test-run]
    if: |
      ! cancelled() &&
      ! contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10

      - name: Download Artifacts
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85 # v4.1.3
        with:
          pattern: ${{ inputs.name }}-component-test-reports-*
          path: ${{ inputs.name }}-json-reports
          merge-multiple: true

      - name: Merge reports
        run: |
          pnpx mochawesome-merge "${{ inputs.name }}-json-reports/**/*-report.json" > mochawesome.json

          if ls ${{ inputs.name }}-json-reports/**/*retries.json 1> /dev/null 2>&1; then
            cat ${{ inputs.name }}-json-reports/**/*retries.json | jq -s add > retries.json
          else
            echo "{}" > retries.json
          fi
        shell: bash

      - name: Publish report
        if: needs.cypress-component-test-run.result == 'failure'
        uses: ./.github/actions/publish-report
        with:
          check_name: ${{ inputs.name }}-report
          path: mochawesome.json
          format: cypress

      - name: Display retries summary
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const retriesFile = 'retries.json';
            const retries = JSON.parse(fs.readFileSync(retriesFile, 'utf8'));
            if (Object.keys(retries).length > 0) {
              const outputTable = [
                [{data: 'Feature', header: true}, {data: 'Scenario', header: true}, {data: 'Retries', header: true}],
              ];
              const warningTitle = `${Object.keys(retries).length} tests were retried during execution`;

              let warningBody = JSON.stringify(retries, null, 2);
              for (const testName in retries) {
                const featureName = testName.split('>')[0];
                const scenarioName = testName.split('>').slice(1).join('>');
                outputTable.push([featureName, scenarioName, String(retries[testName])]);
              }

              // Display json to allow collect of metrics
              core.warning(warningBody, { title: warningTitle });

              core.summary
                .addHeading(`Retries Summary`)
                .addTable(outputTable)
                .addDetails(`Content of ${retriesFile}`, fs.readFileSync(retriesFile, 'utf8'))
                .write();
            }

  regroup-artifacts:
    needs: [cypress-component-coverage-report, cypress-component-test-report, cypress-component-test-run]
    if: |
      ! cancelled() &&
      ! contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type_of_report: [test-results, test-reports, test-coverage]
    steps:
      - name: Check artifacts exist before merge
        id: check_artifacts_for_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pattern="${{ inputs.name }}-component-${{ matrix.type_of_report }}"
          found=false
          timeout=80       # maximum wait time in seconds
          interval=5       # interval between each check
          elapsed=0

          while [ $elapsed -lt $timeout ]; do
            # Retrieve artifact names without quotes, one per line
            artifacts=$(gh api repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[].name' | tr -d '"')

            merge_list=""
            while read -r artifact; do
              echo "Checking artifact: $artifact"
              if [[ "$artifact" == *"$pattern"* ]]; then
                merge_list="$merge_list $artifact"
              fi
            done <<< "$artifacts"

            if [ -n "$merge_list" ]; then
              echo "Found artifact(s): $merge_list"
              found=true
              break
            fi

            echo "Artifacts not found yet, waiting $interval seconds..."
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          echo "DEBUG: found='$found'"
          echo "found=$found" >> $GITHUB_OUTPUT
        shell: bash

      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        if: steps.check_artifacts_for_merge.outputs.found == 'true' &&
          ((needs.cypress-component-test-run.result == 'failure' &&
            contains(fromJson('["test-results", "test-reports"]'), matrix.type_of_report)) ||
          matrix.type_of_report == 'test-coverage')
        with:
          name: ${{ inputs.name }}-component-${{ matrix.type_of_report }}
          pattern: ${{ inputs.name }}-component-${{ matrix.type_of_report }}-*
          delete-merged: false # cannot be set to true due to random fails: Failed to DeleteArtifact: Unable to make request: ECONNRESET
          retention-days: 1

      - name: Check if artifact exists
        id: check_artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking artifact: ${{ inputs.name }}-component-${{ matrix.type_of_report }}-*"
          artifacts=$(gh api repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[].name')
          if echo "$artifacts" | grep -q "${{ inputs.name }}-component-${{ matrix.type_of_report }}"; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Delete merged artifacts
        if: |
          (needs.cypress-component-test-run.result == 'success' || matrix.type_of_report != 'test-coverage') &&
          steps.check_artifact.outputs.found == 'true'
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          name: ${{ inputs.name }}-component-${{ matrix.type_of_report }}-*
          failOnError: false
