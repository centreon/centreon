name: bruno-api-debug-analysis

# Standalone from bruno-api-test.yml on purpose: that file is shared by every module's API
# test CI, so this stays a separate, independently reviewable/deployable workflow rather
# than a job bolted onto it.
#
# Does real work only when a collection failed AND someone re-ran it with "Enable debug
# logging" checked (see the first step — runner.debug only exists once a runner is
# allocated, so it can't gate the job itself via the job-level `if:`). Reads the reports the
# test run already uploaded (no re-run), reads the PR diff, and asks Claude to judge whether
# each failure looks caused by this PR or flaky/pre-existing, writing the verdict to the
# GitHub Step Summary.

on:
  workflow_call:
    secrets:
      claude_code_oauth_token:
        description: "Resolved by the caller from secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', github.actor)] — this workflow has no access to the full secret store to do that lookup itself."
        required: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Check that debug logging is enabled for this run
        id: debug-check
        run: echo "is_debug=${{ runner.debug == '1' }}" >> "$GITHUB_OUTPUT"

      # CLAUDE_CODE_OAUTH_TOKEN is per contributor (see .claude/skills/qa-ticket-verify),
      # keyed by whoever clicked "Re-run jobs" — if they haven't set one, skip quietly
      # instead of failing a run that already has a real test failure to look at.
      - name: Check for a Claude token for the triggering user
        id: token-check
        if: steps.debug-check.outputs.is_debug == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude_code_oauth_token }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            {
              echo "## AI failure analysis skipped"
              echo ""
              echo "No Claude token configured for @$GITHUB_ACTOR. To enable this analysis on your debug re-runs:"
              echo '```'
              echo "claude setup-token"
              echo "gh secret set CLAUDE_CODE_OAUTH_TOKEN_$GITHUB_ACTOR --repo ${{ github.repository }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout sources
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Bruno reports (JSON + HTML + JUnit)
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bruno-report-*
          path: debug-analysis/bruno-reports
          merge-multiple: true

      - name: Get PR diff
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' && github.event.pull_request != null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} > debug-analysis/pr.diff || true

      - name: Install Claude Code CLI
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Analyze failures with Claude
        id: claude-analysis
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude_code_oauth_token }}
        run: |
          set -o pipefail
          claude -p "You are running in CI with no human present. This Bruno API test run \
            failed, and debug logging was explicitly enabled for this re-run (that is how this \
            job got triggered). Read the JSON/HTML/JUnit reports under \
            debug-analysis/bruno-reports/ for the failing request(s) (assertion errors, response \
            bodies), and read debug-analysis/pr.diff (if present) for what this PR actually \
            changed. For each failing request/assertion, decide: is the failure caused by this \
            PR's diff (cite the specific line(s)/change), or does it look flaky / pre-existing / \
            environment-related and unrelated to the diff (explain why — e.g. a timing/ordering \
            issue between requests, test data left over from another collection, an infra \
            timeout)? Write your conclusion directly to \$GITHUB_STEP_SUMMARY as markdown: one \
            heading per failing request, a bold verdict, then your reasoning. Do not edit any \
            repository files, do not open a PR or post a comment anywhere — \
            \$GITHUB_STEP_SUMMARY is the only output. Stop once you have written it." \
            --allowedTools "Bash,Read,Grep,Glob" \
            --permission-mode bypassPermissions \
            --max-budget-usd 3 \
            --output-format stream-json \
            | tee claude-debug-analysis.jsonl \
            | jq -R --unbuffered '
                try (fromjson) catch empty
                | if .type == "assistant" then
                    (.message.content // [])[] |
                    if .type == "tool_use" then "STEP: -> " + .name
                    elif .type == "text" and ((.text // "") | length) > 0 then
                      "STEP: " + ((.text // "") | .[0:200] | gsub("\n"; " "))
                    else empty end
                  elif .type == "result" then "STEP: === finished (" + (.subtype // "?") + ") ==="
                  else empty end
              '

      # Guarantees a visible result in the Summary tab even if the step above crashed, hit
      # its budget cap, or just never got around to writing anything (continue-on-error above
      # keeps a Claude-side failure from being mistaken for a real API test failure on this PR).
      - name: Ensure a summary was written
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' }}
        run: |
          if [ ! -s "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "## AI failure analysis did not complete"
              echo ""
              echo "The analysis step did not produce a verdict (outcome: ${{ steps.claude-analysis.outcome }})."
              echo "Check the run logs and, if present, the \`claude-debug-analysis.jsonl\` artifact for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload analysis transcript
        if: ${{ steps.debug-check.outputs.is_debug == 'true' && steps.token-check.outputs.has_token == 'true' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bruno-debug-analysis
          path: claude-debug-analysis.jsonl
          retention-days: 7
