name: open-tickets
run-name: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.nightly_manual_trigger == 'true')) && format('open-tickets nightly {0}', github.ref_name) || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      nightly_manual_trigger:
        description: "Set to true to trigger a nightly run"
        required: true
        default: false
        type: boolean
      labels:
        description: "Labels to add to the run (comma separated)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 5 * * 1-5"
  pull_request:
    paths:
      - ".github/workflows/open-tickets.yml"
      - ".version"
      - ".version.centreon-open-tickets"
      - "centreon-open-tickets/**"
  push:
    branches:
      - develop
      - dev-[2-9][0-9].[0-9][0-9].x
      - master
      - "[2-9][0-9].[0-9][0-9].x"
      - "release-[2-9][0-9].[0-9][0-9]-next"
      - "hotfix-[2-9][0-9].[0-9][0-9]-next"
    paths:
      - ".version"
      - ".version.centreon-open-tickets"
      - "centreon-open-tickets/**"
    tags:
      - "centreon-open-tickets-*"

env:
  module: open-tickets
  e2e_directory: centreon-open-tickets/tests/e2e

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  dispatch-to-maintenance-branches:
    if: |
      github.run_attempt == 1 &&
      github.event_name == 'schedule' &&
      github.ref_name == 'develop' &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select maintenance branch and run nightly workflow on it
        uses: ./.github/actions/dispatch-to-maintenance-branch

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  get-environment:
    needs: [dependency-scan]
    if: github.event.pull_request.head.repo.fork != true
    uses: ./.github/workflows/get-environment.yml
    with:
      version_file: centreon-open-tickets/www/modules/centreon-open-tickets/conf.php
      labels: ${{ inputs.labels || '' }}

  check-version-consistency:
    runs-on: ubuntu-24.04
    needs: [get-environment]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability == 'testing' &&
      github.event.pull_request.head.repo.fork != true
    env:
      version: ${{ needs.get-environment.outputs.major_version }}.${{ needs.get-environment.outputs.minor_version }}
      version_file: .version.centreon-open-tickets
      configuration_file: centreon-open-tickets/www/modules/centreon-open-tickets/conf.php
      widget_file: centreon-open-tickets/widgets/open-tickets/configs.xml
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check ${{ env.version_file }}
        uses: ./.github/actions/check-version-consistency
        with:
          file: ${{ env.version_file }}
          version: ${{ env.version }}

      - name: Check ${{ env.configuration_file }}
        uses: ./.github/actions/check-version-consistency
        with:
          file: ${{ env.configuration_file }}
          version: ${{ env.version }}

      - name: Check ${{ env.widget_file }}
        uses: ./.github/actions/check-version-consistency
        with:
          file: ${{ env.widget_file }}
          version: ${{ env.version }}

  changes:
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable' &&
      github.event.pull_request.head.repo.fork != true
    needs: [get-environment]
    uses: ./.github/workflows/get-changes-triggers.yml
    with:
      backend_production_paths: |
        ".version"
        ".version.centreon-open-tickets"
        "centreon-open-tickets/config/**"
        "centreon-open-tickets/doc/API/**"
        "centreon-open-tickets/libinstall/**"
        "centreon-open-tickets/packaging/**"
        "centreon-open-tickets/src/**"
        "centreon-open-tickets/widgets/**"
        "centreon-open-tickets/www/modules/centreon-open-tickets/**"
        "!centreon-open-tickets/www/modules/centreon-open-tickets/react/**"
      frontend_production_paths: |
        "centreon-open-tickets/www/modules/centreon-open-tickets/react/**"
        "!centreon-open-tickets/**/cypress/**"
        "!centreon-open-tickets/**/*.cypress.*"
        "!centreon-open-tickets/**/__mocks__/**"
      backend_test_paths: |
        "centreon-open-tickets/.php-cs-fixer*"
        "centreon-open-tickets/composer.*"
        "centreon-open-tickets/phpstan.*"
        "centreon-open-tickets/rector.*"
        "centreon-open-tickets/tests/php/**"
      e2e_test_paths: |
        "centreon-open-tickets/tests/e2e/**"
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
      base_sha: ${{ needs.get-environment.outputs.previous_release_bundle_tag }}
      labels: ${{ needs.get-environment.outputs.labels }}

  backend-lint:
    runs-on: ubuntu-24.04
    needs: [get-environment, changes]
    if: |
      needs.changes.outputs.trigger_backend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable' &&
      github.event.pull_request.head.repo.fork != true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ needs.get-environment.outputs.php_version }}
          coverage: none
        env:
          runner: ubuntu-24.04

      - name: Install dependencies for PHP quality tools
        run: composer install --optimize-autoloader --prefer-dist --no-interaction --no-progress --quiet --no-scripts
        working-directory: php-tools
        shell: bash

      - name: Install dependencies for centreon-open-tickets
        run: composer install --optimize-autoloader --prefer-dist --no-interaction --no-progress --quiet --no-scripts
        working-directory: centreon-open-tickets
        shell: bash

      - name: Get changed PHP files
        id: changed-php
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          use_rest_api: ${{ github.event_name == 'pull_request' }}
          files: |
            **/*.php

      - name: 🛠️ Rector checks
        if: steps.changed-php.outputs.any_changed == 'true'
        working-directory: centreon-open-tickets
        env:
          PHP_DIFF_FILES: ${{ steps.changed-php.outputs.all_changed_files }}
        run: |
          echo "Run of these Rector tests: rector:legacy on diff" && set -e
          composer rector:diff

      - name: 🧹 PHP-CS-Fixer checks
        if: steps.changed-php.outputs.any_changed == 'true'
        working-directory: centreon-open-tickets
        env:
          PHP_DIFF_FILES: ${{ steps.changed-php.outputs.all_changed_files }}
        run: |
          echo "Run of these PHP-CS-Fixer tests: cs:legacy on diff" && set -e
          composer cs:diff

      - name: Restore PHPStan result cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: centreon-open-tickets/.phpstan-cache
          # Unique per run (sha) so the evolving result cache is re-saved every run;
          # head_ref is the real branch name on pull_request (ref_name would be "N/merge").
          key: phpstan-cache-open-tickets-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            phpstan-cache-open-tickets-${{ github.head_ref || github.ref_name }}-
            phpstan-cache-open-tickets-

      - name: 🔍 PHPStan checks
        working-directory: centreon-open-tickets
        run: |
          echo "Run of these PHPStan tests: stan:legacy:www, stan:legacy:src, stan:legacy:test"

          exit_code=0

          run_task() {
            task=$1                  # e.g. legacy:src
            cache_dir=${task//:/-}   # e.g. legacy-src
            # PHPStan has no --tmp-dir flag; its tmp dir defaults to sys_get_temp_dir()/phpstan
            # and sys_get_temp_dir() honours $TMPDIR. Point each task at its own dir so their
            # result caches (resultCache.php) don't clobber each other across runs.
            task_tmp="${PWD}/.phpstan-cache/${cache_dir}"
            mkdir -p "${task_tmp}"
            if TMPDIR="${task_tmp}" composer "stan:${task}" -- --no-progress; then
              echo "✅ PHPStan ${task}: Success"
            else
              echo "❌ PHPStan ${task}: Failed"
              exit_code=1
            fi
          }

          # Run sequentially: each PHPStan run already parallelises internally, so chaining
          # them avoids the CPU oversubscription the previous background fan-out caused.
          run_task legacy:www
          run_task legacy:src
          run_task legacy:test

          exit $exit_code

  backend-unit-test:
    runs-on: ubuntu-24.04
    needs: [get-environment, changes]
    if: |
      needs.changes.outputs.trigger_backend_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable' &&
      github.event.pull_request.head.repo.fork != true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ needs.get-environment.outputs.php_version }}
          coverage: none
        env:
          runner: ubuntu-24.04

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          working-directory: centreon-open-tickets
          composer-options: "--optimize-autoloader"

      - name: Unit test
        run: XDEBUG_MODE=coverage composer run-script test:ci
        working-directory: centreon-open-tickets

      - if: failure()
        uses: ./.github/actions/publish-report
        with:
          path: "centreon/build/phpunit.xml"
          format: "php-junit"

  gherkin-lint:
    needs: [get-environment, changes]
    if: |
      needs.changes.outputs.trigger_e2e_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable' &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/gherkin-lint
        with:
          features_path: ${{ env.e2e_directory }}

  e2e-lint:
    needs: [get-environment, changes]
    if: |
      needs.changes.outputs.trigger_e2e_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable' &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/frontend-lint
        with:
          frontend_directory: ${{ env.e2e_directory }}
          module_name: ${{ env.module }}
          dependencies_lock_file: ${{ env.e2e_directory }}/pnpm-lock.yaml
          pat: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          lint_path: './features'

  package:
    needs:
      [
        get-environment,
        changes,
        check-version-consistency,
        backend-lint,
        backend-unit-test,
        gherkin-lint,
        e2e-lint,
      ]
    if: |
      needs.changes.outputs.trigger_packaging == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      needs.get-environment.outputs.stability != 'stable' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      github.event.pull_request.head.repo.fork != true

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.package_matrix) }}

    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/centreon/delivery-tooling/packaging:${{ needs.get-environment.outputs.major_version }}-${{ matrix.operating_system }}

    name: package ${{ matrix.distrib }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Remove some providers from cloud version
        if: ${{ needs.get-environment.outputs.is_cloud == 'true' }}
        run: |
          rm -rf centreon-open-tickets/www/modules/centreon-open-tickets/providers/{BmcItsm,Mail,Serena}
          sed -i '/\(BmcItsm\|Mail\|Serena\)/d' centreon-open-tickets/www/modules/centreon-open-tickets/providers/register.php
        shell: bash

      - name: Package
        uses: ./.github/actions/package-nfpm
        with:
          nfpm_file_pattern: "centreon-open-tickets/packaging/*.yaml"
          module_name: centreon-open-tickets
          distrib: ${{ matrix.distrib }}
          package_extension: ${{ matrix.package_extension }}
          major_version: ${{ needs.get-environment.outputs.major_version }}
          minor_version: ${{ needs.get-environment.outputs.minor_version }}
          release: ${{ needs.get-environment.outputs.release }}
          arch: all
          commit_hash: ${{ github.sha }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-${{ matrix.package_extension }}-${{ matrix.distrib }}
          rpm_gpg_key: ${{ secrets.RPM_GPG_SIGNING_KEY }}
          rpm_gpg_signing_key_id: ${{ secrets.RPM_GPG_SIGNING_KEY_ID }}
          rpm_gpg_signing_passphrase: ${{ secrets.RPM_GPG_SIGNING_PASSPHRASE }}
          stability: ${{ needs.get-environment.outputs.stability }}
          php_version: ${{ needs.get-environment.outputs.php_version }}
          is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
          upload_artifacts: ${{ needs.get-environment.outputs.is_nightly == 'true' || contains(needs.get-environment.outputs.labels, 'upload-artifacts') && 'true' || 'false' }}

  dockerize:
    runs-on: ubuntu-24.04
    needs: [get-environment, changes, package]
    if: |
      needs.changes.outputs.trigger_packaging == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.get-environment.outputs.stability != 'stable' &&
      github.event.pull_request.head.repo.fork != true

    env:
      project: centreon-open-tickets
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.package_matrix) }}

    name: dockerize ${{ matrix.operating_system }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate information according to matrix os
        id: matrix_include
        run: |
          if [ "${{ matrix.operating_system }}" = "alma9" ]; then
            DISTRIB=el9
            PACKAGE_EXTENSION=rpm
          elif [ "${{ matrix.operating_system }}" = "alma10" ]; then
            DISTRIB=el10
            PACKAGE_EXTENSION=rpm
          elif [ "${{ matrix.operating_system }}" = "trixie" ]; then
            DISTRIB=trixie
            PACKAGE_EXTENSION=deb
          elif [ "${{ matrix.operating_system }}" = "jammy" ]; then
            DISTRIB=jammy
            PACKAGE_EXTENSION=deb
          else
            echo "::error::${{ matrix.operating_system }} is not managed"
            exit 1
          fi

          echo "distrib=$DISTRIB" >> $GITHUB_OUTPUT
          echo "package_extension=$PACKAGE_EXTENSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Login to registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_CENTREON_PUSH_USERNAME }}
          password: ${{ secrets.HARBOR_CENTREON_PUSH_TOKEN }}

      - name: Compute image tag
        id: image_tag
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          MAJOR_VERSION: ${{ needs.get-environment.outputs.major_version }}
        run: |
          if [[ "$REF" == "develop" ]]; then
            echo "tag=develop-${MAJOR_VERSION}" >> $GITHUB_OUTPUT
            echo "additional_tag=develop" >> $GITHUB_OUTPUT
          else
            SANITIZED_REF="$(printf '%s' "$REF" | sed -E 's#[^[:alnum:]_.-]+#-#g; s#^[.-]+##; s#-+#-#g' | cut -c1-128)"
            if [[ -z "$SANITIZED_REF" ]]; then
              echo "::error::Unable to derive a valid Docker tag from ref '$REF'"
              exit 1
            fi
            echo "tag=$SANITIZED_REF" >> $GITHUB_OUTPUT
            echo "additional_tag=" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Get FROM image tag
        id: from_image_version
        uses: ./.github/actions/get-docker-from-image-version
        with:
          from_image: centreon-web-${{ matrix.operating_system }}
          current_tag: ${{ steps.image_tag.outputs.tag }}
          major_version: ${{ needs.get-environment.outputs.major_version }}
          is_cloud: ${{ needs.get-environment.outputs.is_cloud }}
          registry_url: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}

      - name: Restore ${{ steps.matrix_include.outputs.package_extension }} files
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./*.${{ steps.matrix_include.outputs.package_extension }}
          key: ${{ github.sha }}-${{ github.run_id }}-${{ steps.matrix_include.outputs.package_extension }}-${{ steps.matrix_include.outputs.distrib }}
          fail-on-cache-miss: true

      - env:
          PACKAGE_EXTENSION: ${{ steps.matrix_include.outputs.package_extension }}
        run: |
          mkdir packages-centreon
          mv *."$PACKAGE_EXTENSION" packages-centreon/
        shell: bash

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Compute docker tags
        id: docker_tags
        env:
          REGISTRY: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}
          IMAGE: ${{ env.project }}-${{ matrix.operating_system }}
          TAG: ${{ steps.image_tag.outputs.tag }}
          ADDITIONAL: ${{ steps.image_tag.outputs.additional_tag }}
        run: |
          TAGS="${REGISTRY}/${IMAGE}:${TAG}"
          if [[ -n "$ADDITIONAL" ]]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:${ADDITIONAL}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build and push web image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          file: .github/docker/${{ env.project }}/${{ matrix.operating_system }}/Dockerfile
          context: .
          build-args: |
            "REGISTRY_URL=${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}"
            "FROM_IMAGE_VERSION=${{ steps.from_image_version.outputs.from_image_version }}"
          pull: true
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}

  deliver-sources:
    runs-on: centreon-common
    needs: [get-environment, package]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      contains(fromJson('["stable"]'), needs.get-environment.outputs.stability) &&
      github.event_name != 'workflow_dispatch' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      github.event.pull_request.head.repo.fork != true

    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Deliver sources
        uses: ./.github/actions/release-sources
        with:
          bucket_directory: centreon-open-tickets
          module_directory: centreon-open-tickets
          module_name: centreon-open-tickets
          major_version: ${{ needs.get-environment.outputs.major_version }}
          minor_version: ${{ needs.get-environment.outputs.minor_version }}
          token_download_centreon_com: ${{ secrets.TOKEN_DOWNLOAD_CENTREON_COM }}

  create-xray-test-plan-and-test-execution:
    needs: [get-environment, changes, dockerize]
    if: |
      needs.changes.outputs.trigger_e2e_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      (needs.get-environment.outputs.stability == 'testing' || needs.get-environment.outputs.is_nightly == 'true') &&
      github.event.pull_request.head.repo.fork != true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}
    name: create-xray-test-plan-and-test-execution-${{ matrix.operating_system }}

    uses: ./.github/workflows/create-xray-test-plan-and-test-execution.yml
    with:
      major_version: ${{ needs.get-environment.outputs.major_version }}
      minor_version: ${{ needs.get-environment.outputs.minor_version }}
      os: ${{ matrix.operating_system }}
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
    secrets:
      xray_client_id: ${{ secrets.XRAY_CLIENT_ID }}
      xray_client_secret: ${{ secrets.XRAY_CLIENT_SECRET }}
      xray_jira_user_email: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
      xray_jira_token: ${{ secrets.XRAY_JIRA_TOKEN }}

  e2e-test:
    needs:
      [get-environment, changes, create-xray-test-plan-and-test-execution, dockerize]
    if: |
      needs.changes.outputs.trigger_e2e_testing == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      needs.get-environment.outputs.stability != 'stable' &&
      github.event.pull_request.head.repo.fork != true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.os_and_database_matrix).operating_systems }}
    name: e2e-test-${{ matrix.operating_system }}-${{ matrix.database }}

    uses: ./.github/workflows/cypress-e2e-parallelization.yml
    with:
      name: e2e
      module_name: centreon-open-tickets
      image_name: centreon-open-tickets
      database_image: bitnamilegacy/${{ matrix.database }}
      os: ${{ matrix.operating_system }}
      features_path: tests/e2e/features
      major_version: ${{ needs.get-environment.outputs.major_version }}
      minor_version: ${{ needs.get-environment.outputs.minor_version }}
      stability: ${{ needs.get-environment.outputs.stability }}
      target_stability: ${{ needs.get-environment.outputs.target_stability }}
      package_cache_key: ${{ format('{0}-{1}-{2}', github.sha, github.run_id, case(matrix.operating_system == 'alma10', 'rpm-el10', matrix.operating_system == 'alma9', 'rpm-el9', 'deb-trixie') ) }}
      package_directory: centreon-open-tickets/tests/e2e/fixtures/packages
      test_tags: ${{ matrix.test_tags }}
      dependencies_lock_file: centreon-open-tickets/tests/e2e/pnpm-lock.yaml
      xray_keys_and_ids: ${{ toJson(needs.create-xray-test-plan-and-test-execution.outputs) }}
      is_cloud: ${{ needs.get-environment.outputs.is_cloud }}
      is_nightly: ${{ needs.get-environment.outputs.is_nightly }}
    secrets:
      registry_username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
      registry_password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}
      xray_client_id: ${{ secrets.XRAY_CLIENT_ID }}
      xray_client_secret: ${{ secrets.XRAY_CLIENT_SECRET }}
      jira_base_url: ${{ secrets.JIRA_BASE_URL }}
      jira_user_email: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
      jira_api_token: ${{ secrets.XRAY_JIRA_TOKEN }}
      github_models_token: ${{ secrets.CENTREON_TECHNIQUE_PAT }}

  deliver:
    needs: [get-environment, changes, package, e2e-test]
    if: |
      needs.changes.outputs.trigger_delivery == 'true' &&
      needs.get-environment.outputs.skip_workflow == 'false' &&
      contains(fromJson('["testing", "unstable"]'), needs.get-environment.outputs.stability) &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.package_matrix) }}

    name: deliver ${{ matrix.distrib }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Deliver RPM package
        if: matrix.package_extension == 'rpm'
        uses: ./.github/actions/rpm-delivery
        with:
          module_name: open-tickets
          distrib: ${{ matrix.distrib }}
          version: ${{ needs.get-environment.outputs.major_version }}
          artifactory_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-rpm-${{ matrix.distrib }}
          stability: ${{ needs.get-environment.outputs.stability }}
          release_type: ${{ needs.get-environment.outputs.release_type }}
          is_cloud: ${{ needs.get-environment.outputs.is_cloud }}
          delivery_type: ${{ needs.get-environment.outputs.delivery_type }}
          centreon_technique_pat: ${{ secrets.CENTREON_TECHNIQUE_PAT }}

      - name: Deliver DEB package
        if: matrix.package_extension == 'deb'
        uses: ./.github/actions/deb-delivery
        with:
          module_name: open-tickets
          distrib: ${{ matrix.distrib }}
          version: ${{ needs.get-environment.outputs.major_version }}
          artifactory_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-deb-${{ matrix.distrib }}
          stability: ${{ needs.get-environment.outputs.stability }}
          release_type: ${{ needs.get-environment.outputs.release_type }}
          is_cloud: ${{ needs.get-environment.outputs.is_cloud }}

  promote:
    needs: [get-environment, deliver]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      (contains(fromJson('["stable", "testing"]'), needs.get-environment.outputs.stability) && github.event_name != 'workflow_dispatch') &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include: ${{ fromJson(needs.get-environment.outputs.package_matrix) }}

    name: promote ${{ matrix.distrib }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Promote ${{ matrix.distrib }} to stable
        uses: ./.github/actions/promote-to-stable
        with:
          artifactory_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          module_name: open-tickets
          distrib: ${{ matrix.distrib }}
          major_version: ${{ needs.get-environment.outputs.major_version }}
          minor_version: ${{ needs.get-environment.outputs.minor_version }}
          stability: ${{ needs.get-environment.outputs.stability }}
          github_ref_name: ${{ github.ref_name }}
          release_type: ${{ needs.get-environment.outputs.release_type }}
          is_cloud: ${{ needs.get-environment.outputs.is_cloud }}

  set-skip-label:
    needs: [get-environment, deliver, promote]
    if: |
      needs.get-environment.outputs.skip_workflow == 'false' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/set-pull-request-skip-label.yml

  clear-branch-cache:
    runs-on: ubuntu-24.04
    needs: [get-environment, deliver]
    env:
      GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    if: |
      needs.get-environment.outputs.is_nightly == 'true' &&
      ! cancelled() &&
      ! contains(needs.*.result, 'failure') &&
      ! contains(needs.*.result, 'cancelled') &&
      github.event.pull_request.head.repo.fork != true
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: List and delete cache
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t cache_keys < <(gh cache list --ref "refs/heads/$REF_NAME" --json key -q '.[] | .key')
          echo $cache_keys
          while read row; do
            gh cache delete $row
            echo "Cache $row was deleted."
          done <<< "$cache_keys"
        shell: bash

  create-jira-nightly-ticket:
    runs-on: ubuntu-24.04
    needs: [
      get-environment,
      deliver
    ]
    if: |
      needs.get-environment.outputs.is_nightly == 'true' && github.run_attempt == 1 &&
      (failure() || cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) &&
      startsWith(github.ref_name, 'dev') &&
      github.event.pull_request.head.repo.fork != true
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create Jira ticket based on nightly build failure
        uses: ./.github/actions/create-jira-ticket
        with:
          jira_base_url: ${{ secrets.JIRA_BASE_URL }}
          jira_user_email: ${{ secrets.XRAY_JIRA_USER_EMAIL }}
          jira_api_token: ${{ secrets.XRAY_JIRA_TOKEN }}
          module_name: "centreon-open-tickets"
          ticket_reason_for_creation: "Nightly"
