{{- /* A Secret, not a ConfigMap: proxy URLs may carry credentials. */ -}}
{{- with .Values.proxy }}
{{- if .http }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "centreon-poller.fullname" $ }}-proxy
  labels:
    {{- include "centreon-poller.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := include "centreon-poller.proxyVars" $ | fromYaml }}
  {{ $name }}: {{ $value | quote }}
  {{ upper $name }}: {{ $value | quote }}
  {{- end }}
  99centreon-poller-proxy: |
    Acquire::http::Proxy "{{ .http }}";
    Acquire::https::Proxy "{{ .https | default .http }}";
{{- end }}
{{- end }}
