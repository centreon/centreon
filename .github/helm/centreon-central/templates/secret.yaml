{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "centreon-central.secretName" . }}
  labels:
    {{- include "centreon-central.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET: {{ required "secrets.appSecret is required" .Values.secrets.appSecret | quote }}
  SALT: {{ required "secrets.salt is required" .Values.secrets.salt | quote }}
  {{- if and .Values.database.bundled (ne (.Values.secrets.dbRootUser | default "root") "root") }}
  {{- fail "secrets.dbRootUser: the bundled MariaDB only has root (set it for an external database)" }}
  {{- end }}
  MYSQL_ROOT_USER: {{ .Values.secrets.dbRootUser | default "root" | quote }}
  MYSQL_ROOT_PASSWORD: {{ required "secrets.dbRootPassword is required" .Values.secrets.dbRootPassword | quote }}
  MYSQL_PASSWORD: {{ required "secrets.dbCentreonPassword is required" .Values.secrets.dbCentreonPassword | quote }}
  GORGONE_API_PASSWORD: {{ required "secrets.gorgoneApiPassword is required" .Values.secrets.gorgoneApiPassword | quote }}
  {{- with .Values.secrets.adminPassword }}
  ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- if or .Values.valkey.enabled (and .Values.valkey.external.host (not .Values.valkey.external.existingSecret)) }}
  VALKEY_PASSWORD: {{ required "secrets.valkeyPassword is required with valkey (never generated)" .Values.secrets.valkeyPassword | quote }}
  {{- end }}
  {{- if .Values.vault.enabled }}
  VAULT_ROLE_ID: {{ required "secrets.vaultRoleId is required with vault.enabled" .Values.secrets.vaultRoleId | quote }}
  VAULT_SECRET_ID: {{ required "secrets.vaultSecretId is required with vault.enabled" .Values.secrets.vaultSecretId | quote }}
  {{- end }}
{{- end }}
