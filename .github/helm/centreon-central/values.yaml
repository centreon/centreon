# Centreon central node on Kubernetes, built on the split httpd / php-fpm
# images. Defaults are a single-node dev/test profile close to
# .github/docker/centreon-web-split/docker-compose.yml; values-prod.yaml is
# the production overlay (replicas, RWX storage, autoscaling, external DB).
#
# One release per namespace: several Service names (db, fpm, httpd,
# gorgone-central, centreon-broker, cbd, centreon-rrdcached, valkey) are NOT
# release-prefixed on purpose.
# They are hostnames the install writes into the Centreon database
# (12-install.sh: cfg_centreonbroker_info host=centreon-broker,
# options.gorgone_api_address=gorgone-central) or that the images use.

imagePullSecrets: []

# Timezone of the central: PHP (fpm, install Job, CronJobs), the CronJob
# schedules and their containers' TZ, gorgone-central (cron module: scheduled
# autodiscovery jobs), and the central poller (engine evaluates
# timeperiods in it, like a VM in the server's local time). Set it at install
# and keep it: the install creates the database partitions in this timezone
# and the partitioning job must read them in the same one. The per-component
# values (fpm.phpTimezone, cronJobs.timeZone, centralPoller.engine.timezone,
# pollers[].timezone) override it; empty means this one.
timezone: Europe/Paris

images:
  fpm:
    repository: centreon-web-split-fpm
    tag: latest
    pullPolicy: IfNotPresent
  httpd:
    repository: centreon-web-split-httpd
    tag: latest
    pullPolicy: IfNotPresent
  # centreon-collect images: `develop` is a floating tag, so pullPolicy Always
  # (a node keeps whatever `develop` it pulled first otherwise). Pin an
  # immutable tag with IfNotPresent in production.
  # gorgone must carry native TYPE=central support (collect #3880).
  gorgone:
    repository: docker.centreon.com/centreon/centreon-gorgone-trixie
    tag: develop
    pullPolicy: Always
  # gorgone-central only (the poller pods keep images.gorgone): any key set
  # here overrides images.gorgone, e.g. to roll a central-side fix first.
  gorgoneCentral: {}
  engine:
    repository: docker.centreon.com/centreon/centreon-engine-trixie
    tag: develop
    pullPolicy: Always
  broker:
    repository: docker.centreon.com/centreon/centreon-broker-trixie
    tag: develop
    pullPolicy: Always
  # Scheduled jobs (cronJobs below): `--target cron` of the same Dockerfile.
  cron:
    repository: centreon-web-split-cron
    tag: latest
    pullPolicy: IfNotPresent
  # rrdcached sidecar of the broker pod (rrdcached.enabled): `--target
  # rrdcached` of the same Dockerfile.
  rrdcached:
    repository: centreon-web-split-rrdcached
    tag: latest
    pullPolicy: IfNotPresent
  # SNMP traps (centralPoller.traps / pollers[].traps): one image for both
  # containers (centreon/centreon#12403), the role is picked by the command.
  snmptrapd:
    repository: docker.centreon.com/centreon/centreon-trapd-trixie
    tag: develop
    pullPolicy: Always
  centreontrapd:
    repository: docker.centreon.com/centreon/centreon-trapd-trixie
    tag: develop
    pullPolicy: Always
  # VMware connector (centralPoller.vmware / pollers[].vmware). No public
  # image: it embeds the licensed VMware Perl SDK. Build it from
  # centreon-plugins with the SDK, push it to a private registry
  # (imagePullSecrets). Required when a vmware connector is enabled.
  vmware:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  # Official image (bitnamilegacy/mariadb until 0.43: frozen, no security
  # updates). Same data layout: see templates/db.yaml.
  mariadb:
    repository: mariadb
    tag: "11.8"
    pullPolicy: IfNotPresent
  # valkey.enabled. Official image, pinned by tag and digest (multi-arch
  # index).
  valkey:
    repository: valkey/valkey
    tag: "9.1.3-alpine"
    digest: "sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b"
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
# Never generated by the chart (no randAlphaNum/lookup): `lookup` is empty
# under `helm template` and ArgoCD, so a generated APP_SECRET/SALT would
# rotate on every sync and orphan everything already encrypted in the DB.
# Either point existingSecret at a Secret holding the keys below
# (APP_SECRET, SALT, MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD,
# GORGONE_API_PASSWORD, optional ADMIN_PASSWORD), or let the chart create one
# from these values.
secrets:
  existingSecret: ""
  # Identical on web, gorgone, centengine and centreon-broker (engine/broker
  # decrypt what web encrypts). No default: required without existingSecret,
  # e.g. 64 random hex characters each. Never change them on an existing
  # platform (everything encrypted in the database would become unreadable);
  # carry a VM's values when migrating.
  appSecret: ""
  salt: ""
  # MariaDB root password, used by the install Job (schema, upgrades, GRANT)
  # and by fpm (config files, install marker check).
  dbRootPassword: "centreon"
  # "centreon" DB user. Injected into the install fixture (database.json):
  # web config, broker outputs and gorgone-central use it. 12-install.sh
  # GRANTs 'centreon'@'%', which only works if the user already exists: the
  # bundled MariaDB pre-creates it, an external DB must too.
  dbCentreonPassword: "centreon"
  # Password of the centreon-gorgone service account (key
  # GORGONE_API_PASSWORD). The install Job sets it on every run (the split
  # install would otherwise leave it EMPTY); gorgone-central, the Central
  # poller's gorgone, the autodiscovery worker and the config-delivery Job
  # log in to the Centreon API with it, never with admin (remote pollers use
  # their own token). It is also gorgone-central's API basic auth password.
  # Change it here to rotate it.
  gorgoneApiPassword: "centreon-gorgone"
  # Web "admin" password set at the FIRST install (key ADMIN_PASSWORD,
  # optional). Empty = the image fixture's Centreon!2021. Not applied to an
  # existing database (change it in the UI there).
  adminPassword: ""
  # Vault AppRole (keys VAULT_ROLE_ID / VAULT_SECRET_ID), with vault.enabled.
  vaultRoleId: ""
  vaultSecretId: ""
  # Valkey password (key VALKEY_PASSWORD), required with valkey.enabled (or an
  # external Valkey without valkey.external.existingSecret). Never generated:
  # a new value on each ArgoCD sync would restart Valkey and log everyone
  # out. Any character works (fpm URL-encodes it).
  valkeyPassword: ""

# ---------------------------------------------------------------------------
# HashiCorp Vault: credentials stored in Vault instead of the database.
# ---------------------------------------------------------------------------
# Each pod reading Vault (fpm, autodiscovery worker, CronJobs, gorgone-central,
# broker, poller pods) writes /var/lib/centreon/vault/vault.json at startup
# (role_id/secret_id encrypted with APP_SECRET, what cbd requires) and turns
# the web's Vault feature flags on. The Vault configuration page of the UI no
# longer persists: change these values. After the first enabling, move the
# existing credentials to Vault once (bin/migrateCredentials.php in fpm).
vault:
  enabled: false
  # Vault server name, as its certificate states (clients verify it).
  address: ""
  port: 8200
  # KV v2 mount holding Centreon's secrets.
  rootPath: centreon
  # PEM of the CA that signed Vault's certificate, added to every pod's CA
  # bundle. Empty = the image's system CAs only.
  caCert: ""

# Centreon API user of gorgone, the autodiscovery worker and the
# config-delivery Job, and gorgone-central's API basic auth user: the
# dedicated service account, not admin.
centreonApiUsername: centreon-gorgone

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
database:
  # Bundled single-instance MariaDB (dev/test). Set bundled=false and
  # externalHost for a managed database (untested: the install runs
  # GRANT ALL ... WITH GRANT OPTION as root).
  bundled: true
  externalHost: ""
  # TCP port of the database (bundled: the port MariaDB listens on), for
  # every client: web, install, cron, gorgone, broker SQL outputs.
  port: 3306
  configurationDb: centreon
  storageDb: centreon_storage
  persistence:
    size: 10Gi
    storageClass: ""
  resources: {}
  # TLS from every database client: web (PHP), mysql CLI (install, waits),
  # cron (PHP and Perl jobs), broker SQL outputs, gorgone. Needed against a
  # server that requires it, e.g. AWS RDS MariaDB 11.8
  # (require_secure_transport=ON by default). externalHost must then be the
  # name in the server's certificate (the RDS endpoint), not an alias or an IP.
  tls:
    enabled: false
    # Check the server certificate against caCert (and its name).
    verifyServerCert: true
    # PEM bundle trusting the server, e.g. AWS RDS global-bundle.pem.
    # Required with verifyServerCert.
    caCert: ""
  # Dev/test: the bundled MariaDB requires TLS (like RDS 11.8), with the
  # certificate of this kubernetes.io/tls Secret (tls.crt, tls.key, ca.crt:
  # e.g. from cert-manager). Its names must include "db". Set database.tls
  # with ca.crt as caCert to connect.
  bundledTls:
    secretName: ""

# ---------------------------------------------------------------------------
# PHP sessions in Valkey
# ---------------------------------------------------------------------------
# Off (default): sessions are files on the shared centreon-web volume. On:
# fpm stores them in Valkey (PHP_SESSION_HANDLER=redis, with locking), the
# sessions directory is no longer mounted nor seeded. Users are logged out
# once when switching.
valkey:
  # In-chart single-replica StatefulSet + Service "valkey" (6379, fpm only).
  enabled: false
  persistence:
    # Off: emptyDir, a Valkey restart logs everyone out. On: AOF on a PVC.
    enabled: false
    size: 1Gi
    storageClass: ""
  resources: {}
  # An existing Valkey/Redis instead (with enabled=false). Its password: the
  # existingSecret's key, else secrets.valkeyPassword.
  external:
    host: ""
    port: 6379
    existingSecret: ""
    existingSecretKey: VALKEY_PASSWORD

# ---------------------------------------------------------------------------
# install Job: schema install / upgrade, module registration, SQL patches
# ---------------------------------------------------------------------------
# A plain Job (not a Helm hook: a hook would deadlock with `--wait` / ArgoCD
# PostSync, since fpm waits for the install). Its name derives from the fpm
# image reference, the chart version, runId and the install's environment,
# so a new image tag, chart version or install-related value runs it again
# (upgrade). Use immutable
# tags in prod: rebuilding "latest" does not re-run it. Bump runId to force a
# re-run. backoffLimit is 0 on purpose: 12-install.sh is not resumable, a
# retried half-install would report success on a broken schema.
install:
  runId: ""
  # First install only: force the admin to change its password at first
  # login (web UI; the REST API does not handle that state).
  adminPasswordExpired: false
  resources: {}

# ---------------------------------------------------------------------------
# fpm: Centreon web backend (php-fpm). Stateless apart from shared volumes.
# ---------------------------------------------------------------------------
fpm:
  replicas: 1
  # preStop waits 10 s (leave the Service endpoints) then stops php-fpm
  # gracefully: this must cover that wait + the longest request.
  terminationGracePeriodSeconds: 60
  # PHP date.timezone; empty = timezone above.
  phpTimezone: ""
  # PHP memory_limit of each php-fpm worker, as a PHP ini value ("512M",
  # "1536M"); empty = the image's 256M. The configuration generation runs in
  # one worker and needs ~375 MB at 10k hosts, ~1 GB at 30k: see "Sizing" in
  # the README, and keep resources.limits.memory above it (the pod holds the
  # other workers too).
  phpMemoryLimit: ""
  debug: false
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1
  extraEnv: []

# ---------------------------------------------------------------------------
# httpd: static assets, FastCGI proxy to fpm, wss proxy to gorgone-central
# ---------------------------------------------------------------------------
httpd:
  replicas: 1
  # Same graceful-stop logic as fpm; long-lived websockets end with it.
  terminationGracePeriodSeconds: 30
  # With UseCanonicalName On, Apache rebuilds self-referential URLs (incl.
  # the /centreon -> /centreon/ redirect) from this value, not from the Host
  # header. Empty = derived: ingress.host (https:// prefixed when
  # ingress.tls is set) if the ingress is enabled, else "localhost". Set it
  # explicitly to the [scheme://]host[:port] users browse to otherwise (e.g.
  # "localhost:28080" behind a port-forward).
  serverName: ""
  # The in-cluster name stays "httpd" (pollers, fpm, gorgone use it).
  service:
    type: ClusterIP          # NodePort / LoadBalancer to expose without ingress
    port: 80
    nodePort: ""             # NodePort / LoadBalancer only
    loadBalancerSourceRanges: []
    externalTrafficPolicy: ""
    annotations: {}
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1

# Routes host/ (UI, REST API, remote pollers' pullwss websocket) to httpd.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: centreon.local
  # Setting tls also switches the derived httpd.serverName to https://.
  tls: []
  #  - secretName: centreon-tls
  #    hosts: [centreon.local]

# ---------------------------------------------------------------------------
# gorgone-central (TYPE=central): singleton orchestrator
# ---------------------------------------------------------------------------
gorgoneCentral:
  resources: {}

# ---------------------------------------------------------------------------
# autodiscovery-worker: saves the hosts found by autodiscovery jobs (manual
# "Save" and automatic analysis) on the web tier, instead of gorgone running
# PHP. Needs a fpm image whose autodiscovery module has the
# centreon-autodiscovery:save-worker command and its
# mod_host_disco_save_request table.
# ---------------------------------------------------------------------------
autodiscoveryWorker:
  enabled: false
  # Keys overriding images.fpm (repository, tag, pullPolicy).
  image: {}
  # Seconds between two polls of the request queue when it is empty.
  pollInterval: 5
  # A request claimed longer than this (seconds) by a dead worker is retried.
  staleTimeout: 120
  # The worker finishes the save in progress on SIGTERM.
  terminationGracePeriodSeconds: 60
  # Liveness: the worker touches its heartbeat file after each successful
  # loop; a single save longer than this restarts it.
  heartbeatMaxAgeMinutes: 10
  resources: {}
  extraEnv: []

# Restricts gorgone-central's API (8085, basic auth only) to fpm, cron and the
# config-delivery Job, and pullwss (8087) to httpd; php-fpm (9000) to httpd;
# cbd's gRPC API (51001) to the Central poller pod (BBDO 5669 stays open);
# rrdcached (42217) and Valkey (6379) to fpm; the bundled database
# (database.port) to its clients. Poller pods (Central and pollers[]) only accept the CMA port
# 4317 (+ 162/udp with traps): their engine gRPC API (50155, no auth, can
# stop the engine) stays pod-local. Everything a poller does is
# outbound (pullwss, cbmod to the broker, checks), egress is not filtered.
networkPolicy:
  enabled: true
  pollers:
    # Sources allowed on 4317 (NetworkPolicy "from" peers: ipBlock,
    # namespaceSelector, podSelector); empty = anywhere. Behind a load balancer
    # that does not keep the client IP, filter there instead
    # (loadBalancerSourceRanges).
    otelFrom: []
    # Sources allowed on 162/udp when traps are enabled on a poller.
    trapsFrom: []
    # Extra ingress rules (NetworkPolicy ingress items) for the poller pods.
    extraIngress: []

# Configuration export ("generate + move + reload", UI and REST API).
configurationExport:
  # Timeout of the REST export's generation step (internal call to
  # generateFiles.php). 60 s covers a few thousand hosts; raise it for large
  # inventories (MON-213806 scale tests: ~10k hosts already take longer).
  # Derived from it: php max_execution_time (at least this + 60 s, never
  # below 300), httpd ProxyTimeout (at least this + 240 s for the REST
  # generate-and-reload, never below 300) and the config-delivery client.
  generationTimeoutSeconds: 60
  # Hosts processed per batch during generation (MON-214629): bounds PHP's
  # peak memory to roughly this size regardless of how many hosts the poller
  # has, instead of loading every host of the poller at once. 2000 keeps a
  # 10k-host poller under the packaged PHP_MEMORY_LIMIT default (256M).
  hostBatchSize: 2000

# One-shot Job after each install/upgrade (fpm image, no php-fpm): resyncs
# gorgone-central's node list, waits for the Central poller to connect, runs
# "generate + move + reload" once, exits. Later exports are the admin's job,
# as on a VM (the compose stack's every-60s loop is dev-only).
configDelivery:
  centralPollerId: "1"
  # Raised to 3 attempts of generate-and-reload when
  # configurationExport.generationTimeoutSeconds needs more.
  timeoutSeconds: 1800
  resources: {}

# ---------------------------------------------------------------------------
# Scheduled jobs: Centreon's /etc/cron.d/centreon + centstorage, one CronJob each
# ---------------------------------------------------------------------------
# Same schedules, users and commands as a VM install (tmpl/install/*.cron).
# Each run is a short-lived pod on the cron image, output in `kubectl logs`.
# Per job: `enabled: false` removes the CronJob, `suspend: true` keeps it but
# stops scheduling it (e.g. during a maintenance; `kubectl patch` works too).
# Optional per job too: `activeDeadlineSeconds` (kills a run that takes
# longer) and `resources` (overrides cronJobs.resources below).
cronJobs:
  enabled: true
  # The VM runs them in the server's local time. Empty = timezone above.
  timeZone: ""
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  resources: {}
  jobs:
    # ACL computation for non-admin users.
    centacl:
      enabled: true
      schedule: "* * * * *"
      user: www-data
      command: php -q /usr/share/centreon/cron/centAcl.php
    # Starts / stops recurrent downtimes.
    downtime-manager:
      enabled: true
      schedule: "*/5 * * * *"
      user: www-data
      command: php -q /usr/share/centreon/cron/downtimeManager.php
    event-report-builder:
      enabled: true
      schedule: "0 3 * * *"
      user: centreon
      command: /usr/share/centreon/cron/eventReportBuilder --config=/etc/centreon/conf.pm
    dashboard-builder:
      enabled: true
      schedule: "0 6 * * *"
      user: centreon
      command: /usr/share/centreon/cron/dashboardBuilder --config=/etc/centreon/conf.pm
    # Syncs knowledge-base links from a MediaWiki configured in Centreon
    # (Administration > Parameters > Knowledge Base). Without a wiki it only
    # prints "Wiki is not configured" every 5 min: enable it once one is set up.
    knowledge-synchronizer:
      enabled: false
      schedule: "*/5 * * * *"
      user: centreon
      command: php -q /usr/share/centreon/cron/centKnowledgeSynchronizer.php
    # Telemetry to statistics.centreon.com. A central ALWAYS sends the base
    # payload (UUID, versions, platform, auth options); options.send_statistics
    # only adds module statistics. Disabled here so dev/test/CI clusters don't
    # report; enabled in values-prod.yaml, as on a VM install.
    send-stats:
      enabled: false
      schedule: "0 0 * * *"
      user: centreon
      command: php -q /usr/share/centreon/cron/centreon-send-stats.php
      # Mounts the licence volume read-only (it reports whether a valid
      # licence exists). With a ReadWriteOnce class, pins the pod to fpm's node.
      licenses: true
    # No centreon-backup.pl job: the cron image has no MariaDB client, and a
    # backup written into the pod's ephemeral filesystem is lost when the Job
    # ends. Back up the database and the volumes instead (managed DB backups,
    # volume snapshots).
    token-removal:
      enabled: true
      schedule: "* * * * *"
      user: www-data
      command: /usr/share/centreon/cron/outdated-token-removal.php
    storage-purge:
      enabled: true
      schedule: "0 2 * * *"
      user: centreon
      command: php /usr/share/centreon/cron/centstorage_purge.php
    partitioning:
      enabled: true
      schedule: "0 4 * * *"
      user: centreon
      command: php /usr/share/centreon/cron/centreon-partitioning.php

# ---------------------------------------------------------------------------
# centreon-broker: central-broker-master (RRD output merged in), singleton
# ---------------------------------------------------------------------------
broker:
  resources: {}
  # Where central-broker-master keeps its queue while the database is down
  # (written on a clean stop, overflow beyond event_queue_max_size) so it
  # survives a broker restart. Mounted on the brokerCache volume; the install
  # Job points the master broker at it. Not covered: abrupt death (node loss,
  # OOM kill), in-memory events lost.
  cacheDirectory: /var/cache/centreon-broker
  # cbd (the image's PID 1) saves its queues on SIGTERM before exiting:
  # allow for a large backlog.
  terminationGracePeriodSeconds: 60
  # "centreon-broker" Service, BBDO 5669 only: remote pollers send their data
  # here (LoadBalancer/NodePort for pollers outside the cluster; BBDO is raw
  # TCP, no Ingress). cbd's gRPC API (51001, no auth) is on the separate
  # ClusterIP Service "cbd".
  service:
    type: ClusterIP
    nodePort: ""
    loadBalancerSourceRanges: []
    externalTrafficPolicy: ""
    annotations: {}

# rrdcached in the broker pod (sidecar, 42217/TCP): cbd sends its RRD updates
# to it, it writes them to the RRD files in batches (fewer disk writes than cbd
# writing every update itself). On by default for the storage: the RRD files
# live on a PVC, often network storage, where every small write is expensive.
# Switching it on or off re-runs the install Job (rrd_cached_option of the
# central rrd output) and the config delivery. No auth: ClusterIP Service
# "centreon-rrdcached", reachable from fpm only (networkPolicy). Needs a
# broker image whose TCP RRD output initializes its logger (centreon-collect
# MON-213839, see README "rrdcached"): set false with an older broker, cbd
# crashes on the first RRD update otherwise.
rrdcached:
  enabled: true
  resources: {}

# ---------------------------------------------------------------------------
# Central poller: Central's own engine (gorgone TYPE=poller + centengine)
# ---------------------------------------------------------------------------
# One pod: centengine's external command file is a FIFO shared with gorgone,
# which only works within one kernel.
centralPoller:
  # cbmod's cache directory (broker module inside centengine): its in-memory
  # queue is saved there on a clean stop (rollout, drain, upgrade) and
  # reloaded at start, so events buffered during a central broker outage
  # survive an engine restart. Mounted on a volume in every poller pod; the
  # install Job points the Central's cbmod at it, remote pollers need the
  # same "Cache directory" in their broker configuration in Centreon.
  # Not covered: abrupt death (node loss, OOM kill), in-memory events lost.
  cbmodCacheDirectory: /var/cache/centreon-engine
  gorgone:
    # Matches the Central nagios_server.id.
    uid: "1"
    # Fetches the real "poller-default" API token at startup (only for this
    # in-cluster Central poller — never hand the service-account API creds to
    # a remote one).
    pullwssTokenName: poller-default
    pullwssTokenFetchRetries: "90"
    resources: {}
  engine:
    # TZ of the central poller's engine and gorgone; empty = timezone above.
    timezone: ""
    port: "5669"
    resources: {}
  # OpenTelemetry / CMA gRPC server of the Central engine (4317), used by
  # Centreon Monitoring Agents once an agent configuration is attached to
  # the Central poller. Service "<release>-central-engine-otel".
  otel:
    # TLS identity presented to the agents (encryption "full" checks it
    # against the FQDN they dial). The engine's default CA has CN = pod host
    # name (<release>-central-poller-0) and no SAN, so it never matches an
    # external FQDN. Secret of type kubernetes.io/tls (tls.crt, tls.key,
    # optional ca.crt; cert-manager compatible) with the FQDN as SAN, copied
    # under tls.mountPath (key readable by centengine only). In the Central's
    # agent configuration in Centreon, set public certificate / private key
    # (/ CA certificate) to <mountPath>/tls.crt, tls.key (, ca.crt), then
    # export with Restart. Same value names as the centreon-poller chart.
    tls:
      existingSecret: ""
      # Or let cert-manager issue it (Secret "<release>-central-otel-tls").
      # The issuer is yours: e.g. a CA Issuer whose CA the agents trust.
      # Renewals are picked up at the next pod restart.
      certManager:
        enabled: false
        dnsNames: []           # FQDN(s) the agents dial; the first one is the CN
        issuerRef:
          name: ""
          kind: Issuer         # or ClusterIssuer
          group: cert-manager.io
        duration: 2160h        # 90 days
        renewBefore: 360h      # 15 days
        privateKey:
          algorithm: RSA
          size: 2048
          rotationPolicy: Always
      # Must stay under /etc/pki/ (enforced by the central's form).
      mountPath: /etc/pki/centreon-central
    service:
      enabled: true
      type: ClusterIP          # LoadBalancer / NodePort for agents outside the cluster
      port: 4317
      nodePort: ""
      loadBalancerSourceRanges: []
      externalTrafficPolicy: ""
      annotations: {}
  # SNMP traps: snmptrapd (162/udp) + centreontrapd in the poller pod, trap
  # definitions delivered by the central (Configuration > SNMP Traps >
  # Generate), kept in pollerData. Adds the Service
  # "<release>-central-snmptrap". centreontrapd matches the sender by source
  # IP: keep externalTrafficPolicy Local on a LoadBalancer (k3s klipper does
  # not keep it).
  traps:
    enabled: false
    logLevel: error
    service:
      type: ClusterIP          # LoadBalancer for devices outside the cluster
      port: 162
      nodePort: ""
      loadBalancerSourceRanges: []
      externalTrafficPolicy: Local
      annotations: {}
    snmptrapdResources: {}
    centreontrapdResources: {}
  # VMware connector (centreon-vmware:5700 for the engine's VMware plugins),
  # config delivered by the central into /etc/centreon. Needs images.vmware.
  vmware:
    enabled: false
    resources: {}
  debug: false

# ---------------------------------------------------------------------------
# Remote pollers (scaling out = adding pollers, not replicas)
# ---------------------------------------------------------------------------
# Each entry is a poller already created in Centreon ("Add Poller"):
# that gives its id and its pullwss token. Its broker output (cbmod) must
# point at the "centreon-broker" Service, set in the poller's broker config.
pollers: []
#  - name: poller-1            # k8s name suffix (lowercase), also the poller NAME
#    displayName: Poller-1     # optional: NAME when it differs from the k8s-safe name
#    id: "365810065858363403"  # GORGONE_UID: the --uid of the Add Poller install command (nagios_server.uid). Keep it quoted / --set-string: as a number it becomes 3.66e+17
#    tokenSecret:              # "<token-name>:<token-value>" from Add Poller
#      name: poller-1-gorgone
#      key: GORGONE_TOKEN
#    timezone: Europe/Paris    # optional: the poller's own TZ (default: timezone above)
#    resources: {}
#    persistence:              # optional, default persistence.local.pollerData / pollerSpool sizes
#      size: 1Gi               # poller-data
#      spoolSize: 5Gi          # poller-spool
#    traps:                    # same keys as centralPoller.traps; service merged over it.
#      enabled: false
#    vmware:
#      enabled: false

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
# Few volumes, each holding several directories (subPath): on a cloud a
# volume has a floor (EBS gp3: billed 1 GiB minimum, and every volume counts
# in the node's attachment limit), so small directories share one volume.
# Cross-pod volumes (sharedAccessMode) need ReadWriteMany on a multi-node
# cluster (EFS, NFS, CephFS...: billed on usage, the size below is only a
# request): centreonWeb (fpm rw; httpd, the autodiscovery worker and the
# send-stats CronJob ro), centreonRrd (broker and its rrdcached sidecar rw,
# fpm ro), pollerBroker (central poller rw, broker ro). With ReadWriteOnce every pod
# using them must land on the same node (fine for single-node dev).
persistence:
  # Per-pod volumes (and shared ones when sharedStorageClass is empty).
  storageClass: ""
  # Volumes in `shared` below: needs a ReadWriteMany-capable class on a
  # multi-node cluster (EFS, NFS, CephFS...), while `local` can stay on
  # block storage.
  sharedStorageClass: ""
  sharedAccessMode: ReadWriteOnce
  keepOnUninstall: false
  shared:
    # www/img/media, PHP sessions, licences imported through the UI, and the
    # generated config when fpm runs several replicas (with one replica it
    # is pod-local). A few MB.
    centreonWeb: { size: 1Gi }
    # RRD graphs, status/ + metrics/: about 330 KiB per file, one file per
    # metric and one per service (status). 25 GiB ~ 75,000 files.
    centreonRrd: { size: 25Gi }
    # /etc/centreon-broker, the delivered broker config (KB). Keep an existing
    # size: a PVC can only grow, and only if its class allows it.
    pollerBroker: { size: 256Mi }
  local:
    # Poller config and state (remote pollers: pollers[].persistence.size or
    # this size): engine config, /etc/centreon, the CMA CA (agents pin its
    # fingerprint), the traps DB, gorgone's history DB, and a remote poller's
    # broker config. Does not grow.
    pollerData: { size: 1Gi }
    # What a poller lets grow (pollers[].persistence.spoolSize or this size):
    # engine logs + retention.dat, and cbmod's queue while the broker is
    # unreachable. Apart from pollerData, so a full disk stops the logs and
    # the queue, not the config.
    pollerSpool: { size: 5Gi }
    # Master broker queue during a database outage (broker.cacheDirectory).
    brokerCache: { size: 2Gi }
  # Upgrade from chart <= 0.40 (one volume per directory): true for ONE
  # upgrade. Init containers copy the old volumes into the new ones (checked
  # file by file, a mismatch stops the pod), the old PVCs stay rendered with
  # helm.sh/resource-policy: keep and ArgoCD's Delete=false,Prune=false. Then
  # set it to false: the old PVCs are left orphaned (not deleted), delete
  # them by hand once checked. See README.
  # Empty (default): with the helm CLI the chart checks the cluster and
  # refuses to upgrade a <= 0.40 release; rendered WITHOUT cluster access
  # (ArgoCD, helm template) it refuses to render: set true or false there,
  # an absent volume cannot be read as "nothing to migrate".
  migrateLegacyVolumes:

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
