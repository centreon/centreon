paths:
  # Generated by `gh aw compile`: newer GitHub syntax and outputs set at runtime by gh-aw.
  .github/workflows/*.lock.yml:
    ignore:
      - 'unknown permission scope "copilot-requests"'
      - 'unexpected key "queue" for "concurrency" section'
      - 'property "(workflow_ref|admission-[a-z-]+)" is not defined'
