name: frontend-lint
description: Lint Frontend
inputs:
  frontend_directory:
    description: "The frontend source directory"
    required: true
  dependencies_lock_file:
    description: "The frontend dependencies lock file path"
    required: true
  module_name:
    description: "The module name"
    required: true
  command:
    description: The eslint command
    required: false
    default: eslint
  pat:
    description: "The personal access token"
    required: true
  lint_path:
    required: false
    description: "The path to lint"
    default: '.'

runs:
  using: "composite"

  steps:
    - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      with:
        version: 10
        run_install: false

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: ${{ inputs.dependencies_lock_file }}

    - name: Install dependencies
      run: |
        pnpm install \
          --frozen-lockfile \
          --config.trustPolicy=no-downgrade \
          --config.minimumReleaseAge=2880 \
          --config.blockExoticSubdeps=true
      working-directory: ${{ inputs.frontend_directory }}
      shell: bash
      env:
        CYPRESS_INSTALL_BINARY: "0"
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

    - name: Setup Biome CLI
      uses: biomejs/setup-biome@454fa0d884737805f48d7dc236c1761a0ac3cc13 # v2.6.0
      with:
        working-dir: ${{ inputs.frontend_directory }}
        token: ${{ inputs.pat }}
        version: 1.9.4

    - uses: mongolyy/reviewdog-action-biome@aed0b35b89586ed70a61e9749f2edd69c89e16fd # v1.13.0
      with:
        workdir: ${{ inputs.frontend_directory }}
        github_token: ${{ inputs.pat }}
        reporter: github-pr-check
        filter_mode: nofilter
        fail_level: error
        biome_flags: ${{ inputs.lint_path }}
