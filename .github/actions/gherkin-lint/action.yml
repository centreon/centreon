name: gherkin-lint
description: "Check the linting of the gherkin files"
inputs:
  features_path:
    description: The path to the feature files
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24

    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: 10
        run_install: |
          cwd: ".github/actions/gherkin-lint"
          args: [--ignore-scripts, --frozen-lockfile]

    - name: Run Gherkin Lint
      env:
        FEATURES_PATH: ${{ inputs.features_path }}
      run: ./.github/actions/gherkin-lint/node_modules/.bin/gplint -c ./.github/actions/gherkin-lint/.gherkin-lintrc "$FEATURES_PATH"
      shell: bash
