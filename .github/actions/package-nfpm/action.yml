name: package-nfpm
description: Package module using nfpm
inputs:
  nfpm_file_pattern:
    description: The pattern of the nfpm configuration file(s)
    required: true
  module_name:
    description: The name of the module to be packaged
    required: true
  package_extension:
    description: The package extension (deb or rpm)
    required: true
  distrib:
    description: The package distrib
    required: true
  major_version:
    description: The major version
    required: false
  minor_version:
    description: The minor version
    required: false
  release:
    description: The package release number
    required: false
  arch:
    description: The package architecture
    required: false
  commit_hash:
    description: The commit hash
    required: true
  cache_key:
    description: The name of the run artifact holding the built package files (consumed by downstream dockerize/deliver jobs)
    required: true
  rpm_gpg_key:
    description: The rpm gpg key
    required: true
  rpm_gpg_signing_key_id:
    description: The rpm gpg signing key identifier
    required: true
  rpm_gpg_signing_passphrase:
    description: The rpm gpg signing passphrase
    required: true
  stability:
    description: "branch stability (stable, testing, unstable, canary)"
    required: true
  is_nightly:
    description: "nightly status"
    required: false
  upload_artifacts:
    description: "Upload packages as artifacts"
    required: false
    default: "false"

runs:
  using: composite

  steps:
    - name: Remove lockfiles and development files
      env:
        MODULE_NAME: ${{ inputs.module_name }}
      run: |
        find "$MODULE_NAME" -type f -name "compose*.*" -not -path "*vendor*" -delete
        find "$MODULE_NAME" -type f -name "package*.*" -not -path "*vendor*" -delete
        find "$MODULE_NAME" -type f -name "pnpm*.*" -not -path "*vendor*" -delete
        find "$MODULE_NAME" -type f -name "symfony.lock" -delete
      shell: bash

    - name: Parse distrib name
      id: parse-distrib
      uses: ./.github/actions/parse-distrib
      with:
        distrib: ${{ inputs.distrib }}

    - name: Import gpg key
      env:
        RPM_GPG_SIGNING_KEY: ${{ inputs.rpm_gpg_key }}
      run: echo -n "$RPM_GPG_SIGNING_KEY" > key.gpg
      shell: bash

    - name: Build ${{ inputs.package_extension }} files
      env:
        RPM_GPG_SIGNING_KEY_ID: ${{ inputs.rpm_gpg_signing_key_id }}
        RPM_GPG_SIGNING_PASSPHRASE: ${{ inputs.rpm_gpg_signing_passphrase }}
        INPUT_MAJOR_VERSION: ${{ inputs.major_version }}
        INPUT_MINOR_VERSION: ${{ inputs.minor_version }}
        INPUT_RELEASE: ${{ inputs.release }}
        INPUT_ARCH: ${{ inputs.arch }}
        INPUT_PACKAGE_EXTENSION: ${{ inputs.package_extension }}
        INPUT_NFPM_FILE_PATTERN: ${{ inputs.nfpm_file_pattern }}
        INPUT_COMMIT_HASH: ${{ inputs.commit_hash }}
        INPUT_PACKAGE_DISTRIB_NAME: ${{ steps.parse-distrib.outputs.package_distrib_name }}
        INPUT_PACKAGE_DISTRIB_SEPARATOR: ${{ steps.parse-distrib.outputs.package_distrib_separator }}
      run: |
        export MAJOR_VERSION="$INPUT_MAJOR_VERSION"
        export VERSION="$INPUT_MAJOR_VERSION.$INPUT_MINOR_VERSION"
        export RELEASE="$INPUT_RELEASE"
        export ARCH="$INPUT_ARCH"

        if  [ "$INPUT_PACKAGE_EXTENSION" = "rpm" ]; then
          export DIST="$INPUT_PACKAGE_DISTRIB_SEPARATOR$INPUT_PACKAGE_DISTRIB_NAME"
          export APACHE_USER="apache"
          export APACHE_GROUP="apache"
        else
          export DIST=""
          export RELEASE="$RELEASE$INPUT_PACKAGE_DISTRIB_SEPARATOR$INPUT_PACKAGE_DISTRIB_NAME"
          export APACHE_USER="www-data"
          export APACHE_GROUP="www-data"
        fi

        MAJOR_LEFT=$( echo $MAJOR_VERSION | cut -d "." -f1 )
        MAJOR_RIGHT=$( echo $MAJOR_VERSION | cut -d "-" -f1 | cut -d "." -f2 )
        BUMP_MAJOR_RIGHT=$(( MAJOR_RIGHT_PART + 1 ))
        if [ "$MAJOR_RIGHT" = "04" ]; then
          BUMP_MAJOR_LEFT="$MAJOR_LEFT"
          BUMP_MAJOR_RIGHT="10"
        else
          BUMP_MAJOR_LEFT=$(( $MAJOR_LEFT + 1 ))
          BUMP_MAJOR_RIGHT="04"
        fi

        export NEXT_MAJOR_VERSION="$BUMP_MAJOR_LEFT.$BUMP_MAJOR_RIGHT"

        export RPM_SIGNING_KEY_FILE="$(pwd)/key.gpg"
        export RPM_SIGNING_KEY_ID="$RPM_GPG_SIGNING_KEY_ID"
        export NFPM_RPM_PASSPHRASE="$RPM_GPG_SIGNING_PASSPHRASE"

        REPO_ROOT=$(pwd)
        for FILE in $INPUT_NFPM_FILE_PATTERN; do
          DIRNAME=$(dirname $FILE)
          BASENAME=$(basename $FILE)
          cd $DIRNAME
          if [[ "$RPM_SIGNING_KEY_ID" == "" ]]; then
            sed -i "/signature:/d" $BASENAME
            sed -i "/RPM_SIGNING_KEY_FILE/d" $BASENAME
            sed -i "/RPM_SIGNING_KEY_ID/d" $BASENAME
          fi
          sed -i "s/@APACHE_USER@/$APACHE_USER/g" $BASENAME
          sed -i "s/@APACHE_GROUP@/$APACHE_GROUP/g" $BASENAME
          sed -i "s/@COMMIT_HASH@/$INPUT_COMMIT_HASH/g" $BASENAME
          if [[ "$INPUT_PACKAGE_EXTENSION" == "deb" ]]; then
            PKG_LICENSE=$(grep '^license:' "$BASENAME" | head -1 | sed 's/^license: *//;s/"//g' | xargs)
            COPYRIGHT_SRC=""
            if [[ -f "${REPO_ROOT}/copyright.${PKG_LICENSE}" ]]; then
              COPYRIGHT_SRC="${REPO_ROOT}/copyright.${PKG_LICENSE}"
            else
              for candidate in "${REPO_ROOT}/LICENSE.md" "${REPO_ROOT}/LICENSE"; do
                [[ -f "$candidate" ]] && COPYRIGHT_SRC="$candidate" && break
              done
            fi
            if [[ -n "$COPYRIGHT_SRC" ]]; then
              cp "$COPYRIGHT_SRC" ./copyright
              PACKAGE_NAME=$(grep '^name:' "$BASENAME" | head -1 | sed 's/^name: *//;s/"//g' | xargs)
              awk -v pkg="$PACKAGE_NAME" 'BEGIN{in_contents=0;injected=0} /^contents:/{in_contents=1} in_contents && /^[a-z]/ && !/^contents:/ && !injected{print "  - src: ./copyright"; print "    dst: /usr/share/doc/" pkg "/copyright"; print "    packager: deb"; injected=1; in_contents=0} {print} END{if(!injected){if(!in_contents){print "contents:"} print "  - src: ./copyright"; print "    dst: /usr/share/doc/" pkg "/copyright"; print "    packager: deb"}}' "$BASENAME" > "${BASENAME}.tmp" && mv "${BASENAME}.tmp" "$BASENAME"
            fi
          fi
          nfpm package --config $BASENAME --packager "$INPUT_PACKAGE_EXTENSION"
          cd -
          mv $DIRNAME/*."$INPUT_PACKAGE_EXTENSION" ./
        done
      shell: bash

    # Pass packages to downstream jobs via run artifact (atomic) instead of cache
    - name: Upload packages for downstream jobs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.cache_key }}
        path: ./*.${{ inputs.package_extension }}
        retention-days: 1
        if-no-files-found: error

    # Add 'upload-artifacts' label to pull request to get packages as artifacts
    - if: inputs.upload_artifacts == 'true'
      name: Upload package artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.module_name }}-${{ inputs.arch != '' && format('packages-{0}-{1}', inputs.distrib, inputs.arch) || format('packages-{0}', inputs.distrib) }}
        path: ./*.${{ inputs.package_extension }}
        retention-days: 1
