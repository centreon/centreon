name: "promote docker image to ghcr.io stable"
description: >
  Promote an already-built Harbor image to ghcr.io stable (manifest retag,
  no rebuild). Fails hard if the deterministic version_tag candidate isn't
  found on Harbor, or if the ghcr.io push itself fails — callers should wrap
  this with continue-on-error and warn on failure, mirroring
  promote-to-stable-pulp.
inputs:
  ghcr_image:
    description: "Destination image ref on ghcr.io, no tag (e.g. ghcr.io/centreon/centreon-gorgone)"
    required: true
  harbor_image:
    description: "Source image ref on Harbor, no tag"
    required: true
  harbor_tag:
    description: >
      Deterministic version_tag candidate to promote (e.g. 26.10.5). Must be
      a tag only ever written after the image's own container e2e tests
      (docker-boot-test/docker-config-wiring-test) have passed — there is no
      fallback to any pre-validation tag, by design.
    required: true
  ghcr_tags:
    description: "Space-separated list of tags to create on ghcr.io"
    required: true
  platforms:
    description: >
      Comma-separated platform list, informational only for now: the
      manifest list is built from every platform manifest found on the
      source Harbor tag, not filtered by this value.
    required: false
    default: "linux/amd64,linux/arm64"

runs:
  using: "composite"
  steps:
    - name: Verify Harbor candidate exists
      shell: bash
      env:
        HARBOR_IMAGE: ${{ inputs.harbor_image }}
        HARBOR_TAG: ${{ inputs.harbor_tag }}
      run: |
        if ! docker buildx imagetools inspect "$HARBOR_IMAGE:$HARBOR_TAG" > /dev/null 2>&1; then
          echo "::error::No candidate image found on Harbor at $HARBOR_IMAGE:$HARBOR_TAG."
          exit 1
        fi

    - name: Promote Harbor candidate to ghcr.io
      shell: bash
      env:
        GHCR_IMAGE: ${{ inputs.ghcr_image }}
        HARBOR_IMAGE: ${{ inputs.harbor_image }}
        HARBOR_TAG: ${{ inputs.harbor_tag }}
        GHCR_TAGS: ${{ inputs.ghcr_tags }}
        PLATFORMS: ${{ inputs.platforms }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/docker-push-to-ghcr.sh"
