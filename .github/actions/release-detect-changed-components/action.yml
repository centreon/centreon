name: Detect components and collect commit lists
description: Detect changed components and generate per-component commit lists

inputs:
  base_sha:
    description: ref for the base (latest stable release bundle tag)
    required: true
  head_sha:
    description: ref for current release or hotfix branch
    required: true
  components_file:
    description: release-components.json read at head_sha
    required: true

outputs:
  changed_components:
    description: changed component list
    value: ${{ steps.detect-changed-components.outputs.changed_components }}

runs:
  using: composite
  steps:
    - name: Detect changed components
      id: detect-changed-components
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
        COMPONENTS_FILE: ${{ inputs.components_file }}
      run: |
        .github/scripts/release/release-detect-changed-components.sh "$BASE_SHA" "$HEAD_SHA" "$COMPONENTS_FILE"
        echo "changed_components=$(tr '\n' ' ' < artifacts/changed-components.txt)" >> "$GITHUB_OUTPUT"

    - name: Build commit list of the release
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
        COMPONENTS_FILE: ${{ inputs.components_file }}
      run: |
        .github/scripts/release/release-generate-commit-lists.sh "$BASE_SHA" "$HEAD_SHA" "$COMPONENTS_FILE"

    - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: component-commit-lists
        path: artifacts
        retention-days: 1
