name: Workflow incident tracking
description: Create Jira ticket on incident

inputs:
  jira_base_url:
    required: true
    description: jira base url
  jira_user_email:
    required: true
    description: jira user email
  jira_api_token:
    required: true
    description: jira api token
  module_name:
    required: true
    description: module name
  ticket_reason_for_creation:
    required: true
    description: reason for ticket creation
    default: "Nightly"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
      with:
        node-version: 20

    - name: Install Gherkin Lint
      run: npm install dayjs
      shell: bash

    - name: Get ticket elements from context
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      env:
        GH_TOKEN: ${{ github.token }}
        TICKET_REASON_FOR_CREATION: ${{ inputs.ticket_reason_for_creation }}
        MODULE_NAME: ${{ inputs.module_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        REF_NAME: ${{ github.ref_name }}
      id: get_context
      with:
        script: |
          const fs = require('fs');
          const { execSync } = require('child_process');
          const dayjs = require('dayjs');
          const isoWeek = require('dayjs/plugin/isoWeek');
          dayjs.extend(isoWeek);

          const parent_epic_id = 206242
          const parent_epic_key = "MON-151547"
          const JSON_TEMPLATE_FILE = "./.github/actions/create-jira-ticket/nightly-ticket-template.json";
          const date = dayjs().format('YYYY-MM-DD');
          let data, ticket_summary, ticket_squad_id, ticket_board_id, squad_name, ticket_labels, current_sprint, failed_steps;

          let failed_jobs = execSync(
            `gh run view ${{ github.run_id }} --json jobs -q '.jobs[] | select(.conclusion == "failure") | .name'`,
            { encoding: 'utf8' }
          );

          failed_jobs = failed_jobs
            .split('\n')
            .map(line => line.trim())
            .filter(Boolean);

          console.log(failed_jobs);

          for (const failed_job of failed_jobs) {
            ticket_labels = ["Pipeline", "${{ inputs.ticket_reason_for_creation }}" ]
              console.log(`Failed job: ${failed_job}`);
            if (ticket_labels.includes("Nightly")) {
              ticket_summary = `${date} ${process.env.MODULE_NAME}-${process.env.REF_NAME} nightly build failure on ${failed_job}`
              console.log(`Failed job: ${failed_job}`);

              data = fs.readFileSync(JSON_TEMPLATE_FILE, { encoding: 'utf8' });
              data = data.replace(/@MODULE_NAME@/g, process.env.MODULE_NAME);
              data = data.replace(/@DATE@/g, date);

              data = data.replace(/@GITHUB_BRANCH@/g, '${{ github.base_ref || github.ref_name }}');
              data = data.replace(/@GITHUB_SERVER_URL@/g, '${{ github.server_url }}');
              data = data.replace(/@FAILED_JOB@/g, failed_job);
              data = data.replace(/@GITHUB_REPOSITORY@/g, '${{ github.repository }}');
              data = data.replace(/@GITHUB_RUN_ID@/g, '${{ github.run_id }}');
              data = data.replace(/@GITHUB_RUN_ATTEMPT@/g, '${{ github.run_attempt }}');
              data = data.replace(/@FAILED_JOB@/g, failed_job);
            } else {
              throw new Error(`❌ Could not find any labelling option for the ticket.`);
            }

            if (["get-environment", "package", "dockerize", "deliver-rpm", "deliver-deb", "translation-build"].includes(failed_job)) {

            fs.writeFileSync(JSON_TEMPLATE_FILE, data, { encoding: 'utf8' });

            } else if (["frontend-web-lint", "frontend-web-build", "frontend-component-test", "e2e-test", "legacy-e2e-test", "newman-test"].includes(failed_job)) {
              ticket_squad_id = 10524
              ticket_board_id = 184
              squad_name = "DEVSECOPS"
            } else if (["frontend-web-lint", "frontend-web-build", "frontend-component-test", "e2e-test", "legacy-e2e-test", "newman-test"].includes(failed_job)) {
              if (dayjs().isoWeek() % 4 >= 2) {
                ticket_squad_id = 10625
                ticket_board_id = 213
                squad_name = "METROPOLIS"
              } else {
                ticket_squad_id = 10882
                ticket_board_id = 225
                squad_name = "GOTHAM"
              }
            }

            console.log(`Ticket summary: ${ticket_summary}`);
            console.log(`Ticket will be attributed to the ${squad_name} team. (Squad ID ${ticket_squad_id}, Board ID ${ticket_board_id})`)
            console.log(`Ticket summary: ${ticket_summary}`);
            current_sprint = execSync(
              `curl --request GET --url ${{ inputs.jira_base_url }}/rest/agile/1.0/board/$ticket_board_id/sprint?state=active --user "${{ inputs.jira_user_email }}:${{ inputs.jira_api_token }}" --header "Accept: application/json" | jq --arg squad_name "$squad_name" '.values[] | select(.name | test($squad_name; "i")) | .id'`,
              { encoding: 'utf8' }
            );

            console.log(current_sprint);

            failed_steps = execSync(
              `gh run view ${{ github.run_id }} --json jobs | jq -r --arg failed_job "$failed_job" '.jobs[] | select(.name == $failed_job) | .name'`,
              { encoding: 'utf8' }
            );

            console.log(failed_steps);
          }

