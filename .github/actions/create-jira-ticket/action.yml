name: Workflow incident tracking
description: Create Jira ticket on incident

inputs:
  jira_base_url:
    required: true
    description: jira base url
  jira_user_email:
    required: true
    description: jira user email
  jira_api_token:
    required: true
    description: jira api token
  module_name:
    required: true
    description: module name
  ticket_reason_for_creation:
    required: true
    description: reason for ticket creation
    default: "Nightly"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24

    - if: inputs.ticket_reason_for_creation == 'Nightly'
      name: Create nightly epic if it does not exist already
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        GH_TOKEN: ${{ github.token }}
        JIRA_USER_EMAIL: ${{ inputs.jira_user_email }}
        JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
        JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        TICKET_REASON: ${{ inputs.ticket_reason_for_creation }}
      id: get_nightly_epic
      with:
        script: |
          const fs = require('fs');
          const { execSync } = require('child_process');
          const now = new Date();
          const month = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
          const path = './epic-payload.json';

          const JIRA_USER_EMAIL = process.env.JIRA_USER_EMAIL;
          const JIRA_API_TOKEN = process.env.JIRA_API_TOKEN;
          const JIRA_BASE_URL = process.env.JIRA_BASE_URL;
          const TICKET_REASON = process.env.TICKET_REASON;

          let ticket_summary = `centreon-oss nightly incidents on ${month}`
          let nightly_epic_id, nightly_epic_key;

          const encodedJql = encodeURIComponent(`project = "MON" AND summary ~ "${ticket_summary}" AND type = Epic`);

          let response = JSON.parse(
            execSync(
              `curl --request GET \
                --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
                --header "Accept: application/json" \
                --url "${JIRA_BASE_URL}/rest/api/3/search/jql?jql=${encodedJql}&fields=summary,key&maxResults=1"`,
            { encoding: 'utf-8' }
            )
          );

          console.log("response:\n", response);
          total = response.issues.length;
          console.log(`Number of epics with this name: ${total}`);

          if (total === 0) {
            ticket_data =
              {
                "fields": {
                  "summary": ticket_summary,
                  "project": {"key": "MON"},
                  "issuetype": {"id": "10000"},
                  "labels": ["Pipeline", TICKET_REASON ]
                }
              }

            fs.writeFileSync(path, JSON.stringify(ticket_data));

            let response = execSync(
              `curl --request POST \
                --url "${JIRA_BASE_URL}/rest/api/3/issue" \
                --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
                --header 'Accept: application/json' \
                --header 'Content-Type: application/json' \
                --data @${path}
              `,
              { encoding: 'utf8' }
            );

            nightly_epic_id = JSON.parse(response).id;
            nightly_epic_key = JSON.parse(response).key;
            console.log(`An epic for the current month and project (ID ${nightly_epic_id}, key ${nightly_epic_key}) has been created.`);
          } else {
            nightly_epic_id = response.issues[0].id;
            nightly_epic_key = response.issues[0].key;
            console.log(`An epic for the current month and project (ID ${nightly_epic_id}, key ${nightly_epic_key}) has already been found.`);
          }

          core.setOutput('nightly_epic_id', nightly_epic_id);
          core.setOutput('nightly_epic_key', nightly_epic_key);

    - name: Get ticket elements from context and create the incident ticket
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        GH_TOKEN: ${{ github.token }}
        JIRA_USER_EMAIL: ${{ inputs.jira_user_email }}
        JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
        JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        MODULE_NAME: ${{ inputs.module_name }}
        TICKET_REASON: ${{ inputs.ticket_reason_for_creation }}
        NIGHTLY_EPIC_ID: ${{ steps.get_nightly_epic.outputs.nightly_epic_id }}
        NIGHTLY_EPIC_KEY: ${{ steps.get_nightly_epic.outputs.nightly_epic_key }}
        GITHUB_BRANCH: ${{ github.base_ref || github.ref_name }}
      id: get_context
      with:
        script: |
          const fs = require('fs');
          const { execSync } = require('child_process');
          function formatDate(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
          }
          function getIsoWeek(date) {
            const temp = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNumber = temp.getUTCDay() || 7;
            temp.setUTCDate(temp.getUTCDate() + 4 - dayNumber);
            const yearStart = new Date(Date.UTC(temp.getUTCFullYear(), 0, 1));
            return Math.ceil((((temp - yearStart) / 86400000) + 1) / 7);
          }
          const now = new Date();
          const date = formatDate(now);
          const isoWeekNumber = getIsoWeek(now);
          const JIRA_USER_EMAIL = process.env.JIRA_USER_EMAIL;
          const JIRA_API_TOKEN = process.env.JIRA_API_TOKEN;
          const JIRA_BASE_URL = process.env.JIRA_BASE_URL;
          const MODULE_NAME = process.env.MODULE_NAME;
          const TICKET_REASON = process.env.TICKET_REASON;
          const GITHUB_BRANCH = process.env.GITHUB_BRANCH;
          const GITHUB_SERVER_URL = process.env.GITHUB_SERVER_URL;
          const GITHUB_REPOSITORY = process.env.GITHUB_REPOSITORY;
          const GITHUB_RUN_ID = process.env.GITHUB_RUN_ID;
          const GITHUB_RUN_ATTEMPT = process.env.GITHUB_RUN_ATTEMPT;
          const nightly_epic_id = parseInt(process.env.NIGHTLY_EPIC_ID, 10);
          const nightly_epic_key = process.env.NIGHTLY_EPIC_KEY;
          const JSON_TEMPLATE_FILE = "./.github/actions/create-jira-ticket/nightly-ticket-template.json";
          const path = './ticket-payload.json';
          let contents, data, ticket_summary, ticket_squad_id, ticket_board_id, squad_name, ticket_labels, current_sprint, ticket_data, ticket_key;

          let failed_jobs = JSON.parse(execSync(
            `gh run view ${GITHUB_RUN_ID} --json jobs -q '[.jobs[] | select(.conclusion == "failure") | .name | split(" ")[0] ] | unique'`,
            { encoding: 'utf8' }
          ));
          console.log(failed_jobs);

          for (const failed_job of failed_jobs) {
            ticket_labels = ["Pipeline", TICKET_REASON ]
            console.log(`Failed job: ${failed_job}`);
            if (ticket_labels.includes("Nightly")) {
              ticket_summary = `${MODULE_NAME}-${GITHUB_BRANCH} nightly build failure on ${failed_job}`

              data = fs.readFileSync(JSON_TEMPLATE_FILE, { encoding: 'utf8' });
              data = data.replace(/@MODULE_NAME@/g, MODULE_NAME);
              data = data.replace(/@DATE@/g, date);

              data = data.replace(/@GITHUB_BRANCH@/g, GITHUB_BRANCH);
              data = data.replace(/@GITHUB_SERVER_URL@/g, GITHUB_SERVER_URL);
              data = data.replace(/@FAILED_JOB@/g, failed_job);
              data = data.replace(/@GITHUB_REPOSITORY@/g, GITHUB_REPOSITORY);
              data = data.replace(/@GITHUB_RUN_ID@/g, GITHUB_RUN_ID);
              data = data.replace(/@GITHUB_RUN_ATTEMPT@/g, GITHUB_RUN_ATTEMPT);
            } else {
              throw new Error(`❌ Could not find any labelling option for the ticket.`);
            }

            console.log(data);

            if (["changes", "get-environment", "check-version-consistency", "package", "dockerize", "deliver-rpm", "deliver-deb", "translation-build", "deliver-sources"].includes(failed_job)) {
              ticket_squad_id = 10524
              ticket_board_id = 184
              squad_name = "DEVSECOPS"
            } else if (["gherkin-lint", "frontend-web-build", "backend-dependencies", "frontend-web-lint", "frontend-unit-test", "frontend-component-test", "backend-unit-test", "backend-lint", "e2e-test", "performances-test"].includes(failed_job)) {
              if (isoWeekNumber % 4 >= 2) {
                ticket_squad_id = 10625
                ticket_board_id = 213
                squad_name = "METROPOLIS"
              } else {
                ticket_squad_id = 10882
                ticket_board_id = 225
                squad_name = "GOTHAM"
              }
            } else {
              core.setFailed(`Not finding any squad association with job ${failed_job}.`);
              continue;
            }

            console.log(`Ticket summary: ${ticket_summary}`);
            console.log(`Ticket will be attributed to the ${squad_name} team. (Squad ID ${ticket_squad_id}, Board ID ${ticket_board_id})`)

            const encodedJql = encodeURIComponent(`project = "MON" AND summary ~ "${ticket_summary}" AND statusCategory NOT IN (Done)`);
            let response = JSON.parse(
              execSync(
                `curl --request GET \
                  --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
                  --header "Accept: application/json" \
                  --url "${JIRA_BASE_URL}/rest/api/3/search/jql?jql=${encodedJql}&fields=summary,key&maxResults=1"`,
              { encoding: 'utf-8' }
              )
            );
            console.log("response:\n", response);

            total = response.issues.length;
            console.log(`Number of tickets with this name: ${total}`);

            if (total === 0) {
              ticket_summary = `${date} ${ticket_summary}`;

              data = data.replace(/@MODULE_NAME@/g, MODULE_NAME);
              data = data.replace(/@DATE@/g, date);

              data = data.replace(/@GITHUB_BRANCH@/g, GITHUB_BRANCH);
              data = data.replace(/@GITHUB_SERVER_URL@/g, GITHUB_SERVER_URL);
              data = data.replace(/@FAILED_JOB@/g, failed_job);
              data = data.replace(/@GITHUB_REPOSITORY@/g, GITHUB_REPOSITORY);
              data = data.replace(/@GITHUB_RUN_ID@/g, GITHUB_RUN_ID);
              data = data.replace(/@GITHUB_RUN_ATTEMPT@/g, GITHUB_RUN_ATTEMPT);

              if (["changes", "get-environment", "check-version-consistency", "package", "dockerize", "deliver-rpm", "deliver-deb", "translation-build", "deliver-sources", "xray-prepare-test-plan"].includes(failed_job)) {
                ticket_squad_id = 10524
                ticket_board_id = 184
                squad_name = "DEVSECOPS"
              } else if (["gherkin-lint", "frontend-web-build", "backend-dependencies", "frontend-web-lint", "frontend-unit-test", "frontend-component-test", "backend-unit-test", "backend-lint", "e2e-test", "api-test", "performances-test"].includes(failed_job)) {
                if (isoWeekNumber % 4 >= 2) {
                  ticket_squad_id = 10625
                  ticket_board_id = 213
                  squad_name = "METROPOLIS"
                } else {
                  ticket_squad_id = 10882
                  ticket_board_id = 225
                  squad_name = "GOTHAM"
                }
              } else {
                core.setFailed(`Not finding any squad association with job ${failed_job}.`);
                continue;
              }

              console.log(`Ticket will be attributed to the ${squad_name} team. (Squad ID ${ticket_squad_id}, Board ID ${ticket_board_id})`)

              // Desactivated temporarily, activating when the pipeline is more stable
              // current_sprint = execSync(
              //   `curl --request GET \
              //     --url ${JIRA_BASE_URL}/rest/agile/1.0/board/${ticket_board_id}/sprint?state=active \
              //     --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
              //     --header "Accept: application/json" | jq --arg squad_name "$squad_name" '.values[] | select(.name | test($squad_name; "i")) | .id'
              //   `,
              //   { encoding: 'utf8' }
              // );

              // console.log(`Current sprint: ${current_sprint}`);

              // Creating a new incident ticket on Jira
              data = JSON.parse(data);
              ticket_data =
                {
                  "fields": {
                    "summary": ticket_summary,
                    "project": {"key": "MON"},
                    "issuetype": {"id": "10209"},
                    "parent": {"id": `${nightly_epic_id}`, "key": `${nightly_epic_key}`},
                    "labels": ticket_labels,
                    "components": [{"name": MODULE_NAME}],
                    "customfield_10902": {"id": `${ticket_squad_id}`, "value": `${squad_name}`},
                    "description": data
                  }
                }

              // Desactivated temporarily, activating when the pipeline is more stable
              // if (current_sprint !== null) {
              //   ticket_data.fields.customfield_10007 = parseInt(current_sprint, 10);
              // }

              fs.writeFileSync(path, JSON.stringify(ticket_data));
              contents = fs.readFileSync(path, 'utf8');
              console.log("Ticket Payload:\n", contents);
              let response = execSync(
                `curl --request POST \
                  --url "${JIRA_BASE_URL}/rest/api/3/issue" \
                  --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
                  --header 'Accept: application/json' \
                  --header 'Content-Type: application/json' \
                  --data @${path}
                `,
                { encoding: 'utf8' }
              );

              console.log(`Response on ticket creation:\n ${response}`);

              ticket_key = JSON.parse(response).key;
              core.notice(`Created ticket: ${ticket_key}`);

              // Update priority on newly created ticket since you cannot create a ticket with another priority than medium
              response = execSync(
                `curl --request PUT \
                  --url "${JIRA_BASE_URL}/rest/api/3/issue/${ticket_key}" \
                  --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
                  --header 'Accept: application/json' \
                  --header 'Content-Type: application/json' \
                  --data '{ "fields": { "priority": { "id": "2" } } }'
                `,
                { encoding: 'utf8' }
              );

              console.log(`Response on priority change:\n ${response}`);

              // Update ticket status to NEED REFINEMENT and then SPRINT READY so that squad members can see it in their respective sprints
              // for (const transition_id of [11, 21]) {
              //  response = execSync(
              //    `curl --request POST \
              //    --url "${JIRA_BASE_URL}/rest/api/latest/issue/${ticket_key}/transitions" \
              //    --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
              //    --header 'Accept: application/json' \
              //    --header 'Content-Type: application/json' \
              //    --data '{"transition": {"id": "${transition_id}"} }'
              //  `,
              //  { encoding: 'utf8' }
              // )

              // console.log(`Response on ticket status change: ${response}`);
              // }
            } else {
              const ticket_key = response.issues[0].key;
              console.log(`A ticket (ID ${ticket_key}) has already been found. Adding new entry in the description...`);

              data = JSON.parse(data).content[2].content[0];
              console.log("data after shrinking:\n ", data);

              let ticket_description = JSON.parse(
                execSync(
                  `curl --request GET \
                  --url "${JIRA_BASE_URL}/rest/api/3/issue/${ticket_key}" \
                  --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
                  --header "Accept: application/json" | jq '.fields.description'`,
                  { encoding: 'utf8' }
                )
              );

              ticket_description.content[2].content.push(data);
              console.log("ticket_description:\n", ticket_description);

              ticket_description = { fields: { description: ticket_description } };

              fs.writeFileSync(path, JSON.stringify(ticket_description));
              console.log("complete ticket description:\n", JSON.stringify(JSON.parse(fs.readFileSync(path, "utf8")), null, 2));

              response = execSync(
                `curl --request PUT \
                  --url "${JIRA_BASE_URL}/rest/api/3/issue/${ticket_key}" \
                  --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
                  --header "Accept: application/json" \
                  --header "Content-Type: application/json" \
                  --data @${path}`,
                { encoding: 'utf8' }
              )

              console.log(`Response on ticket description change: ${response}`);
            }
          }
