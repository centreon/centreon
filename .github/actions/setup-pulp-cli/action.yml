name: "setup-pulp-cli"
description: "Install pulp-cli and authenticate to pulp with a GitHub OIDC token"
inputs:
  pulp_url:
    description: "The pulp server api url"
    required: false
    default: "https://pulp-api.apps.centreon.com"
  audience:
    description: "OIDC audience, must match the pulp server GITHUB_OIDC.audience"
    required: false
    default: "https://pulp.dev.centreon.io"

runs:
  using: "composite"
  steps:
    - name: Setup python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"

    - name: Install pulp-cli
      shell: bash
      run: |
        set -euo pipefail

        # unconditional: pip is a no-op when the pinned versions are already
        # satisfied, and a `command -v pulp` skip would also skip the pulp-glue
        # patch below on a persistent runner with a cached (unpatched) install
        echo "[INFO] Installing pulp-cli"
        pip install --quiet "pulp-cli==0.37.1" "pulp-cli-deb==0.4.3"

        # pulp-glue's PulpContext.call()/wait_for_task()/wait_for_task_group() re-fetch
        # task (and task-group) status via raw self.api.call(...) calls that never
        # receive the pulp_domain parameter, unlike the call two lines above that
        # creates the task (which injects it via self.domain_enabled). Under a
        # domain-scoped Pulp deployment this 404s every task/task-group status check
        # with "No Task matches the given query", regardless of --background/
        # non-blocking mode: the buggy re-fetch runs unconditionally right after task
        # creation, before the blocking/non-blocking branch is even reached. Confirmed
        # present, unfixed upstream, in pulp-glue 0.37.1 (pinned here) and 0.40.1
        # (latest) as of 2026-07-31. Patch in place until fixed upstream; the exact-
        # count check makes an upstream shape change fail loudly instead of silently
        # doing nothing.
        echo "[INFO] Patching pulp-glue for domain-aware task status re-fetches"
        # the heredoc body is indented to satisfy this YAML block scalar (every
        # line must carry at least its base indentation); dedent it back to valid
        # Python before exec'ing, rather than relying on a bare `python3 -` which
        # would choke on that leading whitespace as an IndentationError
        python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" <<'PYEOF'
        import inspect
        import pathlib

        import pulp_glue.common.context as m

        path = pathlib.Path(inspect.getfile(m))
        src = path.read_text()

        patches = [
            (
                'parameters={"task_href": task_href}',
                'parameters={"task_href": task_href, '
                '**({"pulp_domain": self.pulp_domain} if self.domain_enabled else {})}',
                1,
            ),
            (
                'parameters={"task_group_href": task_group_href}',
                'parameters={"task_group_href": task_group_href, '
                '**({"pulp_domain": self.pulp_domain} if self.domain_enabled else {})}',
                1,
            ),
            (
                'parameters={"task_href": task["pulp_href"]}',
                'parameters={"task_href": task["pulp_href"], '
                '**({"pulp_domain": self.pulp_domain} if self.domain_enabled else {})}',
                2,
            ),
            (
                'parameters={"task_group_href": task_group["pulp_href"]}',
                'parameters={"task_group_href": task_group["pulp_href"], '
                '**({"pulp_domain": self.pulp_domain} if self.domain_enabled else {})}',
                1,
            ),
        ]

        for old, new, expected_count in patches:
            count = src.count(old)
            if count != expected_count:
                raise SystemExit(
                    f"pulp-glue patch: expected {expected_count} occurrence(s) of "
                    f"{old!r}, found {count}. pulp-glue's source has likely changed "
                    "shape; update the patch in setup-pulp-cli/action.yml."
                )
            src = src.replace(old, new)

        path.write_text(src)
        print(f"[INFO] Patched {path}")
        PYEOF

    - name: Request a GitHub OIDC token for pulp
      shell: bash
      env:
        AUDIENCE: ${{ inputs.audience }}
      run: |
        set -euo pipefail

        # an unset org variable is forwarded as "": fail loudly rather than
        # falling back to a default audience, a token minted for the wrong
        # audience must never be silently requested against another server
        if [[ -z "$AUDIENCE" ]]; then
          echo "::error::audience input is empty (is the PULP_OIDC_AUDIENCE org variable defined?)"
          exit 1
        fi

        # the job must grant id-token write permission for these to be set
        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
          echo "::error::Missing OIDC token request context, the job needs 'permissions: id-token: write'"
          exit 1
        fi

        # retry on transient GitHub OIDC token service errors (5xx/timeouts):
        # the endpoint occasionally returns 503, and a single blip must not break
        # the whole delivery.
        PULP_TOKEN=$(
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -G --data-urlencode "audience=$AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value'
        )
        if [[ -z "$PULP_TOKEN" || "$PULP_TOKEN" == "null" ]]; then
          echo "::error::Could not obtain a GitHub OIDC token"
          exit 1
        fi

        # keep the token out of any log and expose it to the next steps.
        # the issuance time and audience let the api helpers refresh the token
        # mid-delivery: github oidc tokens expire ~5 minutes after issuance,
        # which is shorter than a large delivery.
        echo "::add-mask::$PULP_TOKEN"
        {
          echo "PULP_TOKEN=$PULP_TOKEN"
          echo "PULP_TOKEN_ISSUED_AT=$(date +%s)"
          echo "PULP_OIDC_AUDIENCE=$AUDIENCE"
        } >> "$GITHUB_ENV"

    - name: Configure pulp-cli
      shell: bash
      env:
        PULP_URL: ${{ inputs.pulp_url }}
      run: |
        set -euo pipefail

        # fall back to the default when the caller passes an empty value (unset
        # org variable forwarded as "" would otherwise override the default).
        PULP_URL="${PULP_URL:-https://pulp-api.apps.centreon.com}"

        # keep the pulp-cli config (which stores the OIDC token) under the per-job
        # RUNNER_TEMP rather than the runner's persistent ~/.config, and share the
        # location with the later steps, so a self-hosted runner does not retain
        # the token in a home reused across jobs.
        export XDG_CONFIG_HOME="${RUNNER_TEMP:-/tmp}/pulp-cli-config"
        mkdir -p "$XDG_CONFIG_HOME"
        echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"

        # pulpcore's native WorkloadIdentityAuthentication authenticates requests
        # carrying a Bearer token (or Basic with the reserved __token__ username);
        # there is no username/password, the token grants are derived from the
        # token claims by the pulp server rules
        # pulp-cli splits --header on the first colon and keeps the value
        # verbatim, so no space after the colon (it would be rejected as
        # leading whitespace); the sent header is still "Authorization: Bearer …"
        pulp config create --overwrite \
          --base-url "$PULP_URL" \
          --api-root "/" \
          --header "Authorization:Bearer $PULP_TOKEN" \
          --timeout 0

        # fail fast on connectivity issues, scripts cannot distinguish
        # a missing resource from an unreachable server otherwise
        if ! pulp status >/dev/null; then
          echo "::error::Pulp server $PULP_URL is not reachable"
          exit 1
        fi
