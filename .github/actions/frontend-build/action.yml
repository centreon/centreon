name: frontend-build
description: Build Frontend
inputs:
  base_directory:
    description: The base directory
    required: true
  dependencies_lock_file:
    description: "The frontend dependencies lock file path"
    required: true
  index_file:
    description: The index.html file path
    required: false
  static_directory:
    description: The static directory
    required: true
  index_cache_key:
    description: "The index.html cache key"
    required: false
  static_cache_key:
    description: "The frontend static directory cache key"
    required: true
  build_command:
    description: The build command
    required: false
    default: pnpm build

runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: 10
        run_install: false

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: ${{ inputs.dependencies_lock_file }}

    - name: Install dependencies
      run: |
        pnpm install \
          --frozen-lockfile \
          --config.trustPolicy=no-downgrade \
          --config.minimumReleaseAge=2880 \
          --config.blockExoticSubdeps=true
      working-directory: ${{ env.BASE_DIRECTORY }}
      shell: bash
      env:
        BASE_DIRECTORY: ${{ inputs.base_directory }}
        CYPRESS_INSTALL_BINARY: "0"
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

    - name: Build frontend
      env:
        BUILD_COMMAND: ${{ inputs.build_command }}
        BASE_DIRECTORY: ${{ inputs.base_directory }}
      run: $BUILD_COMMAND
      working-directory: ${{ env.BASE_DIRECTORY }}
      shell: bash

    - name: Cache index.html file
      if: ${{ inputs.index_cache_key != '' && inputs.index_file != '' }}
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ inputs.index_file }}
        key: ${{ inputs.index_cache_key }}

    - name: Cache static directory
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ inputs.static_directory }}
        key: ${{ inputs.static_cache_key }}
