name: "Package Centreon"
description: "Test Centreon"
inputs:
  script_name:
    description: "script_name"
    required: true
  image_name:
    description: "image_name"
    required: true
  image_version:
    description: "image_version"
    required: true
  centreon_pat:
    description: "Secret"
    required: false
  params:
    description: "params for script"
    required: false
runs:
  using: "composite"

  steps:
    - env:
        CENTREON_PAT: ${{ inputs.centreon_pat }}
        SCRIPT_NAME: ${{ inputs.script_name }}
        IMAGE_NAME: ${{ inputs.image_name }}
        IMAGE_VERSION: ${{ inputs.image_version }}
        PARAMS: ${{ inputs.params }}
      run: docker run -i -e "TOKEN=$CENTREON_PAT" --entrypoint "/src/.github/scripts/$SCRIPT_NAME.sh" -v "$PWD:/src" "docker.centreon.com/centreon/$IMAGE_NAME:$IMAGE_VERSION" $PARAMS
      shell: bash
