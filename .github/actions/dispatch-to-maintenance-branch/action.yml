name: "dispatch-to-maintenance-branch"
description: "Dispatch to maintenance branch according to reference date"

runs:
  using: "composite"
  steps:
    - name: Select maintenance branch and run nightly workflow on it
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ github.workflow }}
      with:
        script: |
          const { execSync } = require('child_process');
          const today = new Date();
          const currentDayOfWeek = today.getDay();
          if (currentDayOfWeek === 0 || currentDayOfWeek === 6) {
            throw new Error(`❌ Nightly should not be run on weekend days.`);
          }

          // Maintained majors: .github/maintained-majors.json (needs a checkout). Remove a version there at its end of life
          let majors;
          try {
            ({ majors } = JSON.parse(require('fs').readFileSync('.github/maintained-majors.json', 'utf8')));
          } catch (e) {
            throw new Error(`Cannot read .github/maintained-majors.json (is the repository checked out?): ${e.message}`);
          }
          if (!Array.isArray(majors) || majors.length === 0 || !majors.every((m) => /^[0-9]{2}\.(04|10)$/.test(m)) || new Set(majors).size !== majors.length) {
            throw new Error('.github/maintained-majors.json must hold a non-empty "majors" list of distinct XX.04 or XX.10');
          }
          // Sorted, so the rotation does not depend on the order in the file
          const maintenanceBranches = [...majors].sort().map((major) => `dev-${major}.x`);
          const referenceDate = new Date('2025-01-01');

          // Calculate the number of working days since the reference date
          let workingDays = 0;
          let currentDate = new Date(referenceDate);

          while (currentDate < today) {
            const dayOfWeek = currentDate.getDay();
            if (dayOfWeek >= 1 && dayOfWeek <= 5) {
              workingDays++;
            }
            currentDate.setDate(currentDate.getDate() + 1);
            console.log(`Number of working days since January, 1st 2025: ${workingDays}`);
          }

          const branchIndex = workingDays % maintenanceBranches.length;

          execSync(`gh workflow run "${process.env.WORKFLOW}" --ref "${maintenanceBranches[branchIndex]}" --raw-field nightly_manual_trigger=true`);
          console.log(`🌃 Nightly workflow triggered for component ${maintenanceBranches[branchIndex]}`);
