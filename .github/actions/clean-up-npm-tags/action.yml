name: "Clean up NPM versions"
description: "Removes dist-tags and deprecates prerelease versions of deleted branches"

inputs:
  npm_token:
    description: Granular NPM token with write access to the cleaned packages
    required: true
  github_token:
    description: Token used to list the repository branches
    default: ${{ github.token }}
  dry_run:
    description: List what would be cleaned without modifying the registry
    default: "false"

runs:
  using: 'node24'
  main: 'index.js'
