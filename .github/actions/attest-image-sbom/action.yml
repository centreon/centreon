name: "attest image SBOM"
description: >
  Registry-agnostic counterpart of attest-ghcr-image: one SBOM attestation
  per platform (amd64, arm64), built from the Harbor candidate and attached
  to its index digest. The attestations live in the GitHub attestation API,
  keyed by digest, so they hold on every registry the index was copied to
  unchanged (e.g. Pulp, which has no referrers API).
inputs:
  subject_name:
    description: >
      Attestation subject name, kept equal to the build provenance one
      (e.g. ghcr.io/centreon/centreon-gorgone). Verification matches on the
      digest, not on this name.
    required: true
  digest:
    description: "Digest of the promoted manifest list to attest (sha256:...)"
    required: true
  scan_image:
    description: "Image ref to scan, no tag nor digest (the Harbor candidate)"
    required: true
  amd64_digest:
    description: "Digest of the amd64 platform manifest, scanned for its SBOM"
    required: true
  arm64_digest:
    description: "Digest of the arm64 platform manifest, scanned for its SBOM"
    required: true

runs:
  using: "composite"
  steps:
    - name: Generate SBOM (amd64 platform manifest)
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: "${{ inputs.scan_image }}@${{ inputs.amd64_digest }}"
        format: spdx-json
        output-file: sbom-amd64.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Attest SBOM (amd64)
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.subject_name }}
        subject-digest: ${{ inputs.digest }}
        sbom-path: sbom-amd64.spdx.json
        push-to-registry: false
        create-storage-record: false

    - name: Generate SBOM (arm64 platform manifest)
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: "${{ inputs.scan_image }}@${{ inputs.arm64_digest }}"
        format: spdx-json
        output-file: sbom-arm64.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Attest SBOM (arm64)
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.subject_name }}
        subject-digest: ${{ inputs.digest }}
        sbom-path: sbom-arm64.spdx.json
        push-to-registry: false
        create-storage-record: false
