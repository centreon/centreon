name: detect-e2e-test-list
description: Detect relevant Cypress E2E feature files based on repository changes and AI inference.

inputs:
  github-token:
    description: GitHub token used to authenticate downstream actions (requires repo + workflow scopes).
    required: true
  prompt-file:
    description: Path to the AI prompt file used to select feature files.
    required: false
    default: .github/prompts/select-features.prompt.yml
  module-name:
    description: Name of the module where feature files are located.
    required: true
  feature-directory:
    description: Directory containing the Cypress feature files to consider.
    required: true
  tags:
    description: Comma-separated list of tags to filter feature files (optional).
    required: true
    default: 'not @ignore'
  model:
    description: AI model identifier.
    required: false
    default: openai/gpt-4.1
  max-tokens:
    description: Maximum tokens for the AI inference call.
    required: false
    default: '1000'
outputs:
  decision:
    description: Final selection decision (AI, FALLBACK, or FULL).
    value: ${{ steps.final.outputs.decision }}
  specs:
    description: Comma-separated list of feature files or directories selected for execution.
    value: ${{ steps.final.outputs.specs }}
runs:
  using: composite
  steps:
    - name: Get changed files
      id: changed
      uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62

    - name: Check if there are changes
      id: check_changes
      shell: bash
      run: |
        if [ -z "${{ steps.changed.outputs.all_changed_files }}" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          printf 'changed_files=%s\n' "${{ steps.changed.outputs.all_changed_files }}" >> "$GITHUB_OUTPUT"
          CHANGED_JSON=$(printf '%s' "${{ steps.changed.outputs.all_changed_files }}" |
            tr '\n' ' ' |
            awk '{
              n = split($0, arr, /[[:space:]]+/);
              printed = 0;
              printf("[");
              for (i = 1; i <= n; ++i) {
                if (arr[i] == "") {
                  continue;
                }
                gsub(/\\/, "\\\\", arr[i]);
                gsub(/"/, "\\\"", arr[i]);
                printf("%s\"%s\"", (printed++ ? "," : ""), arr[i]);
              }
              printf("]");
            }'
          )
          printf 'changed_files_json=%s\n' "$CHANGED_JSON" >> "$GITHUB_OUTPUT"
        fi

    - name: List features
      id: features
      run: |
        set -o pipefail

        sudo apt-get -q update
        sudo apt-get install -qy cucumber

        TEST_TAGS=$(echo "${{ inputs.tags }}" | sed -e 's#not #~#g' -e 's# and #\&\&#g')
        echo "test_tags=$TEST_TAGS" >> $GITHUB_OUTPUT

        cd ${{ inputs.module-name }}
        FEATURES_JSON=$(cucumber ${{ inputs.feature-directory }} --tags "$TEST_TAGS" -f json | jq -r '.[].uri' | sed -e 's#${{ inputs.feature-directory }}/*##g' | sort | jq -R -s -c 'split("\n")[:-1]')
        echo "features: $FEATURES_JSON"
        echo "features_json=$FEATURES_JSON" >> $GITHUB_OUTPUT
      shell: bash

    - name: Infer relevant feature files (AI)
      id: ai
      if: steps.check_changes.outputs.changed == 'true'
      uses: actions/ai-inference@334892bb203895caaed82ec52d23c1ed9385151e
      with:
        model: ${{ inputs.model }}
        prompt-file: ${{ inputs.prompt-file }}
        input: |
          changed_files: ${{ steps.check_changes.outputs.changed_files_json }}
          available_features: ${{ steps.features.outputs.features_json }}
        max-tokens: ${{ inputs.max-tokens }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Validate AI output
      id: validate
      if: steps.check_changes.outputs.changed == 'true'
      shell: bash
      run: |
        cat <<'EOF' > ai.json
        ${{ steps.ai.outputs.response }}
        EOF

        cat ai.json

        if ! jq -e 'type == "array"' ai.json >/dev/null 2>&1; then
          echo "mode=fallback" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if ! jq -e 'length <= 20 and all(.[]; type == "string" and length > 0)' ai.json >/dev/null 2>&1; then
          echo "mode=fallback" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        BASE_DIR="${{ inputs.module-name }}/$(echo "${{ inputs.feature-directory }}" | sed 's#^/*##')"
        ALL_SPECS=$(jq -r '.[]' ai.json)
        if [ -n "$ALL_SPECS" ]; then
          MISSING_LINES=$(printf '%s\n' "$ALL_SPECS" | while read -r f; do
            [ -z "$f" ] && continue
            TARGET="$BASE_DIR/${f#/}"
            if [ ! -e "$TARGET" ]; then
              printf '%s\n' "${f#/}"
            fi
          done)
          VALID_LINES=$(printf '%s\n' "$ALL_SPECS" | while read -r f; do
            [ -z "$f" ] && continue
            TARGET="$BASE_DIR/${f#/}"
            if [ -e "$TARGET" ]; then
              printf '%s\n' "${f#/}"
            fi
          done)

          if [ -n "$MISSING_LINES" ]; then
            MISSING=$(printf '%s' "$MISSING_LINES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            MISSING=""
          fi

          if [ -n "$VALID_LINES" ]; then
            VALID=$(printf '%s' "$VALID_LINES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            VALID=""
          fi
        else
          MISSING=""
          VALID=""
        fi

        if [ -n "$MISSING" ]; then
          echo "mode=fallback" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "$VALID" ]; then
          echo "mode=fallback" >> "$GITHUB_OUTPUT"
        else
          echo "mode=ai" >> "$GITHUB_OUTPUT"
          echo "specs=$VALID" >> "$GITHUB_OUTPUT"
        fi

    - name: Fallback mapping
      id: fallback
      if: steps.validate.outputs.mode == 'fallback'
      shell: bash
      env:
        CHANGED_FILES_JSON: ${{ steps.check_changes.outputs.changed_files_json }}
      run: |
        SPECS_LINES=""
        if jq -er '.[]' <<<"$CHANGED_FILES_JSON" >/dev/null 2>&1; then
          CHANGED_FILES=$(jq -r '.[]' <<<"$CHANGED_FILES_JSON")
        else
          CHANGED_FILES=""
        fi

        if printf '%s\n' "$CHANGED_FILES" | grep -q 'www/'; then
          SPECS_LINES="${SPECS_LINES}centreon/tests/e2e/features/www\n"
        fi
        if printf '%s\n' "$CHANGED_FILES" | grep -q 'widgets/'; then
          SPECS_LINES="${SPECS_LINES}centreon/tests/e2e/features/widgets\n"
        fi

        if [ -z "$SPECS_LINES" ]; then
          echo "mode=full" >> "$GITHUB_OUTPUT"
        else
          SPECS_JSON=$(printf '%s' "$SPECS_LINES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "mode=mapped" >> "$GITHUB_OUTPUT"
          echo "specs=$SPECS_JSON" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve final decision
      id: final
      shell: bash
      run: |
        if [ "${{ steps.validate.outputs.mode }}" = "ai" ]; then
          echo "decision=AI" >> "$GITHUB_OUTPUT"
          echo "specs=${{ steps.validate.outputs.specs }}" >> "$GITHUB_OUTPUT"
        elif [ "${{ steps.fallback.outputs.mode }}" = "mapped" ]; then
          echo "decision=FALLBACK" >> "$GITHUB_OUTPUT"
          echo "specs=${{ steps.fallback.outputs.specs }}" >> "$GITHUB_OUTPUT"
        else
          SPECS=$(jq -R -s -c 'split("\n")[:-1]' all_features.txt)
          echo "decision=FULL" >> "$GITHUB_OUTPUT"
          echo "specs=$SPECS" >> "$GITHUB_OUTPUT"
        fi

    - name: Summary
      shell: bash
      run: |
        echo "### Cypress AI Feature Selection Result" >> "$GITHUB_STEP_SUMMARY"
        echo "- Decision: ${{ steps.final.outputs.decision }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- Specs: ${{ steps.final.outputs.specs || 'N/A' }}" >> "$GITHUB_STEP_SUMMARY"
