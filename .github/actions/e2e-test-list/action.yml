name: e2e-test-list
description: Detect relevant E2E feature files based on repository changes and AI inference.

inputs:
  github_token:
    description: GitHub token used to authenticate downstream actions (requires repo + workflow scopes).
    required: true
  prompt_file:
    description: Path to the AI prompt file used to select feature files.
    required: false
    default: .github/prompts/select-features.prompt.yml
  module_name:
    description: Name of the module where feature files are located.
    required: true
  feature_directory:
    description: Directory containing the Gherkin feature files to consider.
    required: true
  tags:
    description: Tags to filter feature files (optional).
    required: false
    default: 'not @ignore'
  use_ai:
    description: Whether to use AI inference for test selection.
    required: false
    default: 'false'
  model_primary:
    description: Primary AI model identifier.
    required: false
    default: openai/gpt-4o
  model_fallback:
    description: Fallback AI model identifier.
    required: false
    default: openai/gpt-4o-mini
  max_tokens:
    description: Maximum tokens for the AI inference call.
    required: false
    default: '1000'

outputs:
  decision:
    description: Final selection decision (AI or FULL).
    value: ${{ steps.final.outputs.decision }}
  specs:
    description: JSON array of feature files or directories selected for execution.
    value: ${{ steps.final.outputs.specs }}
  tags:
    description: Tags to use for the test run based on selected specs.
    value: ${{ steps.features.outputs.tags }}

runs:
  using: composite
  steps:
    # --------------------------------------------------
    # Changed files
    # --------------------------------------------------
    - name: Get changed files
      id: changed
      if: github.event_name == 'pull_request'
      uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47.0.0
      with:
        token: ${{ inputs.github_token }}
        use_rest_api: 'true'
        files: |
          ${{ inputs.module_name }}/**

    - name: Normalize changed files
      id: changes
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        ALL_CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
      run: |
        RAW="$ALL_CHANGED_FILES"

        if [ -z "$RAW" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "changed_files_json=[]" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        CHANGED_JSON=$(printf '%s' "$RAW" \
          | tr ' ' '\n' \
          | jq -R -s -c 'split("\n") | map(select(length>0))')

        echo "changed=true" >> "$GITHUB_OUTPUT"
        echo "changed_files_json=$CHANGED_JSON" >> "$GITHUB_OUTPUT"

    # --------------------------------------------------
    # List available features
    # --------------------------------------------------
    - name: List features
      id: features
      shell: bash
      env:
        TAGS_INPUT: ${{ inputs.tags }}
        MODULE_NAME: ${{ inputs.module_name }}
        FEATURE_DIRECTORY: ${{ inputs.feature_directory }}
      run: |
        set -o pipefail

        echo "::group::Install dependencies"
        sudo apt-get -qq update
        sudo apt-get install -qqy cucumber jq
        echo "::endgroup::"

        CUCUMBER_TAGS=()
        if [ -n "$TAGS_INPUT" ]; then
          while IFS= read -r RAW_TAG; do
            RAW_TAG=$(echo "$RAW_TAG" | sed -e 's/^ *//g' -e 's/ *$//g')
            if [[ "$RAW_TAG" == not\ * ]]; then
              TAG="${RAW_TAG#not }"
              CUCUMBER_TAGS+=(--tags "~$TAG")
            elif [ -n "$RAW_TAG" ]; then
              CUCUMBER_TAGS+=(--tags "$RAW_TAG")
            fi
          done <<< "$(echo "$TAGS_INPUT" | sed 's/ and /\n/g')"
        fi

        TAGS=$(echo "$TAGS_INPUT" | sed 's/not /~/g; s/ and /&&/g')

        cd "$MODULE_NAME"

        cucumber "$FEATURE_DIRECTORY" "${CUCUMBER_TAGS[@]}" -f json \
          | jq -r '.[].uri' \
          | sed -e "s#^$FEATURE_DIRECTORY/##" -e 's#\.feature$##' \
          | sort -u \
          | jq -R -s -c 'split("\n") | map(select(length>0))' \
          > features.json

        echo "features_json=$(cat features.json)" >> "$GITHUB_OUTPUT"
        echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

    # --------------------------------------------------
    # AI PRIMARY (non-blocking)
    # --------------------------------------------------
    - name: Infer features (primary model)
      id: ai_primary
      if: |
        github.event_name == 'pull_request' &&
        inputs.use_ai == 'true' &&
        steps.changes.outputs.changed == 'true'
      continue-on-error: true
      uses: actions/ai-inference@334892bb203895caaed82ec52d23c1ed9385151e
      with:
        model: ${{ inputs.model_primary }}
        prompt-file: ${{ inputs.prompt_file }}
        input: |
          changed_files: ${{ steps.changes.outputs.changed_files_json }}
          available_features: ${{ steps.features.outputs.features_json }}
        max-tokens: ${{ inputs.max_tokens }}
        token: ${{ inputs.github_token }}

    - name: Display warning if AI primary failed
      if: |
        github.event_name == 'pull_request' &&
        inputs.use_ai == 'true' &&
        steps.changes.outputs.changed == 'true' &&
        steps.ai_primary.outcome == 'failure'
      env:
        MODEL_FALLBACK: ${{ inputs.model_fallback }}
      run: |
        echo "::warning::AI primary model inference failed. Falling back to secondary model: $MODEL_FALLBACK."
      shell: bash

    # --------------------------------------------------
    # AI FALLBACK (only if primary fails)
    # --------------------------------------------------
    - name: Infer features (fallback model)
      id: ai_fallback
      if: |
        github.event_name == 'pull_request' &&
        inputs.use_ai == 'true' &&
        steps.changes.outputs.changed == 'true' &&
        steps.ai_primary.outcome == 'failure'
      continue-on-error: true
      uses: actions/ai-inference@334892bb203895caaed82ec52d23c1ed9385151e
      with:
        model: ${{ inputs.model_fallback }}
        prompt-file: ${{ inputs.prompt_file }}
        input: |
          changed_files: ${{ steps.changes.outputs.changed_files_json }}
          available_features: ${{ steps.features.outputs.features_json }}
        max-tokens: ${{ inputs.max_tokens }}
        token: ${{ inputs.github_token }}

    # --------------------------------------------------
    # Validate AI output (primary first, then fallback)
    # --------------------------------------------------
    - name: Validate AI result
      id: validate
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        MODULE_NAME: ${{ inputs.module_name }}
        FEATURE_DIRECTORY: ${{ inputs.feature_directory }}
        PRIMARY: ${{ steps.ai_primary.outputs.response }}
        FALLBACK: ${{ steps.ai_fallback.outputs.response }}
      run: |
        BASE_DIR="$MODULE_NAME/$(echo "$FEATURE_DIRECTORY" | sed 's#^/*##')"

        validate() {
          jq -e 'type=="array" and length>0 and all(.[]; type=="string")' <<<"$1" >/dev/null || return 1

          while read -r f; do
            f="${f#/}"
            [[ "$f" != *.feature ]] && f="$f.feature"
            [ -e "$BASE_DIR/$f" ] || return 1
          done < <(jq -r '.[]' <<<"$1")
        }

        if validate "$PRIMARY"; then
          echo "mode=ai" >> "$GITHUB_OUTPUT"
          echo "specs=$PRIMARY" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if validate "$FALLBACK"; then
          echo "mode=ai" >> "$GITHUB_OUTPUT"
          echo "specs=$FALLBACK" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "mode=fallback" >> "$GITHUB_OUTPUT"

    # --------------------------------------------------
    # Final decision
    # --------------------------------------------------
    - name: Resolve final decision
      id: final
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        VALIDATE_MODE: ${{ steps.validate.outputs.mode }}
        VALIDATE_SPECS: ${{ steps.validate.outputs.specs }}
        FEATURES_JSON: ${{ steps.features.outputs.features_json }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$VALIDATE_MODE" = "ai" ]; then
          echo "::notice::E2E test selection decision: AI inference used."
          echo "decision=AI" >> "$GITHUB_OUTPUT"
          printf 'specs=%s\n' "$VALIDATE_SPECS" >> "$GITHUB_OUTPUT"
        else
          echo "decision=FULL" >> "$GITHUB_OUTPUT"
          printf 'specs=%s\n' "$FEATURES_JSON" >> "$GITHUB_OUTPUT"
        fi
