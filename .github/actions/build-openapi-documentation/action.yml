name: "build-openapi-documentation"
description: "Build OpenAPI documentation"

inputs:
  module_name:
    description: "The package module name"
    required: true
  openapi_file_reference:
    description: "Reference (tag or branch) on which the files are fetched"
    required: false
  is_cloud:
    description: "Release context (cloud or not cloud)"
    required: true
outputs:
  doc_version:
    description: Version of the documentation
    value: ${{ steps.build_documentation.outputs.doc_version }}
runs:
  using: "composite"
  steps:
    - name: Checkout sources
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        path: ${{ inputs.openapi_file_reference || github.ref_name }}
        ref: ${{ inputs.openapi_file_reference || github.ref_name }}

    - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: 24

    - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      with:
        version: 10
        run_install: false

    - name: Run pnpm install
      shell: bash
      run: |
        pnpm install \
          --frozen-lockfile \
          --config.trustPolicy=no-downgrade \
          --config.minimumReleaseAge=2880 \
          --config.blockExoticSubdeps=true
      working-directory: ${{ inputs.openapi_file_reference || github.ref_name }}/${{ inputs.module_name == 'centreon-web' && 'centreon' || inputs.module_name }}/doc/API

    - name: Build OpenAPI documentation
      id: build_documentation
      run: |
        if [[ "${{ inputs.is_cloud }}" == "true" && -f "centreon-cloud-api.yaml" ]]; then
          OPENAPI_FILE="centreon-cloud-api.yaml"
        elif [[ -f "centreon-api.yaml" ]]; then
          OPENAPI_FILE="centreon-api.yaml"
        else
          echo "::error::openapi file not found"
          exit 1
        fi

        echo "Building API doc from $OPENAPI_FILE"
        pnpm run build $OPENAPI_FILE

        source ../../../.version
        major_version=${MAJOR}
        if [[ $major_version =~ ^2[0-9]\.(04|10)$ ]]; then
          doc_version=$major_version
          sed -i "s#version: 'latest'#version: '$doc_version'#" $OPENAPI_FILE
        else
          doc_version="cloud"
          sed -i "s#version: 'latest'#version: 'Cloud'#" $OPENAPI_FILE
        fi
        echo "doc_version=$doc_version" >> $GITHUB_OUTPUT

        echo "Building API doc from $OPENAPI_FILE"
        pnpm run redoc-latest
      shell: bash
      working-directory: ${{ inputs.openapi_file_reference || github.ref_name }}/${{ inputs.module_name == 'centreon-web' && 'centreon' || inputs.module_name }}/doc/API

    - name: Upload built artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: openapi-doc-${{ inputs.module_name }}-${{ inputs.openapi_file_reference || github.ref_name }}
        path: |
          ${{ inputs.openapi_file_reference || github.ref_name }}/${{ inputs.module_name == 'centreon-web' && 'centreon' || inputs.module_name }}/doc/API/index.html
          ${{ inputs.openapi_file_reference || github.ref_name }}/${{ inputs.module_name == 'centreon-web' && 'centreon' || inputs.module_name }}/doc/API/centreon-logo.png
        retention-days: 1
