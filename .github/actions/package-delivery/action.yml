name: "package-delivery"
description: "Deliver rpm and deb packages to pulp"
inputs:
  module_name:
    description: "The package module name"
    required: true
  distrib:
    description: "The distribution used for packaging"
    required: true
  version:
    description: "Centreon packaged major version"
    required: true
  cache_key:
    description: "The cached package key"
    required: true
  stability:
    description: "The package stability (stable, testing, unstable)"
    required: true
  release_type:
    description: "Type of release (hotfix, release)"
    required: false
    default: ""
  is_cloud:
    description: "Release context (cloud or not cloud)"
    required: true
  delivery_type:
    description: "Delivery to feature or standard repository"
    required: false
    default: "standard"
  pulp_url:
    description: "The pulp server api url"
    required: false
    default: "https://pulp.dev.centreon.io"
  pulp_content_url:
    description: "The pulp server content url"
    required: false
    default: "https://pulp.dev.centreon.io/pulp/content"
  pulp_username:
    description: "The pulp server username"
    required: true
  pulp_password:
    description: "The pulp server password"
    required: true

runs:
  using: "composite"
  steps:
    - name: Parse distrib name
      id: parse-distrib
      uses: ./.github/actions/parse-distrib
      with:
        distrib: ${{ inputs.distrib }}

    - name: Compute pulp repository properties
      id: pulp-properties
      shell: bash
      env:
        MODULE_NAME: ${{ inputs.module_name }}
        DISTRIB: ${{ inputs.distrib }}
        DISTRIB_FAMILY: ${{ steps.parse-distrib.outputs.distrib_family }}
        VERSION: ${{ inputs.version }}
        STABILITY: ${{ inputs.stability }}
        RELEASE_TYPE: ${{ inputs.release_type }}
        IS_CLOUD: ${{ inputs.is_cloud }}
        DELIVERY_TYPE: ${{ inputs.delivery_type }}
        GH_HEAD_REF: ${{ github.head_ref || github.ref_name }}
      run: |
        set -euo pipefail

        if [[ -z "$MODULE_NAME" || -z "$DISTRIB" || -z "$VERSION" || -z "$STABILITY" || -z "$IS_CLOUD" ]]; then
          echo "::error::some mandatory inputs are empty, please check the logs."
          exit 1
        fi

        if [[ "$DELIVERY_TYPE" != "feature" && "$STABILITY" != "testing" && "$STABILITY" != "unstable" ]]; then
          echo "::error::stability must be one of: testing, unstable (got '$STABILITY')"
          exit 1
        fi

        case "$DISTRIB_FAMILY" in
          el) ROOT_REPO="rpm-standard" ;;
          debian) ROOT_REPO="apt-standard" ;;
          ubuntu) ROOT_REPO="ubuntu-standard" ;;
          *)
            echo "::error::Unsupported distribution family: $DISTRIB_FAMILY"
            exit 1
            ;;
        esac

        STABILITY_SEGMENT="$STABILITY"
        if [[ "$STABILITY" == "testing" && ("$RELEASE_TYPE" == "release" || "$RELEASE_TYPE" == "hotfix") ]]; then
          STABILITY_SEGMENT="$STABILITY-$RELEASE_TYPE"
        fi

        TRACKING_REPOSITORY_NAME=""

        if [[ "$DELIVERY_TYPE" == "feature" ]]; then
          FEATURE_TICKET=$(echo "$GH_HEAD_REF" | grep -oE 'MON-[0-9]+' | head -1 || true)
          if [[ -z "$FEATURE_TICKET" ]]; then
            echo "::error::Cannot extract the feature ticket from branch name $GH_HEAD_REF"
            exit 1
          fi
          if [[ "$DISTRIB_FAMILY" == "el" ]]; then
            REPOSITORY_NAME="$ROOT_REPO-feature-$FEATURE_TICKET-$VERSION-$DISTRIB"
            BASE_PATH="$ROOT_REPO-feature/$FEATURE_TICKET/$VERSION/$DISTRIB"
          else
            REPOSITORY_NAME="$ROOT_REPO-feature-$FEATURE_TICKET-$VERSION"
            BASE_PATH="$ROOT_REPO-feature/$FEATURE_TICKET/$VERSION"
          fi
        else
          if [[ "$IS_CLOUD" == "true" ]]; then
            ROOT_REPO="$ROOT_REPO-internal"
          fi
          if [[ "$DISTRIB_FAMILY" == "el" ]]; then
            REPOSITORY_NAME="$ROOT_REPO-$VERSION-$DISTRIB-$STABILITY_SEGMENT"
            BASE_PATH="$ROOT_REPO/$VERSION/$DISTRIB/$STABILITY_SEGMENT"
          else
            REPOSITORY_NAME="$ROOT_REPO-$VERSION-$STABILITY_SEGMENT"
            BASE_PATH="$ROOT_REPO/$VERSION/$STABILITY_SEGMENT"
          fi
          # testing deliveries are also tracked in a module scoped repository
          # so that promote-to-stable can identify which packages belong to this module
          if [[ "$STABILITY" == "testing" ]]; then
            TRACKING_REPOSITORY_NAME="$ROOT_REPO-$VERSION-$DISTRIB-$STABILITY_SEGMENT-$MODULE_NAME"
          fi
        fi

        echo "[DEBUG] - repository_name: $REPOSITORY_NAME"
        echo "[DEBUG] - base_path: $BASE_PATH"
        echo "[DEBUG] - tracking_repository_name: $TRACKING_REPOSITORY_NAME"

        echo "repository_name=$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
        echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"
        echo "tracking_repository_name=$TRACKING_REPOSITORY_NAME" >> "$GITHUB_OUTPUT"

    - name: Restore packages from cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ./*.${{ steps.parse-distrib.outputs.package_extension }}
        key: ${{ inputs.cache_key }}
        fail-on-cache-miss: true

    - name: Setup pulp-cli
      uses: ./.github/actions/setup-pulp-cli
      with:
        pulp_url: ${{ inputs.pulp_url }}
        pulp_username: ${{ inputs.pulp_username }}
        pulp_password: ${{ inputs.pulp_password }}

    - name: Deliver RPM packages
      if: steps.parse-distrib.outputs.package_extension == 'rpm'
      shell: bash
      env:
        REPOSITORY_NAME: ${{ steps.pulp-properties.outputs.repository_name }}
        BASE_PATH: ${{ steps.pulp-properties.outputs.base_path }}
        TRACKING_REPOSITORY_NAME: ${{ steps.pulp-properties.outputs.tracking_repository_name }}
        PULP_CONTENT_URL: ${{ inputs.pulp_content_url }}
      run: |
        set -euo pipefail
        shopt -s nullglob

        FILES=(*.rpm)
        if [[ ${#FILES[@]} -eq 0 ]]; then
          echo "::error::No rpm package found to deliver"
          exit 1
        fi

        if ! pulp rpm repository show --name "$REPOSITORY_NAME" >/dev/null 2>&1; then
          echo "[INFO] Creating rpm repository $REPOSITORY_NAME"
          pulp rpm repository create --name "$REPOSITORY_NAME" --retain-package-versions 1 >/dev/null
        fi

        if ! pulp rpm distribution show --name "$REPOSITORY_NAME" >/dev/null 2>&1; then
          echo "[INFO] Creating rpm distribution $REPOSITORY_NAME served at $BASE_PATH"
          pulp rpm distribution create --name "$REPOSITORY_NAME" --base-path "$BASE_PATH" --repository "$REPOSITORY_NAME" >/dev/null
        fi

        CONTENT="[]"
        for FILE in "${FILES[@]}"; do
          echo "[INFO] Uploading $FILE"
          PACKAGE_HREF=$(pulp rpm content upload --file "$FILE" | jq -r '.pulp_href')
          CONTENT=$(echo "$CONTENT" | jq --arg href "$PACKAGE_HREF" '. + [{"pulp_href": $href}]')
        done

        echo "[INFO] Adding ${#FILES[@]} packages to repository $REPOSITORY_NAME"
        pulp rpm repository content modify --repository "$REPOSITORY_NAME" --add-content "$CONTENT" >/dev/null

        if [[ -n "$TRACKING_REPOSITORY_NAME" ]]; then
          if ! pulp rpm repository show --name "$TRACKING_REPOSITORY_NAME" >/dev/null 2>&1; then
            echo "[INFO] Creating rpm tracking repository $TRACKING_REPOSITORY_NAME"
            pulp rpm repository create --name "$TRACKING_REPOSITORY_NAME" --retain-package-versions 1 >/dev/null
          fi
          echo "[INFO] Adding packages to tracking repository $TRACKING_REPOSITORY_NAME"
          pulp rpm repository content modify --repository "$TRACKING_REPOSITORY_NAME" --add-content "$CONTENT" >/dev/null
        fi

        echo "[INFO] Publishing repository $REPOSITORY_NAME"
        pulp rpm publication create --repository "$REPOSITORY_NAME" >/dev/null

        echo "::notice::Packages are available at $PULP_CONTENT_URL/$BASE_PATH/"

    - name: Deliver DEB packages
      if: steps.parse-distrib.outputs.package_extension == 'deb'
      shell: bash
      env:
        REPOSITORY_NAME: ${{ steps.pulp-properties.outputs.repository_name }}
        BASE_PATH: ${{ steps.pulp-properties.outputs.base_path }}
        TRACKING_REPOSITORY_NAME: ${{ steps.pulp-properties.outputs.tracking_repository_name }}
        DISTRIB: ${{ inputs.distrib }}
        PULP_CONTENT_URL: ${{ inputs.pulp_content_url }}
      run: |
        set -euo pipefail
        shopt -s nullglob

        FILES=(*.deb)
        if [[ ${#FILES[@]} -eq 0 ]]; then
          echo "::error::No deb package found to deliver"
          exit 1
        fi

        if ! pulp deb repository show --name "$REPOSITORY_NAME" >/dev/null 2>&1; then
          echo "[INFO] Creating deb repository $REPOSITORY_NAME"
          pulp deb repository create --name "$REPOSITORY_NAME" >/dev/null
        fi

        if ! pulp deb distribution show --name "$REPOSITORY_NAME" >/dev/null 2>&1; then
          echo "[INFO] Creating deb distribution $REPOSITORY_NAME served at $BASE_PATH"
          pulp deb distribution create --name "$REPOSITORY_NAME" --base-path "$BASE_PATH" --repository "$REPOSITORY_NAME" >/dev/null
        fi

        if [[ -n "$TRACKING_REPOSITORY_NAME" ]] && ! pulp deb repository show --name "$TRACKING_REPOSITORY_NAME" >/dev/null 2>&1; then
          echo "[INFO] Creating deb tracking repository $TRACKING_REPOSITORY_NAME"
          pulp deb repository create --name "$TRACKING_REPOSITORY_NAME" >/dev/null
        fi

        for FILE in "${FILES[@]}"; do
          echo "[INFO] Uploading $FILE to $REPOSITORY_NAME ($DISTRIB/main)"
          pulp deb content upload --file "$FILE" --repository "$REPOSITORY_NAME" --distribution "$DISTRIB" --component main >/dev/null

          if [[ -n "$TRACKING_REPOSITORY_NAME" ]]; then
            pulp deb content upload --file "$FILE" --repository "$TRACKING_REPOSITORY_NAME" --distribution "$DISTRIB" --component main >/dev/null
          fi
        done

        echo "[INFO] Publishing repository $REPOSITORY_NAME"
        pulp deb publication create --repository "$REPOSITORY_NAME" --structured >/dev/null

        echo "::notice::Packages are available with: deb $PULP_CONTENT_URL/$BASE_PATH/ $DISTRIB main"
