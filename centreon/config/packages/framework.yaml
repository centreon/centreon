framework:
    secret: '%env(APP_SECRET)%'

    php_errors:
        log: true

    http_client:
        default_options:
            max_redirects: 7

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: null # handled by apache
        cookie_httponly: false # handled by apache
        cookie_path: /

    serializer:
        enabled: true
        name_converter: 'serializer.name_converter.camel_case_to_snake_case'
        mapping:
            paths:
                - '%kernel.project_dir%/config/symfony_serializer'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
