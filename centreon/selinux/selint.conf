# selint configuration for the centreon-web policy module (selint 1.5.0).
# --config replaces /etc/selint.conf, so its defaults are repeated here.
severity = "convention"

# Defaults: C-001, C-006, W-010, W-011, E-003, E-004.
# C-005: permission ordering inside av rules, pure style.
# S-001: require blocks are the norm for an out-of-tree module.
# E-005: types from refpolicy and centreon-common-selinux are not visible here.
disable = { C-001, C-005, C-006, S-001, W-010, W-011, E-003, E-004, E-005 }
enable_source = { W-010, W-011, E-003, E-004 }

assume_users = { system_u }
assume_roles = { object_r }
ordering_rules = "refpolicy-lax"
ordering_requires = { bool, attribute, attribute_role, type, class, role }
ordering_requires_same_flavor = false
