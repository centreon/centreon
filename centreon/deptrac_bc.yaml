parameters:
    paths:
        - ./src/App

    layers:
        - name: ActivityLogging
          collectors:
              - type: directory
                value: src/App/ActivityLogging/.*

        - name: MonitoringConfiguration
          collectors:
              - type: directory
                value: src/App/MonitoringConfiguration/.*

        - name: Security
          collectors:
              - type: directory
                value: src/App/Security/.*

        - name: Shared
          collectors:
              - type: directory
                value: src/App/Shared/.*

        - name: Vendors
          collectors:
              - { type: classNameRegex, value: '#^ApiPlatform\\#' }
              - { type: classNameRegex, value: '#^Doctrine\\#' }
              - { type: classNameRegex, value: '#^Godruoyi\\#' }
              - { type: classNameRegex, value: '#^Monolog\\#' }
              - { type: classNameRegex, value: '#^Psr\\#' }
              - { type: classNameRegex, value: '#^Symfony\\#' }
              - { type: classNameRegex, value: '#^Webmozart\\#' }

        - name: Legacy
          collectors:
              - { type: classNameRegex, value: '#^App\\Kernel$#' }
              - { type: classNameRegex, value: '#^Adaptation\\$#' }
              - { type: classNameRegex, value: '#^Centreon*\\#' }
              - { type: classNameRegex, value: '#^Core\\#' }
              - { type: classNameRegex, value: '#^EventSubscriber\\#' }
              - { type: classNameRegex, value: '#^Security\\#' }
              - { type: classNameRegex, value: '#^Utility\\#' }

        - name: TypeAliases # needed because deptrac does not parse phpstan type aliases
          collectors:
              - { type: classNameRegex, value: '#TypeAlias$#' }

        - name: PhpNative # PHP built-in attributes and classes
          collectors:
              - { type: classNameRegex, value: '#^Deprecated$#' }
              - { type: classNameRegex, value: '#^Random\\#' }

    ruleset:
        ActivityLogging: [ MonitoringConfiguration, Security, Shared, Vendors, TypeAliases, PhpNative ]
        MonitoringConfiguration: [ Security, Shared, Vendors, TypeAliases, PhpNative ]
        Security: [ ActivityLogging, MonitoringConfiguration, Shared, Vendors, TypeAliases, PhpNative ]
        Shared: [ Vendors, TypeAliases, PhpNative ]
        Legacy: [ Vendors, TypeAliases, PhpNative ]

    skip_violations:
        App\Shared\Infrastructure\Legacy\LegacyKernelWrapper:
            - App\Kernel
        App\Shared\Infrastructure\Legacy\LegacyContainer:
            - App\Kernel
        App\Shared\Infrastructure\Legacy\LegacyHttpExceptionListener:
            - Centreon\Domain\Exception\EntityNotFoundException
        App\Shared\Infrastructure\Legacy\LegacyVaultWrapper:
            - Core\Common\Application\Repository\ReadVaultRepositoryInterface
        App\Security\Infrastructure\Security\Legacy\LegacyTokenApiAuthenticatorWrapper:
            - Security\TokenAPIAuthenticator
        App\Shared\Infrastructure\ApiPlatform\Routing\LegacyApiPrefixAliasLoader:
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\AgentConfiguration\InstallationCommandResource
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\Command\CommandResource
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\Command\CreateCommandResource
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\Command\DuplicateCommandResource
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\Command\ListCommandResource
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\ConnectorResource
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\GlobalMacroResource
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\ListPluginResource
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\PluginResource
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\Poller\InstallationCommandResource
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\Poller\PollerResource
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\ServiceCategoryResource
            - App\MonitoringConfiguration\Infrastructure\ApiPlatform\Resource\StandardMacroResource
