doctrine:
   dbal:
       default_connection: default
       connections:
           default:
               use_savepoints: true
               server_version: '8.0'
               dbname: '%env(db)%'
               user: '%env(user)%'
               password: '%env(password)%'
               host: '%env(hostCentreon)%'
           realtime:
               use_savepoints: true
               server_version: '8.0'
               dbname: '%env(dbcstg)%'
               user: '%env(user)%'
               password: '%env(password)%'
               host: '%env(hostCentreon)%'
           test_setup_default:
               use_savepoints: true
               server_version: '8.0'
               dbname: '%env(db)%'
               user: '%env(user)%'
               password: '%env(password)%'
               host: '%env(hostCentreon)%'
