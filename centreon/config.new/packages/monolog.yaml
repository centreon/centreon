monolog:
    channels:
        - deprecation
        - token
        - authentication
        # Channel consumed by App\Shared\Infrastructure\Messenger\LoggingMiddleware.
        # Declared platform-wide so the bus log records produced on every
        # command/query dispatch land on a dedicated logger that modules
        # (e.g. centreon-bam) can attach their own handlers to.
        - bus

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            authentication:
                type: stream
                path: "%kernel.logs_dir%/login.log"
                level: debug
                channels: ["authentication"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            token:
                type: stream
                path: "%kernel.logs_dir%/dev.token.log"
                level: debug
                channels: ["token"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            nested:
                type: stream
                path: php://stderr
                level: critical
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!deprecation"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            deprecation:
                type: rotating_file
                channels: [deprecation]
                path: "%kernel.logs_dir%/%kernel.environment%.deprecations.log"
                formatter: monolog.formatter.line
                max_files: 1
                file_permission: 0660
            authentication:
                type: stream
                path: "%kernel.logs_dir%/login.log"
                level: info
                channels: ["authentication"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            token:
                type: stream
                path: "%kernel.logs_dir%/prod.token.log"
                level: info
                channels: ["token"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
