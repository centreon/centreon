monolog:
    channels:
        - deprecation
        - token

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
