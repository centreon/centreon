monolog:
    channels:
        - deprecation
        - token
        - authentication
        # Catch-all channel for records that have no dedicated file
        # (centreon-web, php-fpm errors, sql errors, the `main` / `app` /
        # `request` Symfony defaults). The MON-151077 target file is
        # `/var/log/centreon/<env>.web.log`.
        - web
        # Dedicated channels with their own file under /var/log/centreon
        # (cf. MON-151077). Each is buffered or streamed independently
        # of the catch-all `web` channel.
        - password
        - upgrade
        - plugin-pack-manager
        # Channel consumed by App\Shared\Infrastructure\Messenger\LoggingMiddleware.
        # Declared platform-wide so the bus log records produced on every
        # command/query dispatch land on a dedicated logger that modules
        # (e.g. centreon-bam) can attach their own handlers to.
        - bus

when@dev:
    monolog:
        # Same channel layout as prod, but every file goes through
        # rotating_file so a single dev session does not pile up days
        # of accumulated debug records. Production keeps `stream` and
        # delegates rotation to logrotate (cf. MON-151077).
        handlers:
            web:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.web.log"
                max_files: 14
                level: debug
                channels:
                    - "!event"
                    - "!doctrine"
                    - "!console"
                    - "!deprecation"
                    - "!authentication"
                    - "!token"
                    - "!password"
                    - "!plugin-pack-manager"
                    - "!upgrade"
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            deprecation:
                type: rotating_file
                channels: [deprecation]
                path: "%kernel.logs_dir%/%kernel.environment%.deprecations.log"
                max_files: 14
                level: debug
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            authentication:
                type: rotating_file
                channels: [authentication]
                path: "%kernel.logs_dir%/%kernel.environment%.access.log"
                max_files: 14
                level: debug
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            token:
                type: rotating_file
                channels: [token]
                path: "%kernel.logs_dir%/%kernel.environment%.token.log"
                max_files: 14
                level: debug
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            password:
                type: rotating_file
                channels: [password]
                path: "%kernel.logs_dir%/%kernel.environment%.password.log"
                max_files: 14
                level: debug
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            upgrade:
                type: rotating_file
                channels: [upgrade]
                path: "%kernel.logs_dir%/%kernel.environment%.upgrade.log"
                max_files: 14
                level: debug
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            plugin-pack-manager:
                type: rotating_file
                channels: [plugin-pack-manager]
                path: "%kernel.logs_dir%/%kernel.environment%.plugin-pack-manager.log"
                max_files: 14
                level: debug
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            nested:
                type: stream
                path: php://stderr
                level: critical
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339

when@prod:
    monolog:
        handlers:
            # Catch-all buffered handler. Captures every record that has
            # no dedicated channel handler below (notably the Symfony
            # defaults `main` / `app` / `request`, plus our `web` and
            # `bus` channels) and flushes the buffer on `error`.
            web_finger_crossed:
                type: fingers_crossed
                action_level: error
                buffer_size: 50
                stop_buffering: true
                handler: web_file
                channels:
                    - "!event"
                    - "!doctrine"
                    - "!console"
                    - "!deprecation"
                    - "!authentication"
                    - "!token"
                    - "!password"
                    - "!plugin-pack-manager"
                    - "!upgrade"
                bubble: false
                priority: 255
            web_file:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.web.log"
                level: debug
                # Rotation is handled by logrotate on production hosts
                # (cf. MON-151077). Do NOT use `rotating_file` here —
                # the two would fight over filename / suffix.
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!deprecation"]
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            deprecation:
                type: stream
                channels: [deprecation]
                path: "%kernel.logs_dir%/%kernel.environment%.deprecations.log"
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            authentication:
                type: stream
                channels: [authentication]
                path: "%kernel.logs_dir%/%kernel.environment%.access.log"
                level: info
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            token:
                type: stream
                channels: [token]
                path: "%kernel.logs_dir%/%kernel.environment%.token.log"
                level: info
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            password:
                type: stream
                channels: [password]
                path: "%kernel.logs_dir%/%kernel.environment%.password.log"
                level: info
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            upgrade:
                type: stream
                channels: [upgrade]
                path: "%kernel.logs_dir%/%kernel.environment%.upgrade.log"
                level: info
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
            plugin-pack-manager:
                type: stream
                channels: [plugin-pack-manager]
                path: "%kernel.logs_dir%/%kernel.environment%.plugin-pack-manager.log"
                level: info
                formatter: monolog.formatter.line
                date_format: !php/const DateTimeInterface::RFC3339
