type: object
properties:
  id:
    type: integer
    example: 4
  name:
    type: string
    description: "configuration name"
    example: "my-cfg-name"
  type:
    type: string
    description: |
      Type of configuration
        Supported types:
          * telegraf
          * centreon-agent
    example: centreon-agent
  connection_mode:
    type: string
    description: |
      Connection mode for the configuration
      Supported modes:
        * secure
        * no-tls
        * insecure
    example: secure
  pollers:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
          description: "Poller ID"
          example: 1
        name:
          type: string
          description: "Poller name"
          example: "my-poller-name"
    description: Poller(s) associated with the configuration
  configuration:
    type: object
    description: |
      Configuration parameters, varies depending on the configuration type.
    example:
      poller_initiated: true
      agent_initiated: true
      port: 1234
      create_host_auto: false
      otel_public_certificate: "otel-reverse.crt"
      otel_ca_certificate: "ca-certif.crt"
      otel_private_key: "otel.key"
      tokens: []
      hosts:
        - id: 1
          address: 192.168.0.1
          port: 1234
          poller_ca_certificate: poller-1-ca.crt
          poller_ca_name: CA-One
          token:
            name: host-token-1
            creator_id: 10
          name: host-1
        - id: 2
          address: 192.168.0.2
          port: 5678
          poller_ca_certificate: poller-2-ca.crt
          poller_ca_name: CA-Two
          token:
            name: host-token-2
            creator_id: 10
          name: host-2
