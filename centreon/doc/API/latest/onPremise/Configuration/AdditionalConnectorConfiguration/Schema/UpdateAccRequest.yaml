type: object
required: ["name", "type", "pollers", "parameters"]
properties:
  name:
    type: string
    description: "ACC name"
    example: "my-acc-name"
  description:
    type: string
    description: "A short ACC description"
    example: "some description"
  type:
    type: string
    description: |
      Type of ACC

      Supported ACC types:
        * vmware_v6
    example: vmware_v6
  pollers:
    type: array
    items:
      type: integer
    description: Poller ID(s) associated with the ACC
    example: [1, 12]
  parameters:
    type: object
    description: |
      Configuration parameters, varies depending on the ACC type.
      If password does not change, replace value by null.
      If adding a new vcenter, id must be null.
      When updating an existing vcenter, id must be provided.
    example:
      port: 4242
      vcenters: [
        {
          "id": 2,
          "name": "my-vcenter B",
          "url": "http://10.10.10.10/sdk",
          "username": "username2",
          "password": null
        },
        {
          "id": null,
          "name": "my-vcenter B",
          "url": "http://10.10.10.10/sdk",
          "username": "admin",
          "password": "my-pwd B"
        }
      ]
