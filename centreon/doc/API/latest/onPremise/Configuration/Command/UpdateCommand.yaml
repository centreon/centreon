    - Command
  summary: "Update a command"
  description: |
    Update command.
  parameters:
    - $ref: 'QueryParameter/commandId.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: 'Schema/UpdateCommandRequest.yaml'
  responses:
    '204':
      $ref: '../../../Common/Response/NoContent.yaml'
    '400':
      $ref: '../../../Common/Response/BadRequest.yaml'
    '403':
      $ref: '../../../Common/Response/Forbidden.yaml'
    '404':
      $ref: '../../../Common/Response/NotFound.yaml'
    '409':
      $ref: '../../../Common/Response/Conflict.yaml'
    '500':
      $ref: '../../../Common/Response/InternalServerError.yaml'