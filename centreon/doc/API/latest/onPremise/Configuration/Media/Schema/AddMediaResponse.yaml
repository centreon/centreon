type: object
properties:
  result:
    type: array
    items:
      type: object
      properties:
        id:
          type:
            - integer
            - 'null'
          example: 1
        filename:
          type: string
          example: "centreon_logo.jpg"
        directory:
          type: string
          example: "logos"
        md5:
          type: string
          example: "f7d5fc06a33946703054046c7174bbf4"
  errors:
    type: array
    items:
      type: object
      properties:
        filename:
          type: string
          description: "file name of the media"
          example: "old_logo.jpg"
        directory:
          type: string
          description: "Destination directory"
          example: "logos"
        reason:
          type: string
          description: "Reason for error"
          example: "Media already exists"
