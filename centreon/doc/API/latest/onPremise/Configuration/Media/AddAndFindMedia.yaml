post:
  tags:
    - Media
  summary: "Create a media"
  description: |
    Create a media
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: 'Schema/AddMediaRequest.yaml'
        example: |
          Content-Type: multipart/form-data; boundary=abcde12345

          --abcde12345
          Content-Disposition: form-data; name="directory"

          dashboard
          --abcde12345
          Content-Disposition: form-data; name="data"; filename="img.png"
          Content-Type: image/png

          [file content (in binary string) goes there]
          --abcde12345--
  responses:
    '201':
      description: "Object created"
      content:
        application/json:
          schema:
            type: object
            $ref: 'Schema/AddMediaResponse.yaml'
    '400':
      $ref: '../../Common/Response/BadRequest.yaml'
    '403':
      $ref: '../../Common/Response/Forbidden.yaml'
    '500':
      $ref: '../../Common/Response/InternalServerError.yaml'
get:
  tags:
    - Media
  summary: "Find all media configurations"
  description: |
    Return all media configurations.

    The available parameters to **search** / **sort_by** are:

    * id
    * name
    * directory
  parameters:
    - $ref: '../../Common/QueryParameter/Limit.yaml'
    - $ref: '../../Common/QueryParameter/Page.yaml'
    - $ref: '../../Common/QueryParameter/Search.yaml'
    - $ref: '../../Common/QueryParameter/SortBy.yaml'
  responses:
    '200':
      description: "OK"
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: array
                items:
                  $ref: 'Schema/FindMediasResponse.yaml'
              meta:
                $ref: '../../Common/Schema/Meta.yaml'
    '403':
      $ref: '../../Common/Response/Forbidden.yaml'
    '500':
      $ref: '../../Common/Response/InternalServerError.yaml'
