type: object
properties:
  is_active:
    type: boolean
    description: "Indicates whether the provider is active or not"
    example: true
  is_forced:
    type: boolean
    description: "Indicates whether the provider is forced or not"
    example: false
  base_url:
    type:
      - string
      - 'null'
    description: "Base URL of the provider"
    example: "https://localhost:8080"
  authorization_endpoint:
    type:
      - string
      - 'null'
    description: "Authorization endpoint of the provider"
    example: "/authorize"
  token_endpoint:
    type:
      - string
      - 'null'
    description: "Token endpoint of the provider"
    example: "/token"
  introspection_token_endpoint:
    type:
      - string
      - 'null'
    description: "Introspection token endpoint of the provider"
    example: "/introspect"
  userinfo_endpoint:
    type:
      - string
      - 'null'
    description: "Userinfo endpoint of the provider"
    example: "/userinfo"
  endsession_endpoint:
    type:
      - string
      - 'null'
    description: "Endsession endpoint of the provider"
    example: "/logout"
  connection_scopes:
    type: array
    description: "List of scopes to request"
    items:
      type: string
      description: "Scope"
      example: "openid"
  login_claim:
    type:
      - string
      - 'null'
    description: "Claim used to login"
    example: "sub"
  client_id:
    type:
      - string
      - 'null'
    description: "Client ID"
    example: "client_id"
  client_secret:
    type:
      - string
      - 'null'
    description: "Client secret"
    example: "client_secret"
  authentication_type:
    type:
      - string
      - 'null'
    description: "Authentication type"
    example: "client_secret_post"
    enum:
      - client_secret_post
      - client_secret_basic
      - null
  verify_peer:
    type: boolean
    description: "Verify peer"
    example: true
  auto_import:
    type: boolean
    description: "Auto import user from external provider"
    example: true
  contact_template:
    type:
      - object
      - 'null'
    properties:
      id:
        type: integer
        description: "Contact template ID"
        example: 1
      name:
        type: string
        description: "Contact template name"
        example: "Default"
  email_bind_attribute:
    type:
      - string
      - 'null'
    description: "Email bind attribute"
    example: "email"
  fullname_bind_attribute:
    type:
      - string
      - 'null'
    description: "Fullname bind attribute"
    example: "name"
  redirect_url:
    type:
      - string
      - 'null'
    description: "custom redirect url"
    example: "https://my_custom_domain.com"
  authentication_conditions:
    type: object
    properties:
      trusted_client_addresses:
        type: array
        description: "List of trusted client addresses"
        items:
          type: string
          description: "IP address"
          example: "127.0.0.1"
      blacklist_client_addresses:
        type: array
        description: "List of blacklisted client addresses"
        items:
          type: string
          description: "IP address"
          example: "127.0.0.1"
      is_enabled:
        type: boolean
      attribute_path:
        type: string
        example: info.items.prop1
      endpoint:
        type: object
        required: ['type', 'custom_endpoint']
        properties:
          type:
            type: string
            enum: [introspection_endpoint, user_information_endpoint, custom_endpoint]
          custom_endpoint:
            type:
              - string
              - 'null'
      authorized_values:
        type: array
        items:
          type: string
  groups_mapping:
    type: object
    properties:
      is_enabled:
        type: boolean
      attribute_path:
        type: string
        example: info.items.groups
      endpoint:
        type: object
        required: ['type', 'custom_endpoint']
        properties:
          type:
            type: string
            enum: [introspection_endpoint, user_information_endpoint, custom_endpoint]
          custom_endpoint:
            type:
              - string
              - 'null'
      relations:
        type: array
        items:
          type: object
          required: ['group_value', 'contact_group_id']
          properties:
            group_value:
              type: string
              description: "Attribute group value"
              example: "group1"
            contact_group_id:
              type: integer
              description: "Contact group id"
              example: 1
  roles_mapping:
    type: object
    properties:
      is_enabled:
        type: boolean
      apply_only_first_role:
        type: boolean
      attribute_path:
        type: string
        example: info.items.role
      endpoint:
        type: object
        required: ['type', 'custom_endpoint']
        properties:
          type:
            type: string
            enum: [introspection_endpoint, user_information_endpoint, custom_endpoint]
          custom_endpoint:
            type:
              - string
              - 'null'
      relations:
        type: array
        items:
          type: object
          required: ['access_group_id']
          properties:
            access_group_id:
              type: integer
              description: "Access group id"
              example: 1
