description: |
  Results contain a mixture of responses
content:
  application/json:
    schema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              href:
                type:
                  - string
                  - 'null'
                example: "/path/to/entity/1"
              status:
                type: integer
                format: int64
                example: 404
              message:
                type:
                  - string
                  - 'null'
                example: "Not found"
