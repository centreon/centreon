in: query
name: search
required: false
schema:
  type: string
description: >
  Retrieve only data matching the defined search value.

  A simple search can be done like in the following example
  ```
  search={"host.name":"Central"}
  ```

  A complex search can be done with aggregators and operators.

  Available search aggregators are:
    * `$or`
    * `$and`

  `$and` requires **all** conditions to be true simultaneously for the same resource (intersection).
  `$or` requires **at least one** condition to be true (union).

  > **Important:** Using `$and` on the same field with incompatible values will always return
  > an empty result. For example, a host whose name is "host1" cannot simultaneously have
  > the name "host2". To search for resources matching either value, use `$or` instead.

  Available search operators are:
    * `$eq` → equal
    * `$neq` → not equal
    * `$lt` → less than
    * `$le` → less or equal than
    * `$gt` → greater than
    * `$ge` → greater or equal than
    * `$lk` → like
    * `$nk` → not like
    * `$in` → in
    * `$ni` → not in
    * `$rg` → regex

  Examples without nested aggregators:

  Use `$or` to find hosts named "host1" OR "host2":
    ```
    search={
      "$or":[
        {"host.name":{"$eq":"host1"}},
        {"host.name":{"$eq":"host2"}}
      ]
    }
    ```

  Use `$and` to combine conditions on **different fields**:
    ```
    search={
      "$and":[
        {"host.address":{"$rg":"^10\.0\.0\.\d+$"}},
        {"host.name":{"$lk":"fr%"}}
      ]
    }
    ```

  Example with nested aggregators:
    ```
    search={
      "$or":[
        {
          "$and":[
            {"host.address":{"$rg":"^10\.0\.0\.\d+$"}},
            {"host.name":{"$lk":"fr%"}}
          ]
        },
        {
          "$and":[
            {"host.address":{"$rg":"^192\.168\.0\.\d+$"}},
            {"host.name":{"$lk":"us%"}}
          ]
        }
      ]
    }
    ```
