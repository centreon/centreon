type: object
properties:
  page:
    type: integer
    description: "Number of the paginated page"
    example: 1
  limit:
    type: integer
    description: "Number of items per page"
    example: 10
  search:
    type:
      - object
      - array
    description: "Search parameter passed to URL (empty array when none is given)"
  sort_by:
    type:
      - object
      - array
    description: "Sort parameter passed to URL (empty array when none is given)"
  total:
    type: integer
    description: "Number of items found"
    example: 1
