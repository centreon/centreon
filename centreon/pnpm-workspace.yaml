packages:
  - 'packages/*'
  - 'lighthouse'
  - 'tests/e2e'
  - 'tests/api'
  - 'tests/performance'
  - 'doc/API'

# Transitive overrides: pin versions across the dep tree for packages
# we don't depend on directly.
overrides:
  follow-redirects: 1.16.0
  handlebars: 4.7.9
  qs: 6.14.2
  set-cookie-parser: 2.7.2
  validator: 13.15.26
  lodash: 4.18.1
  lodash-es: 4.18.1
  protobufjs@<=7.5.5: 7.5.5
  find-cypress-specs@<=1.54.9: 1.54.9
  undici@<=6.24.0: 6.24.0
  glob@<11.1.0: 11.1.0
  uuid@<14.0.0: 14.0.0
  # Coverage tooling (nyc/istanbul/test-exclude@6) calls glob with the
  # legacy callable/callback API removed in glob v9 — keep them on a
  # non-vulnerable glob 7.x while everything else moves to 11.1.0.
  nyc>glob: 7.2.3
  istanbul>glob: 7.2.3
  test-exclude@6>glob: 7.2.3

# 7 days
minimumReleaseAge: 10080
