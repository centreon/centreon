packages:
  - 'packages/*'
  - 'lighthouse'
  - 'tests/e2e'
  - 'tests/api'
  - 'tests/performance'
  - 'doc/API'

# Transitive overrides: pin versions across the dep tree for packages
# we don't depend on directly.
overrides:
  follow-redirects: 1.16.0
  handlebars: 4.7.9
  qs: 6.14.2
  set-cookie-parser: 2.7.2
  validator: 13.15.26
  lodash: 4.18.1
  lodash-es: 4.18.1
  protobufjs@<8: 7.6.4
  find-cypress-specs@<=1.54.9: 1.54.9
  undici@<=6.27.0: 6.27.0
  glob@10: 10.5.0
  glob@11: 11.1.0
  uuid@<11.1.1: 11.1.1
  form-data@<4.0.6: 4.0.6
  fast-uri@<3.1.5: 3.1.5
  '@grpc/grpc-js@<1.14.4': 1.14.4
  mysql2@<3.22.0: 3.22.0

# 7 days
minimumReleaseAge: 10080

allowBuilds:
  '@badeball/cypress-cucumber-preprocessor': set this to true or false
  msw: set this to true or false
  protobufjs: set this to true or false
