parameters:
    paths:
        - ./src/App/ActivityLogging
        - ./src/App/MonitoringConfiguration
        - ./src/App/Security
        - ./src/App/Shared

    layers:
        - name: Domain
          collectors:
              - type: directory
                value: .+/Domain/.*

        - name: Application
          collectors:
              - type: directory
                value: .+/Application/.*

        - name: Infrastructure
          collectors:
              - type: directory
                value: .+/Infrastructure/.*

        - name: Vendors
          collectors:
              - { type: classNameRegex, value: '#^ApiPlatform\\#' }
              - { type: classNameRegex, value: '#^Doctrine\\#' }
              - { type: classNameRegex, value: '#^Godruoyi\\#' }
              - { type: classNameRegex, value: '#^Monolog\\#' }
              - { type: classNameRegex, value: '#^Symfony\\(?!(Component\\Uid\\|Component\\DependencyInjection\\Attribute\\))#' }
              - { type: classNameRegex, value: '#^Webmozart\\(?!Assert\\Assert)#' }

        - name: Helpers
          collectors:
              - { type: classNameRegex, value: '#^Psr\\#' }
              - { type: classNameRegex, value: '#^Random\\#' } # PHP 8.2+ native (e.g. Random\RandomException from random_bytes)
              - { type: classNameRegex, value: '#^Symfony\\Component\\DependencyInjection\\Attribute\\#' }
              - { type: classNameRegex, value: '#^Symfony\\Component\\Uid\\#' }
              - { type: classNameRegex, value: '#^Webmozart\\Assert\\Assert#' }
              - { type: classNameRegex, value: '#TypeAlias$#' } # needed because deptrac does not parse phpstan type aliases
              - { type: classNameRegex, value: '#^Deprecated$#' } # PHP built-in attribute

        - name: Legacy
          collectors:
              - { type: classNameRegex, value: '#^App\\Kernel$#' }
              - { type: classNameRegex, value: '#^Adaptation\\$#' }
              - { type: classNameRegex, value: '#^Centreon*\\#' }
              - { type: classNameRegex, value: '#^Core\\#' }
              - { type: classNameRegex, value: '#^EventSubscriber\\#' }
              - { type: classNameRegex, value: '#^Security\\#' }
              - { type: classNameRegex, value: '#^Utility\\#' }

        - name: AdaptationLog # hexagonal-arch adapters for logging
          collectors:
              - { type: classNameRegex, value: '#^Adaptation\\Log\\#' }

    ruleset:
        Domain: [ Helpers ]
        Application: [ Domain, Helpers ]
        Infrastructure: [ Domain, Application, Vendors, Helpers, AdaptationLog ]

    skip_violations:
        App\Shared\Infrastructure\Legacy\LegacyKernelWrapper:
            - App\Kernel
        App\Shared\Infrastructure\Legacy\LegacyContainer:
            - App\Kernel
        App\Shared\Infrastructure\Legacy\LegacyHttpExceptionListener:
            - Centreon\Domain\Exception\EntityNotFoundException
        App\Shared\Infrastructure\Legacy\LegacyVaultWrapper:
            - Core\Common\Application\Repository\ReadVaultRepositoryInterface
            - Core\Common\Application\Repository\WriteVaultRepositoryInterface
            - Core\Common\Application\VaultEligibilityService
        App\Security\Infrastructure\Security\Legacy\LegacyTokenApiAuthenticatorWrapper:
            - Security\TokenAPIAuthenticator
        App\MonitoringConfiguration\Infrastructure\Legacy\LegacyGorgoneNodesSynchronizer:
            - Centreon\Domain\Gorgone\Command\NodesSync
            - Centreon\Domain\Gorgone\Interfaces\GorgoneServiceInterface
