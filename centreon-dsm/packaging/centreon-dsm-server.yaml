name: "centreon-dsm-server"
arch: "${ARCH}"
platform: "linux"
version_schema: "none"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
section: "default"
priority: "optional"
maintainer: "Centreon <contact@centreon.com>"
description: |
  Centreon-dsm server package
  Commit: @COMMIT_HASH@
vendor: "Centreon"
homepage: "https://github.com/centreon/centreon-dsm"
license: "Apache-2.0"

contents:
  - src: "../bin/dsmd.pl"
    dst: "/usr/share/centreon/bin/dsmd.pl"
    file_info:
      owner: centreon
      group: centreon
      mode: 0775

  - src: "../README"
    dst: "/usr/share/centreon/www/modules/centreon-dsm/README"
    file_info:
      owner: "@APACHE_USER@"
      group: "@APACHE_GROUP@"

  - src: "../www/modules/centreon-dsm/core"
    dst: "/usr/share/centreon/www/modules/centreon-dsm/core"
    file_info:
      owner: "@APACHE_USER@"
      group: "@APACHE_GROUP@"

  - src: "../www/modules/centreon-dsm/images"
    dst: "/usr/share/centreon/www/modules/centreon-dsm/images"
    file_info:
      owner: "@APACHE_USER@"
      group: "@APACHE_GROUP@"

  - src: "../www/modules/centreon-dsm/sql"
    dst: "/usr/share/centreon/www/modules/centreon-dsm/sql"
    file_info:
      owner: "@APACHE_USER@"
      group: "@APACHE_GROUP@"

  - src: "../www/modules/centreon-dsm/statistics"
    dst: "/usr/share/centreon/www/modules/centreon-dsm/statistics"
    file_info:
      owner: "@APACHE_USER@"
      group: "@APACHE_GROUP@"

  - src: "../www/modules/centreon-dsm/upgrade"
    dst: "/usr/share/centreon/www/modules/centreon-dsm/upgrade"
    file_info:
      owner: "@APACHE_USER@"
      group: "@APACHE_GROUP@"

  - src: "../www/modules/centreon-dsm/conf.php"
    dst: "/usr/share/centreon/www/modules/centreon-dsm/conf.php"
    file_info:
      owner: "@APACHE_USER@"
      group: "@APACHE_GROUP@"

  - src: "../www/modules/centreon-dsm/cron/*"
    dst: "/usr/share/centreon/www/modules/centreon-dsm/cron/"
    file_info:
      owner: "@APACHE_USER@"
      group: "@APACHE_GROUP@"
      mode: 0755

  - src: "../cron/centreon-dsm"
    dst: "/etc/cron.d/centreon-dsm"
    file_info:
      mode: 0644

  - src: "../libinstall/systemd/dsmd.rpm.systemd"
    dst: "/etc/systemd/system/dsmd.service"
    file_info:
      mode: 0600
    packager: rpm
  - src: "../libinstall/systemd/dsmd.deb.systemd"
    dst: "/lib/systemd/system/dsmd.service"
    file_info:
      mode: 0600
    packager: deb

  - src: "../libinstall/systemd/dsmd.sysconfig"
    dst: "/etc/sysconfig/dsmd"
    file_info:
      mode: 0400
    packager: rpm
  - src: "../libinstall/systemd/dsmd.sysconfig"
    dst: "/etc/default/dsmd"
    file_info:
      mode: 0400
    packager: deb

scripts:
  postinstall: ./scripts/centreon-dsm-server-postinstall.sh

overrides:
  rpm:
    depends:
      - centreon-web >= ${MAJOR_VERSION}
      - centreon-web < ${NEXT_MAJOR_VERSION}
  deb:
    depends:
      - "centreon-web (>= ${MAJOR_VERSION}~)"
      - "centreon-web (<< ${NEXT_MAJOR_VERSION}~)"

rpm:
  summary: Centreon-dsm server
  signature:
    key_file: ${RPM_SIGNING_KEY_FILE}
    key_id: ${RPM_SIGNING_KEY_ID}

deb:
  compression: zstd
