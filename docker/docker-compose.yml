x-defaults: &defaults
  environment:
    TZ: "America/Toronto"

services:  
  php-fpm:
    <<: *defaults
    image: docker.centreon.com/centreon/centreon-web-bookworm:fth-docker-centreon-web
    build:
      context: .
      dockerfile: Dockerfile
    # environment:
    #   - APP_ENV=dev
    volumes:
      - app-etc:/etc/centreon/:rw
      - app-data:/var/www/html:rw,z
      - app-engine:/etc/centreon-engine:rw,z
      - app-broker:/etc/centreon-broker:rw,z
      # - app-status:/var/lib/centreon/status:rw,z
      # - app-metrics:/var/lib/centreon/metrics:rw,z
      # - app-centcore:/var/lib/centreon/centcore:rw,z
      - app-centvar:/var/lib/centreon/:rw,z
      - app-centcache:/var/cache/centreon/:rw,z
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/docker.ready"]
      interval: 10s
      start_period: 60s
      retries: 5
      timeout: 10s


  apache:
    <<: *defaults
    image: httpd:2.4
    restart: always
    depends_on:
      - php-fpm
    ports:
      - "80:80"
    volumes:
      - app-data:/var/www/html:rw,z
      - ./apache-config.conf:/usr/local/apache2/conf/httpd.conf
    # command: ["sleep", "infinity"]  # Keep the container running
    networks:
      - app-network
  cbd:
    <<: *defaults
    image: broker-api:latest
    container_name: cbd
    hostname: cbd
    restart: always
    ports:
      - 5669:5669
    networks:
      - app-network
      - main-network
    volumes:
      - app-broker:/etc/centreon-broker:rw,z
      - app-centvar:/var/lib/centreon/:rw,z
      # - app-status:/var/lib/centreon/status:rw,z
      # - app-metrics:/var/lib/centreon/metrics:rw,z
  centengine:
    <<: *defaults
    # image: centengine-api:latest
    image: docker.centreon.com/centreon/centreon-poller-bookworm:fth-docker-collect
    container_name: centengine
    hostname: centengine
    restart: always
    networks:
      - app-network
    volumes:
      - app-engine:/etc/centreon-engine:rw,z
      - app-broker:/etc/centreon-broker:rw,z
      - app-centcmd:/var/lib/centreon-engine/rw:rw,z
      - app-centlog:/var/log/centreon-engine:rw
  gorgone:
    <<: *defaults
    image: gorgone-test:latest
    container_name: gorgone
    hostname: gorgone
    restart: always
    networks:
      - app-network
      - main-network
    volumes:
      - app-etc:/etc/centreon/:rw
      - app-gorgone:/etc/centreon-gorgone:rw,z
      # - app-centcore:/var/lib/centreon/centcore:rw,z
      - app-centcmd:/var/lib/centreon-engine/rw:rw,z
      - app-centcache:/var/cache/centreon/:rw,z
      - app-centvar:/var/lib/centreon/:rw,z
    depends_on:
      php-fpm:
        condition: service_healthy

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: centreon
      TZ: "America/Toronto"
    networks:
      - app-network
    volumes:
      - app-db:/var/lib/mysql:rw
  cronbox:
    <<: *defaults
    container_name: cronbox
    image: cronbox:latest
    networks:
      - app-network
    volumes:
      - app-etc:/etc/centreon/:r
      - app-data:/var/www/html:r
      - app-centvar:/var/lib/centreon/:rw
    depends_on:
      php-fpm:
        condition: service_healthy


networks:
  app-network:
    driver: bridge
  main-network:
    external: true

volumes:
  app-etc:
  app-data:
  app-engine:
  app-broker:
  app-gorgone:
  # app-centcore:
  app-centcmd:
  app-centvar:
  app-centcache:
  app-centlog:
  app-db:
  # app-metrics:
  # app-status:
